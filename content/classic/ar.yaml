ising_model:
  title: نموذج إيزينغ
  description: "استكشف نموذج إيزينغ للمغناطيسية الحديدية: غيّر درجة الحرارة وشدة التفاعل وشاهد تطوّر النظام لحظيًا."
trig_functions:
  title: الدوال المثلثية
  description: شاهد كيف تنشأ دوال الجيب وجيب التمام والظل من حركة نقطة على دائرة.
ant_colony_optimization:
  title: مستعمرة النمل
  description: كيف يعثر النمل على أقصر طريق إلى الطعام باستخدام آثار الفيرومون فقط.
firefly_synchronization:
  title: تزامن اليراعات
  description: يراعات تومض عشوائيًا ثم تتزامن تدريجيًا بقاعدة محلية بسيطة.
special_relativity:
  title: النسبية الخاصة
  description: تمدّد الزمن وتقلّص الأطوال عند السرعات القريبة من سرعة الضوء.
sorting_algos:
  title: خوارزميات الترتيب
  description: شاهد خوارزميات الترتيب الشهيرة وهي تعمل خطوة بخطوة وقارن بين سرعاتها.
collective_behaviour:
  title: السلوك الجماعي
  description: كيف تنشأ حركة الأسراب والقطعان من قواعد بسيطة يتّبعها كل فرد.
conway_game:
  title: لعبة الحياة
  description: "لعبة كونواي: خلايا تحيا وتموت وفق قواعد بسيطة فتنتج أنماطًا مدهشة."
schelling_model:
  title: نموذج شيلينغ
  description: كيف تؤدي تفضيلات فردية طفيفة إلى فصل واسع بين المجموعات.
gradient_descent:
  title: الانحدار التدرّجي
  description: "كرة تتدحرج على سطح نحو أدنى نقطة: الفكرة الأساسية في تدريب النماذج الذكية."
mandelbrot_fractal:
  title: كسيرية ماندلبرو
  description: كبّر بلا نهاية داخل أشهر شكل كسيري في الرياضيات.
lotka_volterra:
  title: لوتكا–فولتيرا
  description: "معادلات المفترس والفريسة: دورات متكرّرة من الازدهار والانهيار."
spring_motion:
  title: حركة النابض
  description: "كتلة معلّقة بنابض: الحركة التوافقية والتخميد والرنين."
bernoulli_percolation:
  title: ترشيح برنولي
  description: املأ شبكة عشوائيًا وشاهد لحظة ظهور مسار متّصل من طرف إلى آخر.
small_world_networks:
  title: شبكات العالم الصغير
  description: بضع وصلات عشوائية تكفي ليصبح الجميع على بُعد خطوات قليلة من بعضهم.
fourier_series:
  title: متسلسلة فورييه
  description: ابنِ أي موجة من مجموع دوائر دوّارة، وشاهد التقريب يتحسّن مع كل حدّ جديد.
image_filters:
  title: مرشّحات الصور
  description: كيف تعمل مرشّحات التنعيم والحِدّة وكشف الحواف على مستوى البكسل.
lorenz_system:
  title: نظام لورنز
  description: "أثر الفراشة: مساران يبدآن متجاورين ثم يفترقان تمامًا."
nuclear_fusion:
  title: الاندماج النووي
  description: أنوية تتصادم وتتغلّب على التنافر الكهربائي لتندمج وتُطلق طاقة.
vicsek_model:
  title: نموذج فيتشيك
  description: جسيمات تحاكي اتجاه جيرانها فتنتقل من الفوضى إلى حركة جماعية منظّمة.
double_pendulum:
  title: البندول المزدوج
  description: "بندول معلّق ببندول: نظام بسيط يُنتج حركة فوضوية لا يمكن التنبؤ بها."
public_goods:
  title: لعبة المنافع العامة
  description: متى يتعاون الناس ومتى ينتفعون مجانًا؟ نموذج لتطوّر التعاون.
polynomial_regression:
  title: الانحدار متعدّد الحدود
  description: ضع نقاطًا وشاهد المنحنى الأنسب لها، وتعرّف على فرط التخصيص.
reaction_diffusion:
  title: التفاعل والانتشار
  description: مادتان كيميائيتان تتفاعلان وتنتشران فتتشكّل بقع وخطوط كجلود الحيوانات.
hilbert_curve:
  title: منحنى هيلبرت
  description: خط واحد متّصل يملأ المربع كله كلما زادت رتبته.
pedestrian_dynamics:
  title: حركة المشاة
  description: كيف تتشكّل المسارات والازدحام عندما يتحرّك حشد في ممرّ ضيّق.
quantum_logic:
  title: الحوسبة الكمومية
  description: البوابات الكمومية وتأثيرها في الكيوبتات، خطوة بخطوة.
clustering:
  title: التجميع
  description: خوارزميات تقسّم النقاط إلى مجموعات متشابهة دون أي إشراف.
contact_process:
  title: عملية التماس
  description: "نموذج لانتشار العدوى: هل تنقرض أم تستمرّ؟ الجواب يعتمد على معدّل الانتقال."
natural_selection:
  title: الخوارزمية الجينية
  description: كائنات تتطوّر عبر الأجيال بالانتقاء والطفرات لتصل إلى هدفها.
simple_fluid:
  title: مائع بسيط
  description: حرّك المائع بمؤشّرك وشاهد الدوّامات تتشكّل وتتلاشى.
linear_transformations:
  title: التحويلات الخطية
  description: شاهد كيف تمدّد المصفوفة المستوى وتديره وتقصّه.
projectile_motion:
  title: حركة المقذوفات
  description: اختر السرعة والزاوية وأطلق المقذوف، مع مقاومة الهواء أو بدونها.
maze_generation:
  title: توليد المتاهات
  description: خوارزميات تبني متاهات كاملة أمام عينيك ثم تحلّها.
stroboscopic_effect:
  title: الأثر الستروبوسكوبي
  description: لماذا تبدو العجلات أحيانًا وكأنها تدور إلى الخلف؟
monte_carlo:
  title: مونت كارلو
  description: قدّر قيمة π برمي نقاط عشوائية، وتعرّف على قوة العشوائية في الحساب.
linear_momentum:
  title: كمية الحركة الخطية
  description: "تصادمات بين كرات: انحفاظ كمية الحركة والطاقة."
porous_percolation:
  title: الترشيح في وسط مسامي
  description: "سائل يتسرّب عبر وسط مسامي: متى يصل إلى الطرف الآخر؟"
bezier_curves:
  title: منحنيات بيزييه
  description: اسحب نقاط التحكّم وشاهد كيف يُبنى المنحنى الناعم من خطوط مستقيمة.
random_walk:
  title: المشي العشوائي
  description: "خطوات عشوائية تنتج قوانين إحصائية دقيقة: أساس الانتشار."
planetary_motion:
  title: حركة الكواكب
  description: "كواكب تدور حول نجم بفعل الجاذبية: مدارات وقوانين كبلر."
tdp:
  title: الترشيح الموجَّه
  description: ترشيح له اتجاه مفضّل، وهو نموذج لانتقالات الطور خارج التوازن.
lexical_analysis:
  title: التحليل المعجمي
  description: "الخطوة الأولى في المترجمات: تحويل النص البرمجي إلى رموز."
travelling_salesman:
  title: البائع المتجوّل
  description: ما أقصر جولة تمرّ بكل المدن؟ قارن بين طرق حلّ مختلفة.
waves:
  title: الموجات
  description: اسحب طرف الوتر وشاهد الاضطراب ينتقل وينعكس ويتداخل. جرّب الموجة الجيبية والمربعة والمثلثية.
heat_equation:
  title: معادلة الحرارة في بُعد واحد
  description: ارسم توزيعًا للحرارة على قضيب وشاهدها تنتشر حتى تتساوى.
xy_model:
  title: نموذج XY
  description: "لفّات مغزلية تشير في أي اتجاه على المستوى: دوّامات تتكوّن وتتلاشى مع تغيّر الحرارة."
toner_tu:
  title: نظرية تونر–تو
  description: "نظرية متّصلة لحركة الأسراب: مجالات الكثافة والسرعة لجسيمات ذاتية الدفع."
conic_sections:
  title: القطوع المخروطية
  description: اقطع مخروطًا بمستوٍ لتحصل على دائرة أو قطع ناقص أو مكافئ أو زائد.
collatz_conjecture:
  title: حدسية كولاتز
  description: اقسم على 2 إذا كان العدد زوجيًا، واضرب في 3 وأضف 1 إذا كان فرديًا، وتابع الرحلة حتى 1.
marching_squares:
  title: المربعات الزاحفة
  description: الخوارزمية التي تحوّل شبكة من الأرقام إلى خطوط كنتور ناعمة.
hopfield_networks:
  title: شبكات هوبفيلد
  description: شبكة عصبية تخزّن الأنماط كذكريات وتستعيدها من مدخلات مشوّشة.
artificial_life:
  title: الحياة الاصطناعية
  description: قواعد تجاذب وتنافر بسيطة بين جسيمات ملوّنة تُنتج بُنى شبيهة بالكائنات الحية.
sandpile_model:
  title: نموذج كومة الرمل
  description: "أسقط الحبّات واحدة تلو الأخرى وشاهد انهيارات بكل الأحجام: الحرجية ذاتية التنظيم."
couzin_model:
  title: نموذج كوزين
  description: مناطق للتنافر والمحاذاة والتجاذب تُنتج أسرابًا وحلقات ومجموعات مرتحلة.
flocking_behaviour:
  title: سلوك الأسراب
  description: طيور افتراضية تتبع ثلاث قواعد محلية (ابتعد، حاذِ، اقترب) فتطير كسرب حقيقي.
flocking_demonstration:
  title: عرض توضيحي للأسراب
  description: عرض موجَّه يبيّن أثر كل قاعدة من قواعد السرب في المجموعة.
flocking_simulation:
  title: محاكاة الأسراب
  description: محاكاة أكبر للأسراب مع معاملات قابلة للتعديل.
flocking_game:
  title: المفترسات والأسراب
  description: وجّه مفترسًا وسط السرب وشاهد كيف تتفاداه المجموعة.
predator_escape:
  title: الهروب من المفترس
  description: كيف تتفاعل مجموعات الفرائس وتهرب عندما يهاجمها مفترس.
home_range:
  title: نطاق المعيشة
  description: كيف تستقرّ الحيوانات في مناطق ثابتة من خلال الحركة والذاكرة.
swarm_synchronization:
  title: تزامن الأسراب
  description: مذبذبات تتحرّك وتتزامن في الوقت نفسه.
