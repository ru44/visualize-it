"Tweaking": "ضبط الإعدادات"
"A lower population of ants will cause the approximated optimal solution to change rapidly between iterations.": "كلما قلّ عدد النملات تغيّر الحل التقريبي بسرعة أكبر من جولة إلى أخرى."
"A high value of evaporation rate allows the population to explore more paths, but it may not necessarily return an optimal path at the end": "معدل تبخر مرتفع يسمح للنملات باستكشاف مسارات أكثر، لكنه لا يضمن الوصول إلى أفضل مسار في النهاية"
"is equivalent to using only the": " يكافئ الاعتماد فقط على"
"knowledge. The solution given will be the nearest neighbor heuristic, which is the most straightforward way to optimize the travelling salesman problem. Basically, from each node, travel to the nearest unvisited node.": " المعرفة المسبقة بالمسافات. الحل الناتج هو أسلوب أقرب جار، وهو أبسط طريقة لحل مسألة البائع المتجول: من كل عقدة انتقل إلى أقرب عقدة لم تزرها بعد."
"makes the system collapse to a local minimum. But the solution will probably be far from optimum.": " يجعل النملات تستقر عند حل محلي بسرعة، لكنه غالبًا بعيد عن الأفضل."
"will lock the ants into heavily favouring shorter edges. The simulation will then try to find the a way to connected these shorter edges in an optimal manner.": " يجعل النملات تفضل بشدة الحواف القصيرة، وتحاول المحاكاة بعدها وصل هذه الحواف القصيرة بأفضل طريقة ممكنة."
"When points are chosen randomly,": "حين تُختار النقاط عشوائيًا،"
"seem to give the best results.": " تعطي عادة أفضل النتائج."
"This simulation is computationally complex and will lag on lower-end devices": "تحتاج هذه المحاكاة حسابًا كثيفًا، وستتأخر على الأجهزة الضعيفة"
"You can change the evaporation factor, pheromone influence and <em>a priori</em> influence during the simulation to see how it affects the solution space.": "يمكنك تغيير معدل التبخر ووزن الفرمون ووزن <em>المعرفة المسبقة</em> أثناء عمل المحاكاة لترى كيف يتغير الحل."
