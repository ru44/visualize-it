"Mechanism": "آلية العمل"
"Given a bunch of points, the travelling salesman problem involves finding the shortest path that visits all the points exactly once. Finding/verifying a solution absolutely requires a brute force search, whose time complexity scales as factorial. Ant Colony Optimization (ACO) is one way to go about finding near-optimal solutions for the travelling salesman problem.": "مسألة البائع المتجول تعطيك مجموعة نقاط، وتطلب منك أقصر مسار يمر بكل نقطة مرة واحدة فقط. إيجاد الحل الأكيد أو التأكد منه يحتاج تجربة كل المسارات الممكنة، وعددها يكبر بسرعة رهيبة (كمضروب العدد). خوارزمية مستعمرة النمل طريقة تصل إلى حل قريب من الأفضل دون تجربة كل الاحتمالات."
