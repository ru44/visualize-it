"Ant Colony": "مستعمرة النمل"
"Ant Colony Optimization (ACO) is an interesting way to obtain near-optimum solutions to the <a href=\"../travelling_salesman/simulation.html\">Travelling Salesman Problem (TSP)</a>. It involves utilizing multi-agent ants to explore all possible solutions and converge upon a short path with a combination of a priori knowledge and pheromone trails deposited by other ants": "خوارزمية مستعمرة النمل (ACO) طريقة ذكية للوصول إلى حل قريب من الأفضل لمسألة <a href=\"../travelling_salesman/simulation.html\">البائع المتجول (TSP)</a>. يستكشف فيها عدد من النمل الافتراضي كل المسارات الممكنة، ويتفقون تدريجيًا على مسار قصير بالجمع بين معرفة مسبقة بالمسافات وأثر الفرمون الذي يتركه كل نمل خلفه"
"Click on the canvas in order to introduce/remove a node": "اضغط على لوحة الرسم لإضافة عقدة أو حذفها"
