"Nuclear Fusion": "الاندماج النووي"
"This simulation has been developed as a part of a project in one of my courses. It attempts to recreate the situations under which self sustaining nuclear fusion reactions can occur. It involves a plethora of idealisations and ad-hoc assumptions, therefore the viewer is advised to interpret the observations made here with a pinch of salt.": "بُنيت هذه المحاكاة كجزء من مشروع دراسي، وهي تحاول تقريب الظروف التي يمكن أن يحدث فيها اندماج نووي ذاتي الاستمرار. اعتمدت المحاكاة على تبسيطات وافتراضات كثيرة، فلا تأخذ ما تراه فيها على أنه دقيق تمامًا."
