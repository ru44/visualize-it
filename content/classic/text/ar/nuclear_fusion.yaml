"System": "النظام"
"The system is a rectangular area that contains positive nuclei and allows for diffusion of heat. It is enclosed by a rigid wall. The world begins with only hydrogen nuclei (blue). As fusion takes place, some of them fuse to form helium nuclei (yellow). Further fusion leads to the formation of heavier nuclei (light gray).": "النظام مساحة مستطيلة تحوي أنوية موجبة الشحنة وتسمح بانتشار الحرارة فيها، ومحاطة بجدار صلب. تبدأ المحاكاة بأنوية هيدروجين فقط (باللون الأزرق)، وحين يحدث اندماج تتكون منها أنوية هيليوم (باللون الأصفر)، ثم يؤدي المزيد من الاندماج إلى تكوّن أنوية أثقل (باللون الرمادي الفاتح)."
"Dynamics": "الحركة"
"The motion of nuclei obtained using the following Verlet method updates:": "تُحسب حركة الأنوية باستخدام تحديثات طريقة فيرلي التالية:"
"Where": "حيث"
". Further, when a nucleus moves through a heated cell, it gets agitated, resulting in an increase in it's velocity. Lighter nuclei are more influenced by heat than heavier nuclei.": ". وحين تمر نواة عبر خلية ساخنة، تهتز وتزداد سرعتها، والأنوية الأخف تتأثر بالحرارة أكثر من الأنوية الأثقل."
"Coulombic Force of Repulsion": "قوة التنافر الكولومية"
"Every nuclei is positively charged. Hence it feels a repulsive force due to the presence of all other nuclei. The magnitude of this force between two charges is directly proportional to the product of their charges and inversely proportional to the square of the distance of separation between them:": "كل نواة موجبة الشحنة، فهي تشعر بقوة تنافر بسبب وجود بقية الأنوية حولها. ومقدار هذه القوة بين شحنتين يتناسب طرديًا مع حاصل ضرب شحنتيهما، وعكسيًا مع مربع المسافة بينهما:"
"If two nuclei have sufficient kinetic energy to overcome the repulsive force, then they undergo the process of nuclear fusion. In this simulation, the condition for nuclear fusion to take place is:": "إذا كانت لدى نواتين طاقة حركية كافية للتغلب على قوة التنافر بينهما، يحدث الاندماج النووي. وشرط حدوث الاندماج في هذه المحاكاة هو:"
"Nuclear fusion results in emission of heat. Certain fusion reactions generate more heat than others.": "ينتج عن الاندماج النووي انبعاث حرارة، وبعض تفاعلات الاندماج تولّد حرارة أكبر من غيرها."
"Diffusion of Heat": "انتشار الحرارة"
"The world is divided into a rectangular array of cells. Whenever two nuclei fuse, they release heat into their corresponding cell, thereby increasing it's temperature. Relatively hotter cells are rendered with a brighter shade of red. Heat spreads across the world according to the diffusion equation:": "تُقسَّم مساحة المحاكاة إلى شبكة من الخلايا المستطيلة. وكلما اندمجت نواتان، تُطلقان حرارة في خليتهما فترتفع حرارتها، وتُرسم الخلايا الأسخن بدرجة أحمر أشد سطوعًا. وتنتشر الحرارة بين الخلايا وفق معادلة الانتشار:"
"Heat also gets dissipated at a constant rate.": "كما تتبدد الحرارة بمعدل ثابت."
"Introduction of Energy": "إدخال الطاقة"
"When number density of nuclei is low, or if nuclei have less kinetic energy, then fusion events are rare. In such cases, energy can be introduced in the form of heat. One can drag the mouse pointer across the screen to introduce heat in the corresponding cells. One can also instantaneously heat the entire container to a given temperature. Inertial confinement involves heating as well as compression.": "حين تكون كثافة الأنوية منخفضة أو طاقتها الحركية قليلة، يندر حدوث الاندماج. في هذه الحالة يمكنك إضافة طاقة على هيئة حرارة، إما بسحب المؤشر على الشاشة لتسخين الخلايا التي يمر بها، أو بتسخين الحاوية كلها فورًا إلى حرارة معينة. أما الحصر بالقصور الذاتي فيجمع بين التسخين والضغط."
"Analysis": "التحليل"
"In the default scenario, we have 300 hydorgen nuclei at the start. The number density is high enough for self ignition to take place. The heat generated in initial reactions is enough to sustain the process for a few seconds. With time, more and more heavier nuclei are formed. Heavier nuclei get less agitated by heat and are less likely to fuse with each other. Hence, the reaction eventually stops. At this stage, heating up the container or carrying out inertial confinement will be of little help. It is also noticed that if we begin the simulation with more nuclei, the process will be of higher intensity but will terminate faster. This is similar to how massive stars have lower lifespans since they burn out their fuel at a faster rate.": "تبدأ الحالة الافتراضية بـ 300 نواة هيدروجين، وهذه الكثافة تكفي لبدء الاشتعال الذاتي. والحرارة الناتجة من التفاعلات الأولى تكفي لاستمرار العملية بضع ثوانٍ. ومع الوقت تتكون أنوية أثقل فأثقل، وهذه تتأثر بالحرارة أقل فتندمج فيما بينها أقل، حتى يتوقف التفاعل تقريبًا. وعند هذه المرحلة لن يفيد كثيرًا تسخين الحاوية أو استخدام الحصر بالقصور الذاتي. ولوحظ أيضًا أن بدء المحاكاة بعدد أكبر من الأنوية يجعل التفاعل أقوى لكنه ينتهي أسرع، تمامًا كما تحرق النجوم الضخمة وقودها بسرعة أكبر فتعيش عمرًا أقصر."
"With 50 - 70 hydrogen nuclei, nuclear fusion is a sporadic occurence. However, either heating the container to 100 units of temperature or carrying out inertial confinement will trigger some fusion reactions. The process can be sustained for upto a minute by adding 10 hydrogen nuclei whenever the number of nuclei drops below 50.": "مع 50 إلى 70 نواة هيدروجين، يحدث الاندماج بين الحين والآخر فقط. لكن تسخين الحاوية إلى 100 وحدة حرارة أو استخدام الحصر بالقصور الذاتي يشعل بعض تفاعلات الاندماج. ويمكن إبقاء العملية مستمرة قرابة دقيقة بإضافة 10 أنوية هيدروجين كلما قلّ عددها عن 50."
"Inertial confinement involves heating the outer layer of fuel-laden capsules and compressing it's contents. We have attempted to recreate such an process here. When inertial confinement is turned on, the edges of the system get heated. The nuclei are directed towards the center of the container in a batchwise manner. However, inertial confienemnt is relatively useless when the system involves higher proportions of heavier nuclei.": "يقوم الحصر بالقصور الذاتي على تسخين الطبقة الخارجية لكبسولات الوقود وضغط ما بداخلها، وقد حاولنا تقريب هذه العملية هنا: حين يُشغَّل، تُسخَّن أطراف النظام، وتُدفع الأنوية نحو مركز الحاوية على دفعات. لكن هذه الطريقة تصبح أقل فائدة كلما زادت نسبة الأنوية الأثقل في النظام."
"The observation that high number density and high temperature are two approaches to initiate and maintain fusion reactions in this system suggest that we have appreciably recreated Lawson's criteria within the confines of this simulation.": "ملاحظة أن ارتفاع كثافة الأنوية وارتفاع الحرارة طريقتان لبدء الاندماج والحفاظ عليه في هذا النظام، تشير إلى أننا اقتربنا بشكل معقول من تمثيل معيار لوسون داخل حدود هذه المحاكاة."
"Note:": "ملاحظة:"
"This simulation should preferably be viewed on desktops. Weird behaviour is observed on mobiles.": "يُفضَّل مشاهدة هذه المحاكاة على حاسوب مكتبي، فقد يظهر سلوك غريب على الجوال."
"Avoid introducing more than 1000 nuclei. This simulation involves calculation of forces among all pairs of nuclei, application of laws of dynamics on all nuclei, collision detection between nuclei as well as calculation of Laplacians for all cells. All of this happens in a single frame. This simulation is computationally heavy and may lag on lower-end devices.": "تجنّب إضافة أكثر من 1000 نواة. فهذه المحاكاة تحسب القوة بين كل زوج من الأنوية، وتطبّق قوانين الحركة على كل نواة، وتكتشف تصادمها، وتحسب انتشار الحرارة في كل خلية، وكل هذا في الإطار الواحد. هذا حساب ثقيل قد يجعل المحاكاة بطيئة على الأجهزة الضعيفة."
"In order to lower total potential energy, lot of nuclei (especially heavier ones) get stuck to the boundaries. This sometimes creates conditions of electric confinement wherein all the nuclei stuck to the wall repel any nuclei coming close to the wall.": "سعيًا لخفض الطاقة الكامنة الكلية، تلتصق أنوية كثيرة، خصوصًا الأثقل منها، بحواف الحاوية. وهذا يخلق أحيانًا حالة حصر كهربائي، إذ تتنافر الأنوية الملتصقة بالجدار مع أي نواة تقترب منه."
"When number density of nuclei are low, fusion reactions are more likely to happen at the corners, since nuclei have less freedom to move away from approaching nuclei.": "حين تكون كثافة الأنوية منخفضة، يكون الاندماج أرجح عند الزوايا، لأن حرية الأنوية هناك في الابتعاد عن غيرها أقل."
"The units of temperature used in this simulation are completely arbitrary.": "وحدات الحرارة المستخدمة في هذه المحاكاة اعتباطية تمامًا، لا تمثل وحدة حقيقية."
