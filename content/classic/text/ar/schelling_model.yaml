"Schelling's Model": "نموذج شيلينغ"
"Schelling's Model replicates the segregation that takes place in populations of differing backgrounds or opinions": "يحاكي نموذج شيلينغ كيف يفصل الناس أنفسهم بحسب خلفياتهم أو آرائهم المختلفة"
"Simulation": "المحاكاة"
"Agents (people) of different backgrounds/opinions are represented by circles of different colors. The world is initially populated with random agents placed at random positions. The simulation continues until all agents are happy. Unhappy agents have a square drawn around them (see description for more details).": "كل دائرة في الشبكة تمثّل شخصًا، ولونها يدل على خلفيته أو رأيه. تضع المحاكاة الأشخاص في مواضع عشوائية في البداية، وتستمر حتى يصبح الجميع راضين عن مكانهم. يظهر مربع حول كل شخص غير راضٍ (اقرأ الوصف لمزيد من التفاصيل)."
"<b> Warning: <br> Do not introduce too many species with high occupancy and low tolerance. Simulation WILL hang. </b>": "<b> تحذير: <br> لا تختر أنواعًا كثيرة مع كثافة عالية وتسامح منخفض، فستتجمد المحاكاة. </b>"
"Unhappiness: 21.53%": "نسبة عدم الرضا: 21.53%"
"Pause": "إيقاف مؤقت"
"Restart": "إعادة التشغيل"
"Occupancy: 50%": "الإشغال: 50%"
"Tolerance: 0.5": "التسامح: 0.5"
"(Lower tolerance implies causes segregation)": "(كلما قلّ التسامح زاد التفرّق)"
"Number of Species: 2": "عدد الأنواع: 2"
"Description": "الوصف"
"Every agent has 8 neighbours. In every step, a random agent is chosen and it's neighbourhood is analysed:": "لكل شخص 8 جيران حوله. في كل خطوة تختار المحاكاة شخصًا عشوائيًا وتفحص جيرانه:"
"is the number of neighbours of a different species whereas": "هو عدد الجيران من نوع مختلف، بينما"
"is the total number of neighbours present. If the above fraction": "هو العدد الكلي للجيران. إذا كانت هذه النسبة"
"is greater than the tolerance value, then the agent is \"unhappy\" and therefore seeks to relocate to a spot where it will be happy amongst it's compatriots. This simple rule is enough to establish segregation. Lower the tolerance, greater the segregation. In the real world, these species may differ in their background (race, ethinicity, religion, language) or their opinion (politics, incompatible issues). This sort of segregation is observed in the animal kingdom too.": " أكبر من قيمة التسامح، يصبح الشخص \"غير راضٍ\" ويبحث عن مكان جديد بين أمثاله. هذه القاعدة البسيطة وحدها كافية لتكوين التفرّق بين الأنواع. كلما قلّ التسامح زاد التفرّق. في الواقع قد يختلف الناس في الخلفية، كالعرق أو الدين أو اللغة، أو في الرأي، كالسياسة وغيرها من القضايا. ونرى هذا النوع من التفرّق في عالم الحيوان أيضًا."
