"Porous Percolation": "الارتشاح المسامي"
"Percolation is the study of flow of fluid through porous media. This model simulates the flow of a fluid through a two-dimensional grid. Brown cells represent the medium. Blue cells represent fluid / water whereas black cells represent empty space. Fluid from a cell can flow to its four adjacent neighbours.": "الارتشاح هو دراسة تدفق السوائل خلال مادة مسامية، وهذا النموذج يحاكي تدفق سائل خلال شبكة مسطحة من الخلايا. الخلايا البنية تمثل المادة الصلبة، والخلايا الزرقاء تمثل الماء، والخلايا السوداء تمثل الفراغ. يمكن للسائل في أي خلية أن ينتقل إلى الخلايا الأربع المجاورة لها مباشرة."
"Porosity: 0.6": "المسامية: 0.6"
"Moving the above slider will immediately update the grid": "تحريك المنزلق أعلاه يحدّث الشبكة فورًا"
"Reset Grid": "إعادة ضبط الشبكة"
"Refill": "إعادة التعبئة"
"Porosity is the fraction of the grid that is empty. When porosity is above 0.59, then the fluid is most likely to flow from the top to the bottom (or 'percolate')": "المسامية هي نسبة الخلايا الفارغة في الشبكة. وحين تتجاوز المسامية 0.59، يصبح الأرجح أن يتدفق السائل من الأعلى إلى الأسفل، أي أن 'يرتشح' خلال الشبكة"
"Note:": "ملاحظة:"
"When porosity is above 0.59, the medium is likely to have a contiguous space that spans the entirety of the grid. This is called a 'percolating cluster' or a 'spanning cluster'": "حين تتجاوز المسامية 0.59، يصبح من المرجح أن يمتد فراغ متصل من طرف الشبكة إلى الطرف الآخر، ويسمى هذا 'تجمعًا مرتشحًا' أو 'تجمعًا ممتدًا'"
"There will be cases when the fluid does not percolate even when porosity is above 0.59 (and vice versa). This is due to defects of the random number generator, and the finiteness of the grid.": "قد لا يرتشح السائل أحيانًا رغم أن المسامية أعلى من 0.59، والعكس صحيح أيضًا، وذلك بسبب عيوب مولّد الأرقام العشوائية ومحدودية حجم الشبكة."
"Related: <a href=\"../bernoulli_percolation/simulation.html\">Bernoulli Percolation</a>, <a href=\"../tdp/simulation.html\">Directed Percolation</a>, <a href=\"../contact_process/simulation.html\">Contact Process</a>.": "محاكاة قريبة: <a href=\"../bernoulli_percolation/simulation.html\">ارتشاح برنولي</a>، <a href=\"../tdp/simulation.html\">الارتشاح الموجّه</a>، <a href=\"../contact_process/simulation.html\">عملية التماس</a>."
