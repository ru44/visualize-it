"Pause": "إيقاف مؤقت"
"Restart": "إعادة التشغيل"
"If the landscape has gone completely barren or become completely filled, then press 'Restart' to repopulate": "إن أصبحت الأرض خالية تمامًا أو ممتلئة تمامًا، اضغط 'إعادة التشغيل' لتعيد توزيع النبات"
"Working": "طريقة العمل"
"The system consists of an N x N array of cells wherein each cell can be either 0 (unoccupied) or 1 (occupied). The transitions are dictated as follows:": "يتكوّن النظام من شبكة خلايا بحجم N × N، وكل خلية إما 0 (فارغة) أو 1 (مشغولة). وتسير التحوّلات وفق الخطوات التالية:"
"Step 1: Select a random cell. Call this the 'focal cell'": "الخطوة 1: اختر خلية عشوائية، وسمِّها 'الخلية المحورية'"
"Step 2: If the focal cell is unoccupied, return to step (1). Otherwise, proceed to step (3)": "الخطوة 2: إن كانت الخلية المحورية فارغة، عد إلى الخطوة (1). وإلا تابع إلى الخطوة (3)"
"Step 3: Randomly select one of its four Von-Neumann neighbours. If the selected neighbour is unoccupied, then proceed to step (d). Otherwise, proceed to step (e)": "الخطوة 3: اختر عشوائيًا واحدة من جاراتها الأربع (جوار فون نيومان). إن كانت الجارة فارغة تابع إلى الخطوة (د)، وإلا تابع إلى الخطوة (هـ)"
"Step 4: With probability p, update the unoccupied neighbour cell from 0 to 1. This process is reproduction. Otherwise (with probability 1 - p), update the focal cell from 1 to 0. This is stochastic death.": "الخطوة 4: باحتمال p تتحول الجارة الفارغة من 0 إلى 1، وهذا تكاثر. وإلا (باحتمال 1-p) تتحول الخلية المحورية من 1 إلى 0، وهذا موت عشوائي."
"Step 5: The focal cell and neighbour cell collectively have 6 Von-Neumann neighbours. Select one at random. With probability q, update the selected cell to 1 (irrespective of its initial state). This is positive-feedback birth. Otherwise (with probability 1- q), update the focal cell from 1 to 0. This is density death.": "الخطوة 5: للخلية المحورية وجارتها معًا 6 جارات (جوار فون نيومان). اختر واحدة عشوائيًا. باحتمال q تتحول هذه الخلية إلى 1 مهما كانت حالتها، وهذه ولادة بتغذية راجعة موجبة. وإلا (باحتمال 1-q) تتحول الخلية المحورية من 1 إلى 0، وهذا موت بسبب الكثافة."
"Transitions": "التحوّلات"
"Before checking out either of these transitions, please make sure that the landscape is significantly populated. If you want the system to equilibriate faster, then increase the simulation speed.": "قبل أن تجرّب أيًا من هذين التحوّلين، تأكد أن الأرض مليئة بالنبات بقدر كافٍ. وإن أردت أن يصل النظام إلى توازنه أسرع، فزد سرعة المحاكاة."
"<b>Continuous Transition:</b> <br> Set q = 0. Start from p = 0.7, and slowly decrease till p = 0.6. The occupancy should slowly decrease and finally reach zero around p = 0.62": "<b>التحوّل التدريجي:</b> <br> اجعل q = 0. ابدأ من p = 0.7 وأنقصها ببطء حتى p = 0.6. يجب أن تنخفض نسبة الإشغال بالتدريج وتصل إلى الصفر عند p قريبة من 0.62"
"<b>Abrupt Transition:</b> <br> Set q = 0.92. Start from p = 0.3, and slowly decrease till p = 0.26. The occupancy should suddenly collapse around p = 0.28": "<b>التحوّل المفاجئ:</b> <br> اجعل q = 0.92. ابدأ من p = 0.3 وأنقصها ببطء حتى p = 0.26. يجب أن تنهار نسبة الإشغال فجأة عند p قريبة من 0.28"
"Note:": "ملاحظة:"
"A simultion speed of 100x corresponds to N^2 Monte Carlo updates every frame": "سرعة محاكاة قدرها 100x تعني N^2 من تحديثات مونت كارلو في كل إطار"
"The boundary condition is periodic": "حدود الشبكة دائرية: طرفها الأخير متصل بطرفها الأول"
"This simulation may lag on lower-end devices": "قد تتأخر هذه المحاكاة على الأجهزة الضعيفة"
