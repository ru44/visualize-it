"Tricritical Directed Percolation": "التسرّب الموجّه فوق الحرج"
"Tricritical Directed Percolation (TDP) is a DP-class model that can be used to study vegetation dynamics, not only because the processes in this model have analogies in the context of ecology, but also because it possesses both continuous and abrupt transitions.": "التسرّب الموجّه فوق الحرج (TDP) نموذج من عائلة نماذج التسرّب الموجّه، ويُستخدم لدراسة كيف ينتشر النبات أو ينحسر في بيئة ما. فخطواته تشبه ما يحدث فعلًا في الطبيعة، وهو أيضًا يُظهر نوعين من التحوّل: تحوّلًا تدريجيًا وآخر مفاجئًا."
"<b>Green:</b> Vegetation (Occupied) <br> <b>Black:</b> Desert (Unoccupied)": "<b>الأخضر:</b> نبات (مشغولة) <br> <b>الأسود:</b> صحراء (فارغة)"
"<b>Occupancy:</b> 0.508125": "<b>نسبة الإشغال:</b> 0.508125"
