"Rewire propensity: 0": "احتمال إعادة التوصيل: 0"
"In the above interactive visualization, the white color dots arranged along a circle represent the nodes of the network, whereas the straight and curved lines connecting them represent the edges. Red color edges have more propensity to get rewired than blue colored ones. Before rewiring, all nodes are uniformly connected to their nearest nodes, thereby constituting a regular lattice. As the rewire propensity increases, the regular lattice transforms into a random graph.": "النقاط البيضاء المرتبة على شكل دائرة في المحاكاة أعلاه تمثل عُقد الشبكة، والخطوط المستقيمة والمنحنية التي تصلها تمثل الوصلات بينها. الوصلات الحمراء أكثر عرضة لإعادة التوصيل من الزرقاء. قبل إعادة التوصيل تتصل كل عقدة بأقرب العُقد منها فقط، فتتكوّن شبكة منتظمة. وكلما زاد احتمال إعادة التوصيل، تحوّلت هذه الشبكة المنتظمة إلى شبكة عشوائية."
"Explanation": "الشرح"
"Clustering coefficient": "معامل التكتل"
"represents the tight-knit nature of a node's neighbourhood, averaged across all nodes. To be more precise, if a node": "يقيس مدى ترابط جيران العقدة فيما بينها، بعد أخذ متوسط ذلك على كل العُقد. وبتفصيل أكثر، إذا كانت لعقدة"
"has": "لديها"
"neighbours, then these": "جارًا، فإن هؤلاء الـ"
"neigbours can have a maximum of": "جارًا، يمكن أن يكون بينهم على الأكثر"
"connections between them (if they're fully connected). The extent to which this maximum connectedness is achieved across all nodes is called the clustering coefficient.": "رابطًا (إن كانوا جميعًا متصلين ببعضهم). ومقدار اقتراب الشبكة من هذا الحد الأقصى، بعد أخذ متوسطه على كل العُقد، هو معامل التكتل."
"Characteristic length": "الطول المميز"
"is the length of the shortest path between two nodes, averaged across all possible pairs of nodes.": "هو متوسط طول أقصر مسار بين عقدتين، محسوبًا على كل الأزواج الممكنة من العُقد."
"A regular lattice with, say 30 nodes and 4 edges per node, is characterized by a high clustering coefficient and high characteristic length. As soon as some edges get rewired, this introduces": "الشبكة المنتظمة، مثل شبكة من 30 عقدة و4 وصلات لكل عقدة، تتميز بمعامل تكتل مرتفع وطول مميز كبير. وبمجرد إعادة توصيل بعض الوصلات، تظهر فيها"
"shortcuts": "اختصارات"
"in the network which brings down the characteristic length, while having not much effect on the clustering coefficient. This is the realm of small-world networks, and its effects are more prevalent in bigger graphs with sparser connections. As the rewiring propensity is increased, the regular network unravels, giving rise to a random graph which has both: low clustering coefficient and low characteristic length.": "في الشبكة، فتقلل الطول المميز دون أن تؤثر كثيرًا في معامل التكتل. وهذا بالضبط مجال شبكات العالم الصغير، ويظهر أثره أوضح في الشبكات الكبيرة ذات الوصلات القليلة نسبيًا. وكلما زاد احتمال إعادة التوصيل، تتفكك الشبكة المنتظمة أكثر فأكثر حتى تصبح شبكة عشوائية، بمعامل تكتل منخفض وطول مميز صغير معًا."
"Small-world networks have many special properties: contagions (disease or rumours) spread faster, consensus is correctly established, strategies find it difficult to establish, information is delivered faster, oscillators find it easier to establish synchrony, etc. These properties definitely play a role in the the real-world networks that are structured as small-world networks, and may play a role behind fascinating properties observed in them.": "لشبكات العالم الصغير خصائص مميزة كثيرة: تنتشر فيها الأوبئة والشائعات أسرع، ويسهل التوافق الجماعي، ويصعب ترسّخ استراتيجيات معينة، وتصل المعلومة أسرع، وتتزامن المذبذبات فيها بسهولة أكبر، وغير ذلك. ولا شك أن لهذه الخصائص دورًا في كثير من شبكات الواقع المبنية بهذا الشكل، وقد تفسر بعض ظواهرها المثيرة للاهتمام."
"Note:": "ملاحظة:"
"This interactive visualization is inspired by the research paper titled \"Collective dynamics of small-world networks\" by Duncan Watts &amp; Steven Strogatz, published in Nature in 1998 (<a href=\"https://www.nature.com/articles/30918\" target=\"_blank\">link</a>)": "استُلهمت هذه المحاكاة التفاعلية من بحث بعنوان \"الديناميكا الجماعية لشبكات العالم الصغير\" لدنكان واتس &amp; ستيفن ستروغاتز، نُشر في مجلة Nature عام 1998 (<a href=\"https://www.nature.com/articles/30918\" target=\"_blank\">الرابط</a>)"
"Clustering coefficient is straightforward to compute, whereas characteristic length computation requires Djikstra's algorithm to run, so this website may lag on lower-end devices when simulated with large networks.": "حساب معامل التكتل بسيط، لكن حساب الطول المميز يحتاج إلى تشغيل خوارزمية ديكسترا، فقد يعمل الموقع ببطء على الأجهزة الضعيفة مع الشبكات الكبيرة."
