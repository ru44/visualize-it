"Small-World Networks": "شبكات العالم الصغير"
"A network is a set of nodes and edges. It is an abstraction for many real-world systems: social circles, gene circuits, neuronal networks, power grids, etc. Small-world networks are those network topologies which are as densely clustered as regular lattices, but the distance between any two nodes is as low as in random graphs. Most examples of real-life networks have been found to be small-world networks, and they have been studied for their interesting properties. The below interactive visualization allows you to interpolate between a regular lattice and a random graph, thereby showcasing the middle-ground of small-world networks.": "الشبكة مجموعة من العُقد والوصلات بينها، وهي تمثيل مبسّط لأنظمة كثيرة من الواقع: الدوائر الاجتماعية، والشبكات الجينية، وخلايا الدماغ، وشبكات الكهرباء وغيرها. شبكات العالم الصغير هي شبكات متكتلة بكثافة كشبكات منتظمة، لكن المسافة بين أي عقدتين فيها قصيرة كما في الشبكات العشوائية. تبيّن أن أغلب الشبكات الحقيقية من هذا النوع، ولهذا دُرست خصائصها باهتمام. تتيح لك المحاكاة أدناه الانتقال تدريجيًا من شبكة منتظمة إلى شبكة عشوائية، فترى بينهما حالة شبكات العالم الصغير."
"Calculated Parameters:": "القيم المحسوبة:"
