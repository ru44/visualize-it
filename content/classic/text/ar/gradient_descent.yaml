"Gradient Descent": "الانحدار التدريجي"
"Gradient descent is an iterative optimisation algorithm that is commonly used in Machine Learning algorithms to minimize cost functions.": "الانحدار التدريجي خوارزمية تحسين تكرارية، تُستخدم كثيرًا في خوارزميات تعلم الآلة لتصغير دوال التكلفة."
"Click on the canvas to introduce a point <br> Remove a point by clicking on it <br> The blue line depicts the fit": "اضغط على الشاشة لتضيف نقطة <br> اضغط على نقطة لتزيلها <br> الخط الأزرق هو المنحنى الذي يقترب من نقاطك"
"Clear Points": "مسح النقاط"
"Iterate": "خطوة واحدة"
"Start Auto": "بدء تلقائي"
"Reset": "إعادة الضبط"
"Total Iterations: 0 | Manual Clicks: 0": "مجموع الخطوات: 0 | ضغطات يدوية: 0"
"Degree of fitting polynomial: 1": "درجة كثير الحدود: 1"
"Learning rate: 1.000": "معدل التعلم: 1.000"
