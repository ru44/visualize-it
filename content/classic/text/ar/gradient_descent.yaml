"Manual Polynomial Entry": "إدخال كثير الحدود يدويًا"
"Apply Coefficients": "تطبيق المعاملات"
"Description": "الوصف"
"Consider a bunch of": "تخيّل عندك مجموعة من"
"points of the form": "نقطة على الشكل"
", and a polynomial": "، وكثير حدود"
"of order": "درجته"
"Our task is to assign all the": "مهمتنا أن نختار قيم"
"'s such that the polynomial fits the points. In order to quantify how good the fit is, we define something called the cost function": "بحيث يقترب كثير الحدود من النقاط قدر الإمكان. ولنقيس جودة هذا الاقتراب رقميًا، نعرّف ما يسمى دالة التكلفة"
"A lower cost function implies a better fit. Hence, we want to find the": "كلما صغرت دالة التكلفة كان الاقتراب أفضل. لذلك نريد أن نجد قيم"
"'s for which this function is minimized. This can be achieved via the Gradient Descent algorithm, which dictates that the": "التي تجعل هذه الدالة أصغر ما يمكن. ويحقق ذلك خوارزمية الانحدار التدريجي، التي تنص على أن تُعدَّل قيم"
"'s should be modified in the following way:": "على النحو التالي:"
"Here,": "هنا،"
"is known as the learning rate. It is the rate at which the": "يسمى معدل التعلم، وهو المقدار الذي تقترب به قيم"
"'s try to approach their minimum. It must be optimized correctly, depending on the problem. A low learning rate results in a very slow decrease in cost function. A high learning rate causes the cost function to blow up or oscillate.": "من قيمتها الصغرى في كل خطوة. يجب ضبطه بعناية بحسب المسألة: فمعدل التعلم الصغير يجعل دالة التكلفة تنخفض ببطء شديد، ومعدل التعلم الكبير قد يجعلها تتذبذب أو تنفجر بدل أن تقل."
"Note:": "ملاحظة:"
"The learning rate must be optimized correctly. Click on reset if the blue line vanishes, and adjust the learning rate accordingly.": "يجب ضبط معدل التعلم بعناية. إن اختفى الخط الأزرق، اضغط 'إعادة الضبط' واضبط معدل التعلم من جديد."
"The concept of gradient descent can be scaled to more variables easily. Infact, even neural networks utilize gradient descent to optimize the weights and biases of neurons in every level.": "تعمل فكرة الانحدار التدريجي بالطريقة نفسها مع متغيرات أكثر بكل سهولة. حتى الشبكات العصبية تستخدم الانحدار التدريجي لضبط أوزان كل عصبون فيها وانحيازاته في كل طبقة."
"<a href=\"../polynomial_regression/simulation.html\">Polynomial regression</a> directly finds the minimum of the cost function, by using calculus to find the minima and linear algebra to solve for it. However, that method doesn't scale well as the number of points are increased.": "<a href=\"../polynomial_regression/simulation.html\">انحدار كثير الحدود</a> يجد القيمة الصغرى لدالة التكلفة مباشرة، باستخدام التفاضل لإيجاد نقاط الصغرى والجبر الخطي لحلها. لكن هذه الطريقة تصبح بطيئة كلما زاد عدد النقاط."
"Related: <a href=\"../clustering/simulation.html\">K-means clustering</a>, <a href=\"../polynomial_regression/simulation.html\">Polynomial regression</a>, <a href=\"../natural_selection/simulation.html\">Genetic Algorithm</a>.": "محاكاة قريبة: <a href=\"../clustering/simulation.html\">تجميع K-means</a>، <a href=\"../polynomial_regression/simulation.html\">انحدار كثير الحدود</a>، <a href=\"../natural_selection/simulation.html\">الخوارزمية الجينية</a>."
