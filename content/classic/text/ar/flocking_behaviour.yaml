"Rules": "القواعد"
"<b>Separation:</b> If two boids come close to each other, they try moving in different directions to avoid colliding. There is no form of communication between them. The light-gray circle denotes the region around the boid where this rule comes into play.": "<b>الابتعاد:</b> حين يقترب طائران من بعضهما، يحاول كل واحد منهما أن يتحرك في اتجاه مختلف حتى لا يصطدما، بلا أي تواصل بينهما. الدائرة الرمادية الفاتحة حول كل طائر تحدد المنطقة التي تعمل فيها هذه القاعدة."
"<b>Alignment:</b> A boid moves in the average direction of the boids around it. The medium-gray circle denotes the region whose boids are considered. The blue coloured line points towards the average direction": "<b>المحاذاة:</b> يتحرك كل طائر في متوسط اتجاه الطيور المحيطة به. الدائرة الرمادية المتوسطة تحدد الطيور التي تدخل في هذا الحساب، والخط الأزرق يشير إلى الاتجاه المتوسط"
"<b>Cohesion:</b> A boid moves towards the average position of the boids around it. The dark-gray circle denotes the region whose boids are considered.": "<b>الاقتراب:</b> يتحرك كل طائر نحو متوسط موضع الطيور المحيطة به. الدائرة الرمادية الداكنة تحدد الطيور التي تدخل في هذا الحساب."
"Note:": "ملاحظة:"
"Radius of Separation region cannot be changed because it may lead to crashes": "لا يمكن تغيير نصف قطر منطقة الابتعاد لأن ذلك قد يسبب تصادم الطيور"
"Alignment is critical for flocking behaviour.": "المحاذاة أساسية لظهور سلوك السرب."
"However, if a single flock is formed, then turning off alignment will almost never have any effect.": "لكن بعد تكوّن سرب واحد، إيقاف المحاذاة لن يغيّر شيئًا تقريبًا."
"Turning off separation will cause the boids to clump together. Some of these clumps will cease net movement because they move around each other.": "إيقاف الابتعاد يجعل الطيور تتكدس فوق بعضها. بعض هذه التكتلات يتوقف عن الحركة الصافية لأن الطيور تدور حول بعضها فقط."
"Simulation may lag in low-end devices. Simulation may lag if too many boids are introduced.": "قد تتباطأ المحاكاة على الأجهزة الضعيفة، وكذلك إذا زاد عدد الطيور كثيرًا."
