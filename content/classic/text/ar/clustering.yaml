"Clustering": "التجميع"
"Given a set of 'n' points in space, the k-means clustering algorithm attempts to classify 'n' points into 'k' clusters such that the sum of distances of each point from the mean of it's respective cluster is minimized. Although this simulation showcases k-means clustering in 2D space, it is can be easily extended to further dimensions. Circles represent the points. Squares represent the (tentative) centroids of clusters. All points belonging to the same cluster share the same color.": "معك عدد n من النقاط المبعثرة في المستوى، وتريد تجميعها في مجموعات متشابهة. خوارزمية k-means توزّع هذه النقاط على k من المجموعات بحيث تكون كل نقطة قريبة قدر الإمكان من مركز مجموعتها. تعمل هذه المحاكاة في بعدين، لكن الفكرة نفسها تصلح لأي عدد من الأبعاد. الدوائر هي النقاط، والمربعات هي مراكز المجموعات المؤقتة، وكل نقطة تأخذ لون مجموعتها."
"Number of Clusters: 2": "عدد المجموعات: 2"
"Iterate": "كرّر"
"Reset": "إعادة"
"Clear": "امسح"
"Current cost: 950.65": "التكلفة الحالية: 950.65"
"Click on the screen to insert a point. Click on a point to remove it. Press 'Iterate' to progress the clustering process. Press 'Reset' to restart the clustering process anew. Press 'Clear' to remove all existing points": "اضغط على الشاشة لإضافة نقطة جديدة. اضغط على نقطة موجودة لحذفها. اضغط زر 'كرّر' لتقديم خطوة واحدة من التجميع. اضغط زر 'إعادة' لبدء التجميع من جديد. اضغط زر 'امسح' لحذف كل النقاط."
"Algorithm": "الخوارزمية"
"Psuedocode of k-means clustering algorithm is as follows:": "هذه خطوات خوارزمية k-means بشكل مبسّط:"
"Randomly insert k centroids in the space.": "ضع k من مراكز المجموعات في أماكن عشوائية من المستوى."
"Assign each point to the nearest centroid. All points assigned to the same centroid form a cluster. It is imperative to verify that each centroid has atleast one point assigned to it. Otherwise, repeat the previous step.": "اربط كل نقطة بأقرب مركز مجموعة إليها. كل النقاط المرتبطة بالمركز نفسه تكوّن مجموعة واحدة. تأكد أن كل مركز له نقطة واحدة على الأقل، وإلا فكرر الخطوة السابقة."
"Within each cluster, compute it's centroid, and move the assigned centroid to the computed position": "احسب داخل كل مجموعة متوسط مواقع نقاطها، وانقل مركز المجموعة إلى هذا الموقع الجديد."
"Repeat the previous step until the cost function (sum of distances of each point from the centroid of it's respective cluster) stops decreasing further.": "كرر الخطوة السابقة حتى تتوقف دالة التكلفة (مجموع مسافات كل نقطة عن مركز مجموعتها) عن النقصان."
"It is not guaranteed that the algorithm will converge to a global minimum. It might get stuck in a local minimum, in which case, the process must be restarted with a new set of initial centroids. The cost function quantifies how good the clustering is. A lower cost function signifies better clustering.": "لا تضمن هذه الخوارزمية الوصول إلى أفضل تجميع ممكن، فقد تستقر عند حل متوسط فقط. في هذه الحالة أعد المحاولة بمراكز بداية جديدة. دالة التكلفة تقيس مدى جودة التجميع: كلما قلّت كان التجميع أفضل."
"Note:": "ملاحظة:"
"The metric used here is Euclidean distance": "المسافة المستخدمة هنا هي المسافة الإقليدية المعتادة."
