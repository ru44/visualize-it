"Conic Sections | Visualize It": "القطوع المخروطية | Visualize It"
"Visualize It": "Visualize It"
"<a href=\"../index.html\">Home</a>": "<a href=\"../index.html\">الرئيسية</a>"
"<a href=\"../about.html\">About</a>": "<a href=\"../about.html\">حول</a>"
"Visualization of Conic Sections": "تصوير القطوع المخروطية"
"Conic sections refer to the geometric figures obtained upon intersecting a cone with a plane making different angles with its axis. In polar coordinates, all conic sections are represented by a single equaion.": "القطوع المخروطية أشكال هندسية تنتج عن قطع مخروط بمستوٍ يميل بزوايا مختلفة عن محوره. في الإحداثيات القطبية تُكتب كل القطوع المخروطية بمعادلة واحدة."
"Scale: 1 pixel = 1.00 length units": "المقياس: بكسل واحد = 1.00 وحدة طول"
"Clear": "مسح"
"Draw": "ارسم"
"Length of Semi Latus-rectum": "نصف طول الوتر البؤري"
"Eccentricity": "الاختلاف المركزي"
"Brief description": "وصف موجز"
"The equation of a conic with a semi latus-rectum length of 'L' and eccentricity of 'e' is given by": "معادلة القطع المخروطي الذي طول نصف وتره البؤري 'L' واختلافه المركزي 'e' هي"
"The corresponding (r, θ) can be converted into cartesian coordinates (x, y) and plotted": "يمكن تحويل (r, θ) الناتجة إلى إحداثيات ديكارتية (x, y) ورسمها"
"Circle": "الدائرة"
"When the plane is perpendicular to the conical axis, the conic section obtained is a circle. The semi latus-rectum is just the radius. Circles have an eccentricity of 0.": "حين يكون المستوى عموديًا على محور المخروط، ينتج القطع دائرة. نصف الوتر البؤري هنا هو نصف القطر نفسه، واختلافها المركزي يساوي 0."
"Ellipse": "القطع الناقص"
"When the plane makes an angle more than the semi-vertical angle of the cone but less than 90<sup>o</sup>, the conic section obtained is an ellipse. It like a bloated circle. Ellipses have an absolute eccentricity between 0 and 1 (exclusive).": "حين تكون زاوية المستوى أكبر من نصف زاوية رأس المخروط وأصغر من 90<sup>o</sup>، ينتج القطع الناقص، وهو أشبه بدائرة منتفخة. اختلافه المركزي المطلق بين 0 و1 دون أن يساويهما."
"Parabola": "القطع المكافئ"
"When the plane makes an angle lesser than the semi-vertical angle of the cone but intersections only a single motif, the conic section obtained is a parabola. They have an absolute eccentricity of 1": "حين تكون زاوية المستوى أصغر من نصف زاوية رأس المخروط، ويقطع نصفًا واحدًا من المخروط فقط، ينتج القطع المكافئ. اختلافه المركزي المطلق يساوي 1"
"Hyperbola": "القطع الزائد"
"When the plane intersects both the conical motifs, the conic section obtained is a hyperbola. They have an absolute eccentricity greater than 1.": "حين يقطع المستوى نصفي المخروط معًا، ينتج القطع الزائد. اختلافه المركزي المطلق أكبر من 1."
"Note:": "ملاحظة:"
"Due to their open-ended nature, parabolas and hyperbolas extend into infinity. They are not efficiently drawn here.": "بما أن القطع المكافئ والقطع الزائد مفتوحان بلا نهاية، فإنهما يمتدان إلى ما لا نهاية، ورسمهما هنا ليس دقيقًا بالكامل."
"Circles and Ellipses of huge lengths can be drawn. However, the curve may seem broken and a lot of time will be required to rescale": "يمكن رسم دوائر وقطوع ناقصة بأطوال كبيرة جدًا، لكن المنحنى قد يبدو متقطعًا، وسيستغرق تغيير المقياس وقتًا طويلًا"
"All draw buttons are disabled during drawing and scaling": "تُعطَّل كل أزرار الرسم أثناء الرسم وتغيير المقياس"
