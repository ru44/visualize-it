"Linear Momentum": "الزخم الخطي"
"While playing the game of Pong, have you ever wondered how the Computer figures out the final location of the ball? It uses conservation of Linear Momentum. The \"game\" below shows you the calculated trajectory of the ball.": "وأنت تلعب لعبة البونغ (Pong)، هل تساءلت يومًا كيف يعرف الحاسوب أين ستحطّ الكرة في النهاية؟ يستخدم في ذلك قانون حفظ الزخم الخطي. تريك اللعبة أدناه المسار الذي يحسبه الحاسوب للكرة."
"Touch the canvas with the intended position of your paddle": "المس الشاشة عند الموضع الذي تريد أن تضع فيه مضربك"
"Pause": "إيقاف مؤقت"
"Hide Trail": "إخفاء الأثر"
"Restart": "إعادة التشغيل"
"Description": "الوصف"
"According to conservation of linear momentum, the vector sum of linear momenta of a system of isolated particles is conserved. Although the direction and momentum of induvidual particles may change during collisions, the sum of components of linear momentum of the colliding particles remains same before and after the collision.": "يقول قانون حفظ الزخم الخطي: إن مجموع متجهات الزخم لمجموعة من الجسيمات المعزولة يبقى ثابتًا. قد يتغيّر اتجاه كل جسيم وزخمه في أثناء التصادم، لكن مجموع الزخم على كل محور يبقى نفسه قبل التصادم وبعده."
"When colliding with a vertically-oriented, ideally rigid and immovable obstacle, the sign of momentum along the horizontal direction changes whereas the momentum along vertical direction remains the same": "حين تصطدم الكرة بحاجز رأسي صلب لا يتحرك، تنقلب إشارة الزخم الأفقي بينما يبقى الزخم الرأسي كما هو"
"Working of the game": "كيف تعمل اللعبة"
"The game assumes the paddles and the walls to be rigid and immovable objects. The function that controls the paddle has access to the initial coordinates and the initial horizontal and vertical velocity of the ball. It creates a pseudo-ball and tracks its motion. Assuming that the player manages to dodge the pseudo-ball, the function negates its vertical velocity. In the meantime, if the ball collides with the wall, the function negates its horizontal velocity. It continues mapping the trajectory of the pseudo-ball until the ball reaches the Y-coordinate of the paddle. The X-coordinate of the ball at this point is set as target for the paddle. All these calculations happen in the blink of an eye and only once for every oscillation of the ball.": "تفترض اللعبة أن المضارب والجدران صلبة لا تتحرك. الدالة التي تحرّك مضرب الحاسوب تعرف موضع الكرة وسرعتها الأفقية والرأسية في البداية، فتصنع كرة وهمية وتتبع حركتها. تفترض أن اللاعب سيتفادى الكرة الوهمية، فتقلب سرعتها الرأسية عند كل ارتداد. وإن اصطدمت هذه الكرة الوهمية بجدار، تقلب سرعتها الأفقية. تواصل الدالة تتبع مسار الكرة الوهمية حتى تصل إلى ارتفاع مضرب الحاسوب، فيصبح الموضع الأفقي للكرة عندها هو الهدف الذي يتحرك إليه المضرب. كل هذا الحساب يحدث في لحظة واحدة، ومرة واحدة فقط في كل ارتداد للكرة."
"Note:": "ملاحظة:"
"To prevent the game from becoming boring, the vertical speed of the ball is increased periodically by some percentage. In such cases, the trajectory of the ball is recalculated": "لكي لا تصبح اللعبة مملّة، تزداد سرعة الكرة الرأسية بنسبة معيّنة بين حين وآخر، وعندها يُعاد حساب مسارها"
