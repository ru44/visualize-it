"The blue colored boids want to go right. The red colored boids want to go left. All boids want to avoid collisions. These simple rules and interactions can give rise to lane formation and phantom traffic jams, as showcased by this simulation.": "المشاة الزرق في هذه المحاكاة يريدون التحرك يمينًا، والمشاة الحمر يريدون التحرك يسارًا، وكل مشاة يحاول تفادي الاصطدام بغيره. من هذه القواعد البسيطة تتكوّن ممرات ثابتة الاتجاه، وتظهر أحيانًا ازدحامات لا سبب واضحًا لها، كما ستراه في المحاكاة."
