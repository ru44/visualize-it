"Phenomena": "ظواهر"
"<b>Lane formation:</b> Eventually, the boids will forms lanes such that all boids in the same lane are travelling in the same direction. Lane formation happens because boids keep steering away from boids coming in the opposite direction, until they reach a state wherein they no longer encounter opposing boids (that is, in a lane). A critical number of boids is required for lane formation, below which there is just not enough interaction to faciliate lane formation. The size of the \"privacy zone\" also plays a role here. The number of lanes possible depends on the width of the pathway. If there is a bias in direction, then the minority boids may take longer to form their own lanes. A high variance in walking speed impedes the formation of lanes, as described in the next point.": "<b>تكوّن الممرات:</b> مع الوقت تتوزع المشاة في ممرات، بحيث يسير كل مشاة في ممر واحد بنفس اتجاه رفاقه فيه. يحدث هذا لأن كل مشاة يبتعد باستمرار عمّن يسير في الاتجاه المعاكس له، حتى يصل إلى مسار لا يقابل فيه أحدًا معاكسًا، وهذا هو الممر. يحتاج تكوّن الممرات إلى عدد كافٍ من المشاة، وإلا لم يكن هناك احتكاك كافٍ بينهم لتشكيلها. حجم \"منطقة الخصوصية\" حول كل مشاة يؤثر في ذلك أيضًا، وعدد الممرات الممكنة يعتمد على عرض الطريق. وإذا كان هناك ميل لاتجاه معيّن، فقد تحتاج المشاة الأقلية وقتًا أطول لتكوين ممرها الخاص. وتفاوت كبير في سرعة المشي يعطّل تكوّن الممرات، كما سترى في النقطة التالية."
"<b>Phantom traffic jams:</b> A congestion is called a phantom traffic jam if there was no long-term inertial cause (example: vehicle break down, obstacles on road, etc) behind it. They typically happen because vehicles decelerates too much (to take a turn, to avoid coming too close to the front vehicle, etc), which causes the vehicle behind it to decelerate, and so on. This causes a \"shockwave\" of deceleration to travel backwards and is resolved only when the last car in the chain can safely chose not to decelerate. In this simulation, phantom traffic jams are caused when there is high variance in speed. The faster boids will have to decelerate and turn in order to get ahead of the slower boids, and this obstructs the movement of the surrounding boids. This also obstructs formation of lanes. In real-life, however, phantom traffic jams are mostly associated with vehicles (not pedestrians) and they happen in laned roads/highways.": "<b>الازدحام الوهمي:</b> يُسمى الازدحام وهميًا إذا لم يكن سببه شيئًا دائمًا مثل عطل سيارة أو عائق على الطريق. يحدث عادة لأن سيارة تبطئ كثيرًا، لتنعطف مثلًا أو لتبتعد عن السيارة التي أمامها، فتضطر السيارة التي خلفها إلى الإبطاء أيضًا، وهكذا تنتقل \"موجة\" من الإبطاء إلى الخلف، ولا تنتهي إلا حين تجد آخر سيارة في الطابور أنه لا داعي للإبطاء. في هذه المحاكاة يظهر الازدحام الوهمي حين يكون تفاوت السرعة كبيرًا: فالمشاة الأسرع يضطرون إلى الإبطاء والانعطاف لتجاوز الأبطأ منهم، فيعطّلون حركة من حولهم، وهذا يمنع أيضًا تكوّن الممرات. في الواقع يحدث الازدحام الوهمي غالبًا بين السيارات لا المشاة، وعلى الطرق ذات المسارات المحددة."
"Note:": "ملاحظة:"
"The model in this simulation is inspired from <a href=\"https://journals.aps.org/pre/abstract/10.1103/PhysRevE.51.4282\" target=\"_blank\">this paper</a>.": "هذا النموذج مستوحى من <a href=\"https://journals.aps.org/pre/abstract/10.1103/PhysRevE.51.4282\" target=\"_blank\">هذه الورقة البحثية</a>."
"The boundary condition is periodic. However, interactions don't happen across the boundary. This is to simulate the effect of entering a new road.": "حدود المحاكاة دائرية، أي أن من يخرج من طرف يدخل من الطرف الآخر، لكن لا يحدث تفاعل عبر الحد نفسه، لأن هذا يحاكي دخول المشاة إلى طريق جديد."
"If all boids are moving in same direction, and if variance is maximized, then flow decreases. This effect is more pronounced at higher densities. This observation has been vaguely connected to phantom traffic jams.": "إذا سار الجميع في الاتجاه نفسه وكان تفاوت السرعة في أعلى درجاته، يقل معدل الحركة الكلي، ويظهر هذا التأثير بوضوح أكبر كلما زاد عدد المشاة. ويُظن أن لهذه الملاحظة صلة بالازدحام الوهمي."
