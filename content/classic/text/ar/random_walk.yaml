"Random Walks": "المشي العشوائي"
"This simulation aims to show the connection between unbiased random walks and normal distribution. It also showcases the relationship between Standard deviation, Mean squared displacement and number of steps. An animal which has equal probability of moving towards the left or towards the right, is said to execute an unbiased random walk.": "تُظهر هذه المحاكاة العلاقة بين المشي العشوائي غير المتحيز والتوزيع الطبيعي، وتوضح أيضًا العلاقة بين الانحراف المعياري ومتوسط مربع الإزاحة وعدد الخطوات. الحيوان الذي يساوي احتمال تحركه يمينًا احتمال تحركه يسارًا يقال إنه يمشي مشيًا عشوائيًا غير متحيز."
"Mean: -0.031333 <br> Standard Deviation: 22.365398 <br> Mean Squared Displacement: 500.212000": "المتوسط: -0.031333 <br> الانحراف المعياري: 22.365398 <br> متوسط مربع الإزاحة: 500.212000"
"Mean is expected to be around 0, standard deviation around √N and MSD around N": "يُتوقع أن يكون المتوسط قريبًا من 0، والانحراف المعياري قريبًا من √N، ومتوسط مربع الإزاحة قريبًا من N"
"Restart": "إعادة التشغيل"
"Simulation takes a couple of seconds to complete. Please wait": "تحتاج المحاكاة بضع ثوانٍ لتكتمل، فانتظر قليلًا"
"Number of entities:": "عدد الكائنات:"
"Number of steps (N):": "عدد الخطوات (N):"
"Press \"restart\" for changes to take effect": "اضغط \"إعادة التشغيل\" ليصبح التغيير ساري المفعول"
"Relationship with Normal distribution": "العلاقة بالتوزيع الطبيعي"
"The probability of an entity reaching a particular point can be modelled as a binomial distribution. Due to the Central Limit Theorem - as the sample size increases, the distribution becomes more similar to a normal distribution.": "يمكن وصف احتمال وصول كائن إلى نقطة معينة بتوزيع ذي حدين. وبحسب نظرية النهاية المركزية، كلما كبر حجم العينة اقترب التوزيع أكثر من التوزيع الطبيعي."
"Another way to look at it is via Pascal's triangle. The N-th row of Pascal's triangle (where N is the number of steps) has N elements. The entry at a particular point on Pascal's triangle shows the number of steps one can take to reach it (from the top of the triangle). Hence more animals end up at the middle than at the extremes. As we descend Pascal's triangle, The relative magnitudes of the elements bear more resemblance to a normal distribution.": "طريقة أخرى لفهم الأمر هي مثلث باسكال. الصف رقم N من مثلث باسكال (حيث N عدد الخطوات) يحوي N عنصرًا. كل عنصر في المثلث يمثل عدد المسارات التي تصل إليه من قمة المثلث. لهذا ينتهي عدد أكبر من الحيوانات في المنتصف مقارنة بالأطراف. وكلما نزلنا في مثلث باسكال، اقتربت القيم النسبية لعناصره من شكل التوزيع الطبيعي."
"This simulation is a codified form of Galton board, check it out <a target=\"blank\" href=\"https://galtonboard.com/\">here</a>.": "هذه المحاكاة صيغة برمجية للوحة غالتون، يمكنك الاطلاع عليها <a target=\"blank\" href=\"https://galtonboard.com/\">هنا</a>."
"Parameters and their Formulae": "المقادير ومعادلاتها"
"<b>1) Mean: </b> since an animal is equally likely to go left or right, the mean position of an animal is expected to be zero. <br> <b>2) Mean Squared Displacement: </b> MSD is the mean of the square of displacements. It is calculated to be Na<sup>2</sup>, where 'a' is the displacement in one step (a = 1 in our case) and 'N' is the number of steps. Hence MSD = N. <br> <b>3) Standard Deviation: </b> is given by √(MSD - Mean<sup>2</sup>). Evaluates to √N in our case": "<b>1) المتوسط: </b> بما أن احتمال تحرك الحيوان يمينًا يساوي احتمال تحركه يسارًا، يُتوقع أن يكون متوسط موضعه صفرًا. <br> <b>2) متوسط مربع الإزاحة: </b> هو متوسط مربعات الإزاحات، ويُحسب فيساوي Na<sup>2</sup>، حيث 'a' إزاحة الخطوة الواحدة (a = 1 هنا) و'N' عدد الخطوات. إذن متوسط مربع الإزاحة = N. <br> <b>3) الانحراف المعياري: </b> يُحسب من √(متوسط مربع الإزاحة - المتوسط<sup>2</sup>)، وقيمته هنا √N"
"The more animals we consider, the greater agreement we find between our measured and expected parameters.": "كلما زاد عدد الحيوانات التي نتابعها، اقتربت القيم التي نقيسها من القيم المتوقعة."
