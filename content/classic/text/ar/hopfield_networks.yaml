"The amazing thing is that all the memorization and recall takes place via network interactions, without any centralized mechanism. Hopfield networks shed light on how Large Language Models may hypothetically store memory. They also suggest how biological brains retrieve complete information from incomplete snippets (say, an entire song from a few lyrics). There are many extensions of Hopfield networks, the most prominent one being the Boltzmann machine.": "والمدهش أن كل هذا الحفظ والاسترجاع يحدث فقط من خلال تفاعل العقد مع بعضها، بلا أي تحكم مركزي. تقترح شبكات هوبفيلد فكرة عن كيفية تخزين نماذج اللغة الكبيرة للمعلومات، وكيف تسترجع الأدمغة الحيّة معلومة كاملة من أجزاء بسيطة منها، كأن تتذكّر أغنية كاملة من بضع كلمات فقط. ولشبكات هوبفيلد امتدادات كثيرة، أبرزها آلة بولتزمان."
"The theoretical capacity of a Hopfield network is": "السعة النظرية لشبكة هوبفيلد هي"
"patterns, where": "نمطًا، حيث"
"is the number of nodes. In practice, due to correlations in the patterns stored, the actual capacity may be much lower. Similar patterns may give rise to additional local minima which correspond to an amalgamation of the similar patterns (confusion). Multiple local minimas may lie together, leading to mis-identification.": "عدد العقد. لكن في الواقع، وبسبب التشابه بين الأنماط المحفوظة، قد تكون السعة الفعلية أقل بكثير. فالأنماط المتشابهة قد تُنتج نقاطًا دنيا إضافية تمزج بينها (تشويش)، وقد تتقارب عدة نقاط دنيا معًا فتُخطئ الشبكة في التعرّف على النمط."
"Note:": "ملاحظة:"
"This simulation (particularly the recall phase) is computationally complex and may lag on lower-end devices.": "هذه المحاكاة، وخصوصًا مرحلة الاسترجاع، تحتاج حسابًا كثيفًا وقد تتباطأ على الأجهزة الضعيفة."
"For best recall results, use patterns that are dissimilar to each other.": "للحصول على أفضل استرجاع، استخدم أنماطًا مختلفة عن بعضها بوضوح."
