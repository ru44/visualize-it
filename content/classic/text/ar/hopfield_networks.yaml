"nodes. Edges are symmetric/undirected. The memorization phase involves tweaking the weights such that the resulting energy landscape features a local minimum at the pattern to be learnt. The recall phase involves starting from a partial/noisy state and tweaking the state of each node until we reach a local minimum.": "والعقدة. والأضلاع غير موجهة (متماثلة). في مرحلة الحفظ نعدّل الأوزان حتى يصبح النمط المراد حفظه أدنى نقطة في مشهد الطاقة. وفي مرحلة الاسترجاع، نبدأ من حالة جزئية أو مشوّشة ونعدّل حالة كل عقدة حتى نصل إلى أقرب نقطة أدنى."
