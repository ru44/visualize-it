"Hopfield Networks": "شبكات هوبفيلد"
"A hopfield network is a very simple framework that is capable of learning (memorization) and inference (recall) of patterns. It also features associative memory, in the sense that it can recall the learnt pattern when the given pattern is partial and/or noisy. The below simulation fetures a 35x35 grid which comprises a fully connected network of 1225 nodes. Teach it some patterns (example: numbers) by drawing the pattern and then clicking \"memorize\". After this, draw the same pattern(s) partially/differently and click on \"recall\" in order to (hopefully) obtain the learned pattern. Hopfield networks through light on how LLMs may memorize information, and how biological brains may retrieve information.": "شبكة هوبفيلد أداة بسيطة تتعلّم أنماطًا (حفظ) وتستطيع استرجاعها (استدعاء). ولها ذاكرة ترابطية: إن أعطيتها جزءًا من نمط محفوظ أو نسخة مشوّشة منه، تستطيع استرجاع النمط كاملًا. المحاكاة أدناه شبكة كاملة الترابط من 1225 عقدة، مرتّبة في شبكة 35×35. علّمها بعض الأنماط (مثل الأرقام) بأن ترسمها ثم تضغط \"احفظ\". بعدها ارسم النمط نفسه بشكل جزئي أو مختلف قليلًا واضغط \"استرجع\" لترى الشبكة وهي تستعيده (إن نجحت). تكشف شبكات هوبفيلد كيف قد تحفظ نماذج اللغة الكبيرة معلوماتها، وكيف تسترجع الأدمغة الحيّة معلومات كاملة من أجزاء ناقصة."
