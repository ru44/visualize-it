"Stroboscopic Effect": "تأثير الستروبوسكوب"
"Stroboscopic Effect is the visual phenomenon caused due to sampling of continuous motion in discrete steps. It can be observed in daily life, as the apparent change in direction of rotation of a fan when changing its speed. In some movies, the wheels of trains appear to go backwards (wagon-wheel effect), this is also explained by stroboscopic effect. Some videos of helicopters flying without any motion of the rotor are illusions that can be explained by stroboscopic effect: the shutter rate is a multiple of the revolving frequency of the rotor.": "تأثير الستروبوسكوب ظاهرة بصرية تحدث حين نلتقط حركة مستمرة في لقطات منفصلة متباعدة. تراها في حياتك اليومية حين يبدو أن اتجاه دوران مروحة يتغير فجأة عند تعديل سرعتها. وفي بعض الأفلام تبدو عجلات القطارات وكأنها تدور إلى الخلف (تأثير عجلة العربة)، وهذا أيضًا بسبب تأثير الستروبوسكوب. وحتى مقاطع الفيديو التي تُظهر مروحة طائرة مروحية ثابتة تمامًا ليست إلا وهمًا سببه أن معدل التقاط الكاميرا مضاعف لتردد دوران المروحة."
"Pause": "إيقاف مؤقت"
"Toggle direction": "عكس الاتجاه"
"Wheel speed: 60 RPM or 1.00 revolution(s) per second": "سرعة العجلة: 60 دورة/دقيقة أو 1.00 دورة في الثانية"
