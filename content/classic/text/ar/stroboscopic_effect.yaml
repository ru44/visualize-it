"Predefined States": "حالات جاهزة"
"The Stationary Rotor": "العجلة الساكنة ظاهريًا"
"The perceived wheel appears near stationary to the observer. Notice the fact that the sampling rate is exactly twice of the number of revolutions per second. <a href=\"https://www.youtube.com/watch?v=2SgG99QKLFE\">StandUpMaths' YouTube video</a>": "تبدو العجلة للمُشاهد شبه ساكنة، ولاحظ أن معدل الالتقاط هنا يساوي ضعف عدد الدورات في الثانية بالضبط. <a href=\"https://www.youtube.com/watch?v=2SgG99QKLFE\">فيديو StandUpMaths على يوتيوب</a>"
"Simulate": "تشغيل الحالة"
"Near-complete Aliasing": "التعرّج (aliasing) شبه التام"
"The condition where the camera's shutter rate is so high that the discrete frames captured by it actually appear continuous to the eye.": "الحالة التي يكون فيها معدل التقاط الكاميرا مرتفعًا جدًا، حتى تبدو اللقطات المنفصلة للعين وكأنها حركة متصلة."
"The Oscillating Rotor": "العجلة المتذبذبة ظاهريًا"
"The perceived wheel appears to oscillate between three angular positions. This wass commonly seen in World War 2 fighter planes": "تبدو العجلة وكأنها تتذبذب بين ثلاثة أوضاع زاوية فقط، وهذا ما كان يُلاحظ كثيرًا في طائرات القتال في الحرب العالمية الثانية"
"Wagon-wheel Effect": "تأثير عجلة العربة"
"The perceived direction of rotation is opposite to the actual direction of rotation. <a href=\"https://www.youtube.com/watch?v=VNftf5qLpiA\">Professor Valvano's YouTube video</a>": "يبدو اتجاه الدوران المُدرَك معاكسًا للاتجاه الحقيقي. <a href=\"https://www.youtube.com/watch?v=VNftf5qLpiA\">فيديو الأستاذ فالفانو على يوتيوب</a>"
"The Sluggish Rotor": "العجلة البطيئة ظاهريًا"
"The perceived wheel rotates in the same direction as the actual wheel, but with a slower perceived speed.": "تدور العجلة في الاتجاه الصحيح، لكن بسرعة تبدو أبطأ من سرعتها الحقيقية."
"Note:": "ملاحظة:"
"Stroboscopic effect can also be introduced due to the limited frame rate of the screen and due to persistence of vision of the human eye.": "قد يظهر تأثير الستروبوسكوب أيضًا بسبب محدودية معدل تحديث الشاشة، وبسبب بقاء الأثر البصري في عين الإنسان لحظة بعد اختفاء الصورة."
"At speeds greater than 50 RPM, your eye perceives two spokes although only one spoke actually exists. This is due to stroboscopic effect caused due to the persistence of vision of the human eye.": "عند سرعات أكبر من 50 دورة/دقيقة، ترى عينك عارضتين رغم وجود عارضة واحدة فقط، بسبب تأثير الستروبوسكوب الناتج من بقاء الأثر البصري في العين."
