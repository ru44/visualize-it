"The X-coordinate of the default configuration (press 'reset' to obtain) ranges from -2.5 to 1 whereas the Y-coordinate ranges from -1 to +1. The complex number": "في الإعداد الافتراضي (اضغط 'إعادة الضبط' للعودة إليه) يتراوح الإحداثي السيني من -2.5 إلى 1، والإحداثي الصادي من -1 إلى +1. العدد المركب"
"is equal to": "يساوي"
", where": "، حيث"
"and": "و"
"are coordinates within their respective ranges of X and Y.": "إحداثيان يقعان كل منهما داخل مدى المحور الخاص به."
"is recursively iterated from": "يُحسب تكرارًا بدءًا من"
". It diverges if": ". وتتباعد إذا كانت"
". The magnitude of": ". مقدار"
"is checked at every iteration, until a maximum number of iterations (100 in this case). If": "يُفحص في كل تكرار حتى نصل إلى أقصى عدد من التكرارات (100 هنا). فإن ظل"
"is never greater than 2, then it is highly probably that it never diverges, and is a part of the Mandelbrot set.": "لا يتجاوز 2 قط، فالأرجح أنه لا يتباعد أبدًا، وأنه جزء من مجموعة ماندلبرو."
"Elements of the Mandelbrot set are colored black, whereas elements that diverge are coloured on the basis of number of iterations they take to diverge. This coloring scheme gives rise to the Mandelbrot Fractal, which is highly self-similar, detailed and hypnotic in nature.": "تُلوَّن عناصر مجموعة ماندلبرو بالأسود، أما العناصر التي تتباعد فتُلوَّن حسب عدد المرات التي احتاجتها لتتباعد. هذا التلوين هو ما يرسم كسيرة ماندلبرو، وهي شديدة التشابه الذاتي، غنية بالتفاصيل وتأسر النظر."
"Note:": "ملاحظة:"
"An offline, full-screen, interactive version of the Mandelbrot Fractal is available <a href=\"https://github.com/chanrt/mandelbrot-fractal\" target=\"_blank\">here</a>. Requires Java to run.": "توجد نسخة تفاعلية لكسيرة ماندلبرو تعمل بلا إنترنت وبملء الشاشة <a href=\"https://github.com/chanrt/mandelbrot-fractal\" target=\"_blank\">هنا</a>. تحتاج جافا (Java) لتشغيلها."
"This simulation, despite being highly optimized, is computationally heavy, and may lag on lower-end computers.": "هذه المحاكاة محسَّنة قدر الإمكان، لكنها تحتاج حسابًا كثيرًا وقد تتقطع على الأجهزة الأضعف."
"If the region being simulated has a greater proportion of elements belonging to the Mandelbrot set, then it will take longer to generate.": "إذا كانت المنطقة المعروضة تحوي عناصر أكثر من مجموعة ماندلبرو، احتاج رسمها وقتًا أطول."
