"Note:": "ملاحظة:"
"A set of n points can be exactly fitted with a polynomial of degree n-1. This is the general analogue of the fact that there is always a line (which is a 1 dimensional polynomial) joining 2 points.": "يمكن ضبط n نقطة بدقة تامة بكثيرة حدود من الدرجة n-1، تمامًا كما يمر خط واحد (وهو كثيرة حدود من الدرجة الأولى) بنقطتين دائمًا."
"A polynomial of degree m requires atleast m+1 points for a proper fit. If this condition is not satisfied, then the extra coefficients will be extremely low or zero, which badly skewes the curve.": "تحتاج كثيرة الحدود من الدرجة m إلى m+1 نقطة على الأقل لضبط صحيح. وإن قلت النقاط عن ذلك، تصبح المعاملات الزائدة صغيرة جدًا أو صفرًا، فيلتوي المنحنى بشكل سيئ."
"<a href=\"../gradient_descent/simulation.html\">Gradient Descent</a> can be used for polynomial regression too, and adopts an iterative approach to find the best fit. It turns out that this method does not scale well, as the number of points and the degree of polynomial increases.": "<a href=\"../gradient_descent/simulation.html\">الانحدار التدريجي</a> يمكن استخدامه أيضًا لإيجاد أفضل تطابق بطريقة تكرارية، لكن هذه الطريقة لا تصلح جيدًا كلما زاد عدد النقاط ودرجة كثيرة الحدود."
