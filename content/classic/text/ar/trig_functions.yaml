"Trigonometric Functions": "الدوال المثلثية"
"Ever wondered why Trigonometric functions are named the way they are?<br> Why is cosine named as \"co\"sine, \"cosecant\" named as \"co\"secant and \"cotangent\" named as \"co\"tangent?<br> Do these functions have any meaning outside of triangles?<br> Aren't terms like \"secant\" and \"tangent\" associated with circles?": "هل تساءلت يومًا لماذا تحمل الدوال المثلثية هذه الأسماء؟<br> لماذا يبدأ \"جيب التمام\" بكلمة \"تمام\"، و\"قاطع التمام\" و\"ظل التمام\" كذلك؟<br> وهل لهذه الدوال معنى خارج المثلثات أصلًا؟<br> أليست كلمتا \"القاطع\" و\"الظل\" مرتبطتين بالدوائر لا المثلثات؟"
"The Age-old Brothers:<br>Sine and Cosine": "الأخوان القديمان:<br>الجيب وجيب التمام"
"Etymology:": "أصل الكلمة:"
"The word \"sine\" is derived from the latin word \"Sinus\" which means a \"bay\" or a \"fold\". It's Sanskrit, Arabic and Persian versions are dervided from the Greek word \"khorde\" which signifies a bow-string. In the below visualization, if we imagine the X-axis to act like a mirror, the image would become symmetrical. The line segments OP and OP' look like the strings of a bow, and the perpendiculars to X axis (whose length is equal to 2sin(θ)) looks like a bow": "كلمة \"sine\" الإنجليزية مشتقة من الكلمة اللاتينية \"Sinus\" وتعني \"خليجًا\" أو \"طيّة\". وأصلها السنسكريتي والعربي والفارسي يعود إلى الكلمة اليونانية \"khorde\" التي تعني وتر القوس. في الرسم بالأسفل، لو تخيلنا المحور السيني مرآةً لصارت الصورة متماثلة: القطعتان OP وOP' تشبهان وتر القوس، والعمودان على المحور السيني (وطولهما معًا 2sin(θ)) يشبهان القوس نفسه"
"Visualization:": "الرسم:"
"Consider a unit circle (a circle of radius 1). Consider a line drawn from the origin O, that makes an angle θ with the X-axis in the anti-clockwise direction. This line intersects the circle at a point P. The length of the projection of the line segment OP on the Y-axis is equal to the Sine of θ": "تخيّل دائرة نصف قطرها 1 (دائرة الوحدة). ارسم خطًا من المركز O بزاوية θ مع المحور السيني، عكس اتجاه عقارب الساعة، حتى يقطع الدائرة عند نقطة P. طول ظل القطعة OP على المحور الصادي هو جيب الزاوية θ"
"θ = 47<sup>o</sup>": "θ = 47<sup>o</sup>"
"Sin(θ) = <span style=\"color:red\">length of red line</span> = 0.7314": "Sin(θ) = <span style=\"color:red\">طول الخط الأحمر</span> = 0.7314"
"Cos(θ) = <span style=\"color:blue\">length of blue line</span> = 0.6820": "Cos(θ) = <span style=\"color:blue\">طول الخط الأزرق</span> = 0.6820"
"<b>Adjust angle using the following slider:</b>": "<b>غيّر الزاوية بتحريك هذا المنزلق:</b>"
"<b>Or, type the angle here:</b>": "<b>أو اكتب قيمة الزاوية هنا:</b>"
"Relationship between Sine and Cosine:": "العلاقة بين الجيب وجيب التمام:"
"Cosine has a serendipitous co-existence with Sine. The length of projection of the same line segment OP on the X-axis is equal to the Cosine of θ": "يعيش جيب التمام إلى جانب الجيب في الرسم نفسه: طول ظل القطعة OP نفسها، لكن هذه المرة على المحور السيني، هو جيب تمام الزاوية θ"
"Deductions": "استنتاجات"
"The basic trigonometric identity:": "المتطابقة المثلثية الأساسية:"
"Just using pythagoras theorem, we see that sin(θ)^2 + cos(θ)^2 = 1 for all angles θ": "بتطبيق نظرية فيثاغورس فقط نجد أن sin(θ)^2 + cos(θ)^2 = 1 مهما كانت الزاوية θ"
"Value of Sines and Cosines of multiples of 90 degrees:": "قيم الجيب وجيب التمام عند مضاعفات 90 درجة:"
"The Sine of 0 degrees is 0, since a line coinciding with the X-axis has no projection on the Y-axis": "جيب الزاوية 0 يساوي 0، لأن الخط المنطبق على المحور السيني ليس له ظل على المحور الصادي"
"The Cosine of 0 degrees is 1, since a line drawn within a unit circle and coinciding with the X-axis has a projection of length 1 on the X-axis": "جيب تمام الزاوية 0 يساوي 1، لأن الخط المنطبق على المحور السيني داخل دائرة الوحدة ظله على المحور السيني بطول 1"
"The Sine of 90 degrees is 1, since a line drawn within a unit circle and coinciding with the Y-axis has a projection of length 1 on the Y-axis": "جيب الزاوية 90 يساوي 1، لأن الخط المنطبق على المحور الصادي داخل دائرة الوحدة ظله على المحور الصادي بطول 1"
"The Cosine of 90 degees is 0, since a line coinciding with the Y-axis has no projection on the X-axis": "جيب تمام الزاوية 90 يساوي 0، لأن الخط المنطبق على المحور الصادي ليس له ظل على المحور السيني"
"The same logic holds good for 180 degrees and 270 degrees": "المنطق نفسه ينطبق عند 180 درجة و270 درجة"
"This visualization also allows us to extend the definition of trigonometric functions beyond 90 degrees, since we are no longer restricted to a triangle": "هذا الرسم يتيح لنا أيضًا توسيع تعريف الدوال المثلثية إلى ما بعد 90 درجة، لأننا لم نعد محصورين داخل مثلث"
"Signs of Sine and Cosine functions:": "إشارتا الجيب وجيب التمام:"
"Any angle from 0 to 180 degrees has a positive Sine, since the length of projection on the Y-axis is measured along the positive Y-direction": "جيب أي زاوية بين 0 و180 درجة موجب، لأن ظلها على المحور الصادي يقع في الاتجاه الموجب"
"Sine is negative for rest of the angles because the length of projection on the Y-axis is measured along the negative Y-direction": "وجيب بقية الزوايا سالب، لأن ظلها على المحور الصادي يقع في الاتجاه السالب"
"Any angle from 0 to 90 degrees and 270 to 360 degrees has a positive Cosine, since the length of projection on the X-axis is measured along the positive X-direction": "جيب تمام أي زاوية بين 0 و90 درجة، أو بين 270 و360 درجة، موجب، لأن ظلها على المحور السيني يقع في الاتجاه الموجب"
"Cosine is negative for rest of the angles because the length of projection on the X-axis is measured along the negative X-direction": "وجيب تمام بقية الزوايا سالب، لأن ظلها على المحور السيني يقع في الاتجاه السالب"
"Sine is an odd function:": "الجيب دالة فردية:"
"Consider an angle θ, having magnitude between 0 and 90 degrees": "تخيّل زاوية θ مقدارها بين 0 و90 درجة"
"The Sine of +θ is always positive since the projection on the Y-axis is always along the positive Y-direction": "جيب +θ دائمًا موجب، لأن ظلها على المحور الصادي يقع دائمًا في الاتجاه الموجب"
"The Sine of -θ is always negative since the projection on the Y-axis is always along the negative Y-direction": "وجيب -θ دائمًا سالب، لأن ظلها على المحور الصادي يقع دائمًا في الاتجاه السالب"
"Hence, sin(-θ) = -sin(θ): Sine is an odd function": "إذن sin(-θ) = -sin(θ)، أي أن الجيب دالة فردية"
"The same also holds good for an angle θ having magnitude between 90 and 180 degrees: Sin(θ) is always positive whereas sin(-θ) is always negative": "والأمر نفسه صحيح لزاوية θ بين 90 و180 درجة: Sin(θ) موجب دائمًا بينما sin(-θ) سالب دائمًا"
"Cosine is an even function:": "جيب التمام دالة زوجية:"
"The Cosine of +θ is always positive since the projection on the X-axis is always along the positive X-direction": "جيب تمام +θ دائمًا موجب، لأن ظلها على المحور السيني يقع دائمًا في الاتجاه الموجب"
"The Cosine of -θ is always positive since the projection on the X-axis is always along the positive X-direction": "وجيب تمام -θ دائمًا موجب أيضًا، لأن ظلها على المحور السيني يقع في الاتجاه الموجب نفسه"
"Hence, cos(-θ) = cos(θ): Cosine is even odd function": "إذن cos(-θ) = cos(θ)، أي أن جيب التمام دالة زوجية"
"The same also holds good for an angle θ having magnitude between 90 and 180 degrees: Cos(θ) and cos(-θ) are both negative": "والأمر نفسه صحيح لزاوية θ بين 90 و180 درجة: كل من Cos(θ) وcos(-θ) سالب"
"The Circle Grazers:<br>Tangent and Cotangent": "ملامسا الدائرة:<br>الظل وظل التمام"
"The word \"tangent\" comes from the Latin verb \"tangere\" which means \"to touch\"": "كلمة \"tangent\" مشتقة من الفعل اللاتيني \"tangere\" ومعناه \"يلمس\""
"Consider the same unit cirle with the same line segment OP. Consider a tangent drawn to the circle at point P. The length between the point P and the point where this tangent intersects the X-axis is equal to the tangent of the angle θ": "تخيّل الدائرة نفسها والقطعة OP نفسها. ارسم مماسًا للدائرة عند النقطة P. طول القطعة بين P والنقطة التي يقطع فيها هذا المماس المحور السيني هو ظل الزاوية θ"
"Tan(θ) = <span style=\"color:blue\">length of blue line</span> = 1.0000": "Tan(θ) = <span style=\"color:blue\">طول الخط الأزرق</span> = 1.0000"
"Cot(θ) = <span style=\"color:red\">length of red line</span> = 1.0000": "Cot(θ) = <span style=\"color:red\">طول الخط الأحمر</span> = 1.0000"
"Relationship between Tangent and Cotangentt:": "العلاقة بين الظل وظل التمام:"
"The length of the same tangent, but from the point P to its point of intersection with the Y-axis is equal to the Cotangent of θ": "طول المماس نفسه، لكن من النقطة P إلى نقطة تقاطعه مع المحور الصادي، هو ظل تمام الزاوية θ"
"Values of Tangents and Cotangents of multiples of 90 degrees": "قيم الظل وظل التمام عند مضاعفات 90 درجة"
"The Tangent of 0 degrees is 0, since the point P is already intersecting with the X-axis": "ظل الزاوية 0 يساوي 0، لأن النقطة P تقع أصلًا على المحور السيني"
"The Cotangent of 0 degrees is infinite, since the tangent never meets the Y-axis": "وظل تمام الزاوية 0 لا نهائي، لأن المماس لا يلتقي المحور الصادي أبدًا"
"The Tangent of 90 degrees is infinite, since the tangent never meets the X-axis": "ظل الزاوية 90 لا نهائي، لأن المماس لا يلتقي المحور السيني أبدًا"
"The Cotangent of 90 degrees is 0, since the point P is already intersecting with the Y-axis": "وظل تمام الزاوية 90 يساوي 0، لأن النقطة P تقع أصلًا على المحور الصادي"
"The Inner Perpetrators:<br>Secant and Cosecant": "الفاعلان الخفيّان:<br>القاطع وقاطع التمام"
"<b>Etymology:</b> The word \"secant\" is derived from the French verb \"secanter\" which means \"to cut\" <br><br> <b>Visualization:</b> Consider the same unit cirle with the same line segment OP and the tangent drawn to the circle at point P. The length between the Origin and the point where the tangent intersects the X-axis is equal to the Secant of θ <br> <br>": "<b>أصل الكلمة:</b> كلمة \"secant\" مشتقة من الفعل الفرنسي \"secanter\" ومعناه \"يقطع\" <br><br> <b>الرسم:</b> تخيّل الدائرة نفسها والقطعة OP نفسها والمماس المرسوم عند النقطة P. طول القطعة بين المركز O والنقطة التي يقطع فيها هذا المماس المحور السيني هو قاطع الزاوية θ <br> <br>"
"Sec(θ) = <span style=\"color:blue\">length of blue line</span> = 2.0000": "Sec(θ) = <span style=\"color:blue\">طول الخط الأزرق</span> = 2.0000"
"Cosec(θ) = <span style=\"color:red\">length of red line</span> = 1.1547": "Cosec(θ) = <span style=\"color:red\">طول الخط الأحمر</span> = 1.1547"
"Relationship between Secant and Cosecant:": "العلاقة بين القاطع وقاطع التمام:"
"The distance between the Origin and the point where the same tangent intersects the Y-axis is equal to the Cosecant of θ": "المسافة بين المركز O والنقطة التي يقطع فيها المماس نفسه المحور الصادي هي قاطع تمام الزاوية θ"
"Trigonometric identities:": "متطابقات مثلثية:"
