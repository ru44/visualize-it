"The Secant of 0 degrees is 1, since the point P coincides with the X-axis": "قاطع الزاوية 0 يساوي 1، لأن النقطة P تنطبق على المحور السيني"
"The Cosecant of 0 degrees is infinite, since the tangent never meets the Y-axis": "وقاطع تمام الزاوية 0 لا نهائي، لأن المماس لا يلتقي المحور الصادي أبدًا"
"The Secant of 90 degrees is infinite, since the tangent never meets the X-axis": "قاطع الزاوية 90 لا نهائي، لأن المماس لا يلتقي المحور السيني أبدًا"
"The Cosecant of 0 degrees is 1, since the point P coincides with the Y-axis": "وقاطع تمام الزاوية 0 يساوي 1، لأن النقطة P تنطبق على المحور الصادي"
