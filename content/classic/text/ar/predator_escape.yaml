"Now, we have two instincts at work here: (a) Collective Behaviour and (b) Predator Avoidance. In order to understand the dynamics of Collective Behaviour, please visit": "يتحكم في حركة الطائر غريزتان: السلوك الجماعي، وتجنّب المفترس. لفهم كيف يعمل السلوك الجماعي، زر"
"this page": "هذه الصفحة"
". The dynamics of predator avoidance is simple: go in the opposite direction of predator approach. The main question is, how do we make these two behaviours operate together? We define a lower radii": ". أما تجنّب المفترس فبسيط: تحرّك في الاتجاه المعاكس لاقترابه. والسؤال المهم: كيف نجمع بين الغريزتين؟ نعرّف نصف قطر أدنى"
"and an upper radii": "ونصف قطر أعلى"
". Let the distance of the predator from the boid be": ". ولتكن المسافة بين المفترس والطائر"
", and assume that the predator": "، ولنفترض أن المفترس"
"does not lie": "لا يقع"
"in the blind spot of the boid, then:": "في النقطة العمياء للطائر، عندها:"
"The boid will follow a weighted average of predator escape and collective behaviour. The weight of predator escape 'w' is given by:": "يتبع الطائر عندئذ مزيجًا موزونًا من الهروب والسلوك الجماعي. ويُحسب وزن الهروب w من:"
"The weight of collective behaviour is therefore": "ويكون وزن السلوك الجماعي عندئذ"
". The boid will seek to move in the direction given by the weightage average of these two instincts.": ". ويتحرك الطائر في الاتجاه الناتج عن جمع الغريزتين بهذا الوزن."
"If the predator lies in the blind spot of the boid, then irrespective of the value of": "أما إذا وقع المفترس في النقطة العمياء للطائر، فبصرف النظر عن قيمة"
", the boid will continue following the rules of collective behaviour since it has not detected the predator.": "، يستمر الطائر في اتّباع قواعد السلوك الجماعي لأنه لم يلاحظ المفترس أصلًا."
