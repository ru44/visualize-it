"Reaction Diffusion System": "نظام التفاعل والانتشار"
"A reaction diffusion system is used to model the spatial dynamics of two chemical reactants 'A' and 'B'. Wherein A + 2B → 3B. The 'plate' is initially filled with 'A'. 'B' is added in a localised manner. Both chemical species react with each other and diffuse across the plate to varying degrees, governed by the following equations:": "نظام التفاعل والانتشار يمثّل كيف تتوزع مادتان كيميائيتان 'A' و'B' في المكان بمرور الوقت، وفق التفاعل A + 2B → 3B. تبدأ 'اللوحة' مليئة بالمادة 'A'، وتُضاف المادة 'B' في مواضع محددة منها فقط. تتفاعل المادتان معًا وتنتشران على اللوحة بمعدلين مختلفين، وفق المعادلتين التاليتين:"
"Where A<sub>n</sub> and B<sub>n</sub> denotes the concentration of the chemical species in the n<sup>th</sup> cell of a grid. D<sub>A</sub> and D<sub>B</sub> are their diffusion constants. According to the chemical reaction, one species of A gets converted to one species of B, in the presence of two other B's. Hence, we add A at a rate 'r' and remove B at a rate 'e'. Therefore, the reaction functions are:": "حيث A<sub>n</sub> وB<sub>n</sub> تركيز كل مادة في الخلية رقم n من شبكة اللوحة، وD<sub>A</sub> وD<sub>B</sub> ثابتا انتشارهما. وحسب معادلة التفاعل، تتحول وحدة من A إلى وحدة من B بوجود وحدتين أخريين من B. لذلك نضيف A بمعدل 'r' ونزيل B بمعدل 'e'، فتكون معادلتا التفاعل:"
"After a long period of time, if either reactant hasn't fizzled out completely, then we obtain intricate patterns. The mechanics of Reaction - Diffusion are important for chemical and biological morphogenesis. Infact, the texture of certain pigments found in nature are similar to the patterns obtained here. Black colour denotes high concentrations of 'B' whereas white colour signifies high concentration of 'A'": "بعد وقت طويل، إن لم تختفِ إحدى المادتين تمامًا، تظهر أنماط معقدة على اللوحة. وآلية التفاعل والانتشار هذه مهمة في تفسير كيف تتشكل الأنماط في الكائنات الحية والمواد الكيميائية، بل إن نقوش بعض الكائنات في الطبيعة تشبه الأنماط التي تراها هنا. اللون الأسود يدل على تركيز عالٍ من 'B'، والأبيض يدل على تركيز عالٍ من 'A'"
"Set the Draw mode to 'ON' for introducing 'B' by clicking or touching the canvas. Pausing is recommended": "شغّل وضع الرسم لإضافة المادة 'B' بالنقر أو اللمس على اللوحة، ويُفضَّل إيقاف المحاكاة مؤقتًا أثناء ذلك"
