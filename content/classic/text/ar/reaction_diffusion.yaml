"It takes a lot of time to form patterns. The simulation can be speeded up in two ways: 1) increasing Δt or 2) Increasing iterations per frame. (1) results in loss of accuracy whereas (2) can cause serious lag in lower end machines": "يحتاج تكوّن الأنماط وقتًا طويلاً، ويمكن تسريع المحاكاة بطريقتين: 1) زيادة Δt، أو 2) زيادة عدد التكرارات لكل إطار. الطريقة الأولى تقلل الدقة، والثانية قد تُبطئ الأجهزة الضعيفة كثيرًا"
"Interestingly, the above patterns form faster when viewed in mobile devices, since the size of the landscape is inherently small in mobile screens.": "من اللافت أن هذه الأنماط تتكوّن أسرع على أجهزة الجوال، لأن مساحة اللوحة فيها أصغر بطبيعتها."
"Simulation is still in alpha stage. Certain values of parameters can easily break it.": "لا تزال هذه المحاكاة في مرحلة تجريبية مبكرة، وبعض القيم قد تُفسدها بسهولة."
