"Fourier Series": "متسلسلة فورييه"
"Fourier Series encaptulates the idea that any periodic function can be expressed as a sum of sine and cosine waves. This simulation has been programmed to contain the visual framework that is featured in <a href=\"https://www.youtube.com/watch?v=spUNpyF58BY&amp;t=9s\" target=\"_blank\">3Blue1Brown's video on Fourier Transforms</a>.": "تقول متسلسلة فورييه إن أي دالة دورية يمكن كتابتها كمجموع موجات جيب وجيب تمام. بُنيت هذه المحاكاة على الفكرة المرئية نفسها التي شرحها <a href=\"https://www.youtube.com/watch?v=spUNpyF58BY&amp;t=9s\" target=\"_blank\">فيديو 3Blue1Brown عن تحويل فورييه</a>."
