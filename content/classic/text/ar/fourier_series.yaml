"Sine": "جيب"
"Cosine": "جيب التمام"
"Add Wave": "أضف موجة"
"Clear Waves": "امسح الموجات"
"Analyze Fourier Spectrum:": "حلّل طيف فورييه:"
"Equation of current wave:": "معادلة الموجة الحالية:"
"f(x) = sin(2π[3]x) + sin(2π[7]x)": "f(x) = sin(2π[3]x) + sin(2π[7]x)"
"Fourier Transform": "تحويل فورييه"
"F(3) = -0.00 + (0.50)i<br> Magnitude = 0.50": "F(3) = -0.00 + (0.50)i<br> المقدار = 0.50"
"Sampling frequency: 3 Hz": "تردد أخذ العينات: 3 هرتز"
"Intuition": "الفكرة"
"is the function that we want to analyze. It consists of a bunch of sine (": " هي الدالة التي نريد تحليلها، وتتكوّن من موجات جيب ("
") and cosine waves (": ") وموجات جيب تمام ("
") of different frequencies added together. The above formula gives us the relative amplitude of the sines and cosines corresponding to the frequency": ") بترددات مختلفة مجموعة معًا. تعطينا الصيغة أعلاه سعة كل موجة جيب أو جيب تمام عند التردد"
". The real part": ". الجزء الحقيقي"
"is the amplitude of the cosine wave and the imaginary part": " هو سعة موجة جيب التمام، والجزء التخيلي"
"is the amplitude of the sine wave. Both": " هو سعة موجة الجيب. كلٌّ من"
"and": "و"
"are evaluated in the above visualization. The": " يُحسبان في الرسم أعلاه. حَدّ"
"term depicts winding of the function around the origin, and": " يمثّل التفاف الدالة حول نقطة الأصل، و"
"is the rate at which the function is sampled. The integral is akin to finding the \"centre of mass\" of the winded function.": " هو معدل أخذ العينات من الدالة. يشبه هذا التكامل إيجاد \"مركز ثقل\" الشكل الملتف."
"Please watch <a href=\"https://www.youtube.com/watch?v=spUNpyF58BY&amp;t=9s\" target=\"_blank\">3Blue1Brown's video</a> for a better explanation. Here are some instructions about using this visualization:": "شاهد <a href=\"https://www.youtube.com/watch?v=spUNpyF58BY&amp;t=9s\" target=\"_blank\">فيديو 3Blue1Brown</a> لشرح أوضح. وإليك طريقة استخدام هذا الرسم:"
"In the default configuration, sine waves of frequencies 3 and 7 are present. When the sampling frequencies are equal to these frequencies, a peak in the magnitude is observed. Moreover, the magnitude entirely comes from the imaginary part of the Fourier transform.": "في الإعداد الافتراضي توجد موجتا جيب بترددي 3 و7. حين يساوي تردد أخذ العينات أحد هذين الترددين، يظهر مقدار كبير في الرسم. ويأتي هذا المقدار كله من الجزء التخيلي لتحويل فورييه."
"Now, remove the waves and add cosine waves of the two distinct frequencies. When the sampling frequencies are equal to these frequencies, a peak in the magnitude is observed. This time, the magnitude comes from the real part of the Fourier transform.": "الآن احذف الموجات وأضف موجتي جيب تمام بالترددين نفسهما. حين يساوي تردد أخذ العينات أحد هذين الترددين، يظهر مقدار كبير من جديد، لكنه هذه المرة يأتي من الجزء الحقيقي."
