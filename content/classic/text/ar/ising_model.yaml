"Energy of the Lattice": "طاقة الشبكة"
"The energy of a lattice is calculated using the following formula:": "الطاقة هنا رقم يقيس كم يختلف الجيران. نحسبها بهذه المعادلة:"
"Intuitively speaking, the energy of the lattice is minimum if all the spins are aligned in the same direction. In large lattices, this can be achieved after long wait times, provided the temperature is low enough. More commonly, we see regions of the lattice having the same spin. This is a reasonably low energy state.": "إذا اتفق مربعان متجاوران في اللون نقصت الطاقة، وإذا اختلفا زادت. فأقل طاقة ممكنة حين تصير الشبكة كلها بلون واحد. في الشبكات الكبيرة يحتاج ذلك وقتًا طويلًا وحرارة منخفضة. والذي نراه غالبًا بقع واسعة، كل بقعة بلون واحد، وطاقتها منخفضة أيضًا."
"Metropolis Algorithm": "خوارزمية متروبوليس"
"In every step, a random spin is chosen and flipped. The change in energy of the system (": "في كل خطوة نختار مربعًا عشوائيًا ونجرّب قلب لونه. ثم نحسب كم تغيّرت الطاقة ("
") is calculated. If energy has decreased (which is favourable), then the flip is accepted. If energy has increased (unfavourable), then the flip is accepted with a probability of:": "). إذا نقصت الطاقة قبلنا القلب فورًا، لأن المربع صار يشبه جيرانه أكثر. وإذا زادت قبلناه أحيانًا فقط، باحتمال قدره:"
"The intuition behind this formula is:": "ماذا تقول هذه المعادلة؟"
"As the value of": "كلما كبرت الزيادة"
"increases, it becomes less likely that the unfavourable flip will be accepted": "قلّ احتمال قبول القلب الذي يرفع الطاقة"
"A higher value of temperature": "كلما ارتفعت درجة الحرارة"
"in the denominator decreases the value of the fraction, thereby increasing the probability of all unfavourable flips. Higher temperature promotes disorder.": "وهي في مقام الكسر، صغر الكسر وزاد احتمال قبول القلب الذي يرفع الطاقة. فالحرارة العالية تخلط الألوان وتمنع الجيران من الاتفاق."
"Every iteration of the simulation asynchronously updates a percentage of randomly chosen cells.": "في كل خطوة من المحاكاة نراجع نسبة من المربعات، نختارها عشوائيًا واحدًا بعد واحد."
"What to try": "جرّب هذا"
"With low temperature": "اجعل درجة الحرارة منخفضة"
"and a positive interactive strength": "وقوة تأثير الجيران موجبة"
", you will observe the characteristic magnetic lattices of ferromagnets: huge regions of the lattice have the same spin. These regions are known as 'domains'. If you increase": "، وسترى ما يحدث داخل المغناطيس الحقيقي: بقع واسعة، كل بقعة بلون واحد. تسمى هذه البقع 'نطاقات'. وإذا رفعت"
", then disorder is promoted and it will take slightly longer for domains to form.": "، زاد خلط الألوان واحتاجت البقع وقتًا أطول لتتكوّن."
"If you set the interaction strength": "إذا جعلت قوة تأثير الجيران"
"to be negative, then energy is minimized if neighbouring spins are dislike. In such a case, the system will evolve to be disordered.": "سالبة، صار كل مربع يفضّل أن يخالف جيرانه. عندها لا تتكوّن بقع بلون واحد، ويبقى الأصفر والأزرق متداخلين."
"Note:": "ملاحظة:"
"The boundary condition is periodic.": "حواف الشبكة متصلة: المربع في أقصى اليمين جار للمربع في أقصى اليسار، وكذلك الأعلى والأسفل."
