"Ising Model": "نموذج آيزنغ"
"The Ising model is used to model a system of interacting spins in a ferromagnetic material. The model was first conceived by Wilhelm Lenz in 1920. He presented the model to his student, Ernst Ising, for analysis. It is a central model in the domain of statistical mechanics.": "نموذج آيزنغ يصف نظامًا من مغزلات (spins) تتفاعل مع بعضها داخل مادة مغناطيسية. اقترحه فيلهلم لنز أول مرة سنة 1920، وأعطاه لتلميذه إرنست آيزنغ ليحلله. هذا النموذج من أهم نماذج الميكانيكا الإحصائية."
"Simulation": "المحاكاة"
"The model consists of a 2D lattice of spins. Each spin can be either +1 (yellow) or -1 (blue). Initially, all spins are randomly assigned. The system is evolved using the Metropolis algorithm (described below).": "يتكون النموذج من شبكة ثنائية الأبعاد من المغزلات. كل مغزل إما +1 (أصفر) أو -1 (أزرق). في البداية تُعطى كل المغزلات قيمًا عشوائية، ثم يتطور النظام باستخدام خوارزمية متروبوليس (موضحة أدناه)."
