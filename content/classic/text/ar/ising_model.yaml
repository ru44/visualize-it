"Energy of the Lattice": "طاقة الشبكة"
"The energy of a lattice is calculated using the following formula:": "تُحسب طاقة الشبكة بالمعادلة التالية:"
"Intuitively speaking, the energy of the lattice is minimum if all the spins are aligned in the same direction. In large lattices, this can be achieved after long wait times, provided the temperature is low enough. More commonly, we see regions of the lattice having the same spin. This is a reasonably low energy state.": "ببساطة، تكون طاقة الشبكة أقل ما يمكن حين تصطف كل المغزلات في الاتجاه نفسه. في الشبكات الكبيرة يحتاج هذا وقتًا طويلًا، بشرط أن تكون درجة الحرارة منخفضة بما يكفي. الأكثر شيوعًا أن نرى مناطق من الشبكة لها المغزل نفسه، وهذه حالة طاقة منخفضة بدرجة معقولة."
"Metropolis Algorithm": "خوارزمية متروبوليس"
"In every step, a random spin is chosen and flipped. The change in energy of the system (": "في كل خطوة يُختار مغزل عشوائي ويُقلب. يُحسب التغير في طاقة النظام ("
") is calculated. If energy has decreased (which is favourable), then the flip is accepted. If energy has increased (unfavourable), then the flip is accepted with a probability of:": "). إذا انخفضت الطاقة (وهذا مرغوب) يُقبل القلب مباشرة. أما إذا ارتفعت الطاقة (غير مرغوب) فيُقبل القلب باحتمال قدره:"
"The intuition behind this formula is:": "فكرة هذه المعادلة هي:"
"As the value of": "كلما زادت قيمة"
"increases, it becomes less likely that the unfavourable flip will be accepted": "قلّ احتمال قبول القلب غير المرغوب"
"A higher value of temperature": "كلما ارتفعت قيمة درجة الحرارة"
"in the denominator decreases the value of the fraction, thereby increasing the probability of all unfavourable flips. Higher temperature promotes disorder.": "في المقام، قلّت قيمة الكسر، فزاد احتمال قبول كل القلبات غير المرغوبة. درجة الحرارة الأعلى تزيد الفوضى في النظام."
"Every iteration of the simulation asynchronously updates a percentage of randomly chosen cells.": "في كل خطوة من المحاكاة، تُحدَّث نسبة من الخلايا المختارة عشوائيًا كل واحدة على حدة."
"What to try": "جرّب هذا"
"With low temperature": "مع درجة حرارة منخفضة"
"and a positive interactive strength": "وقوة تفاعل موجبة"
", you will observe the characteristic magnetic lattices of ferromagnets: huge regions of the lattice have the same spin. These regions are known as 'domains'. If you increase": "، سترى الشكل المميز لشبكات المواد المغناطيسية: مناطق واسعة من الشبكة لها المغزل نفسه. تسمى هذه المناطق 'نطاقات'. إذا رفعت"
", then disorder is promoted and it will take slightly longer for domains to form.": "، زادت الفوضى، واحتاج تكوّن النطاقات وقتًا أطول قليلًا."
"If you set the interaction strength": "إذا جعلت قوة التفاعل"
"to be negative, then energy is minimized if neighbouring spins are dislike. In such a case, the system will evolve to be disordered.": "سالبة، صارت الطاقة أقل ما يمكن حين تختلف المغزلات المتجاورة. في هذه الحالة يتطور النظام نحو الفوضى."
"Note:": "ملاحظة:"
"The boundary condition is periodic.": "شرط الحدود دوري (الحافتان المتقابلتان متصلتان)."
"This simulation may hang on lower-end devices, for large grid sizes and large values of steps per second.": "قد تتجمد هذه المحاكاة على الأجهزة الأضعف عند استخدام شبكة كبيرة أو عدد خطوات كبير في الثانية."
