"Ising Model": "نموذج آيزنغ"
"The Ising model is used to model a system of interacting spins in a ferromagnetic material. The model was first conceived by Wilhelm Lenz in 1920. He presented the model to his student, Ernst Ising, for analysis. It is a central model in the domain of statistical mechanics.": "نموذج آيزنغ يشرح كيف يصير الحديد مغناطيسًا. تخيّل قطعة الحديد مكوّنة من مغناطيسات صغيرة جدًا. كل مغناطيس صغير يشير إلى أعلى أو إلى أسفل، ويحاول أن يجعل جيرانه يشيرون مثله. إذا اتفق أغلبها على اتجاه واحد صارت القطعة كلها مغناطيسًا. اقترح النموذج فيلهلم لنز سنة 1920، وأعطاه لتلميذه إرنست آيزنغ ليدرسه، وهو اليوم من أشهر النماذج في الفيزياء."
"Simulation": "المحاكاة"
"The model consists of a 2D lattice of spins. Each spin can be either +1 (yellow) or -1 (blue). Initially, all spins are randomly assigned. The system is evolved using the Metropolis algorithm (described below).": "كل مربع صغير في الصورة مغناطيس صغير. الأصفر يشير إلى أعلى (+1)، والأزرق يشير إلى أسفل (-1). في البداية تتوزع الألوان عشوائيًا. ثم تتغير خطوة بعد خطوة بطريقة اسمها خوارزمية متروبوليس، وشرحها في الأسفل."
