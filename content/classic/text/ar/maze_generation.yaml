"Maze Generation Algorithms": "خوارزميات توليد المتاهات"
"Maze algorithms are used to generate mazes. They are given a grid of cell separated by walls, and they output a maze by systematically breaking down a set of walls. Due to the method of generation, it is assured that there is only one path between two points on the maze. There are several maze generation algorithms, each with their own pros and cons in terms of length of passages, frequency and length of dead ends, and computational resources demanded.": "خوارزميات توليد المتاهات تبني متاهة من شبكة خلايا تفصل بينها جدران، فتزيل بعض الجدران بطريقة منظمة حتى تتكوّن المتاهة. بسبب طريقة البناء هذه، يكون بين أي نقطتين في المتاهة مسار واحد فقط. توجد عدة خوارزميات لتوليد المتاهات، ولكل منها ميزاتها وعيوبها من حيث طول الممرات، وعدد الطرق المسدودة وطولها، والموارد الحسابية التي تحتاجها."
"Choose a maze generation algorithm": "اختر خوارزمية توليد المتاهة"
"Iterative Depth First Search": "البحث بالعمق أولًا (تكراري)"
"Randomized Kruskal": "خوارزمية كروسكال العشوائية"
"Randomized Prim": "خوارزمية بريم العشوائية"
"Restart": "إعادة التشغيل"
"Description": "الوصف"
"1) Iterated Depth First Search:": "1) البحث بالعمق أولًا (تكراري):"
"Maintains a stack of cells whose neighbours haven't been explored yet": "تحتفظ بمكدّس من الخلايا التي لم تُستكشف كل جيرانها بعد"
"A random cell is chosen, marked as visited and pushed to the stack": "تُختار خلية عشوائية، وتُعلَّم بأنها زُوِرت، وتُضاف إلى المكدّس"
"While the stack is not empty, the following steps are carried out:": "طالما المكدّس غير فارغ تُكرَّر الخطوات التالية:"
"The last cell from the stack is obtained and designated as the current cell": "تُؤخذ آخر خلية في المكدّس وتصبح هي الخلية الحالية"
"If it has any neighbouring cell(s) that have not been visited yet, then the current cell is again added to the stack. An unvisited neighbour is chosen at random, marked as visited and designated as the chosen cell. The wall between the current cell and the chosen cell is removed. The chosen cell is pushed to the stack": "فإن كان لها جيران لم تُزَر بعد، تُضاف الخلية الحالية إلى المكدّس مرة أخرى. يُختار جار غير مزور عشوائيًا، ويُعلَّم بأنه زُوِر، ويصبح هو الخلية المختارة. يُزال الجدار بين الخلية الحالية والخلية المختارة. تُضاف الخلية المختارة إلى المكدّس"
"If it does not have any neighbouring unvisited cell, then it's exploraton potential has been fully utilised": "أما إن لم يكن لها أي جار غير مزور، فقد استُنفدت كل إمكانات استكشافها"
"The current cell is painted yellow. Cells that are suspected of having unexplored neighbours are red while those that surely don't have any unexplored neighbours are blue.": "تُلوَّن الخلية الحالية بالأصفر. الخلايا التي قد يكون لها جيران غير مستكشَفين تُلوَّن بالأحمر، والخلايا المتأكد أنها استُنفدت تمامًا تُلوَّن بالأزرق."
"2) Randomized Kruskal:": "2) خوارزمية كروسكال العشوائية:"
"Requires a randomized list of all walls and a list of sets, each containing only one cell at the beginning": "تحتاج قائمة عشوائية بكل الجدران، وقائمة مجموعات تضم كل واحدة منها خلية واحدة فقط في البداية"
"For each wall in the list of walls, if the cells divided by the wall lie in disjoint sets, then the wall is removed and the sets are merged.": "لكل جدار في القائمة: إن كانت الخليتان اللتان يفصل بينهما في مجموعتين مختلفتين، يُزال الجدار وتُدمَج المجموعتان."
"Cells whose parent sets have been merged atleast once are colored blue. The current wall is stroked yellow.": "الخلايا التي انضمت مجموعتها إلى مجموعة أخرى ولو مرة واحدة تُلوَّن بالأزرق. الجدار قيد الفحص يُرسم بالأصفر."
"3) Randomized Prim:": "3) خوارزمية بريم العشوائية:"
"Requires a stack of walls which surround the currently visited cells.": "تحتاج مكدّسًا من الجدران المحيطة بالخلايا المزورة حتى الآن."
"A random cell is chosen, marked as visited. It's surrounding walls are pushed to the stack": "تُختار خلية عشوائية وتُعلَّم بأنها زُوِرت، وتُضاف جدرانها المحيطة إلى المكدّس"
"While the wall stack is not empty, the following steps are repeated:": "طالما مكدّس الجدران غير فارغ تُكرَّر الخطوات التالية:"
"A random wall is selected from the stack. If either cell separated by the wall is unvisited, then the unvisited cell is marked as visited, and it's surrounding walls are added to the stack": "يُختار جدار عشوائي من المكدّس. إن كانت إحدى الخليتين اللتين يفصل بينهما غير مزورة، تُعلَّم بأنها زُوِرت، وتُضاف جدرانها المحيطة إلى المكدّس"
"The aforementioned wall is removed from the stack as well as the maze.": "يُزال هذا الجدار من المكدّس ومن المتاهة معًا."
"Visited cells are marked with blue and the wall under consideration is stroked with yellow.": "تُلوَّن الخلايا المزورة بالأزرق، والجدار قيد الفحص يُرسم بالأصفر."
"Analysis of Algorithms": "تحليل الخوارزميات"
"Iterated Depth First Search: Has a bias for generating long corridors, due to its very method of operation. Considerably difficult for humans to solve. Moderate space and time complexity": "البحث بالعمق أولًا: تميل لتوليد ممرات طويلة بحكم طريقة عملها. صعبة نسبيًا على الإنسان أن يحلها. تعقيدها في الذاكرة والزمن متوسط"
"Randomized Kruskal: Generates lot of small dead-ends. Simple for humans to solve. High space complexity and moderate time complexity": "خوارزمية كروسكال: تولّد كثيرًا من الطرق المسدودة القصيرة. سهلة على الإنسان أن يحلها. تعقيدها في الذاكرة مرتفع وفي الزمن متوسط"
"Randomized Prim: Generates more dead-ends than Kruskal. Extremely simple for humans to solve. Moderate space and time complexity. Considerable resources wasted on redundant tasks": "خوارزمية بريم: تولّد طرقًا مسدودة أكثر من كروسكال. سهلة جدًا على الإنسان أن يحلها. تعقيدها في الذاكرة والزمن متوسط، لكنها تهدر موارد كثيرة في مهام متكررة"
"Note:": "ملاحظة:"
