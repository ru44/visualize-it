"Analysis": "التحليل"
"<b>Factors that induce homesickness:</b> High rate of food regeneration, low population of animals and high number of predators. Generally speaking, homesickness instinct is prevalent in most cases. This shows that it is an extremely important instinct to possess for the sake of survival.": "<b>عوامل تزيد الحنين إلى الوطن:</b> ارتفاع معدل تجدد الطعام، وقلة عدد الحيوانات، وكثرة المفترسات. وتغلب غريزة الحنين في معظم الحالات، مما يدل على أهميتها الكبيرة لبقاء الحيوان."
"<b>Factors that induce exploration:</b> Low rate of food regeneration, high population of animals and low number of predators.": "<b>عوامل تزيد الاستكشاف:</b> انخفاض معدل تجدد الطعام، وكثرة عدد الحيوانات، وقلة المفترسات."
"Note:": "ملاحظة:"
"Since every death is replaced, the population stays constant. If you want to simulate with a different population size, enter the intended population size in the input and click on the restart button.": "بما أن كل حيوان يموت يُستبدل بآخر، يبقى عدد الحيوانات ثابتًا. إذا أردت تجربة عدد مختلف، اكتب العدد المطلوب في الحقل واضغط زر إعادة التشغيل."
"Rate of predation and rate of food regeneration can be adjusted dynamically. It takes considerable time for allele frequencies to change after such changes are made": "يمكن تعديل معدل الافتراس ومعدل تجدد الطعام أثناء التشغيل مباشرة، لكن تغيّر نسب المورّثات في المجتمع يحتاج وقتًا طويلًا بعد كل تعديل"
"Refer to <a href=\"refined_intro.pdf\">this</a> document for more details on modelling": "راجع <a href=\"refined_intro.pdf\">هذا</a> المستند لمزيد من تفاصيل النمذجة"
"Compared to the predators, the animals are actually smarter. Animals can sense food from a certain radius (dependent on their exploration instinct). Once they find food, they steer towards it.": "الحيوانات أذكى من المفترسات في الواقع. تستطيع أن تشعر بالطعام من مسافة معينة تعتمد على قوة غريزة الاستكشاف لديها، وبمجرد أن تجده تتجه نحوه."
"The food sensing instinct is a bit buggy. If an animal finds food in multiple equidistant locations, it may spend some time incessantly turning in the same location, before choosing one location to pursue.": "استشعار الطعام فيه خلل بسيط: إذا وجد الحيوان طعامًا في عدة أماكن على نفس المسافة، قد يظل يستدير في مكانه فترة قبل أن يختار وجهة واحدة."
