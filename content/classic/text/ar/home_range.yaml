"Home Range": "نطاق المعيشة"
"This simulation was developed as a part of a project in one of my courses. It uses the same Evolutionary Algorithm Framework as in our <a href=\"../natural_selection/simulation.html\">Natural Selection among random walks</a> simulation. Animals (triangles) have a single behavioural gene with two nucleotides. One controls their homesickenss instinct whereas the other controls their exploration instinct. Every animal's behaviour is influenced by these two instincts.": "أُعدّت هذه المحاكاة ضمن مشروع دراسي، وتستخدم نفس إطار الخوارزمية التطورية في محاكاة <a href=\"../natural_selection/simulation.html\">الانتقاء الطبيعي بين المسارات العشوائية</a>. لكل حيوان (المثلثات) مورّثة سلوكية واحدة بنيوكليوتيدتين: واحدة تتحكم في غريزة الحنين إلى الوطن، والأخرى تتحكم في غريزة الاستكشاف. سلوك كل حيوان يتأثر بهاتين الغريزتين معًا."
"Food distribution across the world is modeled in form of a grid. A cell with food is light grey whereas one without food is black. When an unsaturated animal walks into a cell with food, it consumes it. After certain time of starvation, an animal dies. Food is generated according to the regeneration rate specified by the user.": "يُمثَّل توزيع الطعام في العالم بشبكة من الخلايا: الخلية الرمادية الفاتحة فيها طعام، والخلية السوداء بلا طعام. حين يدخل حيوان جائع خلية فيها طعام، يأكله. وإذا طال جوع الحيوان مات. يتجدد الطعام بمعدل يحدده المستخدم."
"Additionally, the world consists of predators (red circles). They move randomly. In general, they avoid the home range of the animal but the boundary is not sharp. If a predator gets very close to an animal, it kills the animal. No hunger or behavioural dynamics are present in the predator (for sake of simplicity). Number of predators can be controlled by the user.": "يضم العالم أيضًا حيوانات مفترسة (الدوائر الحمراء) تتحرك عشوائيًا. تتجنب هذه المفترسات عادة نطاق معيشة الحيوان، لكن حدود هذا النطاق ليست حادة. وإذا اقترب مفترس كثيرًا من حيوان قتله. وللتبسيط، لا جوع ولا سلوك متغير لدى المفترسات. يمكن للمستخدم التحكم في عددها."
"Every time an animal dies due to starvation or predation, another animal is generated. It obtains it's genes from it's parents, subjected to the processes of recombination and mutation. The parents are chosen from the alive animals, based on their fitness. Fitness is calculated on the basis of lifespan.": "كلما مات حيوان بالجوع أو الافتراس، وُلد حيوان جديد يرث مورّثاته من والديه بعد أن تمر بعمليتي إعادة التركيب والطفرة. يُختار الوالدان من الحيوانات الحية بحسب لياقتها، وتُحسب اللياقة من طول عمر الحيوان."
"<b>Indicators:</b> The blue circle represents the distance from the home (origin) at which homesickness instinct becomes half maximum. A saturated animal is blue in colour. The more starved an animal is, the redder it becomes. A death is signaled by an expanding circle. At the top of the canvas, the blue section indicates prevalence of the homesickness instinct whereas the red section indicates that of the exploration instinct.": "<b>المؤشرات:</b> الدائرة الزرقاء تمثّل المسافة من نقطة المنزل التي تصل عندها غريزة الحنين إلى نصف أقصى قيمة لها. الحيوان الشبعان لونه أزرق، وكلما زاد جوعه مال لونه إلى الأحمر أكثر. يُعلَن موت الحيوان بدائرة تتسع تدريجيًا. وفي أعلى الشاشة، يبيّن الجزء الأزرق مدى انتشار غريزة الحنين بين الحيوانات، ويبيّن الجزء الأحمر مدى انتشار غريزة الاستكشاف."
"Net instinct: exploration (+0.01)": "الغريزة الصافية: استكشاف (+0.01)"
