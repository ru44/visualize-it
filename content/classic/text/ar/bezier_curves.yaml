"Bezier Curves": "منحنيات بيزييه"
"A Bezier curve is a parametric curve used widely in designing and computer graphics. It was first used by French engineer Pierre Bezier in the 1960s. A bezier curve is generated through the process of recursive linear interpolation of control points. All text on computers are rendered as Bezier curves, since it is more efficient to store a bunch of coordinates than to store the coordinates of all pixels involved.": "منحنى بيزييه شكل منحنٍ يستخدمه المصمّمون كثيرًا في برامج الرسم والحاسوب. استخدمه أول مرة المهندس الفرنسي بيير بيزييه في الستينيات. نبني هذا المنحنى بخطوة بسيطة نكرّرها: نصل بين نقاط التحكّم بخطوط مستقيمة، ثم نقرّب بين هذه الخطوط مرة بعد مرة حتى تتحول إلى نقطة واحدة متحركة، وهي التي ترسم المنحنى. حتى الحروف التي تقرأها الآن على الشاشة مرسومة بمنحنيات بيزييه، لأن حفظ عدد قليل من الإحداثيات أوفر بكثير من حفظ لون كل نقطة على الشاشة."
"Click and drag a control point to move it": "اضغط على نقطة تحكّم واسحبها لتحريكها."
"On Mobiles: If unable to scroll, then touch the below canvas and try again": "على الجوال: إن لم تستطع التمرير فالمس الرسم بالأسفل ثم حاول مرة أخرى."
