"Linear interpolation between two points": "الاستيفاء الخطي بين نقطتين"
"and": "و"
"is a process of uniformly tracing the space between them. To be more mathematical, it involves varying a parameter, say": "هو عملية نتحرك فيها بانتظام في المسافة بينهما. وبلغة الرياضيات، نغيّر قيمة معامل نسمّيه"
", from 0 to 1, in the following equations:": "من 0 إلى 1، في المعادلتين التاليتين:"
"The line traced by the point": "الخط الذي ترسمه النقطة"
"as": "مع"
"varies from 0 to 1 is called a linear interpolation. At": "يتغيّر من 0 إلى 1، تسمّى هذه العملية استيفاءً خطيًا. عند"
", the line begins from": "، يبدأ الخط من"
". At": ". وعند"
", the line ends at": "، ينتهي الخط عند"
"Let us consider the case of just two points. Then linear interpolation between them will just generate a straight line connecting the two points. The red dot is the initial point whereas the blue dot is the final point.": "لنأخذ حالة نقطتين فقط. الاستيفاء الخطي بينهما يعطينا ببساطة خطًا مستقيمًا يصل بين النقطتين. النقطة الحمراء هي نقطة البداية، والنقطة الزرقاء هي نقطة النهاية."
"Now, add another point. This point fits in between the initial and final point. We consider (but won't draw) a line between the 1st and 2nd point, and a line between the 2nd and 3rd point. Interpolating between these two lines and joining the interpolated points will give us a moving line. When interpolation takes place between the two lines, we also interpolate the resulting line, and trace the interpolated point. This gives us a quadratic bezier curve.": "أضف الآن نقطة ثالثة تقع بين نقطتي البداية والنهاية. نتخيل (دون أن نرسمه) خطًا بين النقطة الأولى والثانية، وخطًا آخر بين الثانية والثالثة. حين نستوفي بين هذين الخطين ونتابع النقاط الناتجة، نحصل على خط متحرك. وحين نستوفي على هذا الخط المتحرك نفسه ونتابع نقطته، نرسم منحنى بيزييه من الدرجة الثانية."
"In general, with": "وبشكل عام، مع"
"points, we get": "نقطة، نحصل على"
"lines by interpolation. We interpolate between these lines to get": "خطًا بالاستيفاء. نستوفي بين هذه الخطوط لنحصل على"
"lines and so on. Until we arrive at only one interpolated line. Tracing it's interpolation gives us the corresponding Bezier curve.": "خطوط، وهكذا نكرر العملية حتى يبقى خط واحد. متابعة النقطة المستوفاة على هذا الخط الأخير هي التي ترسم منحنى بيزييه."
"It might be hard to understand the working of a Bezier curve using just textual description. In this case, fret not. A lot of videos are available online (I would recommend <a href=\"https://www.youtube.com/watch?v=aVwxzDHniEw\" target=\"_blank\">this one</a>). This website just allows you to play with Bezier curves.": "قد يصعب فهم عمل منحنى بيزييه من الشرح وحده، فلا بأس. تجد على الإنترنت مقاطع فيديو كثيرة تشرحه (وأنصحك بـ<a href=\"https://www.youtube.com/watch?v=aVwxzDHniEw\" target=\"_blank\">هذا المقطع</a>). أما هذه الصفحة فتتيح لك أن تجرّب المنحنى بيدك."
