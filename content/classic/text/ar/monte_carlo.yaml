"A Monte Carlo simulation relies on repeated random sampling of objects from a distribution, and subsequent operation of then, to generate numerical results. In this simulation, we utilize random sampling of 2D points from an uniform distribution to estimate the value of pi. The circle has a unit radius, whereas the square has a length of 2 distance units. If the points are appreciably random, and if we have generated enough number of points, then:": "تعتمد محاكاة مونت كارلو على توليد نقاط عشوائية كثيرة، ثم حساب نتيجة عددية منها. تولّد هذه المحاكاة نقاطًا عشوائية داخل مربع لتقدير قيمة π. نصف قطر الدائرة هنا وحدة واحدة، وطول ضلع المربع وحدتان. كلما كانت النقاط عشوائية فعلاً وكثيرة العدد، اقترب هذا من الصحة:"
