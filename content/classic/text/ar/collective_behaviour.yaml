"Collective Behaviour": "السلوك الجماعي"
"Basic interactions like repulsion, orientation and attraction can operate to different extents and give rise to a variety of dynamical behaviours.": "تفاعلات بسيطة كالتنافر والتوجّه والجذب، حين تعمل بدرجات مختلفة، تنتج أنماطًا متنوعة من الحركة الجماعية."
"<b>This real-time simulation is computationally complex and may induce unresponsiveness on lower-end devices</b>": "<b>هذه محاكاة حيّة تحتاج حسابًا كثيفًا، وقد تصبح بطيئة على الأجهزة الضعيفة</b>"
