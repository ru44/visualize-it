"Interactions": "التفاعلات"
"All boids (a generic term used to indicate agents in collective behaviour) interact with each other via three interactions:": "تتفاعل كل الطيور (وهو اسم عام لكل فرد في السلوك الجماعي) مع بعضها عبر ثلاثة تفاعلات:"
"Repulsion:": "التنافر:"
"When boids come too close, they move away from each other. Suppose there are": "حين تقترب الطيور من بعضها كثيرًا، تبتعد عن بعضها. لنفترض أن هناك"
"boids within the repulsion radius of a particular boid": "طيورًا داخل نصف قطر التنافر لطائر معيّن"
". If": ". إذا كان"
"represents their direction, and": "يمثّل اتجاهها، و"
"represents their position, then repulsion dictates:": "يمثّل موضعها، فإن قاعدة التنافر تكون:"
"Orientation:": "التوجّه:"
"Boids tend to orient themselves along the direction of their neighbours. Suppose there are": "تميل الطيور إلى التوجّه في اتجاه جيرانها. لنفترض أن هناك"
"boids within the orientation radius of a particular boid": "طيورًا داخل نصف قطر التوجّه لطائر معيّن"
"represents their velocity, then orientation dictates:": "يمثّل سرعتها، فإن قاعدة التوجّه تكون:"
"Attraction:": "الجذب:"
"Boids tend to move towards the centre of mass of their neighbours. Suppose there are": "تميل الطيور إلى التحرك نحو مركز كتلة جيرانها. لنفترض أن هناك"
"boids within the attraction radius of a particular boid": "طيورًا داخل نصف قطر الجذب لطائر معيّن"
". then attraction operates exactly opposite to orientation:": ". فإن قاعدة الجذب تعمل بعكس قاعدة التوجّه تمامًا:"
"If there are any boids in the repulsion zone of a boid, then the boid only follows the repulsion rule. If there are boids that lie in the attraction as well as the orientation zone, then the boid averages the result of both interactions. The boids can turn only at a limited angle": "إذا وُجدت طيور في منطقة تنافر طائر ما، يتبع هذا الطائر قاعدة التنافر وحدها. وإذا وُجدت طيور في منطقتي الجذب والتوجّه معًا، يأخذ الطائر متوسط أثر القاعدتين. ولا يستطيع أي طائر أن يدور إلا بزاوية محدودة"
"in every time step. Further, there is a blind angle": "في كل خطوة زمنية. كذلك توجد زاوية عمياء"
"behind each boid where it cannot perceive other boids. Every boid moves with the same velocity": "خلف كل طائر، لا يرى فيها الطيور الأخرى. وتتحرك كل الطيور بنفس السرعة"
"along its current direction. The intended direction of every boid is perturbed by random noise. This represents errors in judgement made by the boids.": "في اتجاهها الحالي. ويضاف إلى الاتجاه المقصود لكل طائر تشويش عشوائي، يمثّل أخطاء تقدير الطيور."
"Metrics": "المقاييس"
"The following quantities can be used to quantify the collective motion of boids:": "تقيس الكميات التالية مدى انتظام حركة الطيور الجماعية:"
"Group polarization:": "استقطاب المجموعة:"
"This quantifies the degree of overall alignment of the boids. If every boid is moving along the same direction, then group polarization is 1. If all boids are moving along random directions, then group polarization is 0.": "يقيس هذا مدى توافق اتجاهات الطيور. إذا تحركت كل الطيور في نفس الاتجاه، يصبح استقطاب المجموعة 1. وإذا تحركت في اتجاهات عشوائية، يصبح صفرًا."
"Group angular momentum:": "الزخم الزاوي للمجموعة:"
"Measures the degree of rotation of the group along their center:": "يقيس مقدار دوران المجموعة حول مركزها:"
"Here,": "هنا،"
"is the displacement vector of the": "متجه إزاحة"
"boid from the center of mass of the group, which is given by:": "الطائر عن مركز كتلة المجموعة، وصيغته:"
"Dynamical Behaviours": "أنماط الحركة"
"Depending on the strengths of various interactions, as well as other parameters, the boids can exhibit four different kinds of dynamical behaviour:": "بحسب قوة كل تفاعل والمعاملات الأخرى، يمكن أن تظهر الطيور أربعة أنماط مختلفة من الحركة الجماعية:"
"Swarming:": "التجمّع العشوائي:"
"Characterised by low polarization and low angular momentum": "يتميز باستقطاب منخفض وزخم زاوي منخفض"
"This behaviour is seen when attraction is the dominant force, and there is negligible orientation. Boids rotate in random directions, repeatedly flying into the center of the group and then emerging out. This sort of behaviour is often seen in insects.": "يظهر هذا النمط حين يسيطر الجذب وتكاد قوة التوجّه تنعدم. تدور الطيور في اتجاهات عشوائية، وتدخل مركز المجموعة وتخرج منه بالتناوب، وهو نمط شائع بين الحشرات."
"Observe": "شاهد"
"Swirling:": "الدوامة:"
"Characterised by low polarization and high angular momentum": "يتميز باستقطاب منخفض وزخم زاوي مرتفع"
"This behaviour is observed when orientation is low whereas attraction is relatively high. Boids revolve around a common point in the same direction. This behaviour is seen in fish.": "يظهر هذا النمط حين يكون التوجّه ضعيفًا والجذب قويًا نسبيًا. تدور الطيور حول نقطة مشتركة في نفس الاتجاه، وهو نمط شائع بين الأسماك."
"It may take some time for swirls to emerge": "قد يستغرق ظهور الدوامة بعض الوقت"
"Dynamic parallel grouping:": "التجمّع المتوازي المتحرك:"
"Characterised by high polarisation and low angular momentum": "يتميز باستقطاب مرتفع وزخم زاوي منخفض"
"This behaviour is observed when orientation is intermediate whereas attraction can be either intermediate or relatively high. Boids move in groups called 'flocks'. Seen in birds and fish.": "يظهر هذا النمط حين يكون التوجّه متوسطًا والجذب متوسطًا إلى قوي نسبيًا. تتحرك الطيور في مجموعات تُسمى 'أسرابًا'، وهو نمط شائع بين الطيور والأسماك."
"Highly parallel grouping:": "التجمّع المتوازي الشديد:"
"Characterised by very high polarisation and low angular momentum": "يتميز باستقطاب مرتفع جدًا وزخم زاوي منخفض"
"This behaviour is seen when orientation is high.": "يظهر هذا النمط حين يكون التوجّه قويًا."
"It may take some time for highly parallel groupings to emerge": "قد يستغرق ظهور هذا التجمّع بعض الوقت"
"Note:": "ملاحظة:"
"This model is from the paper \"Collective Memory and Spatial Sorting in Animal Groups\" by Couzin et al. <a href=\"https://doi.org/10.1006/jtbi.2002.3065\">https://doi.org/10.1006/jtbi.2002.3065</a>": "هذا النموذج من بحث \"Collective Memory and Spatial Sorting in Animal Groups\" لكوزين وزملائه <a href=\"https://doi.org/10.1006/jtbi.2002.3065\">https://doi.org/10.1006/jtbi.2002.3065</a>"
"If reflect is off, boids just teleport from one edge to another. Implementing a periodic boundary condition was not possible owing to the complex nature of this simulation": "إذا كان الانعكاس متوقفًا، تنتقل الطيور فجأة من حافة إلى الحافة المقابلة. ولم يكن ممكنًا تطبيق حدود دورية حقيقية بسبب تعقيد هذه المحاكاة"
"Although this simulation is usable on a mobile, it is preferably viewed on a desktop.": "تعمل هذه المحاكاة على الجوال، لكن يُفضّل تشغيلها على حاسوب مكتبي."
