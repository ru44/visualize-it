". Where 'k' is known as spring constant. It is the magnitude of restoring force developed for unit displacement of the edge of the spring from its equilibrium position. In essence, it quantifies the 'stiffness' of the spring. 'm' is mass of the spring.": ". حيث 'k' هو ثابت النابض، أي مقدار قوة الإرجاع الناتجة عن إزاحة طرف النابض وحدة واحدة عن موضع اتزانه. باختصار هو مقياس لصلابة النابض. أما 'm' فهي كتلة النابض."
"The time period of SHM is universally given by": "زمن الدورة في الحركة التوافقية البسيطة يُحسب دائمًا من"
