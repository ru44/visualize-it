"Spring motion belongs to a subset of periodic motion known as Simple Harmonic Motion (SHM), where the restoring force is directly proportional to the object's displacement magnitude and acts towards the object's equilibrium position. The proportionality factor between restoring force and displacement plays a key role in determining the time period of motion. It is commonly denoted by": "حركة النابض نوع من الحركة الدورية يسمى الحركة التوافقية البسيطة (SHM)، حيث تتناسب قوة الإرجاع طرديًا مع مقدار إزاحة الجسم، وتتجه دائمًا نحو موضع اتزانه. عامل التناسب بين قوة الإرجاع والإزاحة هو ما يحدد زمن الدورة، ويُرمز له عادة بـ"
"For a spring,": "في حالة النابض،"
