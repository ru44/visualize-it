"Interactions": "التفاعلات"
"All boids (a generic term used to indicate agents in collective behaviour) interact with each other via three interactions:": "كل الطيور (وهي تسمية عامة لأي وحدة متحركة في محاكاة السلوك الجماعي) تتفاعل مع بعضها بثلاث طرق:"
"Repulsion:": "التنافر:"
"When boids come too close, they move away from each other. Suppose there are": "حين تقترب الطيور من بعضها كثيرًا، تبتعد عن بعضها. لنفترض أن هناك"
"boids within the repulsion radius of a particular boid": "طيورًا داخل نصف قطر التنافر لطائر معيّن"
". If": ". إذا كانت"
"represents their direction, and": "تمثّل اتجاهها، و"
"represents their position, then repulsion dictates:": "تمثّل موضعها، فإن قاعدة التنافر هي:"
"Orientation:": "التوجّه:"
"Boids tend to orient themselves along the direction of their neighbours. Suppose there are": "تميل الطيور إلى التوجّه بنفس اتجاه جيرانها. لنفترض أن هناك"
"boids within the orientation radius of a particular boid": "طيورًا داخل نصف قطر التوجّه لطائر معيّن"
"represents their velocity, then orientation dictates:": "تمثّل سرعتها، فإن قاعدة التوجّه هي:"
"Attraction:": "الانجذاب:"
"Boids tend to move towards the centre of mass of their neighbours. Suppose there are": "تميل الطيور إلى التحرك نحو مركز كتلة جيرانها. لنفترض أن هناك"
"boids within the attraction radius of a particular boid": "طيورًا داخل نصف قطر الانجذاب لطائر معيّن"
". then attraction operates exactly opposite to orientation:": ". فإن قاعدة الانجذاب عكس قاعدة التوجّه تمامًا:"
"If there are any boids in the repulsion zone of a boid, then the boid only follows the repulsion rule. If there are boids that lie in the attraction as well as the orientation zone, then the boid averages the result of both interactions. The boids can turn only at a limited angle": "إذا وُجد طائر في منطقة التنافر، يتبع الطائر قاعدة التنافر وحدها. أما إذا وُجدت طيور في منطقتي الانجذاب والتوجّه معًا، فيأخذ الطائر متوسط القاعدتين. ولا يلتف أي طائر بأكثر من زاوية محدودة قدرها"
"in every time step. Further, there is a blind angle": "في كل خطوة زمنية. ولكل طائر أيضًا زاوية عمياء قدرها"
"behind each boid where it cannot perceive other boids. Every boid moves with the same velocity": "خلفه لا يرى فيها الطيور الأخرى. وتتحرك كل الطيور بالسرعة نفسها"
"along its current direction. The intended direction of every boid is perturbed by random noise. This represents errors in judgement made by the boids.": "في اتجاهها الحالي. ويضاف إلى اتجاه كل طائر تشويش عشوائي بسيط، يمثّل أخطاء التقدير التي يقع فيها."
"Metrics": "مقاييس"
"The following quantities can be used to quantify the collective motion of boids:": "تقيس الكميات التالية حركة الطيور الجماعية:"
"Group polarization:": "استقطاب المجموعة:"
"This quantifies the degree of overall alignment of the boids. If every boid is moving along the same direction, then group polarization is 1. If all boids are moving along random directions, then group polarization is 0.": "يقيس هذا مدى تجانس اتجاه الطيور. إن تحركت كل الطيور في الاتجاه نفسه كان الاستقطاب 1، وإن تحركت في اتجاهات عشوائية كان 0."
"Measures the degree of rotation of the group along their center:": "يقيس مدى دوران المجموعة حول مركزها:"
"Here,": "هنا،"
"is the displacement vector of the": "هو متجه إزاحة"
"boid from the center of mass of the group, which is given by:": "الطائر عن مركز كتلة المجموعة، وتحسبه هذه الصيغة:"
"Dynamical Behaviours": "أنماط الحركة"
"Depending on the strengths of various interactions, as well as other parameters, the boids can exhibit four different kinds of dynamical behaviour:": "حسب قوة كل تفاعل والقيم الأخرى، تظهر على الطيور أربعة أنماط حركة مختلفة:"
"Swarming:": "التجمّع العشوائي:"
"Characterised by low polarization and low angular momentum": "استقطاب منخفض وزخم زاوي منخفض"
"This behaviour is seen when attraction is the dominant force, and there is negligible orientation. Boids rotate in random directions, repeatedly flying into the center of the group and then emerging out. This sort of behaviour is often seen in insects.": "يظهر هذا النمط حين يكون الانجذاب هو القوة المسيطرة والتوجّه شبه معدوم. تدور الطيور في اتجاهات عشوائية، تندفع نحو مركز المجموعة ثم تخرج منه مرارًا. نرى هذا السلوك كثيرًا في الحشرات."
"Observe": "راقب"
"Swirling:": "الدوران:"
"Characterised by low polarization and high angular momentum": "استقطاب منخفض وزخم زاوي مرتفع"
"This behaviour is observed when orientation is low whereas attraction is relatively high. Boids revolve around a common point in the same direction. This behaviour is seen in fish.": "يظهر هذا النمط حين يكون التوجّه منخفضًا والانجذاب مرتفعًا نسبيًا. تدور الطيور حول نقطة مشتركة في اتجاه واحد، وهذا ما نراه في الأسماك."
"It may take some time for swirls to emerge": "قد يحتاج ظهور هذا الدوران بعض الوقت"
"Dynamic parallel grouping:": "التجمّع المتوازي المتحرك:"
"Characterised by high polarisation and low angular momentum": "استقطاب مرتفع وزخم زاوي منخفض"
"This behaviour is observed when orientation is intermediate whereas attraction can be either intermediate or relatively high. Boids move in groups called 'flocks'. Seen in birds and fish.": "يظهر هذا النمط حين يكون التوجّه متوسطًا والانجذاب متوسطًا إلى مرتفع. تتحرك الطيور في مجموعات تسمى 'أسراب'، وهذا شائع في الطيور والأسماك."
"Highly parallel grouping:": "التجمّع المتوازي التام:"
"Characterised by very high polarisation and low angular momentum": "استقطاب مرتفع جدًا وزخم زاوي منخفض"
"This behaviour is seen when orientation is high.": "يظهر هذا النمط حين يكون التوجّه مرتفعًا."
"It may take some time for highly parallel groupings to emerge": "قد يحتاج ظهور هذا التجمّع المتوازي التام بعض الوقت"
"Note:": "ملاحظة:"
"This model is from the paper \"Collective Memory and Spatial Sorting in Animal Groups\" by Couzin et al. <a href=\"https://doi.org/10.1006/jtbi.2002.3065\">https://doi.org/10.1006/jtbi.2002.3065</a>": "هذا النموذج مأخوذ من بحث \"الذاكرة الجماعية والفرز المكاني في مجموعات الحيوانات\" لكوزين وزملائه. <a href=\"https://doi.org/10.1006/jtbi.2002.3065\">https://doi.org/10.1006/jtbi.2002.3065</a>"
"If reflect is off, boids just teleport from one edge to another. Implementing a periodic boundary condition was not possible owing to the complex nature of this simulation": "إذا كان الانعكاس متوقفًا، تنتقل الطيور فجأة من حافة إلى الحافة المقابلة. لم يكن تطبيق حدود دورية حقيقية ممكنًا بسبب تعقيد هذه المحاكاة"
"Although this simulation is usable on a mobile, it is preferably viewed on a desktop.": "تعمل هذه المحاكاة على الجوال، لكن مشاهدتها على حاسوب أفضل."
