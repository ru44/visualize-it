"At the end of each generation, the fitness": "في نهاية كل جيل تُقاس لياقة"
"of each boid is measured. It is given by the following formula:": "لكل طائر، وتُعطى بالصيغة التالية:"
"where": "حيث"
"is the baseline fitness and": "هي اللياقة الأساسية، و"
"is the distance between the boid and the target in the final frame. There are negative feedbacks for crashing into obstacles and walls, and positive feedbacks for reaching the target faster. The greater the fitness of a boid, the more likely that its genes (or segments of it) will be present in the next generation of boids. For generating each boid of the next generation, two parents are randomly chosen (based on their fitness), and random halves of their genes are incalculated into the offspring. Finally, randomly selected nucleotides are slightly nudged. The former process is called recombination whereas the latter is called mutation. As generations pass, the total fitness as well as the average fitness of the population increases. Eventually, the boids are able to traverse complex layouts and make it to the target in large numbers.": "هي المسافة بين الطائر والهدف في آخر إطار. يُخصم من اللياقة عند الاصطدام بعائق أو جدار، ويُضاف إليها عند الوصول إلى الهدف بسرعة أكبر. كلما زادت لياقة الطائر، زاد احتمال أن تظهر مورّثته (أو أجزاء منها) في الجيل التالي. ولتوليد كل طائر جديد، يُختار أبوان عشوائيًا حسب لياقتهما، ويُؤخذ نصف مورّثة كل منهما لتركيب مورّثة الطائر الجديد. وأخيرًا، تُعدَّل بعض النوكليوتيدات المختارة عشوائيًا تعديلًا طفيفًا. تسمى الخطوة الأولى إعادة التركيب، وتسمى الثانية الطفرة. ومع تعاقب الأجيال يزداد مجموع اللياقة ومتوسطها، حتى تستطيع الطيور اجتياز التخطيطات المعقدة والوصول إلى الهدف بأعداد كبيرة."
"Note:": "ملاحظة:"
"If evolution is taking longer than usual, or if the boids have gone down a irrecoverable/fruitless path of evolution, then please consider restarting the evolution by clicking the last button": "إن استغرق التطور وقتًا أطول من المعتاد، أو سلكت الطيور مسارًا لا رجعة فيه ولا فائدة منه، فأعد بدء التطور بالضغط على الزر الأخير"
"Changing the location of the source, target or the obstacles during the course of evolution will redirect it's course. Boids will eventually adapt to the new conditions": "تغيير موضع نقطة الانطلاق أو الهدف أو العوائق أثناء التطور يغيّر مساره. وستتكيف الطيور في النهاية مع الوضع الجديد"
