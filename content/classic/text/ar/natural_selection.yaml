"Genetic Algorithm": "الخوارزمية الجينية"
"This simulation uses survival of the fittest gene to improve the performance of boids across generations.": "تستخدم هذه المحاكاة قانون بقاء الأصلح لتحسين أداء الطيور جيلًا بعد جيل."
"Simulation": "المحاكاة"
"Each yellow-shaped triangular entity is known as a boid. The maximum lifespan of a boid is 500 frames. Each boid has it's own, unique gene, with 500 nucleotides. Each nucleotide is a number such that the": "كل مثلث أصفر تراه على الشاشة يسمى طائرًا (boid). أقصى عمر للطائر 500 إطار، ولكل طائر مورّثة خاصة به فيها 500 نوكليوتيدة. وكل نوكليوتيدة رقم يحدد زاوية دوران الطائر، فالنوكليوتيدة رقم"
"nucleotide determines the angle that the boid turns in the": "تحدد زاوية دوران الطائر في الإطار رقم"
"frame. Initially, all boids have random genes. At the beginning of each generation, the boids start from the source (blue circle). They need to reach the target (red circle) while avoiding collisions with the obstacles (white rectangles) and the boundary walls.": ". تبدأ كل الطيور بمورّثات عشوائية. في بداية كل جيل، تنطلق الطيور من نقطة الانطلاق (الدائرة الزرقاء)، وعليها أن تصل إلى الهدف (الدائرة الحمراء) من دون أن تصطدم بالعوائق (المستطيلات البيضاء) أو بحدود الشاشة."
