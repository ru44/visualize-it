"Lotka Volterra Model": "نموذج لوتكا-فولتيرا"
"The Lotka-Volterra Model is a set of two non-linear differential equations that describe the population dynamics of a predator and prey. It can be extended to include more interacting species. This simulation replicates the Lotka-Volterra Model in the spatial domain, using a method called Gillespie algorithm. Blue squares represent the prey whereas red squares represent the predator.": "نموذج لوتكا-فولتيرا معادلتان تصفان كيف يتغير عدد المفترس والفريسة معًا بمرور الوقت. يمكن توسيعه ليشمل أنواعًا أكثر تتفاعل معًا. تحاكي هذه المحاكاة النموذج في شبكة مكانية باستخدام خوارزمية غيليسبي. المربعات الزرقاء تمثّل الفريسة، والمربعات الحمراء تمثّل المفترس."
