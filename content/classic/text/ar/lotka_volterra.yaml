"Model Description": "وصف النموذج"
"Let": "لنفترض أن"
"denote population of the prey and": " يرمز إلى عدد الفرائس، و"
"denote population of the predator. Then, according to Lotka Volterra Model:": " يرمز إلى عدد المفترسات. عندئذ يقول نموذج لوتكا-فولتيرا:"
"are real, positive numbers that descibe the growth, mortality and interaction between the two species. Numerical simulations of this model (with certain values of model parameters) showcase oscillatory behaviour in the populations of prey and predator. This sort of behaviour is actually observed in real-world populations, for example - snowshow hare (prey) and canada lynx (predator).": " أعداد موجبة تصف نمو النوعين وموتهما وتفاعلهما. عند قيم معينة لهذه الأعداد، يُظهر النموذج تذبذبًا في عدد الفرائس والمفترسات: يرتفع ثم ينخفض بالتناوب. ونرى هذا التذبذب فعلاً في الطبيعة، كما بين أرنب الثلج (الفريسة) ووَشَق كندا (المفترس)."
"Spatial Simulation": "المحاكاة المكانية"
"The above model is a mean-field model. We attempt to replicate the results of this model using a bare-bones probabilistic automaton with basic interactions. Each prey reproduces at some rate, in which case it populates an empty cell next to it. Prey die with some mortality rate. Predators also die with some mortality rate. However, predators require prey in order to reproduce. If a prey is surrounded by atleast": "النموذج أعلاه نموذج متوسط لا يهتم بموضع كل فرد. نحاول هنا محاكاة نتائجه بشبكة بسيطة من الخلايا المتفاعلة. تتكاثر كل فريسة بمعدل معيّن فتملأ خلية فارغة مجاورة لها، وتموت بمعدل آخر. يموت المفترس أيضًا بمعدل معيّن، لكنه يحتاج فريسة ليتكاثر. إذا أحاط بالفريسة على الأقل"
"predators, then the prey is killed and a predator is born in the same cell. Using Gillespie algorithm, these rates are converted into probabilities. The entire grid is synchronously updates in every time step.": " من المفترسات، تُفترس الفريسة ويولد مفترس جديد في مكانها. تحوّل خوارزمية غيليسبي هذه المعدلات إلى احتمالات، وتُحدَّث الشبكة كلها معًا في كل خطوة زمنية."
"All the probabilites, as well as the number of predators required to kill a prey, can be adjusted in the above simulation.": "يمكنك تغيير كل هذه الاحتمالات، وعدد المفترسات اللازم لقتل فريسة، في المحاكاة أعلاه."
"Note:": "ملاحظة:"
"This simulation is computationally complex and may lag on lower-end devices": "تحتاج هذه المحاكاة حسابًا كثيفًا، وقد تتأخر على الأجهزة الضعيفة"
"For the default values of probabilites, we indeed see some sort of oscillatory behaviour. However, there is a small chance that this is not the case.": "بالقيم الافتراضية نرى فعلاً نوعًا من التذبذب، لكن هناك احتمالًا ضئيلًا ألا يحدث ذلك."
"Prey search through Von-Neumann neighbours, whereas Predators consider all 8 neighbourhood cells": "تبحث الفريسة في جيرانها الأربعة المباشرين فقط (جوار فون نيومان)، بينما يبحث المفترس في الخلايا الثماني المحيطة كلها"
