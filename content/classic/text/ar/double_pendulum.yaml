"Double Pendulum": "البندول المزدوج"
"A double pendulum is composed of one pendulum suspended from another pendulum. Although its behaviour is completely deterministic, a small change in the initial conditions will drasticallly affect the behaviour of the system later on. This phenomenon is known as chaos. Due to this, making long-term predictions for a chaotic system's behaviour is meaningless. In the below simulation, we have two double pendulums such that their initial conditions differ by a small value. Observe how this small difference leads to a drastic change in the pendulum's trajectory.": "البندول المزدوج بندول معلَّق من طرف بندول آخر. حركته تسير وفق معادلات دقيقة تمامًا، لكن أي تغيير صغير جدًا في وضعه الأول يقلب مساره كليًا بعد قليل من الوقت. هذا يسمى الفوضى (chaos)، ولهذا لا فائدة من التنبؤ بمصير نظام فوضوي على المدى الطويل. في المحاكاة أدناه بندولان مزدوجان، وضعهما الأول يختلف باختلاف بسيط جدًا فقط. راقب كيف يتحول هذا الفرق الصغير إلى مسارين مختلفين تمامًا."
