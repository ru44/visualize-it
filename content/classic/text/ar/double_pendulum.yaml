"Note:": "ملاحظة:"
"You can choose any values of θ<sub>1</sub> and θ<sub>2</sub> for the two double pendulums. However, for observing the phenomenon of chaos, they need to differ from each other by a small value.": "يمكنك اختيار أي قيمتين لـ θ<sub>1</sub> و θ<sub>2</sub> للبندولين. لكن لرؤية ظاهرة الفوضى، يجب أن يكون الفرق بينهما صغيرًا جدًا."
"Under the above circumstances, it may take a couple of oscillations of the double pendulum for their behaviours to diverge.": "وحتى في هذه الحالة، قد يحتاج البندولان بضع أرجحات قبل أن يبدأ مساراهما بالتباعد الواضح."
"Dynamics of the two bobs of the each double pendulum can be obtained from <a href=\"https://en.wikipedia.org/wiki/Double_pendulum\" target=\"_blank\">here</a>. This simulation uses the equations of motion derived using Lagrangian mechanics.": "يمكنك قراءة معادلات حركة كرتي كل بندول من <a href=\"https://en.wikipedia.org/wiki/Double_pendulum\" target=\"_blank\">هنا</a>. تستخدم هذه المحاكاة معادلات الحركة المشتقة بطريقة لاغرانج."
