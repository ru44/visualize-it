"Public Goods": "المنافع العامة"
"A public good is anything that is non-excludable and non-rivalous. Best examples of public goods include lighthouses and OTT media services (Netflix, etc). Just because one ship is utilizing a light house does not mean another ship cannot use it, neither does it 'exhaust' the lighthouse. Yet, public goods still require support for establishment and maintenance. For this purpose, governments collect taxes/tolls, and OTT media houses collect monthly subscriptions. However, what happens when system cannot track down the users of the public good? Entities will no longer contribute to the public good and it may collapse. This is known as the free-rider problem (among many other terms). This simulation showcases one way to tackle this problem.": "المنفعة العامة شيء لا يمكن منع أحد من استخدامه، واستخدام شخص له لا ينقص من نصيب غيره. مثاله المنارة البحرية أو خدمات مثل نتفليكس. سفينة واحدة تستفيد من ضوء المنارة لا تمنع سفينة أخرى من الاستفادة منه، ولا تُنهك المنارة بذلك. لكن بناء هذه المنافع وصيانتها يحتاجان تمويلًا، فتجمع الحكومات ضرائب أو رسومًا، وتجمع الشركات اشتراكات شهرية. فماذا يحدث حين لا يستطيع النظام معرفة من يستخدم المنفعة؟ يتوقف الجميع عن المساهمة فيها وقد تنهار. تسمى هذه المشكلة مشكلة المستفيد المجاني (free-rider)، وتعرض هذه المحاكاة طريقة واحدة لمواجهتها."
