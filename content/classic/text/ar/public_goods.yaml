"In this simulation, every cell plays the public goods game with its 8 neighbors, and thereafter adopts the strategy of its most successful neighbor. The updates are synchronous. The tunable parameters are": "في هذه المحاكاة، تلعب كل خلية لعبة المنفعة العامة مع جيرانها الثمانية، ثم تتبنّى استراتيجية أنجح جار لها. تحدث كل التحديثات في الوقت نفسه. والقيمتان اللتان يمكنك ضبطهما هما"
