"If you want loners to even have a chance of existence, then we require": "لكي يكون للمنعزلين فرصة للبقاء أصلًا، يجب أن يتحقق"
"In order to make total cooperation better than total defection, we need": "ولكي يكون التعاون الكامل أفضل من الانشقاق الكامل، يجب أن يتحقق"
"The dynamics is not only dependent on the above parameters, but also on previous state of the system, and non-extinction of strategies. With": "لا تعتمد حركة النظام على هاتين القيمتين فقط، بل أيضًا على حالته السابقة وبقاء كل استراتيجية من الانقراض. فعند"
", we observe oscillations. This is because it is better to be a defector in a population of cooperators, a loner in a population of defectors, and a cooperator in a population of loners. This rock-paper-scissor interaction makes sure that cooperators always exist, and the public good is always maintained. This kind of continuous evolution, which is required for the system to undergo (even though it comes back to the same state as before), in order to continue 'existing', is called the Red Queen Mechanism.": "، نرى النظام يتأرجح. والسبب أن الانشقاق أفضل بين المتعاونين، والانعزال أفضل بين المنشقّين، والتعاون أفضل بين المنعزلين، تمامًا كلعبة الحجر والورقة والمقص. هذا التأرجح المستمر يضمن بقاء المتعاونين دائمًا واستمرار المنفعة العامة، رغم أن النظام يعود إلى الحالة نفسها بعد كل دورة. يسمى هذا التطور الدائم، الذي يلزم النظام لمجرد 'البقاء' كما هو، آلية الملكة الحمراء."
"The system may reach a steady state, oscillate, or showcase short-term oscillations with a period as short as 2. One of the strategies may go exist, in which case it will never come back. The pre-existing spatial structures also have an effect on the evolution of the system, especially when the parameters are changed. Basically, hysteresis plays a prominent role.": "قد يستقر النظام، أو يتأرجح، أو يظهر تذبذبات قصيرة دورتها خطوتان فقط. وقد تنقرض إحدى الاستراتيجيات تمامًا فلا تعود أبدًا. كذلك يؤثر شكل توزّع الخلايا السابق على تطور النظام، خصوصًا عند تغيير القيم. باختصار، للتأثير التخلّفي (hysteresis) دور كبير هنا."
