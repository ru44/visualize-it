"Description": "الوصف"
"Every pixel has an (R, G, B) tuple associated with it, where all numbers are between 0 and 255. Every image can be represented by a superposition of three 2D matrices, each matrix corresponding to the intensity of a particular color associated with every pixel. We divide these matrices into 3x3 overlapping blocks, and multiply all these blocks with the kernel matrix to get the 'filtered' image.": "لكل بكسل في الصورة ثلاث قيم (R, G, B)، وكل رقم منها بين 0 و255. يمكن تمثيل أي صورة بثلاث مصفوفات ثنائية الأبعاد متراكبة، كل مصفوفة تمثل شدة لون واحد من ألوان البكسلات. نقسّم كل مصفوفة إلى مربعات متداخلة من 3×3، ونضرب كل مربع في مصفوفة النواة لنحصل على الصورة 'المفلترة'."
