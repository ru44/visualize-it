"Image Filters": "مرشحات الصور"
"Image filters work by applying a square matrix (known as a kernel) on the RGB values of an image. This interactive tool allows you to apply a variety of kernels on a small collection of diverse images. You may also specify the kernel elements yourselves.": "تعمل مرشحات الصور بتطبيق مصفوفة مربعة (تسمى النواة أو kernel) على قيم الألوان RGB في الصورة. تتيح لك هذه الأداة التفاعلية تجربة عدة أنواع من النوى على مجموعة صور مختلفة، وتستطيع أيضًا كتابة قيم النواة بنفسك."
