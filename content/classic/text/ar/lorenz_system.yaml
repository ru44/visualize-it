"Description": "الوصف"
"The Lorenz system is a set of ordinary differential equations originally studied by Edward Lorenz as a simplified model for atmospheric convection. Several of its solutions were known for their chaotic nature, wherein a small nudge to initial conditions changed the future course of the solution altogether. The mapping of one of these chaotic solutions (known as lorenz attractor) onto 3D space generates a trajectory akin to the wings of a butterfly. The term \"butterfly effect\" was coined from this uncanny resemblance. The equations are as follows:": "نظام لورنتز مجموعة معادلات تفاضلية درسها إدوارد لورنتز كنموذج مبسّط لحركة الهواء الساخن في الجو. لاحظ لورنتز أن بعض حلول هذه المعادلات فوضوية: أدنى تغيير في القيم الابتدائية يغيّر مسار الحل كله لاحقًا. إذا رسمت أحد هذه الحلول الفوضوية في فضاء ثلاثي الأبعاد، فيما يُسمى جاذب لورنتز، يخرج لك مسار يشبه جناحي فراشة. من هذا الشبه جاء اسم \"أثر الفراشة\". هذه هي المعادلات:"
