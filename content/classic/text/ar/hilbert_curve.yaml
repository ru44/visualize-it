"Description": "الوصف"
"Hilbert curves are space filling curves that establish a mapping between real numbers and 2D space. Based on how densely it fills the space, Hilbert curves have an 'order' parameter. The": "منحنيات هيلبرت خطوط تملأ المستوى، وتربط كل عدد حقيقي بنقطة في مستوى ثنائي الأبعاد. ولها معامل اسمه 'الرتبة' يحدد كثافة امتلائها للمستوى. منحنى هيلبرت من الرتبة"
"order Hilbert curve can be drawn using the": "يُرسم باستخدام منحنى هيلبرت من الرتبة"
"Hilbert curve. The 2D space is completely filled only as the limit of order approaches infinity. Hilbert curves are widely used in rendering software and games.": "Hilbert curve. لا يمتلئ المستوى بالكامل إلا حين تقترب الرتبة من اللانهاية. تُستخدم منحنيات هيلبرت كثيرًا في برامج الرسم والألعاب."
"Note:": "ملاحظة:"
"Although most implementation recursivly draw the curve, the above implementation uses an iterative method.": "معظم التطبيقات ترسم المنحنى بطريقة تكرارية ذاتية (recursion)، لكن هذا التطبيق يستخدم طريقة تكرار حلقي (iteration) بدلًا من ذلك."
"Hilbert curves of upto 10th order can be comfortably drawn on lower-end devices too.": "يمكن رسم منحنيات هيلبرت حتى الرتبة العاشرة بسهولة حتى على الأجهزة الضعيفة."
