"Flocking Behaviour": "سلوك الأسراب"
"Flocking behaviour is an example of emergent phenomenon, wherein a simple set of interactions can give rise to complex, coordinated behaviour.": "سلوك الأسراب مثال على الظاهرة الناشئة: تفاعلات بسيطة بين الأفراد تنتج حركة جماعية معقدة ومنسقة."
