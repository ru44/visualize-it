"Description": "الوصف"
"There are three types of interactions: Repulsion, Orientation and Attraction:": "هناك ثلاثة أنواع من التفاعلات: التنافر، والتوجّه، والجذب:"
"Repulsion:": "التنافر:"
"If boid(s) are present within radii": "إذا وُجد طائر أو أكثر داخل نصف القطر"
"of a boid (indicated by red colored circle), then the boid moves in a direction away from the average direction of approach of other boid(s).": "لطائر معيّن (تمثّله الدائرة الحمراء)، يتحرك هذا الطائر بعيدًا عن متوسط اتجاه اقتراب الطيور الأخرى منه."
"Orientation:": "التوجّه:"
"Every boid tries to orient itself along the average direction of motion of the boids present in it's circular neighbourhood": "يحاول كل طائر أن يتجه في متوسط اتجاه حركة الطيور الموجودة داخل الدائرة المحيطة به"
"(indicated by blue colored circle).": "(تمثّلها الدائرة الزرقاء)."
"Attraction:": "الجذب:"
"Every boid tries to move towards the centre of mass of the group of boids present in the same circular neighbourhood as above (": "يحاول كل طائر التحرك نحو مركز كتلة مجموعة الطيور الموجودة في نفس الدائرة المحيطة السابقة ("
") (indicated by blue colored circle).": ") (تمثّلها الدائرة الزرقاء)."
"Orientation and Attraction operate only in the absence of repulsion, and they operate together. Their effects combine in a weighted manner, described by parameters": "يعمل التوجّه والجذب معًا فقط عند غياب التنافر، ويُجمع تأثيرهما بحسب وزن كل منهما، يصفه المعاملان"
"and": "و"
". Additionally, a noise component is introduced to the intended direction of every boid's motion. This representes the errors in their perception and motion.": ". كذلك تُضاف ضوضاء عشوائية إلى الاتجاه المقصود لحركة كل طائر، لتمثّل أخطاء في إدراكه وحركته."
"The speed of the boids, the radius of interaction": "يمكن تعديل سرعة الطيور، ونصف قطر التفاعل"
", the noise amplitude, the orientation weight": "، وسعة الضوضاء، ووزن التوجّه"
"and the attraction weight": "ووزن الجذب"
"can be modified in real-time. For demonstration purposes. The radius of repulsion": "لحظيًا أثناء التشغيل. ولأغراض التوضيح، نصف قطر التنافر"
"(depicted by a red circle) and the circular neighbourhood of interaction (depicted by a blue circle) are shown for a single boid.": "(تمثّله الدائرة الحمراء) ونطاق التفاعل الدائري (تمثّله الدائرة الزرقاء) معروضان لطائر واحد فقط."
"Note:": "ملاحظة:"
"This simulation was developed under the guidance of <a href=\"http://ces.iisc.ac.in/new/?q=user/36\" target=\"_blank\">Prof. Vishwesha Guttal</a> (<a href=\"https://teelabiisc.wordpress.com/\" target=\"_blank\">Lab webpage</a>).": "أُعدّت هذه المحاكاة بإشراف <a href=\"http://ces.iisc.ac.in/new/?q=user/36\" target=\"_blank\">الأستاذ فيشويشا غوتال</a> (<a href=\"https://teelabiisc.wordpress.com/\" target=\"_blank\">صفحة المختبر</a>)."
"This simulation implements the model described in \"Predatory Fish Select for Coordinated Collective Motion in Virtual Prey\" by C. C. Ioannou, V. Guttal, I. D. Couzin (<a href=\"https://doi.org/10.1126/science.1218919\" target=\"_blank\">https://doi.org/10.1126/science.1218919</a>).": "تطبّق هذه المحاكاة النموذج الوارد في بحث \"Predatory Fish Select for Coordinated Collective Motion in Virtual Prey\" لمؤلفيه C. C. Ioannou وV. Guttal وI. D. Couzin (<a href=\"https://doi.org/10.1126/science.1218919\" target=\"_blank\">https://doi.org/10.1126/science.1218919</a>)."
"For considering cross-border interactions, the landscape is repeated in the eight cardinal directions. Hence, this simulation is computationally expensive and may lag on lower-end devices. It is not recommended to have 100+ boids.": "لحساب التفاعلات عبر حدود الشاشة، تتكرر الساحة في الاتجاهات الثماني كلها. لهذا تحتاج المحاكاة حسابًا كثيفًا وقد تتباطأ على الأجهزة الضعيفة، ولا يُنصح بتجاوز 100 طائر."
"The sum of orientation weight and the attraction weight are constrained to be between 0 and 1.": "مجموع وزن التوجّه ووزن الجذب محصور بين 0 و1."
