"Collatz Conjecture": "حدسية كولاتز"
"The Collatz problem is one of those unsolved problems in mathematics which can be understood (ironically) by common people. Beginning with any positive integer x<sub>1</sub> = k, we successively iterate using x<sub>n</sub> = x<sub>n-1</sub> / 2 if x<sub>n-1</sub> is even, or x<sub>n</sub> = 3 * x<sub>n-1</sub> + 1 otherwise. Collatz conjecture claims that x<sub>n</sub> eventually reaches '1' for every positive integer k that we begin with. The following graph portrays the behaviour of the input number when subjected to the aforementioned iterations. Stopping time is the number of iterations after which we obtain '1'.": "حدسية كولاتز من المسائل الرياضية التي لم تُحلّ بعد، رغم أنها بسيطة بما يكفي لأي شخص أن يفهمها. اختر أي عدد صحيح موجب k وسمّه x<sub>1</sub>. بعدها كرر هذه القاعدة: إذا كان العدد الحالي x<sub>n-1</sub> زوجيًا فاقسمه على 2 لتحصل على x<sub>n</sub>، وإن كان فرديًا فاضربه في 3 وأضف 1. تقول الحدسية إن هذه السلسلة تصل دائمًا إلى 1 مهما كان العدد k الذي بدأت منه. يبيّن الرسم أدناه كيف يتغيّر العدد مع كل خطوة. وزمن التوقف هو عدد الخطوات التي احتجناها للوصول إلى 1."
"<b>X-axis: iterations; Y-axis: number</b>": "<b>المحور الأفقي: عدد الخطوات. المحور الرأسي: قيمة العدد</b>"
"Iterate": "كرّر"
"Brief Description": "نبذة مختصرة"
"Despite the apparent simplicity of the conjecture, no one has been able to prove it. It has been found correct for number until 300 quintillion, via brute-force computation). However, that is hardly a proof. There are two circumstances under which this conjecture is false: 1) If there is a number that never converges to 1 or 2) If the number go about in an infinitely repeating loop. There are a lot of proofs which convey that this conjecture is true for <em>almost</em> all numbers. or that <em>most</em> numbers, on average, decrease during iterations. A conclusive proof is at large.": "رغم أن الحدسية تبدو بسيطة، لم يستطع أحد إثباتها حتى الآن. تحقق الحاسوب منها لكل الأعداد حتى 300 كوينتليون تقريبًا، لكن هذا لا يكفي ليكون برهانًا. تصبح الحدسية خاطئة في حالتين فقط: أن يوجد عدد لا يصل أبدًا إلى 1، أو أن يدخل عدد في حلقة تتكرر إلى ما لا نهاية. توجد براهين كثيرة تثبت أن الحدسية صحيحة <em>تقريبًا</em> لكل الأعداد، وأن <em>معظم</em> الأعداد تتناقص في المتوسط أثناء الخطوات. لكن البرهان الكامل ما زال مفقودًا."
"Note:": "ملاحظة:"
