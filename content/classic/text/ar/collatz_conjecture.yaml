"Some numbers undergo a lot of iterations before reaching 1. In such cases, the graph may look horizontally compressed if your device is low-width.": "بعض الأعداد تحتاج خطوات كثيرة جدًا قبل أن تصل إلى 1. في هذه الحالة قد يبدو الرسم مضغوطًا أفقيًا إن كانت شاشة جهازك ضيقة."
"Some numbers iterate through a large range of values. The maximum value attained is displayed at the end. If this value is high, then small changes go unnoticed.": "بعض الأعداد تمر بقيم كبيرة جدًا أثناء الخطوات. نعرض أكبر قيمة وصل إليها العدد في نهاية المحاكاة. وإن كانت هذه القيمة كبيرة، فقد لا تلاحظ التغيرات الصغيرة في الرسم."
