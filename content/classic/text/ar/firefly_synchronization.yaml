"Mean phase: 162.77° <br>SD of phase: 97.91°": "متوسط الطور: 162.77° <br>الانحراف المعياري للطور: 97.91°"
"Sync strength: 1.00": "شدة التزامن: 1.00"
"Sync radius: 70": "نطاق التزامن: 70"
"Phase noise amplitude: 1°": "شدة ضوضاء الطور: 1°"
