"Firefly Synchronization": "تزامن اليراعات"
"Fireflies synchronize their internal flashing clocks by obtaining inputs from nearby fireflies. This simulation tries to mimic this phenomenon.": "تُزامن اليراعات وميض أجسامها الداخلي عبر التقاط إشارات من اليراعات المجاورة لها. تحاول هذه المحاكاة تقليد هذه الظاهرة."
"Simulation": "المحاكاة"
"The circles represent the fireflies. Each firefly has an internal phase": "تمثّل الدوائر اليراعات. لكل يراعة طور داخلي"
"that advances by phase velocity": "يتقدم بسرعة طورية مقدارها"
"in every update. If": "في كل تحديث. فإن"
"increases beyond": "زاد عن"
"then it resets to zero, and the firefly emits light. The color of the firefly is an indicator of it's phase. The phase circle at the centre depicts the current phase of all the fireflies. The motion of the fireflies is essentially random walks + repulsion. Initially, all fireflies have a random phase between 0 and": "عاد إلى الصفر، وأطلقت اليراعة ومضة ضوء. لون اليراعة يدل على طورها الحالي، والدائرة الصغيرة في المنتصف تعرض طور كل اليراعات في اللحظة نفسها. حركة اليراعات مزيج من مشي عشوائي وتنافر بينها. في البداية يكون طور كل يراعة رقمًا عشوائيًا بين 0 و"
