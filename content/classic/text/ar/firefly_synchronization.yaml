"Pause": "إيقاف مؤقت"
"Restart": "إعادة التشغيل"
"Description": "الوصف"
"This simulation uses the Kuramoto model of phase oscillators for synchronization. For a given firefly": "تستخدم هذه المحاكاة نموذج كوراموتو للتزامن بين المتذبذبات الطورية. بالنسبة إلى يراعة معينة"
"where θ is the phase, ω is the phase velocity,": "حيث θ هو الطور، وω هي السرعة الطورية،"
"is the synchronization strength and": "هي شدة التزامن، و"
"is the set of fireflies within the synchronization radius of the given firefly. The first term depicts the advancing of phase, whereas the second term depicts the 'nudge' that each firefly gets from the nearby fireflies, and leads to their eventual synchronization. The value of this 'nudge' becomes zero only when the phase of the firefly is aligned with all other fireflies in it's vicinity. Additionally, phase is also affected by a random noise term": "هي مجموعة اليراعات الواقعة ضمن نطاق التزامن حول هذه اليراعة. الحد الأول في المعادلة يمثل تقدم الطور بمرور الوقت، والحد الثاني يمثل 'الدفعة' التي تتلقاها كل يراعة من جاراتها، وهي ما يقودها في النهاية إلى التزامن معها. تصبح قيمة هذه 'الدفعة' صفرًا فقط حين يتطابق طور اليراعة مع طور كل اليراعات المجاورة لها. كذلك يتأثر الطور بحد ضوضاء عشوائي"
". This represents errors in judgement made by the firefly.": ". يمثل هذا الحد أخطاء تقدير تقع فيها اليراعة."
"A higher sync strength": "كلما زادت شدة التزامن"
"leads to faster synchronization of nearby. A higher sync radius": "تزامنت اليراعات المتجاورة أسرع. وكلما زاد نطاق التزامن"
"ensures tha synchronization is present over greater areas. Higher phase noise makes synchronization harder. Higher the global synchronization, lower the standard deviation of phase.": "امتد التزامن إلى مساحة أكبر. وكلما زادت ضوضاء الطور صعب التزامن، وكلما ازداد التزامن الكلي بين اليراعات قلّ الانحراف المعياري لطورها."
"Note:": "ملاحظة:"
"Standard deviation of phase has an oscillatory behaviour because of the cyclic nature of phase. Even when all fireflies are synchronized, SD briefly peaks whenever the phases cross the 360 ° threshold.": "يتذبذب الانحراف المعياري للطور بسبب الطبيعة الدائرية للطور. فحتى حين تتزامن كل اليراعات، يقفز الانحراف المعياري للأعلى للحظة كلما عبر الطور حد الـ360°."
"This simulation is computationally complex, and may lag on lower-end devices.": "هذه المحاكاة تحتاج حسابًا كثيفًا، وقد تبطئ على الأجهزة الأضعف."
"Related: <a href=\"../collective_behaviour/simulation.html\">Collective Behaviour</a>.": "مرتبط بها: <a href=\"../collective_behaviour/simulation.html\">السلوك الجماعي</a>."
