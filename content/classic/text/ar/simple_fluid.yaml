"Simple Fluid": "مائع بسيط"
"This simulation attempts to simulate a fluid in a computationally inexpensive way (in comparison to more accurate methods). The aim here is to recreate a fluid's behaviour for aesthetic and educational purposes. This is a recreation of <a href=\"https://www.dgp.toronto.edu/people/stam/reality/Research/pdf/GDC03.pdf\" target=\"_blank\">Jos Stam's</a> method of fluid simulation for games.": "تحاول هذه المحاكاة تقليد حركة مائع (كالماء أو الدخان) بحساب بسيط وسريع، بدل الطرق الدقيقة الأثقل على الحاسوب. الهدف هنا أن ترى حركة تشبه المائع الحقيقي بشكل جميل ومفيد للتعلّم. وهي مبنية على طريقة <a href=\"https://www.dgp.toronto.edu/people/stam/reality/Research/pdf/GDC03.pdf\" target=\"_blank\">جوس ستام</a> المستخدمة في محاكاة الموائع داخل ألعاب الفيديو."
"<b>This real-time simulation is computationally complex and may induce unresponsiveness on lower-end devices</b>": "<b>هذه محاكاة حيّة تحتاج حسابات كثيرة، وقد تصبح بطيئة على الأجهزة الأقل قوة</b>"
