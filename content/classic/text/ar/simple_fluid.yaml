"Explanation": "الشرح"
"We're essentially trying to solve the Navier-Stokes equations in a simpler way:": "نحاول هنا حل معادلات نافييه-ستوكس (معادلات حركة الموائع) بطريقة أبسط:"
"The first equation tells us how fluid density": "المعادلة الأولى تخبرنا كيف تتغيّر كثافة المائع"
"behaves. The first term on the RHS says that density 'flows' according to the velocity field": "بمرور الوقت. الحد الأول في يمين المعادلة يقول إن الكثافة 'تنتقل' مع حقل السرعة"
"(this process is called advection). The second term represents diffusion of fluid whereas the third term accounts for sources and sinks.": "(نسمي هذا 'الحمل'). والحد الثاني يمثّل انتشار المائع، والحد الثالث يمثّل مصادره ومصارفه."
"The second equation lays down the behaviour of the velocity field": "أما المعادلة الثانية فتصف سلوك حقل السرعة"
". The first term on the RHS says that the velocity field advects on the basis of itself (this can be intrepreted as flow of momentum). The second term represents the diffusion of momentum (due to viscosity). The third term represents external forces acting on the fluid.": ". الحد الأول يقول إن حقل السرعة ينتقل بتأثير نفسه (أي أن كمية الحركة تتدفق مع المائع). والحد الثاني يمثّل انتشار كمية الحركة بسبب اللزوجة. والحد الثالث يمثّل القوى الخارجية المؤثرة على المائع."
"In addition to these two equations, we also need to make sure that the velocity field is mass conserving. This correction is achieved by using the result of Hodge decomposition, which states that every velocity field is the sum of a mass conserving field and a gradient field. Hence, if we subtract the gradient from our velocity field, we will get a mass conserving velocity field.": "بالإضافة إلى هاتين المعادلتين، يجب أن نتأكد أن حقل السرعة لا يفقد كتلة ولا يكسبها. نصحّح هذا باستخدام نتيجة رياضية اسمها 'تفكيك هودج'، وتقول إن أي حقل سرعة هو مجموع حقل يحافظ على الكتلة وحقل تدرّج. فإذا طرحنا التدرّج من حقل السرعة، نحصل على حقل يحافظ على الكتلة."
"Note:": "ملاحظة:"
"The boundary condition is closed. It has not been implemented properly (yet). If fluid is introduced in the corner from which a velocity field originates, then the densities blow up. Clear the simulation if this happens.": "حدود الحاوية مغلقة، ولم تُبرمج هذه الحدود بدقة بعد. فإذا أضفت مائعًا في الزاوية التي ينطلق منها حقل السرعة، قد تتضخّم الكثافة بشكل غير طبيعي. اضغط 'امسح' إذا حدث هذا."
