". Figuratively, the determinant determines the scaling of areas that occurs as a result of a linear transformation represented by a matrix. The sign of the determinant is negative if the linear transformation flips the lattice points. A determinant of zero indicates that the linear transformation reduces the coordinate system to a point or a line.": ". يخبرك المحدِّد كم تكبر المساحات أو تصغر بعد التحويل. يصبح المحدِّد سالبًا إن قلب التحويل النقاط وعكس اتجاهها. وإذا كان المحدِّد صفرًا فهذا يعني أن التحويل يضغط المستوى كله إلى نقطة واحدة أو خط واحد."
