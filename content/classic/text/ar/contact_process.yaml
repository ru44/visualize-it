"Contact Process": "عملية التماس"
"In the context of Stochastic and Spatial Dynamics, Contact Process is used to model population growth in a set of interactive cells. In essence, it is a randomised cellular automaton: a zero player game that follows a set of rules coupled with randomness.": "عملية التماس نموذج رياضي يصف كيف ينمو عدد سكان في مجموعة من الخلايا التي تؤثر كل واحدة منها في جاراتها. هي في جوهرها أوتوماتا خلوية عشوائية: لعبة بلا لاعبين تسير وفق قواعد ثابتة ممزوجة بالعشوائية."
"Simulation": "المحاكاة"
"The model comprises a 2D lattice of cells. Each cell can be dead (black) or alive (gray). Alive cells can die (red) or dead cells can be born (blue). The algorithm is as follows:": "يتكوّن النموذج من شبكة خلايا ثنائية الأبعاد. كل خلية إما ميتة (سوداء) أو حية (رمادية). الخلية الحية قد تموت فتصير حمراء، والخلية الميتة قد تولد فيها حياة فتصير زرقاء. هذه خطوات الخوارزمية:"
"Select a random cell": "اختر خلية عشوائية"
"If the selected cell is empty, then repeat the previous step. If the selected cell is occupied, then proceed to next step with the selected cell as the 'current cell'": "إذا كانت الخلية فارغة، أعد الخطوة السابقة. وإذا كانت مشغولة، تابع إلى الخطوة التالية معتبرًا إياها 'الخلية الحالية'"
"The next step is probabilistic, with a probability 'p' of birth and '1-p' of death": "الخطوة التالية احتمالية: باحتمال 'p' تحدث ولادة، وباحتمال '1-p' يحدث موت"
"<b>Birth:</b> Randomly select a cell adjacent to the current cell. If it is empty, then spawn an occupant there. If it is already occupied then do nothing": "<b>الولادة:</b> اختر عشوائيًا خلية مجاورة للخلية الحالية. إن كانت فارغة، ضع فيها ساكنًا جديدًا. وإن كانت مشغولة، لا تفعل شيئًا"
"<b>Death:</b> Kill the occupant of the current cell": "<b>الموت:</b> أزل ساكن الخلية الحالية"
"Repeat from the beginning": "أعد الكرّة من البداية"
"Click on a cell to toggle it's state. Consider pausing the simulation <br> Blue - Birth ; Red - Death": "اضغط أي خلية لتبدّل حالتها، ويُستحسن إيقاف المحاكاة مؤقتًا أثناء ذلك <br> الأزرق: ولادة، الأحمر: موت"
"Pause": "إيقاف مؤقت"
"Clear": "مسح"
"Probability of birth: 0.8": "احتمال الولادة: 0.8"
"Updates to probability get reflected immediately": "يظهر أثر تغيير الاحتمال فورًا"
"Grid size: 10 x 10": "حجم الشبكة: 10 × 10"
"Grid gets cleared when size is updated": "تُمسح الشبكة كلما غيّرت حجمها"
"Note:": "ملاحظة:"
"If p < 0.5, then there is a pretty high chance that your population will go extinct within a couple of steps": "إن كان p أصغر من 0.5 فاحتمال انقراض العدد كبير خلال خطوات قليلة"
"If you want to paint a pattern and watch it's evolution, then pause the simulation while doing so": "إن أردت رسم نمط ومراقبة تطوره، أوقف المحاكاة مؤقتًا أثناء الرسم"
"Related: <a href=\"../bernoulli_percolation/simulation.html\">Bernoulli Percolation</a>, <a href=\"../tdp/simulation.html\">Directed Percolation</a>, <a href=\"../porous_percolation/simulation.html\">Porous Percolation</a>.": "محاكاة قريبة: <a href=\"../bernoulli_percolation/simulation.html\">تسرّب برنولي</a>، <a href=\"../tdp/simulation.html\">التسرّب الموجّه</a>، <a href=\"../porous_percolation/simulation.html\">التسرّب المسامي</a>."
