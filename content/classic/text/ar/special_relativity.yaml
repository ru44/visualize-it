"Special Relativity": "النسبية الخاصة"
"Special relativity explains the relationship between space and time. It's based on two postulates: 1) The laws of physics are same in all inertial frames of reference and 2) The speed of light in vacuum is same for all observers. On applying these postulates, one realizes that certain physical quantities when measured from different inertial frames of reference do not tally with each other. We explore three such quantities.": "تشرح النسبية الخاصة العلاقة بين المكان والزمان. وتقوم على فرضيتين: الأولى أن قوانين الفيزياء واحدة في كل الأطر العطالية (الأطر التي لا تتسارع)، والثانية أن سرعة الضوء في الفراغ ثابتة عند كل الراصدين. وحين نطبّق هاتين الفرضيتين، نكتشف أن بعض الكميات الفيزيائية تختلف قيمتها باختلاف الإطار الذي نقيسها منه. نستكشف هنا ثلاث كميات من هذا النوع."
"Consider a Geosynchronous satellite orbiting the Earth. It's near-circular orbital path has a radius of 42300 km. We measure the passage of time, length of the same object and frequency of waves tranmitted by the satellite and received by the Earth. Use the slider to vary the orbital speed of the satellite as a % of speed of light.": "تخيّل قمرًا صناعيًا يدور حول الأرض في مدار شبه دائري نصف قطره 42300 كم. نقيس هنا مرور الزمن وطول الجسم نفسه وتردد الموجات التي يرسلها القمر وتستقبلها الأرض. حرّك المنزلق لتغيّر سرعة القمر كنسبة مئوية من سرعة الضوء."
"Satellite speed: 70.0% of speed of light or 209854721 m/s.<br><b>γ = 1.4003</b>": "سرعة القمر: 70.0% من سرعة الضوء، أي 209854721 م/ث.<br><b>γ = 1.4003</b>"
"Or type the % of speed of light here:": "أو اكتب النسبة المئوية من سرعة الضوء هنا:"
"Description": "الوصف"
"Time Dilation": "تمدّد الزمن"
"According to a stationary observer on Earth, time appears to pass slower aboard the satellite. If the time period between two events on the satellite is 't<sub>0</sub>'' aboard the satellite, then it is 't' (as calculated above) for the observer on Earth. Observe that t<sub>0</sub> &lt; t. This phenomenon is known as time dilation.": "بالنسبة لراصد ثابت على الأرض، يبدو أن الزمن يمر أبطأ على متن القمر الصناعي. فإذا كان الزمن بين حدثين على متن القمر هو t<sub>0</sub>، فسيقيسه الراصد على الأرض بالقيمة t المحسوبة أعلاه. ولاحظ أن t<sub>0</sub> أصغر من t. تسمى هذه الظاهرة تمدّد الزمن."
"Length contraction": "تقلّص الطول"
"If the length of an object on Earth is measured to be 'l<sub>0</sub>'' by a stationary observer on Earth, then an observer aboard the satellite measured the same object's length to be 'l' as calculated above. Observe that l<sub>0</sub> &gt; l. This phenomenon is known as length contraction.": "إذا قاس راصد ثابت على الأرض طول جسم فوجده l<sub>0</sub>، فسيقيس راصد على متن القمر طول الجسم نفسه بالقيمة l المحسوبة أعلاه. ولاحظ أن l<sub>0</sub> أكبر من l. تسمى هذه الظاهرة تقلّص الطول."
"Relativistic Doppler Effect": "تأثير دوبلر النسبي"
"If the satellite transmits waves of frequency 'f<sub>0</sub>'', then a stationary receiver on the Earth will measure the same waves to have a frequency of 'f' as calculated above. This phenomenon is known as relativistic doppler effect.": "إذا أرسل القمر موجات ترددها f<sub>0</sub>، فسيقيس مستقبل ثابت على الأرض تردد الموجات نفسها بالقيمة f المحسوبة أعلاه. تسمى هذه الظاهرة تأثير دوبلر النسبي."
"Note:": "ملاحظة:"
"Speaking in a strict sense, a satellit orbiting the Earth won't exactly show these effects in the same manner. The orbiting satellite analogy has been provided to get a brief idea of speed. Instead, consider a spaceship going away from Earth at the same speed.": "بدقة، القمر الصناعي في مداره لن يُظهر هذه الظواهر تمامًا بهذه الطريقة، لأن مداره يتضمن تسارعًا. استخدمنا مثال القمر الصناعي فقط لتقريب فكرة السرعة. الأدق أن تتخيّل مركبة فضائية تبتعد عن الأرض بالسرعة نفسها في خط مستقيم."
