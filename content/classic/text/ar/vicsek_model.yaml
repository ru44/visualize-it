"Vicsek Model": "نموذج فيتشك"
"Vicsek Model is a simple agent-based model of self-propelled particles. Its working is simple: every boid aligns itself along the average direction of all the boids in its interaction radius. Additionally, there is a small noise added to the direction of the boid. The polarization of the system (a value between 0 and 1) is dependent on the density of boids, the interaction radius, and the amplitude of noise.": "نموذج فيتشك نموذج بسيط لجسيمات تتحرك من تلقاء نفسها. فكرته سهلة: كل جسيم يوجّه حركته بمتوسط اتجاه الجسيمات المجاورة له ضمن نطاق تفاعل معيّن، مع إضافة قدر صغير من الضوضاء العشوائية إلى اتجاهه. مقدار الاستقطاب في النظام (رقم بين 0 و1) يعتمد على كثافة الجسيمات ونطاق التفاعل وشدة الضوضاء."
