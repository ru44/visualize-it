"Note:": "ملاحظة:"
"This model shows a transition from disordered motion to large-scale ordered motion. When density is low or noise is high, particles behave like a disordered gas. When noise is low and density is high, particles 'flow' like a liquid. Their behaviour is conveyed by the value of polarization.": "يُظهر هذا النموذج انتقال الجسيمات من حركة عشوائية إلى حركة منظمة على نطاق واسع. حين تكون الكثافة منخفضة أو الضوضاء عالية، تتصرف الجسيمات كغاز مضطرب. وحين تكون الضوضاء منخفضة والكثافة عالية، 'تتدفق' الجسيمات كسائل. رقم الاستقطاب هو ما يخبرك بحالتها."
