"Given a list of cities and the distances between each pair of cities, what is the shortest possible route that visits each city exactly once and returns to the origin city?": "معك قائمة مدن والمسافة بين كل مدينتين. ما أقصر طريق يمر بكل مدينة مرة واحدة فقط ثم يعود إلى مدينة البداية؟"
