"This problem is classified as NP-hard since it's time complexity is": "نصنّف هذه المشكلة بأنها NP-hard لأن الزمن الذي تحتاجه هو"
"(Along with a space complexity of": "(والذاكرة التي تحتاجها"
"). The only assured way of obtaining the shortest path is via brute-force search, which involves looking at all possible paths and keeping track of the shortest ones encountered. However, the number of possible paths grows factorially with number of nodes (which is asymptotically faster than even exponential growth). Hence, there are several ways through which we can get 'shorter' but not the 'shortest' path:": "). الطريقة الوحيدة المضمونة لإيجاد أقصر طريق هي تجربة كل المسارات الممكنة (القوة الغاشمة) وتتبّع أقصرها. لكن عدد المسارات الممكنة ينمو نموًا فاكتوريًا مع عدد المدن، وهذا أسرع حتى من النمو الأسي. لذلك توجد طرق عدة تعطينا طريقًا 'أقصر' لكن ليس بالضرورة 'الأقصر':"
"<b>Nearest Neighbour:</b> <br> Start at a particular node. Travel to the nearest node. Repeat. This algorithm is very simple to implement.": "<b>أقرب جار:</b> <br> ابدأ من مدينة، وانتقل إلى أقرب مدينة لم تزرها، وكرّر ذلك. خوارزمية بسيطة جدًا في التطبيق."
"<b>Greedy Heuristic:</b> <br> Form the initial path with shorter edges, and connect them.": "<b>الطريقة الجشعة:</b> <br> ابنِ المسار الأولي من أقصر الوصلات، ثم اربطها ببعضها."
"<b>Simulated Annealing:</b> <br> Inspired by the way crystals cool, this method tries to converge to a local minima while implementing a cooling schedule. In every step, two nodes from the path are switched, and the resulting path is accepted or rejected using Metropolis algorithm (please find intricate details <a href=\"../ising_model/simulation.html\">here</a>).": "<b>التلدين المحاكى:</b> <br> مستوحاة من طريقة تبرّد البلورات. تقترب هذه الطريقة تدريجيًا من أقصر مسار وفق جدول تبريد معيّن. في كل خطوة تُستبدل مدينتان في المسار، ثم يُقبل المسار الجديد أو يُرفض باستخدام خوارزمية متروبوليس (التفاصيل الدقيقة <a href=\"../ising_model/simulation.html\">هنا</a>)."
"<b>Genetic Algorithm:</b> <br> A poplation of entities whose genes comprise of paths, and whose fitness is based on how short the paths are. Fitter entities have greater chance of their genes making it into the offspring. Also uses mutation (to explore prospectively better avenues) and recombination (to combine the best of two genes).": "<b>الخوارزمية الجينية:</b> <br> مجموعة من الأفراد، جينات كل فرد منها هي مسار كامل، وكلما قصُر مساره زادت لياقته. الأفراد الأنسب أوفر حظًا في نقل جيناتهم إلى الجيل التالي. تستخدم الطريقة أيضًا الطفرة (لاستكشاف مسارات جديدة) والتزاوج (لدمج أفضل ما في مسارين)."
"<b>Ant Colony Optimization:</b> <br> Initially, a population of ants randomly traverse the graph. By gauging the shortness of each edge, they leave more pheromones along that edge. In the next iteration, at every node, the ants choose the edge on a probabilistic manner, weighted by pheromone strength. Both, genetic algorithm and ant colony optimization are called metaheuristic methods because they solve the problem at hand by working at a higher level, instead of directly tackling the problem.": "<b>مستعمرة النمل:</b> <br> يجول النمل بدايةً في المسارات عشوائيًا. وكلما كانت الوصلة أقصر ترك عليها النمل فرمونًا أكثر. في الجولة التالية، يختار كل نملة عند كل مدينة الوصلة التالية باحتمال يعتمد على كمية الفرمون عليها. تسمى الخوارزمية الجينية ومستعمرة النمل معًا بالطرق فوق-الاستدلالية، لأنها تحل المشكلة من مستوى أعلى بدل مهاجمتها مباشرة."
"<b>Christofides' Algorithm</b> <br> Considered the gold standard of solving the Travelling Salesman Problem, this algorithm utilizes insights from an easily solvable problem in graph theory (constructing a minimal spanning tree from a given graph) and manipulates it to arrive at (on average) comparatively shorter paths.": "<b>خوارزمية كريستوفيدس</b> <br> تُعتبر أفضل طريقة معروفة لحل مشكلة البائع المتجول. تستفيد من مشكلة سهلة الحل في نظرية الرسوم البيانية، وهي بناء الشجرة الممتدة الصغرى، وتبني عليها للوصول -في المتوسط- إلى مسارات أقصر نسبيًا."
