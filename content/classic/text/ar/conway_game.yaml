"Accidently touching the canvas while scrolling down on a mobile will toggle the state of a cell and may disturb the ongoing simulation": "لمس الشاشة بالخطأ أثناء التمرير على الجوال يبدّل حالة خلية وقد يخل بالمحاكاة الجارية"
