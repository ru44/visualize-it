"Interesting Facts": "حقائق مثيرة"
"It is possible to construct all elements of electronics in Conway's game of life: logic gates, counters, memory cells, etc. In fact, Turing-complete computers have been constructed within this world.": "يمكن بناء كل عناصر الإلكترونيات داخل لعبة الحياة لكونواي: بوابات منطقية، وعدّادات، وخلايا ذاكرة، وغيرها. بل صُنعت داخل هذا العالم حواسيب كاملة القدرة الحسابية."
"It is possible to construct self-replicative entities within this game. A DNA-like record has also been used to store and propogate information.": "يمكن أيضًا بناء كائنات تستنسخ نفسها داخل هذه اللعبة، واستُخدم سجل يشبه الحمض النووي لتخزين المعلومات ونقلها."
"This game can be simulated on a variety of 2D geometric figures like knots and Mobius strips.": "يمكن محاكاة هذه اللعبة على أشكال هندسية ثنائية الأبعاد متنوعة، مثل العقد وشريط موبيوس."
"This system also exhibits chaos: if you modify the initial state by a little, then the long-term behaviour of the system gets drastically changed.": "يُظهر هذا النظام فوضى أيضًا: فتغيير بسيط في الحالة الأولى يغيّر سلوك النظام على المدى الطويل تغييرًا كبيرًا."
"Note:": "ملاحظة:"
