"Hopfield Networks | Visualize It": "شبكات هوبفيلد | Visualize It"
"Hopfield Networks": "شبكات هوبفيلد"
"A hopfield network is a very simple framework that is capable of learning (memorization) and inference (recall) of patterns. It also features associative memory, in the sense that it can recall the learnt pattern when the given pattern is partial and/or noisy. The below simulation fetures a 35x35 grid which comprises a fully connected network of 1225 nodes. Teach it some patterns (example: numbers) by drawing the pattern and then clicking \"memorize\". After this, draw the same pattern(s) partially/differently and click on \"recall\" in order to (hopefully) obtain the learned pattern. Hopfield networks through light on how LLMs may memorize information, and how biological brains may retrieve information.": "شبكة هوبفيلد بنية بسيطة جدًا قادرة على تعلم الأنماط (الحفظ) واسترجاعها (التذكر). ولها أيضًا ذاكرة ترابطية: تستطيع أن تتذكر النمط الذي تعلمته حتى إن أعطيتها جزءًا منه أو نسخة فيها تشويش. المحاكاة أدناه شبكة بحجم 35×35، أي 1225 عقدة متصلة كلها ببعضها. علّمها بعض الأنماط (أرقامًا مثلًا) بأن ترسمها ثم تضغط \"حفظ\". بعدها ارسم النمط نفسه جزئيًا أو بشكل مختلف قليلًا واضغط \"تذكر\"، وستحصل (على الأرجح) على النمط الذي حفظته. تكشف شبكات هوبفيلد كيف قد تحفظ نماذج اللغة الكبيرة معلوماتها، وكيف قد تسترجع الأدمغة الحيّة المعلومات."
"Draw a pattern on the grid <br> Clear the grid to start over": "ارسم نمطًا على الشبكة <br> امسح الشبكة لتبدأ من جديد"
"Clear Grid": "مسح الشبكة"
"Clear Memory": "مسح الذاكرة"
"Number of patterns memorized: 0": "عدد الأنماط المحفوظة: 0"
"Memory capacity (theoretical): 0.14 N<sup>2</sup> = approx. 170 patterns": "سعة الذاكرة (نظريًا): 0.14 N<sup>2</sup> ≈ 170 نمطًا"
"Memorize": "حفظ"
"Recall": "تذكر"
"Description": "الوصف"
"The inspiration for Hopfield network comes from spin-glass systems in physics. A hopfield network of": "استُلهمت شبكة هوبفيلد من أنظمة الزجاج المغزلي (spin-glass) في الفيزياء. شبكة هوبفيلد من"
"nodes is a fully connected network. Each node can take either discrete or continuous values. In this case, the nodes are discrete (+/- 1). A pair of nodes connected by an edge with a positive weight have a tendency to correlate, and vice versa. We define the energy of the system as follows:": "عقدة، وهي شبكة متصلة بالكامل. يمكن أن تأخذ كل عقدة قيمًا متقطعة أو متصلة، وهنا هي متقطعة (+1 أو -1). العقدتان المتصلتان بوزن موجب تميلان إلى التوافق، والعكس مع الوزن السالب. نعرّف طاقة النظام كما يلي:"
"Here,": "هنا،"
"is a vector that represents the state of the network and": "متجه يمثل حالة الشبكة، و"
"is the weight of the edge joining the": "وزن الحافة الواصلة بين العقدة"
"and": "والعقدة"
"nodes. Edges are symmetric/undirected. The memorization phase involves tweaking the weights such that the resulting energy landscape features a local minimum at the pattern to be learnt. The recall phase involves starting from a partial/noisy state and tweaking the state of each node until we reach a local minimum.": "العقدتين. الحواف متماثلة الاتجاه (غير موجهة). مرحلة الحفظ تعني تعديل الأوزان بحيث يصبح للنمط المراد حفظه أدنى موضعي في مشهد الطاقة. ومرحلة التذكر تعني البدء من حالة جزئية أو فيها تشويش، وتعديل حالة كل عقدة حتى نصل إلى أدنى موضعي."
"Memorization:": "الحفظ:"
"with a given training vector": "بمتجه تدريب معطى"
", we tweak the weights as follows, in order to make": "، نعدّل الأوزان كما يلي لنجعل"
"correspond to a local minimum in the energy landscape:": "يقابل أدنى موضعي في مشهد الطاقة:"
"Recall:": "التذكر:"
"with an initial partial/noisy vector": "بمتجه أولي جزئي أو فيه تشويش"
", we tweak the state of each node as follows, in order to make": "، نعدّل حالة كل عقدة كما يلي لنجعل"
"descend towards a local minimum in the energy landscape:": "تنزل نحو أدنى موضعي في مشهد الطاقة:"
"The amazing thing is that all the memorization and recall takes place via network interactions, without any centralized mechanism. Hopfield networks shed light on how Large Language Models may hypothetically store memory. They also suggest how biological brains retrieve complete information from incomplete snippets (say, an entire song from a few lyrics). There are many extensions of Hopfield networks, the most prominent one being the Boltzmann machine.": "والمدهش أن كل هذا الحفظ والتذكر يحدث عبر تفاعلات الشبكة وحدها، من دون أي آلية مركزية تديرها. تكشف شبكات هوبفيلد كيف يمكن لنماذج اللغة الكبيرة (LLMs) أن تخزن الذاكرة افتراضيًا، وتقترح أيضًا كيف تسترجع الأدمغة الحيّة معلومات كاملة من مقاطع ناقصة (كأن تتذكر أغنية كاملة من كلمات قليلة منها). ولشبكات هوبفيلد امتدادات كثيرة، أشهرها آلة بولتزمان."
"The theoretical capacity of a Hopfield network is": "السعة النظرية لشبكة هوبفيلد هي"
"patterns, where": "نمطًا، حيث"
"is the number of nodes. In practice, due to correlations in the patterns stored, the actual capacity may be much lower. Similar patterns may give rise to additional local minima which correspond to an amalgamation of the similar patterns (confusion). Multiple local minimas may lie together, leading to mis-identification.": "عدد العقد. لكن في التطبيق العملي، بسبب الترابط بين الأنماط المحفوظة، قد تكون السعة الفعلية أقل من ذلك بكثير. الأنماط المتشابهة قد تنشئ نقاط أدنى موضعي إضافية تمثل خلطًا بين الأنماط المتشابهة (التباس)، وقد تتقارب عدة نقاط أدنى موضعي فتؤدي إلى تمييز خاطئ."
"This simulation (particularly the recall phase) is computationally complex and may lag on lower-end devices.": "هذه المحاكاة، وخصوصًا مرحلة التذكر، معقدة حسابيًا وقد تتأخر على الأجهزة الضعيفة."
"For best recall results, use patterns that are dissimilar to each other.": "للحصول على أفضل تذكر، استخدم أنماطًا مختلفة عن بعضها."
