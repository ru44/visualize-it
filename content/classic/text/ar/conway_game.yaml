"Conway's Game of Life": "لعبة الحياة لكونواي"
"The most famous cellular automaton, Conway's game of life was was devised by British Mathematician John Conway in 1970.": "أشهر أوتوماتا خلوية على الإطلاق، ابتكرها عالم الرياضيات البريطاني جون كونواي عام 1970."
"Simulation": "المحاكاة"
"The world consists of a 2D lattice of cells. Each cell has a state, either alive (colored) or dead (black). The future of every cell is determined by a simple set of rules:": "يتكوّن العالم من شبكة خلايا ثنائية الأبعاد. لكل خلية حالة: إما حية (ملوّنة) أو ميتة (سوداء). ومستقبل كل خلية تحدده قواعد بسيطة:"
"An alive cell dies of loneliness if it has none or only 1 living neighbour": "تموت الخلية الحية من الوحدة إن لم يكن لها جارة حية، أو كانت لها جارة واحدة فقط"
"An alive cell dies of starvation if it has more than 3 living neighbours": "تموت الخلية الحية من الازدحام إن كان لها أكثر من 3 جارات حية"
"An alive cell is sustained if it has 2 or 3 living neighbours": "تبقى الخلية الحية إن كان لها جارتان أو 3 جارات حية"
"A non-living cell becomes alive if it has exactly 3 living neighbours": "تصير الخلية الميتة حية إن كان لها 3 جارات حية بالضبط"
"These rules are enforced on all cells, and the grid is updated synchronously. Cells that are about to die of loneliness are represented by white. Cells that are going to die due to overcrowding are represented by red. Cells with two neighbours are colored orange whereas cells with three neighbours are colored blue.": "تُطبَّق هذه القواعد على كل الخلايا معًا، وتُحدَّث الشبكة دفعة واحدة. الخلايا التي ستموت من الوحدة تظهر بيضاء، والتي ستموت من الازدحام تظهر حمراء. الخلايا ذات الجارتين تظهر برتقالية، وذات الثلاث جارات تظهر زرقاء."
"Instructions:": "تعليمات:"
