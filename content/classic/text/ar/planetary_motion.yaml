"Planetary Phenomena": "ظواهر كوكبية"
"Precessing orbit:": "مدار متقدّم:"
"The use of the velocity Verlet integration preserves the total energy of the planetary system. The drifting of the system given the initial conditions is expected. Furthermore, the wobble of the star is also expected due to the planet being only 10 times less massive than its star. While stable in the sense of preserving the total energy (for the default step size) and the shape and size of the orbits, the simulated orbits deviate from their theoretical trajectories in that orbital precession is evident as an artefact of the integration approach.": "تستخدم المحاكاة طريقة حسابية اسمها 'فيرلية بالسرعة' تحافظ على الطاقة الكلية للنظام. لذلك من الطبيعي أن ينجرف النظام قليلًا حسب الشروط التي بدأنا بها، وأن يتمايل النجم نفسه لأن كتلة الكوكب هنا ليست صغيرة جدًا مقارنة به (أقل بعشر مرات فقط). ورغم أن الطاقة الكلية وشكل المدارات وحجمها تبقى ثابتة تقريبًا، إلا أن المدار يتحرك قليلًا بمرور الوقت (نسمي هذا تقدّم المدار)، وهذا أثر جانبي لطريقة الحساب نفسها وليس لقانون الجاذبية."
"Two planetary orbits:": "مداران كوكبيان:"
"Two planets revolving around a star in remarkably stable orbits.": "كوكبان يدوران حول نجم في مدارين مستقرّين بشكل لافت."
"Binary system:": "نظام ثنائي:"
"Two equally heavy bodies orbiting their center of mass. This sort of behaviour is usually seen among stars. Alpha Centauri A and B are well-known examples, just 4.36 light years away from Earth. However, another star named Proxima Centauri actually orbits the binary system!": "جسمان متساويان في الكتلة يدوران حول مركز كتلتهما المشترك. نرى هذا السلوك كثيرًا بين النجوم، ومن أشهر أمثلته ألفا قنطورس A وB، وهما على بعد 4.36 سنة ضوئية من الأرض فقط. بل إن نجمًا آخر اسمه بروكسيما قنطورس يدور حول هذا الزوج نفسه!"
"Intersecting orbits:": "مدارات متقاطعة:"
"Two planets revolving around a star in intersecting orbits.": "كوكبان يدوران حول نجم في مدارين يتقاطعان."
"Planetary dance:": "رقصة الكواكب:"
"The two planets revolve symmetrically around the star, staying in stable (but precessing) orbits.": "يدور الكوكبان حول النجم بتناظر، ويبقيان في مدارين مستقرّين يتقدّمان ببطء."
"Description": "الوصف"
"The Force of Gravity:": "قوة الجاذبية:"
"As a result of Newton's 3rd law of motion, the gravitational force of attraction of body A on body B is equal to that of body B on body A.": "بحسب قانون نيوتن الثالث، قوة جذب الجسم A للجسم B تساوي قوة جذب B لـA تمامًا."
"G is an universal constant whose value is known to be 6.67 * 10<sup>-11</sup> m<sup>3</sup>kg<sup>-1</sup>s<sup>-2</sup>": "G ثابت عام قيمته 6.67 × 10<sup>-11</sup> m<sup>3</sup>kg<sup>-1</sup>s<sup>-2</sup>"
"As stated before, gravitational force acts between all pairs of objects in this universe by virtue of their mass. However, we don't see everyday objects getting attracted to each other because the product of their masses is not high enough to dwarf the low value of G. Hence, the force of gravity between them is too low to cause any observable effects.": "كما ذكرنا، تعمل الجاذبية بين أي جسمين في الكون بسبب كتلتيهما. لكننا لا نرى الأشياء من حولنا تتجاذب لأن حاصل ضرب كتلتيها صغير جدًا مقارنة بقيمة G الصغيرة أصلًا. فتكون قوة الجاذبية بينهما ضعيفة جدًا لدرجة لا نلاحظها."
"Although it is a well-known fact that electromagnetic force is 10<sup>38</sup> times stronger than gravitational force, electromagnetic force cannot be dominant in the universe due to the presence of two types of charge. Over large volumes, these two types of charges cancel out each other, thereby nullifying any electromagnetic interactions. Moreover, electromagnetic interactions can be attractive as well as repulsive. On the other hand, there is only one type of mass, hence there is no repulsive gravitational interaction and no mass cancellation throughout the entire expanse of the universe, thereby allowing gravity to pervade it.": "صحيح أن القوة الكهرومغناطيسية أقوى من الجاذبية بمقدار 10<sup>38</sup> مرة، لكنها لا تتحكم في الكون لأن هناك نوعين من الشحنة. وعلى مساحات كبيرة، يلغي كل نوع أثر النوع الآخر فتختفي القوة الكهرومغناطيسية تقريبًا. كما أن هذه القوة قد تجذب أو تدفع، بينما الكتلة نوع واحد فقط، فالجاذبية تجذب دائمًا ولا يلغي أثرها شيء، ولهذا تسيطر على الكون كله."
"The motion of celestial bodies is directed by the force of gravity alone. Their huge masses allows high degree of gravitational interaction despite the large distances between them.": "الجاذبية وحدها هي التي توجّه حركة الأجرام السماوية. وكتلتها الضخمة تجعل تجاذبها قويًا رغم المسافات الشاسعة بينها."
"The Gravitational Field:": "المجال الجاذبي:"
"Physicists often use the concept of a gravitational field being generated around a mass. The strength of the gravitational field at a point in the vicinity of a mass is proportional to the mass 'M' of the object and falls as the square of distance of separation 'r'. The above formula generalises the gravitational field at point": "يستخدم الفيزيائيون فكرة المجال الجاذبي الذي تولّده أي كتلة حولها. تزداد قوة هذا المجال عند نقطة قريبة كلما كبرت الكتلة M، وتضعف مع مربع المسافة r عنها. المعادلة أعلاه تعمّم هذه الفكرة لحساب المجال عند نقطة"
"due to": "بسبب"
"bodies.": "من الأجسام."
"is the distance between them.": "هي المسافة بينها."
"Any body of mass 'm', when kept in this field, interacts with it. The strength of interaction being proportional to 'm' and to the strength of the gravitational field.": "أي جسم كتلته m، إذا وُضع داخل هذا المجال، يتفاعل معه بقوة تتناسب مع كتلته m ومع شدة المجال نفسه."
"The postulation of a field is not merely theoretical. Infact, it is known that the bounds of this field explands at the speed of light. Moreover, the concents of fields and potentials convey the transfer of energy and momentum in an elegant manner.": "فكرة المجال ليست مجرد أداة رياضية، فحدود هذا المجال تتمدد فعليًا بسرعة الضوء. وتساعدنا فكرتا المجال والجهد على فهم كيف تنتقل الطاقة وكمية الحركة بطريقة أنيقة."
"Gravitational Potential": "الجهد الجاذبي"
"When two bodies are gravitationally interacting with one another, some energy is required to separate them until the gravitational force of attraction between them becomes negligible. This energy, but for a unit mass, is defined to be the gravitational potential.": "حين يتجاذب جسمان، نحتاج طاقة لفصلهما حتى تصبح قوة الجذب بينهما مهملة. الجهد الجاذبي هو هذه الطاقة محسوبة لكل وحدة كتلة."
"The gravitational potential": "الجهد الجاذبي"
"at a point 'r' units away from a mass 'M' is defined to be -GM/r whereas the potential energy of a mass 'm' placed at this point is defined to be -GMm/r": "عند نقطة تبعد مسافة r عن كتلة M يساوي -GM/r، وطاقة الوضع لكتلة m عند هذه النقطة تساوي -GMm/r"
"The negative sign denotes that 1) energy is required to separate them or 2) the bodies are bound to each other": "الإشارة السالبة تعني أن الجسمين مرتبطان ببعضهما، وأننا نحتاج طاقة لفصلهما."
"The above formula generalises gravitational potential and potential energy for multiple bodies": "المعادلة أعلاه تعمّم فكرتي الجهد وطاقة الوضع لأكثر من جسمين."
"The total mechanical energy as a result of gravitational interaction between two objects is equal to the sum of their kinetic energy and gravitational potential energy.": "الطاقة الميكانيكية الكلية الناتجة عن تجاذب جسمين تساوي مجموع طاقة حركتهما وطاقة وضعهما الجاذبية."
"Kepler's Laws": "قوانين كبلر"
"In the 17th century, Johannes Kepler postulated three laws that were followed by orbiting planets. These laws were obtained by analysis of planetary data recorded by Tycho Brahe with the assistance of Kepler. They lacked any scientific backing when they were proposed.": "في القرن السابع عشر، وضع يوهانس كبلر ثلاثة قوانين تصف حركة الكواكب في مداراتها. توصّل إليها بتحليل بيانات رصدها تيخو براهي بمساعدة كبلر نفسه، رغم أنها لم تكن مبنية على تفسير علمي وقت اقتراحها."
"The first law states that planets revolve around their star in elliptical orbits, wherein the star is situated at one of the foci. An ellipse is the locus of a point such that the sum of their distance from two fixed points is always constant. In theory, a circle is an ellipse obtained by a merger of these two points. This law is a result of the nature of gravitational force itself.": "القانون الأول يقول إن الكواكب تدور حول نجمها في مدارات إهليلجية (بيضاوية)، والنجم يقع في إحدى بؤرتي هذا الشكل. الشكل الإهليلجي هو كل نقطة يبقى مجموع بعدها عن نقطتين ثابتتين (البؤرتين) قيمة واحدة. والدائرة نفسها حالة خاصة من الإهليلج حين تلتقي البؤرتان في نقطة واحدة. وهذا القانون نتيجة طبيعية لطبيعة قوة الجاذبية نفسها."
"The second law states that planets trace equal areas in equal intervals of time. This indirectly means that planets in non-circular orbits must move faster when closer to the star. This can be observed in the default simulation above. This law is a result of conservation of angular momentum": "القانون الثاني يقول إن الكوكب يمسح مساحات متساوية في أزمنة متساوية. ومعنى هذا أن الكوكب يتحرك أسرع كلما اقترب من النجم في مداره غير الدائري، وتراه في المحاكاة أعلاه. وهذا القانون نتيجة لثبات كمية الحركة الزاوية."
"The third law states that the square of time period of revolution of a planet around its star is directly proportional to the cube of the major axis. This law can be derived with a bit of algebra.": "القانون الثالث يقول إن مربع الزمن الذي يستغرقه الكوكب في دورة كاملة يتناسب مع مكعب نصف المحور الأطول لمداره. ويمكن اشتقاق هذا القانون بقليل من الجبر."
"General info about stellar systems": "معلومات عامة عن الأنظمة النجمية"
"It is a false notion that all planets revolve around their star. The planets and the star revolve around the center of mass of the stellar system. Due to the fact that stars tend to be much more massive than all the revolving planets combined, this center of mass often tends to be within the star and maybe very close to the center of the star, therefore giving the appearance that the planets actually revolve around the star.": "من الشائع الاعتقاد أن الكواكب تدور حول نجمها فقط، لكن الحقيقة أن الكواكب والنجم يدورون معًا حول مركز كتلة النظام كله. ولأن كتلة النجم أكبر بكثير من كل كواكبه مجتمعة، يقع هذا المركز عادة داخل النجم نفسه أو قريبًا جدًا من مركزه، فيبدو لنا أن الكواكب وحدها هي التي تدور."
"Planets are usually formed from a disk of rocks and gases found around the protostar. Since a disk is planar, all the resulting planets tend to orbit the star in the same plane, with small deviations.": "تتكوّن الكواكب عادة من قرص من الصخور والغازات يحيط بالنجم وهو ما يزال في طور التكوّن. ولأن هذا القرص مسطّح، تدور الكواكب الناتجة عنه في المستوى نفسه تقريبًا، مع اختلافات بسيطة."
"The Three Body Problem and Chaos": "مسألة الأجسام الثلاثة والفوضى"
"While Newton's laws perfectly describe the behaviour of two gravitationally attracted bodies, describing the motion of three bodies turned out to be elusive.": "قوانين نيوتن تصف بدقة حركة جسمين متجاذبين، لكن وصف حركة ثلاثة أجسام معًا أصعب بكثير مما يبدو."
"It was also noticed that a small change to the initial coordinates of velocites of a planet (in three or multi-body motion) can have a drastic change in the long-term behaviour of the system. This phenomenon is known as chaos.": "ولوحظ أيضًا أن تغييرًا صغيرًا جدًا في موقع كوكب أو سرعته في البداية (عندما يتفاعل ثلاثة أجسام أو أكثر) قد يغيّر سلوك النظام كله على المدى الطويل تغييرًا كبيرًا. هذه الظاهرة تسمى الفوضى."
"Note:": "ملاحظة:"
"The above simulation is not compatible with SI units. The value of G is taken to be 1, in order to avoid working with huge masses and astronomical distances": "هذه المحاكاة لا تستخدم وحدات SI المعتادة. جعلنا قيمة G تساوي 1 لنتجنب التعامل مع كتل ومسافات فلكية ضخمة."
"Stars and Planets in the above simulation are treated equally. This allows us to observe the wobbling of the star when the revolving planets are not many orders lighter than the star.": "تتعامل المحاكاة مع النجوم والكواكب بالطريقة نفسها، فنستطيع أن نلاحظ تمايل النجم إذا لم تكن كواكبه أخف منه بكثير."
"The above simulation doesn't check and allow collissions between bodies. Because of this, ejection of planets is a very common occurence in the simulation although it rarely takes place in reality.": "لا تتحقق المحاكاة من حدوث تصادم بين الأجسام، ولهذا قد ترى كواكب تُقذف بعيدًا بسهولة، وهو أمر نادر في الواقع."
"Additionally, the simulation uses Euler method to solve for the trajectory of the planet. This is just a first order method, and is prone to errors.": "كذلك تستخدم المحاكاة طريقة أويلر لحساب مسار الكوكب، وهي طريقة بسيطة من الدرجة الأولى قد تحمل بعض الخطأ."
