"Planetary Motion": "حركة الكواكب"
"The Universal Law of Gravitation states that every body in this universe attracts the other by virtue of its mass, The force of attraction being directly proportional to the product of their masses and inversely proportional to the square of the distance of their separation. This law was first published by Sir Isaac Newton in 1687.": "قانون الجذب العام يقول إن أي جسمين في الكون يتجاذبان بسبب كتلتيهما. وتزداد قوة هذا التجاذب كلما زادت كتلتا الجسمين، وتقل كلما زادت المسافة بينهما (وتحديدًا مربع هذه المسافة). نشر هذا القانون أول مرة السير إسحاق نيوتن سنة 1687."
