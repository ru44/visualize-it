"Lexical Analysis": "التحليل المعجمي"
"Lexical Analysis is the first step carried out during compilation. It involves breaking code into tokens and identifying their type, removing white-spaces and comments, and identifying any errors. The tokens are subsequently passed to a syntax analyser before heading to the pre-processor. This page provides a sample lexical analyser that identifies four types of tokens: numbers, text, operators and syntax and ignores white-spaces.": "التحليل المعجمي هو أول خطوة يقوم بها المترجم (compiler) عند تحويل الكود. يقسّم الكود إلى وحدات صغيرة تسمى الرموز (tokens) ويحدد نوع كل رمز، ثم يحذف الفراغات والتعليقات ويكتشف الأخطاء. بعد ذلك تنتقل هذه الرموز إلى المحلل النحوي ثم إلى المعالج المسبق. تعرض هذه الصفحة محللًا معجميًا بسيطًا يميّز أربعة أنواع من الرموز: الأرقام والنصوص والعمليات وعلامات التركيب، ويتجاهل الفراغات."
"Input": "الإدخال"
"Output": "الإخراج"
"[text: \"y\"] [operator: \"=\"] [text: \"amp\"] [operator: \"*\"] [text: \"cos\"] [syntax: \"(\"] [text: \"omega\"] [operator: \"*\"] [text: \"t\"] [operator: \"-\"] [text: \"k\"] [operator: \"*\"] [text: \"x\"] [syntax: \")\"] [syntax: \";\"]": "[text: \"y\"] [operator: \"=\"] [text: \"amp\"] [operator: \"*\"] [text: \"cos\"] [syntax: \"(\"] [text: \"omega\"] [operator: \"*\"] [text: \"t\"] [operator: \"-\"] [text: \"k\"] [operator: \"*\"] [text: \"x\"] [syntax: \")\"] [syntax: \";\"]"
"Description": "الوصف"
"While scanning a string, the lexical analyser keeps track of changes in state (number, text, operator or syntax). It keeps building up a character stack as long as the state remains the same. When the state changes, the pre-existing character stack is pushed into the <b>value stack</b> and it's type is pushed into the <b>type stack</b>. A new character stack is built up with the new state in mind. This process goes on until the entire string is scanned. A token consists of a (value, type) pair, and the lexical analyser outputs a list of these tokens. It is highly suggested that you view <a href=\"https://github.com/visualize-it/visualize-it.github.io/blob/main/lexical_analysis/lexical_analysis.js\" target=\"_blank\">lexical_analysis.js</a> (the code that runs lexical_analysis here).": "أثناء فحص النص حرفًا حرفًا، يراقب المحلل المعجمي أي تغيّر في الحالة: رقم أو نص أو عملية أو علامة تركيب. يجمع الأحرف المتشابهة فوق بعضها ما دامت الحالة نفسها مستمرة. حين تتغيّر الحالة يضع الأحرف المجمّعة في <b>مكدس القيم</b> ونوعها في <b>مكدس الأنواع</b>، ثم يبدأ مجموعة أحرف جديدة للحالة الجديدة. يستمر هذا حتى ينتهي من النص كله. كل رمز في النهاية هو زوج من (قيمة، نوع)، ويخرج المحلل المعجمي قائمة بهذه الرموز. يمكنك الاطلاع على شيفرة <a href=\"https://github.com/visualize-it/visualize-it.github.io/blob/main/lexical_analysis/lexical_analysis.js\" target=\"_blank\">lexical_analysis.js</a> نفسها لترى كيف يعمل هذا المحلل هنا."
"Note:": "ملاحظة:"
"The string data type can be scanned by triggering the string state when double-quotes (\") are encountered. The character stack of the string is built up until double-quotes (\") are encountered again.": "يدخل المحلل حالة النص حين يقابل علامة اقتباس مزدوجة (\")، ويستمر في جمع الأحرف حتى يقابل علامة اقتباس مزدوجة أخرى (\") تنهي النص."
"The syntax analyser looks for unpaired containers, adjacent neighbours that make no sense (like two number tokens next to each other) and operations that are not defined on the operands (like division of a string).": "يبحث المحلل النحوي عن أقواس بلا زوج، ورموز متجاورة لا معنى لها مثل رقمين متتاليين، وعمليات غير معرّفة على نوع المعطى مثل قسمة نص."
"The preprocessor views the text tokens and tries to associate pre-defined variables or functions with them. If none can be found, then it throws an error. If an unknown variable is to the left side of an assignment operator (=), then a new variable is created and assigned with the value on the right.": "يتفحّص المعالج المسبق رموز النص، ويحاول ربطها بمتغيرات أو دوال معرّفة مسبقًا. إن لم يجد شيئًا يطابقها أظهر خطأً. أما إن كان المتغير المجهول على يسار عملية الإسناد (=) فينشئ متغيرًا جديدًا ويعطيه القيمة الموجودة على يمينه."
