"Sorting algorithms are ubiquitous in computer science. This webpage provides a visual demonstration of some popular sorting algorithms.": "خوارزميات الفرز موجودة في كل مكان تقريبًا في علوم الحاسوب. تعرض هذه الصفحة أشهرها بصريًا لتراها وهي تعمل خطوة بخطوة."
"Visualization": "العرض المرئي"
"The height of the candles represents their numerical value. Initially, the candles are randomly distributed. You can use various sorting algorithms to put them in ascending order. Sorted sections of the list are shown in blue, whereas unsorted sections are shown in red. In divide-andconquer algorithms like quick sort and merge sort, sections of the list being ignored are colored gray. White candles convey that the iterator is at their position. Yellow candles are used to depict candles of interest, eg: the maximum number envountered <em>so far</em> during selection sort. In quick sort, the pivot candle is colored purple (and is placed at the end of the list).": "ارتفاع كل عمود يمثّل قيمته العددية. في البداية تكون الأعمدة موزعة عشوائيًا، وتستطيع اختيار خوارزمية فرز مختلفة لترتيبها تصاعديًا. يظهر الجزء المرتّب من القائمة باللون الأزرق، والجزء غير المرتّب باللون الأحمر. في خوارزميات فرّق تسد مثل الفرز السريع وفرز الدمج، يُلوَّن الجزء المتجاهَل حاليًا باللون الرمادي. العمود الأبيض يدل على موضع المؤشر الحالي، والعمود الأصفر يدل على عمود مهم، مثل أكبر رقم وُجد <em>حتى الآن</em> أثناء فرز الاختيار. وفي الفرز السريع، يُلوَّن عمود المحور بالبنفسجي ويوضع في نهاية القائمة."
