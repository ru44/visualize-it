"Description": "الوصف"
"<b>Bubble sort:</b> A simple sorting algorithm that just goes through the list comparing adjacent elements and swapping them if they are not in order. It's performance and utiity are very poor, and is primarily taught for educational purposes. It has an average time complexity of O(n<sup>2</sup>). However, if the machine performing the sort has a sizeable probability of not comparing elements properly, then bubble sort is the most fault tolerant algorithm in this list (since it makes frequent comparisons, and can detect mistakes made previously).": "<b>فرز الفقاعة:</b> خوارزمية بسيطة تمر على القائمة وتقارن كل عنصرين متجاورين، وتبدّل مكانهما إن لم يكونا بالترتيب الصحيح. أداؤها ضعيف جدًا، وتُدرَّس غالبًا لأغراض تعليمية فقط. متوسط تعقيدها الزمني O(n<sup>2</sup>). لكن إن كان الجهاز الذي يجري الفرز يخطئ أحيانًا في المقارنة، فهذه الخوارزمية هي الأكثر تحمّلًا للأخطاء بين كل ما في هذه القائمة، لأنها تكرر المقارنة كثيرًا فتكتشف الأخطاء السابقة."
"<b>Selection sort:</b> Another simple sorting algorithm. It scans all N elements, finds the largest one, and puts it at the Nth position. Then, it scans all N-1 elements, finds the largest one, puts it at the (N-1)th position, and so on. It is as worse as bubble sort, with an average time complexity of O(n<sup>2</sup>). It doesn't use the advantages from an approimately sorted list. However, it is noted for it's simplicity.": "<b>فرز الاختيار:</b> خوارزمية بسيطة أخرى. تمر على العناصر الـ N كلها وتجد أكبرها وتضعه في الموضع N، ثم تمر على العناصر الـ N-1 الباقية وتجد أكبرها وتضعه في الموضع N-1، وهكذا. أداؤها سيئ كفرز الفقاعة، بمتوسط تعقيد زمني O(n<sup>2</sup>)، ولا يستفيد من كون القائمة شبه مرتبة أصلًا. رغم ذلك تشتهر ببساطتها."
"<b>Insertion sort:</b> An algorithm that most humans likely use unconsciously to sort things. It considers the first k elements to be sorted, and figures out where the (k+1)th element should be placed within the sorted portion. Although it's time complexity is still O(n<sup>2</sup>), insertion sort has significant advantages over the last two. It is extremely good to sorting lists that are already approximately sorted, nearing a time complexity of O(n) in this case. Even if a list is already sorted, it can readily accept another element and put it in it's correct place.": "<b>فرز الإدراج:</b> خوارزمية يستخدمها معظم الناس دون أن يشعروا حين يرتبون الأشياء. تفترض أن أول k عنصر مرتبة، وتبحث عن الموضع الصحيح للعنصر رقم k+1 داخل هذا الجزء المرتب. تعقيدها الزمني ما زال O(n<sup>2</sup>)، لكنها أفضل من الخوارزميتين السابقتين بوضوح، فهي ممتازة مع القوائم شبه المرتبة أصلًا، إذ يقترب تعقيدها من O(n) في هذه الحالة. وحتى لو كانت القائمة مرتبة تمامًا، تستطيع إضافة عنصر جديد ووضعه في مكانه الصحيح بسهولة."
"<b>Cocktail Shaker sort:</b> A variation of selection sort that scans for the maximum element while going forward, and the minimum element while going backwards. It is useful for electromechanical machines that use a physical data reader to scan and sort through values sorted in a tape.": "<b>فرز الكوكتيل:</b> نسخة من فرز الاختيار تبحث عن أكبر عنصر وهي ذاهبة إلى الأمام، وعن أصغر عنصر وهي عائدة إلى الخلف. تفيد في الآلات الكهروميكانيكية التي تقرأ القيم فعليًا من شريط وتفرزها."
"<b>Heap sort:</b> A slightly complex sorting algorithm that uses a data structure called heaps. First algorithm on this list to have a time complexity of O(n log n), although it comes with a space complexity of O(n), and the only algorithm on this list to require explicit space. It is extremely good at keeping frequently updated lists sorted dynamically, an advantage conferred by the data structure that it is built on. For information on the heap data structure, please refer <a href=\"https://www.geeksforgeeks.org/heap-data-structure/\" target=\"_blank\">GeeksForGeeks</a> website.": "<b>فرز الكومة:</b> خوارزمية أعقد قليلًا تعتمد على بنية بيانات تسمى الكومة (heap). أول خوارزمية في هذه القائمة تعقيدها الزمني O(n log n)، لكنها تحتاج مساحة إضافية بتعقيد O(n)، وهي الوحيدة هنا التي تحتاج ذاكرة إضافية صراحة. تمتاز بإبقاء القوائم المتغيّرة باستمرار مرتبة بكفاءة، بفضل بنية الكومة نفسها. لمعرفة المزيد عن بنية الكومة راجع موقع <a href=\"https://www.geeksforgeeks.org/heap-data-structure/\" target=\"_blank\">GeeksForGeeks</a>."
"<b>Quick sort:</b> As the name implies, it has the fastest time complexity of O(n log n) despite not requiring any explicit memory. It randomly choses an element as a pivot, and transports all elements lower than the pivot to the left, and the elements greater than the pivot to the right of the pivot. The same operation is repeated on the portion of the list to the left and right of the pivot, recursively. Despite it's charasmatic name, it is difficult to implement, and certain choices of pivots can be disastrous on it's runtime.": "<b>الفرز السريع:</b> كما يوحي اسمه، تعقيده الزمني O(n log n) وهو الأسرع في هذه القائمة، رغم أنه لا يحتاج ذاكرة إضافية. يختار عنصرًا عشوائيًا محورًا (pivot)، وينقل كل عنصر أصغر منه إلى يساره وكل عنصر أكبر منه إلى يمينه. تتكرر العملية نفسها على الجزأين يمين المحور ويساره. رغم اسمه اللافت، تنفيذه صعب، واختيار محور سيئ قد يبطئه كثيرًا."
"<b>Merge sort:</b> The industrial standard for sorting huge lists. It recursively divides the list into smaller lists, sorts the smaller ones and merges them in the right way. It always has a time complexity of O(n log n). A merge sort routine with multithreading support can sort billions of numbers in no time. However, it uses some auxillary memory while merging, and is really difficult to implement.": "<b>فرز الدمج:</b> المعيار المعتمد صناعيًا لفرز القوائم الضخمة. يقسّم القائمة إلى قوائم أصغر فأصغر، ثم يفرز كل جزء صغير ويدمج الأجزاء بالترتيب الصحيح. تعقيده الزمني ثابت دائمًا عند O(n log n)، وبدعم تعدد الخيوط يستطيع فرز مليارات الأرقام في وقت قصير جدًا. لكنه يحتاج ذاكرة إضافية أثناء الدمج، وتنفيذه صعب فعلًا."
