adhoc.limit.title: Limit explorer
adhoc.limit.summary: Slide the two dots toward the target and watch where the values are heading.
adhoc.limit.param: distance from {a}
adhoc.limit.var: the input, moving toward {a} from both sides
adhoc.limit.intuition: Pull the two dots toward the dashed line. A limit asks where the values are heading — not what happens exactly at the point. If the two sides head to different places, or run off the chart, there is no limit.
adhoc.limit.formal: '$\lim_{x \to a} f(x) = L$ means: for every $\varepsilon > 0$ there is a $\delta > 0$ with $0 < |x - a| < \delta \Rightarrow |f(x) - L| < \varepsilon$.'
adhoc.integral.title: Integral explorer
adhoc.integral.summary: Cover the area with rectangles, then use more and more of them until the total stops changing.
adhoc.integral.n: number of rectangles
adhoc.integral.a: start a
adhoc.integral.b: end b
adhoc.integral.var1: where the adding-up starts and stops
adhoc.integral.var2: the width of one thin slice
adhoc.integral.intuition: 'Each rectangle is height × width — one small piece of the total. Add more rectangles and compare “sum of rectangles” with “integral”: the gap melts away. Parts below the axis count as negative.'
adhoc.integral.formal: $\int_a^b f(x)\,dx = \lim_{n \to \infty} \sum_{i=1}^{n} f(x_i^*)\,\Delta x$.
adhoc.fn.title: Function explorer
adhoc.fn.dtitle: Derivative explorer
adhoc.fn.summary: Drag the point along the curve. The orange line shows how steep the curve is right there; the dashed curve collects all those steepness values.
adhoc.fn.param: point x
adhoc.fn.var1: the curve (solid line)
adhoc.fn.var2: its steepness at each x (dashed line)
adhoc.fn.intuition: Where the curve climbs, the orange line tilts up and the dashed curve is above zero. At the top of a hill or the bottom of a valley the line is flat and the dashed curve crosses zero. Steeper curve, bigger value.
adhoc.fn.formal: $f'(x) = \lim_{h \to 0} \dfrac{f(x+h) - f(x)}{h}$.
adhoc.surface.title: Surface explorer
adhoc.surface.summary: A rule with two inputs makes a landscape. Turn it around, move the point, and read how steep it is in each direction.
adhoc.surface.x: point x
adhoc.surface.y: point y
adhoc.surface.var1: steepness if you walk in the x direction only
adhoc.surface.var2: steepness if you walk in the y direction only
adhoc.surface.var3: the arrow on the floor — it points straight uphill
adhoc.surface.intuition: The orange tile is the flat surface that best matches the landscape at your point. The arrow on the floor points in the steepest uphill direction; the longer it is, the steeper the climb. Where it vanishes you are on a peak, in a pit, or on a saddle.
adhoc.surface.formal: $\nabla f = (f_x, f_y)$; the slope in direction $\mathbf{u}$ is $\nabla f \cdot \mathbf{u}$.
adhoc.solve.title: Equation solver
adhoc.solve.summary: Solving means finding the x where both sides are equal — where “left side minus right side” is zero.
adhoc.solve.param: try a value of x
adhoc.solve.var: the unknown — drag it until “left − right” reads 0
adhoc.solve.intuition: 'The curve shows left side minus right side. Drag the point: wherever the value is zero, the two sides are equal and you have found a solution. The steps beside it reach the same place without guessing.'
adhoc.solve.formal: Each step does the same thing to both sides, so the solutions never change. $f(x) = g(x) \iff f(x) - g(x) = 0$.
trust.exact: Exact
trust.numeric: Numerical
trust.warning: Careful
trust.derivExact: The derivative was worked out symbolically (exact) and double-checked numerically at several points.
trust.derivNumeric: No symbolic derivative was found, so the slope is measured numerically from the curve. It is accurate to about 6 digits.
trust.derivMismatch: The symbolic derivative did not agree with a numerical check, so the slope shown is the measured one.
trust.limitFinite: 'Both sides approach the same value. Computed numerically by extrapolation; reliable to about {d} decimal places: {v}.'
trust.limitInf: 'The values grow without bound on both sides: the limit is {v}.'
trust.limitDne: 'The limit does not exist: from the left the values head to {l}, from the right to {r}.'
trust.limitUnknown: The values do not settle down (they may oscillate), so no limit is reported rather than a guess.
trust.intExact: 'Exact value, from integrating the polynomial term by term with fractions: {v}.'
trust.intNumeric: 'Computed numerically (Simpson’s rule at three resolutions). Reliable to about {d} decimal places: {v}.'
trust.intSingular: The function is undefined near x = {x} inside this interval, so this is an improper integral and may have no finite value. No number is reported.
trust.intUnreliable: The numerical methods disagree with each other here (the function is too wild in this interval). Treat {v} as a rough estimate only.
trust.solveExact: Solved exactly by algebra. Every solution was substituted back into the original equation to confirm it.
trust.solvePoly: All real solutions of this polynomial were found numerically and each was substituted back to confirm it (error below 0.00000001).
trust.solveNumeric: Found numerically by searching −50 ≤ x ≤ 50; each solution was substituted back to confirm it. Solutions outside that range are not listed.
trust.solveNone: No real solution exists.
trust.solveNoneRange: No solution was found for −50 ≤ x ≤ 50.
trust.surface: Slopes are measured numerically from the surface (accurate to about 6 digits).
solve.start: 'The question: for which $x$ are both sides equal?'
solve.always: 'The $x$ terms cancel and what remains is always true: every $x$ is a solution.'
solve.never: 'The $x$ terms cancel and what remains is false: no $x$ works.'
solve.moveX: Subtract ${term}$ from both sides so that $x$ is only on the left.
solve.sub: Subtract ${k}$ from both sides. A balance stays level if you do the same to both pans.
solve.add: Add ${k}$ to both sides. A balance stays level if you do the same to both pans.
solve.divide: Divide both sides by ${k}$ to leave $x$ alone.
solve.done: Nothing left to undo.
solve.check: 'Put the answer back into the original equation: both sides agree.'
solve.standard: Move everything to one side. Solutions are where this curve touches the axis.
solve.disc: 'The discriminant counts the solutions: positive → two, zero → one, negative → none.'
solve.noReal: The curve never reaches the axis — look at the graph. (The solutions are complex numbers.)
solve.formula: 'The quadratic formula: completing the square, done once for every quadratic.'
solve.roots: Both are marked on the graph where the curve meets the axis.
solve.rootsCheck: 'Checked by substituting back: left − right = 0 (to within rounding).'
solve.polyStd: 'Move everything to one side: a polynomial of degree {n}.'
solve.polyRoots: A polynomial of degree {n} has at most {n} real solutions. All of them were located numerically and confirmed.
solve.numStd: Move everything to one side. There is no general algebraic recipe here, so the crossings are located numerically.
solve.numRoots: Found by trapping each crossing between two inputs and halving the gap until it closes.
solve.none: no real solution
