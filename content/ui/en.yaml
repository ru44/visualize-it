adhoc.count.title: Counting explorer
adhoc.count.summary: How many ways? Exact answer, and every arrangement drawn while there are few enough to show.
adhoc.count.n: n — items to choose from
adhoc.count.k: k — how many to pick
adhoc.count.varn: how many different items there are
adhoc.count.vark: how many of them you pick
adhoc.count.intuitionP: 'Picking k items one after another: n choices for the first, n − 1 for the second, and so on. Because the order counts, (1,2) and (2,1) are listed separately.'
adhoc.count.intuitionC: Pick k items when only the group matters. Every group of k appears k! times among the ordered arrangements, so divide by k! to count each group once.
adhoc.count.intuitionF: 'n! is the number of ways to line up all n items: n choices for the first place, n − 1 for the next, down to 1.'
adhoc.count.formal: $P(n,k) = \dfrac{n!}{(n-k)!}$, $\;C(n,k) = \dbinom{n}{k} = \dfrac{n!}{k!\,(n-k)!}$.
trust.countExact: Computed with exact integer arithmetic (no rounding), so every digit is correct.
count.tooMany: too many to draw
