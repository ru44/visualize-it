cell.hint: slide E⁰, n and Q — the voltmeter follows the Nernst equation live
cell.volts: voltmeter
cell.dead: dead battery — equilibrium
cell.anode: anode (−) · e.g. Zn
cell.anodeNote: metal dissolves, electrons leave
cell.cathode: cathode (+) · e.g. Cu
