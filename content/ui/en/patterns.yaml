pat.lesson.title: The five rules behind pattern puzzles
pat.lesson.lead: Most grid puzzles of this kind, in this test and in printed matrix tests, are built from the same five rules. Once you can spot them, the puzzles stop looking random.
pat.lesson.yours: From your test
pat.lesson.weakest: Start here
pat.lesson.takeFirst: Take the test first, and this lesson will start with the rules you found hardest.
pat.lesson.method.t: A method for any puzzle
pat.lesson.method.1: Look at the top row only. List what changes from left to right — shape, number, colour, size, direction, lines.
pat.lesson.method.2: For each thing that changes, ask which of the five rules it follows.
pat.lesson.method.3: Check every rule on the middle row. A rule that fails there is the wrong rule.
pat.lesson.method.4: Build the missing picture in your head first. Then look at the options and cross out every one that breaks a rule.
pat.lesson.constant.idea: One thing stays exactly the same along a row. Every picture in the row has the same shape, or the same colour. Another row may use a different value, but it keeps that value all the way along too.
pat.lesson.constant.spot: Easy to see and easy to forget. When the other rules are hard, check that your answer still keeps what never changes.
pat.lesson.progression.idea: Something grows or shrinks by the same step from one picture to the next. Two dots, four dots, six dots. An arrow that turns an eighth of a turn each time. A shape that gains one side.
pat.lesson.progression.spot: Compare neighbours. If the change from the first picture to the second is the same as the change from the second to the third, it is a progression.
pat.lesson.distribution.idea: Each row uses the same three values, once each, in a different order. A circle, a triangle and a square in every row, and never two of the same in one row.
pat.lesson.distribution.spot: Ask what the bottom row is still missing. If it already has a circle and a triangle, the answer has the square.
pat.lesson.combine.idea: The third picture is made from the first two. Add the shapes up, take the second away from the first, or lay one picture over the other and keep everything.
pat.lesson.combine.spot: Count, or lay the first two pictures over each other in your head. Then compare what you get with the third.
pat.lesson.xor.idea: Lay the first two pictures over each other. Whatever they share disappears. Whatever appears in only one of them stays.
pat.lesson.xor.spot: The trap is to keep everything. If a line is in both of the first two pictures but missing from the third, the shared parts are cancelling out.
pat.lesson.example: Worked example
pat.lesson.step1: Start with the top row. What changes from left to right?
pat.lesson.step2: 'The same rules work on the middle row. Rules in this puzzle: {list}.'
pat.lesson.step3: Use the rules on the bottom row to build the missing picture.
pat.lesson.next: Next step
pat.lesson.again: Start over
pat.lesson.yourTurn: Your turn
pat.lesson.right: Right.
pat.lesson.wrong: Not this one. Look again, or see why.
pat.lesson.why: Show why
pat.lesson.traps.t: Four traps
pat.lesson.traps.1: Looking at the options first. They are built to look right, and each wrong one breaks only one or two rules.
pat.lesson.traps.2: Checking one row only. A rule that fits the top row can fail on the middle one.
pat.lesson.traps.3: Following one feature. Many puzzles run two or three rules at once, on the shape and the number and the colour.
pat.lesson.traps.4: Keeping lines that should cancel. When a line is in both of the first two pictures, check whether it survives in the third.
pat.lesson.origin.t: Where the five rules come from
pat.lesson.origin.d: In 1990 the psychologists Patricia Carpenter, Marcel Just and Peter Shell studied how people solve Raven's Progressive Matrices, the best-known puzzle test of this kind. They found that its puzzles can be described with just five kinds of rule — the five on this page. This test uses those rules with new pictures. Every wrong option differs from the right one in one, two or three features, so you cannot find the answer from the options alone.
