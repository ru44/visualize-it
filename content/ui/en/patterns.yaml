pat.title: Pattern reasoning test
pat.kicker: 60 puzzles · IQ-style matrices · anonymous
pat.lead: Each puzzle is a grid of nine pictures with the last one missing. Find the rules that run along the rows, then pick the picture that completes the grid.
pat.fact.items: 60 puzzles in 5 sets of 12, from easy to hard — the length of a full printed matrix test.
pat.fact.time: No time limit. Plan on about 40 minutes; the clock is only there so you can see your pace.
pat.fact.skip: Skip any puzzle and come back to it before you finish.
pat.fact.after: At the end you get your score, a rough IQ estimate, every answer explained, and a lesson that starts with the rules you missed.
pat.private.t: Fully anonymous
pat.private.d: No name, no account, no tracking. The test runs entirely in your browser. Your answers never leave this device, and they are erased when you close this tab.
pat.lessonFirst: Rather learn first? Read the five rules
pat.how.t: How to read a puzzle
pat.how.d: Read each row from left to right. Something changes along it — the shape, the number, the colour, the size, the lines. Find the rule in the top two rows, then use it to build the missing picture before you look at the options.
