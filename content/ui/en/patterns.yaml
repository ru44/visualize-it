pat.why.same: '{attr} is the same in every picture ({v}), so the answer has it too.'
pat.why.row: '{attr} stays the same along each row, so the bottom row keeps it ({v}).'
pat.why.step: '{attr} changes by the same step along each row: {a}, then {b}, so next comes {c}.'
pat.why.sidesUp: 'Each step along a row adds one side: {a}, then {b}, so next comes {c}.'
pat.why.sidesDown: 'Each step along a row takes away one side: {a}, then {b}, so next comes {c}.'
pat.why.turn: 'The arrow turns {deg}° {dir} at every step: {a}, then {b}, so next comes {c}.'
pat.why.move: 'The dot moves {k|one=one place|other=# places} {dir} round the edge at every step, so after {b} comes {c}.'
pat.cw: clockwise
pat.ccw: anticlockwise
pat.why.each: '{attr} takes three values in every row, each once: {x}, {y} and {z}. The bottom row already has {a} and {b}, so the missing one is {c}.'
pat.why.add: 'In each row, the number of shapes in the third picture is the first two added: {sum}.'
pat.why.sub: 'In each row, take the second number away from the first: {sum}.'
pat.why.set.const: Each row repeats the same picture.
pat.why.set.dist3: Every row shows the same three pictures, each once. The bottom row is missing the one it has not used yet.
pat.why.set.or: Lay the first two pictures of a row over each other. The third keeps everything from both.
pat.why.set.diff: Start from the first picture and take away everything the second one shows. What is left is the third.
pat.why.set.xor: Lay the first two pictures over each other. What they share disappears, and what appears in only one of them stays.

