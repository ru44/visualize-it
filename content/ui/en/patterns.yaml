pat.res.iq.t: How rough is this number?
pat.res.iq.d: A real IQ compares you with thousands of people your age who took the same test. Nobody has done that for this test yet, so we borrow the usual pattern of 60-puzzle matrix tests. We assume an average adult gets about 42 right, and two adults in three land within about 8 of that. Treat the number as a starting point, not a verdict. It assumes you are 16 or older, and taking the same version again runs high because you have seen its puzzles, so retake with another version. Your score out of 60 and your rule-by-rule results are exact.
pat.res.grow: Scores on puzzles like these rise with practice. Your lesson starts with the rules you missed most.
