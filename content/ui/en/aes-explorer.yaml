aes.what1: Every byte is swapped for another from a fixed table of 256 entries, the S-box.
aes.what2: Row 0 stays put, row 1 slides 1 place left, row 2 slides 2 and row 3 slides 3. A byte that falls off the left end comes back on the right.
aes.what3: Each column is multiplied by a fixed 4×4 matrix, so every byte of the column changes all four.
aes.what3last: The last round skips this step, so nothing changes here.
aes.what4: Every byte is XORed with the byte in the same place of this round's key.
aes.click: Click any byte to see how it was made.
