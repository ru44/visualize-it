adhoc.limit.title: مستكشف النهايات
adhoc.limit.summary: حرّك النقطتين نحو الهدف وراقب إلى أين تتّجه القيم.
adhoc.limit.param: البعد عن {a}
adhoc.limit.var: المُدخل، يقترب من {a} من الجهتين
adhoc.limit.intuition: اسحب النقطتين نحو الخط المتقطّع. تسأل النهاية إلى أين تتّجه القيم، لا ماذا يحدث عند النقطة نفسها. وإذا اتّجه الجانبان إلى مكانين مختلفين، أو خرجت القيم عن الرسم، فلا نهاية موجودة.
adhoc.limit.formal: '$\lim_{x \to a} f(x) = L$ تعني: لكل $\varepsilon > 0$ يوجد $\delta > 0$ بحيث $0 < |x - a| < \delta \Rightarrow |f(x) - L| < \varepsilon$.'
adhoc.integral.title: مستكشف التكامل
adhoc.integral.summary: غطِّ المساحة بمستطيلات، ثم زِد عددها حتى يتوقّف المجموع عن التغيّر.
adhoc.integral.n: عدد المستطيلات
adhoc.integral.a: البداية a
adhoc.integral.b: النهاية b
adhoc.integral.var1: أين يبدأ الجمع وأين ينتهي
adhoc.integral.var2: عرض شريحة رفيعة واحدة
adhoc.integral.intuition: كل مستطيل ارتفاع × عرض، أي قطعة صغيرة من المجموع. زِد عدد المستطيلات وقارن «مجموع المستطيلات» بـ«التكامل»، وسترى الفرق يتلاشى. الأجزاء التي تحت المحور نحسبها سالبة.
adhoc.integral.formal: $\int_a^b f(x)\,dx = \lim_{n \to \infty} \sum_{i=1}^{n} f(x_i^*)\,\Delta x$.
adhoc.fn.title: مستكشف الدوال
adhoc.fn.dtitle: مستكشف المشتقات
adhoc.fn.summary: اسحب النقطة على المنحنى. الخط البرتقالي يبيّن مدى انحدار المنحنى عندها، والمنحنى المتقطّع يجمع قيم الانحدار كلها.
adhoc.fn.param: النقطة x
adhoc.fn.var1: المنحنى (الخط المتّصل)
adhoc.fn.var2: انحداره عند كل x (الخط المتقطّع)
adhoc.fn.intuition: حيث يصعد المنحنى يميل الخط البرتقالي إلى الأعلى ويكون المنحنى المتقطّع فوق الصفر. عند قمة التل أو قاع الوادي يصبح الخط أفقيًا ويقطع المنحنى المتقطّع الصفر. كلما زاد الانحدار كبرت القيمة.
adhoc.fn.formal: $f'(x) = \lim_{h \to 0} \dfrac{f(x+h) - f(x)}{h}$.
adhoc.surface.title: مستكشف السطوح
adhoc.surface.summary: القاعدة ذات المُدخلين ترسم تضاريس. أدِرها، وحرّك النقطة، واقرأ الانحدار في كل اتجاه.
adhoc.surface.x: النقطة x
adhoc.surface.y: النقطة y
adhoc.surface.var1: الانحدار إذا مشيت في اتجاه x فقط
adhoc.surface.var2: الانحدار إذا مشيت في اتجاه y فقط
adhoc.surface.var3: السهم على الأرضية، ويشير إلى أشدّ صعود
adhoc.surface.intuition: البلاطة البرتقالية هي السطح المستوي الأقرب إلى التضاريس عند نقطتك. السهم على الأرضية يشير إلى اتجاه أشدّ صعود، وكلما طال كان الصعود أشدّ. حيث يختفي السهم فأنت على قمة أو في قاع أو عند نقطة سرج.
adhoc.surface.formal: $\nabla f = (f_x, f_y)$؛ والميل في الاتجاه $\mathbf{u}$ هو $\nabla f \cdot \mathbf{u}$.
adhoc.solve.title: حلّ المعادلات
adhoc.solve.summary: الحلّ هو إيجاد قيمة x التي يتساوى عندها الطرفان، أي حيث «الطرف الأيسر ناقص الأيمن» يساوي صفرًا.
adhoc.solve.param: جرّب قيمة لـ x
adhoc.solve.var: 'المجهول: اسحبه حتى تصبح قيمة «الأيسر − الأيمن» صفرًا'
adhoc.solve.intuition: يمثّل المنحنى الطرف الأيسر ناقص الطرف الأيمن. اسحب النقطة، وحيثما كانت القيمة صفرًا يتساوى الطرفان وتكون قد وجدت حلًّا. والخطوات المجاورة تصل إلى النتيجة نفسها دون تخمين.
adhoc.solve.formal: كل خطوة تُجري العملية نفسها على الطرفين، فلا تتغيّر الحلول. $f(x) = g(x) \iff f(x) - g(x) = 0$.
trust.exact: دقيق تمامًا
trust.numeric: عددي
trust.warning: انتبه
trust.derivExact: نحسب المشتقة رمزيًا (بدقة تامة) ثم نتحقّق منها عدديًا عند عدة نقاط.
trust.derivNumeric: لا توجد مشتقة رمزية، لذلك نقيس الميل عدديًا من المنحنى بدقة نحو 6 خانات.
trust.derivMismatch: لم تتّفق المشتقة الرمزية مع التحقّق العددي، لذلك نعرض الميل المقيس.
trust.limitFinite: يقترب الجانبان من القيمة نفسها. حسبناها عدديًا بالاستكمال، وهي موثوقة حتى نحو {d} خانات عشرية، والقيمة {v}.
trust.limitInf: تكبر القيم بلا حدّ من الجانبين، فالنهاية {v}.
trust.limitDne: لا نهاية هنا، فمن اليسار تتّجه القيم إلى {l}، ومن اليمين إلى {r}.
trust.limitUnknown: القيم لا تستقرّ (ربما تتذبذب)، لذلك لا نعرض نهاية بدل أن نخمّن.
trust.intExact: حسبنا قيمة دقيقة تمامًا بتكامل كثيرة الحدود حدًّا حدًّا بالكسور، وهي {v}.
trust.intNumeric: حسبناه عدديًا (قاعدة سمبسون بثلاث دقّات)، وهو موثوق حتى نحو {d} خانات عشرية، والقيمة {v}.
trust.intSingular: الدالة غير معرّفة قرب x = {x} داخل هذه الفترة، فهذا تكامل معتلّ وقد لا تكون له قيمة محدودة. لذلك لا نعرض رقمًا.
trust.intUnreliable: الطرق العددية لا تتّفق فيما بينها هنا (الدالة شديدة التقلّب في هذه الفترة). اعتبر {v} تقديرًا تقريبيًا فقط.
trust.solveExact: حللناها جبريًا بدقة تامة، وعوّضنا كل حلّ في المعادلة الأصلية للتأكّد منه.
trust.solvePoly: وجدنا كل الحلول الحقيقية لكثيرة الحدود عدديًا، وعوّضنا كل حلّ للتأكّد منه (بخطأ أقل من 0.00000001).
trust.solveNumeric: وجدناها عدديًا بالبحث في المجال −50 ≤ x ≤ 50، وعوّضنا كل حلّ للتأكّد منه. الحلول خارج هذا المجال غير مُدرجة هنا.
trust.solveNone: لا يوجد حلّ حقيقي.
trust.solveNoneRange: لم نعثر على حلّ في المجال −50 ≤ x ≤ 50.
trust.surface: نقيس الميول عدديًا من السطح، بدقة نحو 6 خانات.
solve.start: عند أي قيمة لـ $x$ يتساوى الطرفان؟
solve.always: تختصر حدود $x$ ويبقى ما هو صحيح دائمًا، فكل قيمة لـ $x$ حلّ.
solve.never: تختصر حدود $x$ ويبقى ما هو خاطئ دائمًا، فلا قيمة لـ $x$ تحقّق المعادلة.
solve.moveX: اطرح ${term}$ من الطرفين ليبقى $x$ في الطرف الأيسر فقط.
solve.sub: اطرح ${k}$ من الطرفين. يبقى الميزان متوازنًا إذا فعلت الشيء نفسه في الكفّتين.
solve.add: أضِف ${k}$ إلى الطرفين. يبقى الميزان متوازنًا إذا فعلت الشيء نفسه في الكفّتين.
solve.divide: اقسم الطرفين على ${k}$ ليبقى $x$ وحده.
solve.done: لم يبقَ ما نُزيله.
solve.check: عوِّض الجواب في المعادلة الأصلية وسترى الطرفين متساويين.
solve.standard: انقل كل شيء إلى طرف واحد. الحلول هي حيث يلمس هذا المنحنى المحور.
solve.disc: 'يحدّد المميّز عدد الحلول: موجب ← حلّان، صفر ← حلّ واحد، سالب ← لا حلّ.'
solve.noReal: المنحنى لا يصل إلى المحور أبدًا، كما ترى في الرسم. (الحلول أعداد مركّبة.)
solve.formula: القانون العام للمعادلة التربيعية يكمل المربع مرة واحدة، فيصلح لكل المعادلات التربيعية.
solve.roots: يظهر كلاهما على الرسم حيث يلتقي المنحنى بالمحور.
solve.rootsCheck: تحقّقنا بالتعويض، فالأيسر − الأيمن = 0 (ضمن حدود التقريب).
solve.polyStd: انقل كل شيء إلى طرف واحد فتحصل على كثيرة حدود من الدرجة {n}.
solve.polyRoots: لكثيرة الحدود من الدرجة {n} حلول حقيقية {n} على الأكثر. وجدناها جميعًا عدديًا وتحقّقنا منها.
solve.numStd: انقل كل شيء إلى طرف واحد. لا وصفة جبرية عامة هنا، لذلك نحدّد نقاط التقاطع عدديًا.
solve.numRoots: نجدها بحصر كل تقاطع بين قيمتين ثم تنصيف الفجوة حتى تنغلق.
solve.none: لا يوجد حلّ حقيقي
