adhoc.count.title: مستكشف العدّ
adhoc.count.summary: بكم طريقة؟ إجابة دقيقة تمامًا، مع رسم كل الترتيبات ما دام عددها قليلًا.
adhoc.count.n: n — عدد العناصر المتاحة
adhoc.count.k: k — عدد ما نختاره
adhoc.count.varn: عدد العناصر المختلفة
adhoc.count.vark: عدد ما تختاره منها
adhoc.count.intuitionP: اختر k عنصرًا واحدًا بعد الآخر، n خيارًا للأول وn − 1 للثاني وهكذا. ولأن الترتيب مهم نعدّ (1,2) و(2,1) منفصلين.
adhoc.count.intuitionC: اختر k عنصرًا عندما تهمّك المجموعة فقط. كل مجموعة من k تظهر k! مرة بين الترتيبات، لذلك نقسم على k! لنعدّ كل مجموعة مرة واحدة.
adhoc.count.intuitionF: n! هو عدد طرق رصّ كل العناصر الـ n في صف، n خيارًا للمكان الأول وn − 1 للثاني حتى نصل إلى 1.
adhoc.count.formal: $P(n,k) = \dfrac{n!}{(n-k)!}$، $\;C(n,k) = \dbinom{n}{k} = \dfrac{n!}{k!\,(n-k)!}$.
