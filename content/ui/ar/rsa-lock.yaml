rsa.hint: حرّك p وq وm — بوب يصنع القفل، وأليس تُطبقه
rsa.alice: أليس
rsa.bob: بوب
rsa.message: الرسالة
rsa.public: المفتاح العلني
rsa.private: المفتاح الخاص
rsa.publishes: بوب ينشر القفل المفتوح (n, e)
rsa.eve: 'ترى إيف n = {n} وe = {e} وc = {c} — ولكي تفتح القفل عليها تحليل n إلى عامليه'
rsa.samePrime: يجب أن يكون p وq عددين أوليين مختلفين — n = p² يسهل تحليله فورًا
rsa.tooSmall: هذان العددان أصغر من أن يصنعا مفتاحًا صالحًا
rsa.msgTooBig: يجب أن تبقى m أصغر من n
rsa.factor: 'السر كله أن تفكيك {n} = p × q إلى عامليه شبه مستحيل بالأحجام الحقيقية (617 خانة لا 3)'
