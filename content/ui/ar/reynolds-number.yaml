re.hint: ▶ غيّر L و v معًا — يبقى الجسم في الرسم بالحجم نفسه، ويتغيّر شكل الأثر خلفه فقط
re.regime: نوع الانسياب
re.laminar: انسياب طبقي، أثر منتظم
