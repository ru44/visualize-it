lpf.hint: ارفع تردد الدخل فوق القطع — تنعصر الموجة في عبورها أصغر فأصغر
lpf.in: 'الدخل: تأرجح كامل عند {f} هرتز'
lpf.out: 'الخرج: {h}% من التأرجح'
lpf.box: مرشّح ترددات منخفضة
lpf.corner: f = f_c — ركن الـ−3 ديسيبل، ينجو 71% من التأرجح
lpf.note: المرشّح لا يقطع أبدًا — بل يخفت، 20 ديسيبل لكل ×10 في التردد
lpf.caption: الجهير يعبر الجدار والحاد يضيع — كل جدار ومفتاح نغمة ودارة تنعيم هي هذا الصندوق
