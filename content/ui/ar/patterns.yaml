pat.lesson.title: القواعد الخمس وراء ألغاز الأنماط
pat.lesson.lead: معظم ألغاز الشبكات من هذا النوع، في هذا الاختبار وفي اختبارات المصفوفات المطبوعة، مبنية على القواعد الخمس نفسها. حين تتعلم أن تراها، لن تبدو لك الألغاز عشوائية بعد ذلك.
pat.lesson.yours: من اختبارك
pat.lesson.weakest: ابدأ من هنا
pat.lesson.takeFirst: أدِّ الاختبار أولًا، فيبدأ هذا الدرس بالقواعد التي وجدتها أصعب.
pat.lesson.method.t: طريقة تنفع مع كل لغز
pat.lesson.method.1: انظر إلى الصف الأول وحده. حدّد ما يتغير من اليسار إلى اليمين، كالشكل والعدد واللون والحجم والاتجاه والخطوط.
pat.lesson.method.2: اسأل عن كل شيء يتغير، أي القواعد الخمس يتبع؟
pat.lesson.method.3: جرّب كل قاعدة على الصف الثاني. القاعدة التي تفشل هناك قاعدة خاطئة.
pat.lesson.method.4: ابنِ الصورة الناقصة في ذهنك أولًا. ثم انظر إلى الخيارات، واشطب كل خيار يكسر قاعدة.
pat.lesson.constant.idea: شيء واحد يبقى كما هو تمامًا على طول الصف. كل صور الصف لها الشكل نفسه، أو اللون نفسه. قد يأخذ صف آخر قيمة مختلفة، لكنه يحافظ عليها هو أيضًا حتى آخره.
pat.lesson.constant.spot: تراها بسهولة وتنساها بسهولة. حين تصعب القواعد الأخرى، تأكد أن جوابك ما زال يحفظ ما لا يتغير.
pat.lesson.progression.idea: شيء يكبر أو يصغر بالخطوة نفسها من صورة إلى التي تليها. نقطتان، ثم أربع، ثم ست. سهم يدور ثُمن دورة في كل مرة. شكل يزيد ضلعًا.
pat.lesson.progression.spot: قارن كل صورة بجارتها. إن كان التغير من الأولى إلى الثانية مثل التغير من الثانية إلى الثالثة، فهذا تدرّج.
pat.lesson.distribution.idea: كل صف يستعمل القيم الثلاث نفسها، كل واحدة مرة، بترتيب مختلف. دائرة ومثلث ومربع في كل صف، ولا يتكرر شكل في الصف الواحد.
pat.lesson.distribution.spot: اسأل ماذا ينقص الصف الأخير. إن كان فيه دائرة ومثلث، ففي الجواب المربع.
pat.lesson.combine.idea: الصورة الثالثة مصنوعة من الأوليين. اجمع الأشكال، أو اطرح الثانية من الأولى، أو ضع إحداهما فوق الأخرى واحتفظ بكل شيء.
pat.lesson.combine.spot: عُدّ، أو ضع الصورتين الأوليين فوق بعضهما في ذهنك. ثم قارن ما تحصل عليه بالصورة الثالثة.
pat.lesson.xor.idea: ضع الصورتين الأوليين فوق بعضهما. ما تشتركان فيه يختفي. وما يظهر في واحدة منهما فقط يبقى.
pat.lesson.xor.spot: الفخ أن تحتفظ بكل شيء. إن ظهر خط في الصورتين الأوليين معًا ثم غاب عن الثالثة، فالأجزاء المشتركة تمحو بعضها.
pat.lesson.example: مثال محلول
pat.lesson.step1: ابدأ بالصف الأول. ما الذي يتغير من اليسار إلى اليمين؟
pat.lesson.step2: 'القواعد نفسها تصح على الصف الثاني. القواعد في هذا اللغز: {list}.'
pat.lesson.step3: طبّق القواعد على الصف الأخير، وابنِ بها الصورة الناقصة.
pat.lesson.next: الخطوة التالية
pat.lesson.again: من البداية
pat.lesson.yourTurn: دورك
pat.lesson.right: صحيح.
pat.lesson.wrong: ليس هذا. انظر مرة أخرى، أو اعرض الشرح.
pat.lesson.why: اعرض الشرح
pat.lesson.traps.t: أربعة فخاخ
pat.lesson.traps.1: أن تنظر إلى الخيارات أولًا. صُمّمت لتبدو صحيحة، وكل خيار خاطئ يكسر قاعدة أو قاعدتين فقط.
pat.lesson.traps.2: أن تتحقق من صف واحد. القاعدة التي تناسب الصف الأول قد تفشل في الثاني.
pat.lesson.traps.3: أن تتبع شيئًا واحدًا. في ألغاز كثيرة قاعدتان أو ثلاث معًا، على الشكل والعدد واللون.
pat.lesson.traps.4: أن تُبقي خطوطًا كان يجب أن تختفي. حين يظهر خط في الصورتين الأوليين معًا، تحقق هل يبقى في الثالثة.
pat.lesson.origin.t: من أين جاءت القواعد الخمس
pat.lesson.origin.d: في عام 1990 درس علماء النفس باتريشيا كاربنتر ومارسيل جست وبيتر شيل كيف يحل الناس مصفوفات رافن المتتابعة، وهي أشهر اختبار ألغاز من هذا النوع. ووجدوا أن ألغازه تُوصف بخمسة أنواع من القواعد فقط، وهي الخمس التي في هذه الصفحة. يستعمل هذا الاختبار تلك القواعد بصور جديدة. ويختلف كل خيار خاطئ عن الصحيح في صفة أو صفتين أو ثلاث، فلا تستطيع أن تعرف الجواب من الخيارات وحدها.
pat.lesson.retake: أدِّ الاختبار
pat.lesson.back: عُد إلى نتيجتي

