pat.title: اختبار التفكير بالأنماط
pat.kicker: 60 لغزًا · مصفوفات على طريقة اختبارات الذكاء · بلا اسم
pat.lead: كل لغز شبكة من تسع صور، والصورة الأخيرة ناقصة. اكتشف القواعد التي تسير عليها الصفوف، ثم اختر الصورة التي تكمل الشبكة.
pat.fact.items: 60 لغزًا في 5 مجموعات، في كل مجموعة 12 لغزًا، من السهل إلى الصعب. هذا طول اختبار المصفوفات المطبوع كاملًا.
pat.fact.time: لا حدّ للوقت. خصّص له نحو 40 دقيقة، والساعة أمامك لتعرف سرعتك فقط.
pat.fact.skip: تستطيع أن تتخطى أي لغز، ثم تعود إليه قبل أن تنهي الاختبار.
pat.fact.after: في النهاية تعرف درجتك وتقديرًا تقريبيًا لنسبة ذكائك، وتقرأ شرح كل جواب، وتحصل على درس يبدأ بالقواعد التي فاتتك.
pat.private.t: بلا هوية تمامًا
pat.private.d: لا اسم، ولا حساب، ولا تتبّع. يعمل الاختبار كله داخل متصفحك. لا تغادر إجاباتك جهازك أبدًا، وتُمحى حين تغلق هذا التبويب.
pat.lessonFirst: تفضّل أن تتعلم أولًا؟ اقرأ القواعد الخمس
pat.how.t: كيف تقرأ اللغز
pat.how.d: اقرأ كل صف من اليسار إلى اليمين. ستجد شيئًا يتغير على طوله، كالشكل أو العدد أو اللون أو الحجم أو الخطوط. اكتشف القاعدة من الصفين الأولين، ثم ابنِ بها الصورة الناقصة في ذهنك قبل أن تنظر إلى الخيارات.
