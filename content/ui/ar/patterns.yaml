pat.res.iq.t: ما مدى دقة هذا الرقم؟
pat.res.iq.d: نسبة الذكاء الحقيقية تقارنك بآلاف الناس من عمرك أدّوا الاختبار نفسه. لم يفعل أحد ذلك مع هذا الاختبار بعد، لذلك نستعير النمط المعتاد في اختبارات المصفوفات ذات الستين لغزًا. نفترض أن البالغ المتوسط يصيب نحو 42 لغزًا، وأن اثنين من كل ثلاثة بالغين لا يبتعدون عن ذلك بأكثر من 8 ألغاز تقريبًا. اعتبر الرقم نقطة بداية، لا حكمًا عليك. وهو يفترض أن عمرك 16 سنة أو أكثر. وإذا أعدت النسخة نفسها فسيخرج الرقم أعلى من حقيقته لأنك رأيت ألغازها، فأعد الاختبار بنسخة أخرى. أما درجتك من 60 ونتيجتك في كل قاعدة فدقيقتان.
pat.res.grow: ترتفع الدرجات في ألغاز كهذه بالتمرين. يبدأ درسك بالقواعد التي فاتتك أكثر من غيرها.
