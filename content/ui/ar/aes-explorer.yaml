aes.subCalc: 'البايت {a}: اذهب إلى الصف {row} والعمود {col} في الجدول. الخانة هناك فيها {b}.'
aes.shift0: الصف 0 لا يتحرك، فيبقى هذا البايت في مكانه.
aes.shiftCalc: 'الصف {r} ينزاح إلى اليسار بمقدار {r}: كان هذا البايت في العمود {from} وصار في العمود {to}.'
aes.mixRule: '×1 يبقي البايت كما هو. و×2 يزيح بتاته خانة واحدة إلى اليسار، وإذا خرج 1 من اليسار نجمع الناتج مع 1b بعملية XOR. و×3 هو ×2 ثم XOR مع البايت نفسه. والرمز ⊕ يعني XOR.'
