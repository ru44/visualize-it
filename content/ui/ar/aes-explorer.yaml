aes.message: الرسالة (16 بايتًا)
aes.key: المفتاح (16 بايتًا)
aes.bytesNote: 'كل حرف إنجليزي أو رقم أو مسافة بايت واحد، والحرف العربي بايتان. نأخذ أول 16 بايتًا فقط، وإذا كان النص أقصر نكمله بمسافات. نكتب كل بايت برقمين من النظام الست عشري (من 0 إلى 9 ثم من a إلى f)، فالبايت 68 هو الحرف h.'
aes.title0: 'الجولة 0: قبل بدء الجولات نجمع الرسالة مع المفتاح بعملية XOR.'
aes.title: 'الجولة {r} من 10 · الخطوة {s} من 4: {name}'
aes.step1: استبدال البايتات (SubBytes)
aes.step2: إزاحة الصفوف (ShiftRows)
aes.step3: خلط الأعمدة (MixColumns)
aes.step4: إضافة مفتاح الجولة (AddRoundKey)
aes.short1: استبدال البايتات
aes.short2: إزاحة الصفوف
aes.short3: خلط الأعمدة
aes.short4: إضافة مفتاح الجولة
aes.what1: نستبدل كل بايت ببايت آخر من جدول ثابت فيه 256 خانة، اسمه جدول الاستبدال (S-box).
aes.what2: الصف 0 لا يتحرك، والصف 1 ينزاح خانة واحدة إلى اليسار، والصف 2 خانتين، والصف 3 ثلاث خانات. البايت الذي يخرج من اليسار يعود من اليمين.
aes.what3: نضرب كل عمود في مصفوفة ثابتة 4×4، فيؤثر كل بايت في العمود على البايتات الأربعة كلها.
aes.what3last: الجولة الأخيرة لا تستخدم هذه الخطوة، فلا يتغير شيء هنا.
aes.what4: نجمع كل بايت بعملية XOR مع البايت الذي في المكان نفسه من مفتاح هذه الجولة.
aes.click: اضغط على أي بايت لترى كيف حسبناه.
aes.before: قبل الخطوة
aes.after: بعد الخطوة
aes.order: البايتات تملأ الشبكة من أعلى إلى أسفل، عمودًا بعد عمود
aes.sbox: 'الجدول: الصف هو الرقم الأول من البايت، والعمود هو الرقم الثاني'
