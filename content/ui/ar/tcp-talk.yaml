tcp.hint: ▶ عشر شرائح من صورة تعبر خطًّا عاصفًا — غيّر loss ثم شغّل الإيصالات أو أطفئها بـ ack
tcp.mode: البروتوكول
tcp.loss: الخط يُسقط
tcp.delivered: وصل من الصورة
tcp.resends: إعادات الإرسال
tcp.storm: 'العاصفة: تُسقط {p}% من كل شيء'
tcp.sender: المرسِل
tcp.receiver: المستقبِل
tcp.again: أُرسلت ثانية — لم يرجع إيصالها
tcp.complete: وصلت كل الشرائح — الصورة كاملة
tcp.holes: '{n} شرائح لم تصل قط، ولن يعيد إرسالها أحد'
tcp.tcpNote: TCP ينتظر إيصالًا صغيرًا (ACK) عن كل رزمة؛ لا إيصال → يرسلها من جديد
tcp.udpNote: UDP لا يلتفت وراءه أبدًا — مقبول في مكالمة فيديو، وكارثة في تحويل مصرفي
tcp.caption: يُسمح للخط أن يكون رديئًا — عناد البروتوكول في مسك الدفاتر هو ما يجعله موثوقًا
