tcp.hint: ▶ عشر شرائح من صورة تعبر خطًّا عاصفًا — اسحب الفقد وقلّب الإشعارات
tcp.mode: البروتوكول
tcp.loss: الخط يُسقط
tcp.delivered: وصل من الصورة
tcp.resends: إعادات الإرسال
tcp.storm: 'العاصفة: تُسقط {p}% من كل شيء'
tcp.sender: المرسِل
tcp.receiver: المستقبِل
tcp.again: أُرسلت ثانية — لم تعد ورقة الشكر
tcp.complete: وصلت كل الشرائح — الصورة كاملة
