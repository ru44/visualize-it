tcp.tcpNote: TCP ينتظر ورقة شكر صغيرة (ACK) عن كل رزمة؛ لا ورقة → يرسلها من جديد
tcp.udpNote: UDP لا يلتفت وراءه أبدًا — مقبول لمكالمة فيديو، قاتل لتحويل مصرفي
tcp.caption: يُسمح للخط أن يكون رديئًا — عناد البروتوكول في مسك الدفاتر هو ما يجعله موثوقًا
