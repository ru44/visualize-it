# 3D models: put each file at public/models/<name>.glb (binary glTF 2.0 with metal/roughness materials,
# low-poly, < 6 MB, CC0 / CC-BY / CC-BY-SA). Credits are read from the metadata Sketchfab embeds in the file
# and shown under the scene. `rotate` (degrees) turns the model so it faces +X; `size` is its longest side in
# scene units. Scenes fall back to drawn shapes when a file is missing.
- name: airplane
  used_by: airfoil (lift, stall)
  rotate: [0, 90, 0]
  status: in use
- name: battery
  used_by: circuit scene (not built yet)
  status: file present
- name: water-molecule
  used_by: reaction scene (not built yet)
  status: file present
# Tried and not usable — the drawn shape is used instead:
#   cannon   4.9 MB, node transforms defeat auto-fitting (renders as a huge block); a simpler single-mesh cannon would work
#   earth    uses KHR_materials_pbrSpecularGlossiness, which three.js no longer supports (renders grey); need a metal/rough Earth
#   spring   coarse coil, the drawn helix looks better
#   ramp     a skate ramp, not an inclined plane; a plain wedge is drawn
#   car      17.9 MB, 414k triangles, CC-BY-NC — far too heavy; need a low-poly car (< 30k triangles, < 5 MB)
# Still wanted (all optional, drawn shapes exist): ball, crate, low-poly car, single-mesh cannon, PBR Earth
