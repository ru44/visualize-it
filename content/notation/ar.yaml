e:
  name: عدد أويلر
  read: e
  meaning: 2.71828…، أساس النمو الطبيعي؛ وفي الفيزياء شحنة الإلكترون.
  group: constant
  simple: العدد 2.718…، معدل النمو الطبيعي.
  example: 'مال بفائدة 100% تُركّب باستمرار يتضاعف بعامل e كل سنة: 1 → 2.718.'
  lesson: exponential-growth
i:
  name: دليل / الوحدة التخيلية
