p: { name: الاحتمال / كمية الحركة, read: "p", meaning: "احتمال بين 0 و 1؛ وفي الميكانيكا كمية الحركة p = mv؛ وفي الغازات الضغط.", group: letter }
q: { name: الشحنة, read: "q", meaning: "شحنة كهربائية بالكولوم؛ أو 1 − p في الاحتمال.", group: letter }
r: { name: نصف القطر / المعدل, read: "r", meaning: "نصف قطر أو مسافة من المركز؛ وفي نماذج النمو معدل.", group: letter }
s: { name: s, read: "s", meaning: "المسافة المقطوعة، أو معامل الانتقاء، أو الثواني.", group: letter }
w: { name: w, read: "w", meaning: "وزن أو عرض.", group: letter }
A: { name: المساحة / السعة, read: "A", meaning: "المساحة، أو سعة الموجة، أو حادثة في الاحتمال.", group: letter }
B: { name: المجال المغناطيسي / حادثة, read: "B", meaning: "شدة المجال المغناطيسي بالتسلا؛ أو حادثة ثانية في الاحتمال.", group: letter }
C: { name: السعة الكهربائية / ثابت, read: "C", meaning: "السعة بالفاراد؛ ثابت التكامل؛ C(n,k) تعدّ التوافيق.", group: letter }
D: { name: السحب / القطر, read: "D", meaning: "قوة السحب، أو القطر، أو مشتقة اتجاهية.", group: letter }
E: { name: الطاقة / المجال / التوقع, read: "E", meaning: "الطاقة بالجول؛ المجال الكهربائي بـ V/m؛ E[X] القيمة المتوقعة لـ X.", group: letter }
F: { name: القوة, read: "F", meaning: "القوة بالنيوتن.", group: letter }
G: { name: ثابت الجاذبية, read: "G", meaning: "6.674 × 10⁻¹¹ N·m²/kg²، شدة الجاذبية.", group: constant }
H: { name: H, read: "H", meaning: "ارتفاع، أو مصفوفة هيس للمشتقات الثانية.", group: letter }
I: { name: التيار / المصابون, read: "I", meaning: "التيار الكهربائي بالأمبير؛ مجموعة المصابين في نموذج الوباء.", group: letter }
