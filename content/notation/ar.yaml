\alpha:
  name: ألفا
  read: ألفا
  meaning: زاوية (زاوية الهجوم في الديناميكا الهوائية) أو ثابت صغير.
  group: greek
  simple: مدى ارتفاع مقدمة الجناح نحو الريح، ويُقاس بزاوية.
  example: عند α = 5° يرفع الجناح جيدًا، وبعد نحو 15° ينفلت الهواء عنه ويحدث الانهيار الهوائي.
  lesson: lift
\beta:
  name: بيتا
  read: بيتا
  meaning: زاوية ثانية أو معدل؛ في نموذج SIR هي معدل العدوى.
  group: greek
  simple: مدى سهولة انتقال المرض من شخص إلى آخر كل يوم.
  example: β = 0.3 تعني أن كل مريض يعدي نحو 0.3 شخص في اليوم.
  lesson: sir-epidemic
\gamma:
  name: غاما
  read: غاما
  meaning: زاوية ثالثة أو معدل؛ معدل الشفاء في نموذج SIR، ونسبة السعات الحرارية في الغازات.
  group: greek
  simple: مدى سرعة شفاء المرضى كل يوم.
  example: γ = 0.1 تعني أن عُشر المرضى يشفون كل يوم، فيستمر المرض نحو 10 أيام.
  lesson: sir-epidemic
\delta:
  name: دلتا الصغيرة
  read: دلتا
  meaning: مسافة صغيرة أو حد للخطأ، كما في تعريف النهاية بإبسيلون ودلتا.
  group: greek
  simple: مقدار صغير مسموح به من التحرك في المدخل.
  example: ابقَ ضمن δ = 0.01 من النقطة فيبقى المخرج ضمن الخطأ الذي طلبته.
  lesson: limit
\Delta:
  name: دلتا الكبيرة
  read: دلتا
  meaning: 'التغير في كمية: Δx تعني «التغير في x»، أي القيمة النهائية ناقص الابتدائية.'
  example: ارتفعت الحرارة من 18° إلى 25°، فالتغير ΔT = 25 − 18 = 7°.
  group: greek
  simple: 'التغير: ما انتهيت إليه ناقص ما بدأت به.'
  lesson: slope
\epsilon:
  name: إبسيلون
  read: إبسيلون
  meaning: عدد موجب صغير، خطأ مسموح به.
  group: greek
  simple: خطأ صغير مسموح به.
  example: «ضمن ε = 0.001» تعني أن الجواب قد يبتعد بجزء من ألف على الأكثر.
  lesson: limit
\varepsilon:
  name: إبسيلون
  read: إبسيلون
  meaning: عدد موجب صغير، خطأ مسموح به، كما في «ضمن ε من النهاية».
  group: greek
  simple: خطأ صغير مسموح به.
  example: «ضمن ε = 0.001» تعني أن الجواب قد يبتعد بجزء من ألف على الأكثر.
  lesson: limit
\theta:
  name: ثيتا
  read: ثيتا
  meaning: زاوية، تُقاس عادة من محور x الموجب.
  group: greek
  simple: 'زاوية: مقدار ما دار الشيء.'
  example: θ = 90° ربع دورة، و θ = 360° دورة كاملة.
  lesson: unit-circle
\lambda:
  name: لامدا
  read: لامدا
  meaning: الطول الموجي؛ المعدل المتوسط في توزيع بواسون؛ قيمة ذاتية في الجبر الخطي.
  group: greek
  simple: المسافة من قمة موجة إلى القمة التالية.
  example: تموجات تبعد قممها 2 cm طولها الموجي λ = 2 cm.
  lesson: sine-wave
\mu:
  name: مو
  read: مو
  meaning: متوسط التوزيع؛ معامل الاحتكاك؛ البادئة مايكرو (جزء من مليون).
  group: greek
  simple: 'المتوسط: اجمع كل الأعداد واقسم على عددها.'
  example: الدرجات 4 و 6 و 8 متوسطها μ = (4 + 6 + 8) / 3 = 6.
  lesson: mean-and-spread
\nu:
  name: نو
  read: نو
  meaning: التردد في الفيزياء أو اللزوجة الحركية في الموائع.
  group: greek
  simple: عدد الموجات التي تمر في الثانية.
  example: ν = 440 Hz هي نغمة A، أي 440 قمة موجية كل ثانية.
  lesson: sine-wave
\pi:
  name: باي
  read: باي
  meaning: نسبة محيط الدائرة إلى قطرها، 3.14159…
  group: greek
  simple: 'كم مرة يدخل عرض الدائرة في محيطها: أكثر من 3 بقليل.'
  example: عجلة عرضها متر واحد تقطع 3.14 m في دورة واحدة.
  lesson: circle
\rho:
  name: رو
  read: رو
  meaning: 'الكثافة: الكتلة في وحدة الحجم (kg/m³). كثافة الهواء عند سطح البحر نحو 1.225 kg/m³.'
  group: greek
  simple: مدى ثقل المادة بالنسبة إلى حجمها (كتلة اللتر أو المتر المكعب).
  example: 'الماء: كيلوغرام لكل لتر. الهواء: نحو 1.2 g لكل لتر. الحديد: 7.9 kg لكل لتر.'
  lesson: ideal-gas-law
\sigma:
  name: سيغما الصغيرة
  read: سيغما
  meaning: الانحراف المعياري، أي البعد النموذجي للبيانات عن المتوسط؛ و σ² هو التباين.
  group: greek
  simple: مدى ابتعاد الأعداد عادة عن متوسطها.
  example: الدرجات 48 و 50 و 52 لها σ صغيرة، والدرجات 20 و 50 و 80 لها σ كبيرة.
  lesson: mean-and-spread
\Sigma:
  name: سيغما الكبيرة
  read: سيغما
  meaning: 'علامة الجمع: اجمع الحدود التي تليها.'
  group: greek
  simple: اجمعها كلها.
  example: Σ للأعداد 1 و 2 و 3 و 4 تساوي 10.
  lesson: integral
\sum:
  name: المجموع
  read: مجموع
  meaning: اجمع كل الحدود، والدليل يجري من الحد الأدنى إلى الأعلى.
  example: Σ من i = 1 إلى 4 للمقدار i هي 1 + 2 + 3 + 4 = 10.
  group: operator
  simple: اجمعها كلها، حدًا واحدًا لكل قيمة من قيم العدّاد.
  lesson: integral
\tau:
  name: تاو
  read: تاو
  meaning: ثابت زمني، أي الزمن الذي تتغير فيه عملية أسية بعامل e؛ وأيضًا عزم الدوران.
  group: greek
  simple: الزمن الذي يحتاجه الشيء ليتلاشى نحو ثلثيه.
  example: مكثف τ له ثانيتان يُشحن 63% بعد ثانيتين و 95% بعد 6 ثوانٍ.
  lesson: rc-circuit
\phi:
  name: فاي
  read: فاي
  meaning: 'زاوية الطور: أين تبدأ الموجة في دورتها. وأيضًا النسبة الذهبية.'
  group: greek
  simple: أين تبدأ الموجة في دورتها.
  example: φ = 90° تعني أن الموجة تبدأ من قمتها لا من الصفر.
  lesson: sine-wave
\varphi:
  name: فاي
  read: فاي
  meaning: 'زاوية الطور: أين تبدأ الموجة في دورتها.'
  group: greek
  simple: أين تبدأ الموجة في دورتها.
  example: φ = 90° تعني أن الموجة تبدأ من قمتها لا من الصفر.
  lesson: sine-wave
\Phi:
  name: فاي الكبيرة
  read: فاي
  meaning: التدفق المغناطيسي؛ أو دالة التوزيع التراكمي للتوزيع الطبيعي المعياري.
  group: greek
  simple: كم من المجال يعبر سطحًا، أو مساحة منحنى الجرس حتى نقطة.
  example: 'Φ(0) = 0.5: نصف منحنى الجرس يقع يسار الوسط.'
  lesson: normal-distribution
\omega:
  name: أوميغا
  read: أوميغا
  meaning: التردد الزاوي ω = 2πf (راديان في الثانية)؛ السرعة الزاوية للدوران.
  group: greek
  simple: مدى سرعة الدوران، بالراديان في الثانية.
  example: دورة كاملة في الثانية تساوي ω = 2π ≈ 6.28 rad/s.
  lesson: simple-harmonic-motion
\Omega:
  name: أوميغا الكبيرة
  read: أوميغا
  meaning: وحدة الأوم للمقاومة الكهربائية؛ أو مجموعة كل النتائج في الاحتمال.
  group: greek
  simple: وحدة المقاومة الكهربائية، الأوم.
  example: مقاومة 100 Ω تمرر 0.1 A عندما يدفعها جهد 10 V.
  lesson: ohms-law
\eta:
  name: إيتا
  read: إيتا
  meaning: 'الكفاءة: الطاقة النافعة الخارجة مقسومة على الطاقة الداخلة.'
  group: greek
  simple: 'الكفاءة: كم مما تدخله يخرج على شكل شيء نافع.'
  example: η = 0.3 تعني أن 30% من طاقة الوقود تحرك السيارة، والباقي يضيع حرارة.
  lesson: entropy-and-heat-engines
\kappa:
  name: كابا
  read: كابا
  meaning: انحناء أو ثابت تناسب.
  group: greek
  simple: انحناء أو ثابت تناسب.
\chi:
  name: كاي
  read: كاي
  meaning: تظهر في إحصائية مربع كاي.
  group: greek
  simple: تظهر في إحصائية مربع كاي.
\psi:
  name: بساي
  read: بساي
  meaning: دالة موجية في ميكانيكا الكم أو دالة انسياب في الموائع.
  group: greek
  simple: دالة موجية في ميكانيكا الكم أو دالة انسياب في الموائع.
\xi:
  name: كسي
  read: كسي
  meaning: متغير وهمي أو متغير عشوائي.
  group: greek
  simple: متغير وهمي أو متغير عشوائي.
\zeta:
  name: زيتا
  read: زيتا
  meaning: نسبة التخميد في الاهتزازات.
  group: greek
  simple: نسبة التخميد في الاهتزازات.
\int:
  name: علامة التكامل
  read: تكامل
  meaning: اجمع عددًا لا نهائيًا من الشرائح الرفيعة جدًا؛ المساحة تحت المنحنى بين الحدين.
  example: ∫ من 0 إلى 4 للمقدار x² dx تساوي 21.33، وهي المساحة تحت المنحنى بين 0 و 4.
  group: calculus
  simple: 'اجمع عددًا لا نهائيًا من الشرائح الرفيعة: المساحة تحت المنحنى.'
  lesson: integral
\lim:
  name: النهاية
  read: نهاية
  meaning: القيمة التي تقترب منها الدالة عندما يقترب مدخلها من نقطة، دون الحاجة إلى بلوغها.
  example: تتجه sin(x)/x إلى 1 عندما تتجه x إلى 0، مع أن 0/0 نفسها لا تعني شيئًا.
  group: calculus
  simple: إلى أين تتجه القيم كلما اقتربت أكثر وأكثر.
  lesson: limit
\partial:
  name: علامة المشتقة الجزئية
  read: جزئي
  meaning: معدل التغير بالنسبة إلى متغير واحد مع تثبيت بقية المتغيرات.
  example: على تل، ∂h/∂x هو الانحدار عند المشي شرقًا مع إهمال الشمال.
  group: calculus
  simple: الميل في اتجاه واحد فقط مع تثبيت بقية المدخلات.
  lesson: gradient
\nabla:
  name: نابلا
  read: دل
  meaning: 'مؤثر التدرج: متجه كل المشتقات الجزئية، ويشير إلى اتجاه أشد صعود.'
  example: على سطح يشبه الوعاء يشير ∇f بعيدًا عن القاع في كل مكان.
  group: calculus
  simple: السهم الذي يشير إلى أشد صعود، ويطول كلما زاد الانحدار.
  lesson: gradient
\to:
  name: السهم
  read: يقترب من / يتحول إلى
  meaning: في النهاية يقترب المدخل من هذه القيمة؛ وفي التفاعلات «يتحول إلى».
  group: calculus
  simple: يتجه نحو.
  example: x → 0 تعني أن x تقترب أكثر وأكثر من 0.
  lesson: limit
\infty:
  name: ما لا نهاية
  read: ما لا نهاية
  meaning: 'بلا حد: أكبر من أي عدد. وليس عددًا في ذاته.'
  group: calculus
  simple: 'بلا نهاية: أكبر من أي عدد تستطيع تسميته.'
  example: 1، 2، 3، … تستمر → ∞. إنها اتجاه لا مكان.
  lesson: limits-at-infinity
'''':
  name: الشرطة
  read: شرطة
  meaning: 'المشتقة: f′(x) هي معدل تغير f؛ و f″ المشتقة الثانية.'
  example: إذا كانت f موضع سيارة فإن f′ سرعتها.
  group: calculus
  simple: 'معدل التغير: كم يتغير المخرج بسرعة عندما يتغير المدخل.'
  lesson: derivative
\dot:
  name: النقطة
  read: نقطة
  meaning: 'نقطة فوق الكمية تعني معدل تغيرها في الزمن: ẍ التسارع، و ṁ الكتلة في الثانية.'
  example: ṡ هي السرعة إذا كانت s المسافة، و ṁ كيلوغرامات تتدفق في الثانية.
  group: calculus
  simple: نقطة فوق الحرف تعني «مدى سرعة تغيره مع الزمن».
  lesson: derivative
\ddot:
  name: النقطتان
  read: نقطتان
  meaning: 'المشتقة الثانية في الزمن: ẍ هو التسارع.'
  group: calculus
  simple: نقطتان تعنيان «مدى سرعة تغير سرعة التغير نفسها».
  example: ẋ السرعة، و ẍ التسارع.
  lesson: kinematics-constant-acceleration
d:
  name: d التفاضلية
  read: دي
  meaning: 'في dx أو dt: تغير صغير جدًا في ذلك المتغير. و dy/dx مشتقة y بالنسبة إلى x.'
  group: calculus
  simple: خطوة صغيرة جدًا في تلك الكمية.
  example: 'dx تغير صغير جدًا في x، و dy/dx هو الميل: الارتفاع لكل خطوة صغيرة.'
  lesson: derivative
\propto:
  name: يتناسب مع
  read: يتناسب مع
  meaning: 'يكبر معه بالخطوة نفسها: تضاعف أحدهما يضاعف الآخر. y ∝ x تعني y = ثابت × x.'
  group: relation
  simple: 'يكبر معه بالخطوة نفسها: ضاعف أحدهما فيتضاعف الآخر.'
  example: 'التكلفة ∝ عدد التذاكر: ثلاث تذاكر تكلف ثلاثة أضعاف تذكرة واحدة.'
  lesson: slope
\approx:
  name: يساوي تقريبًا
  read: يساوي تقريبًا
  meaning: متساويان مع خطأ صغير.
  group: relation
  simple: يساوي تقريبًا.
  example: π ≈ 3.14.
\ne:
  name: لا يساوي
  read: لا يساوي
  meaning: الطرفان مختلفان.
  group: relation
  simple: لا يساوي.
  example: 3 ≠ 4.
\neq:
  name: لا يساوي
  read: لا يساوي
  meaning: الطرفان مختلفان.
  group: relation
  simple: لا يساوي.
  example: 3 ≠ 4.
\le:
  name: أصغر من أو يساوي
  read: على الأكثر
  meaning: أصغر من أو يساوي.
  group: relation
  simple: أصغر من أو يساوي.
  example: x ≤ 5 تسمح بـ 5 وبكل ما دونها.
\leq:
  name: أصغر من أو يساوي
  read: على الأكثر
  meaning: أصغر من أو يساوي.
  group: relation
  simple: أصغر من أو يساوي.
  example: x ≤ 5 تسمح بـ 5 وبكل ما دونها.
\ge:
  name: أكبر من أو يساوي
  read: على الأقل
  meaning: أكبر من أو يساوي.
  group: relation
  simple: أكبر من أو يساوي.
  example: x ≥ 5 تسمح بـ 5 وبكل ما فوقها.
\geq:
  name: أكبر من أو يساوي
  read: على الأقل
  meaning: أكبر من أو يساوي.
  group: relation
  simple: أكبر من أو يساوي.
  example: x ≥ 5 تسمح بـ 5 وبكل ما فوقها.
\ll:
  name: أصغر بكثير
  read: أصغر بكثير من
  meaning: أصغر بعامل كبير.
  group: relation
  simple: أصغر بكثير من.
  example: 1 ≪ 1000.
\gg:
  name: أكبر بكثير
  read: أكبر بكثير من
  meaning: أكبر بعامل كبير.
  group: relation
  simple: أكبر بكثير من.
  example: 1000 ≫ 1.
\pm:
  name: زائد أو ناقص
  read: زائد أو ناقص
  meaning: 'حالتان معًا: واحدة بـ + وأخرى بـ −. تُستخدم لجذري المعادلة التربيعية ولهوامش الخطأ.'
  group: relation
  simple: 'جوابان في سطر واحد: مرة بالزائد ومرة بالناقص.'
  example: x = 3 ± 2 تعني x = 5 أو x = 1.
  lesson: quadratic-roots
\mp:
  name: ناقص أو زائد
  read: ناقص أو زائد
  meaning: الإشارة المعاكسة لاختيار ± سابق في الصيغة نفسها.
  group: relation
  simple: اختيار الإشارة المعاكس لعلامة ± سابقة في السطر نفسه.
  example: a ± b ∓ c تقرن + مع − و − مع +.
\cdot:
  name: الضرب / الضرب القياسي
  read: ضرب
  meaning: الضرب؛ وبين المتجهات الضرب القياسي.
  group: operator
  simple: ضرب.
  example: 3 · 4 = 12.
\times:
  name: الضرب / الضرب الاتجاهي
  read: ضرب
  meaning: الضرب؛ وبين المتجهات الضرب الاتجاهي (متجه عمودي على كليهما).
  group: operator
  simple: ضرب.
  example: 3 × 4 = 12.
\sqrt:
  name: الجذر التربيعي
  read: جذر
  meaning: العدد الذي إذا ضُرب في نفسه أعطى ما تحت العلامة.
  group: operator
  simple: العدد الذي إذا ضربته في نفسه أعطاك ما بداخل الجذر.
  example: √9 = 3 لأن 3 × 3 = 9.
  lesson: exponents-and-powers
\frac:
  name: الكسر
  read: على
  meaning: البسط مقسومًا على المقام.
  group: operator
  simple: الأعلى مقسومًا على الأسفل.
  example: '3/4 من البيتزا: قسّمها أربعًا وخذ ثلاثًا.'
\Rightarrow:
  name: يستلزم
  read: إذن
  meaning: إذا صح الطرف الأيسر تبع الأيمن.
  group: relation
  simple: إذن؛ إذا صح اليسار تبعه اليمين.
  example: x = 2 ⇒ x² = 4.
\iff:
  name: إذا وفقط إذا
  read: إذا وفقط إذا
  meaning: كل طرف يستلزم الآخر؛ العبارتان متكافئتان.
  group: relation
  simple: كل طرف صحيح تمامًا عندما يصح الآخر.
  example: x + 1 = 3 ⇔ x = 2.
\mid:
  name: بشرط
  read: بشرط
  meaning: 'في P(A | B): احتمال A بشرط وقوع B.'
  group: probability
  simple: '«بشرط»: انظر فقط إلى الحالات التي وقع فيها ما بعد الخط.'
  example: P(مطر | غيوم) هو احتمال المطر في الأيام الغائمة وحدها.
  lesson: bayes-theorem
\binom:
  name: معامل ذي الحدين
  read: n اختيار k
  meaning: عدد طرق اختيار k عنصرًا من n عندما لا يهم الترتيب.
  example: 'من 3 أصدقاء يمكن اختيار 3 أزواج مختلفة: C(3,2) = 3.'
  group: probability
  simple: كم مجموعة مختلفة من k يمكنك اختيارها من n شيء.
  lesson: combinations
'!':
  name: المضروب
  read: مضروب
  meaning: n! = n × (n−1) × … × 1، عدد طرق ترتيب n عنصرًا.
  example: '3! = 3 × 2 × 1 = 6: طرق رصّ 3 أشخاص في صف.'
  group: probability
  simple: اضرب العدد في كل الأعداد الصحيحة التي تحته.
  lesson: permutations
\in:
  name: ينتمي إلى
  read: ينتمي إلى
  meaning: عنصر في المجموعة.
  group: sets
  simple: واحد من.
  example: 3 ∈ {1, 2, 3}.
\subseteq:
  name: مجموعة جزئية
  read: مجموعة جزئية من
  meaning: كل عنصر في المجموعة اليسرى موجود في اليمنى أيضًا.
  group: sets
  simple: كل ما في المجموعة الأولى موجود في الثانية أيضًا.
  example: '{1, 2} ⊆ {1, 2, 3}.'
\cup:
  name: الاتحاد
  read: أو
  meaning: كل ما في أي من المجموعتين؛ وللحوادث «A أو B».
  group: sets
  simple: هذا أو ذاك (أو كلاهما).
  example: 'A ∪ B: في A، أو في B، أو في كليهما.'
  lesson: probability-basics
\cap:
  name: التقاطع
  read: و
  meaning: كل ما في المجموعتين معًا؛ وللحوادث «A و B».
  group: sets
  simple: كلاهما معًا.
  example: 'A ∩ B: في A وفي B أيضًا.'
  lesson: probability-basics
\mathbb:
  name: مجموعات الأعداد
  read: R، الأعداد الحقيقية
  meaning: ℝ مجموعة الأعداد الحقيقية؛ ℕ الأعداد الطبيعية؛ ℤ الأعداد الصحيحة.
  group: sets
  simple: مجموعة مشهورة من الأعداد تُكتب بحروف مجوفة.
  example: 'ℝ: كل الأعداد على خط الأعداد. ℤ: الأعداد الصحيحة بما فيها السالبة.'
\dots:
  name: نقاط الحذف
  read: وهكذا
  meaning: يستمر النمط.
  group: operator
  simple: وهكذا.
  example: 1، 2، 3، … تستمر إلى ما لا نهاية.
\cdots:
  name: نقاط الحذف
  read: وهكذا
  meaning: يستمر النمط.
  group: operator
  simple: وهكذا.
  example: 1 + 2 + ⋯ + 10 تتابع النمط حتى 10.
\langle:
  name: قوسا المتوسط
  read: متوسط
  meaning: ⟨v²⟩ هو متوسط v² على كل الجسيمات.
  group: operator
  simple: متوسط ما بداخل القوسين.
  example: ⟨v²⟩ هو متوسط مربعات سرعات كل الجسيمات.
  lesson: ideal-gas-law
\hat:
  name: القبعة
  read: قبعة
  meaning: 'تقدير من البيانات: p̂ هي النسبة المرصودة التي تقدر الاحتمال الحقيقي p.'
  group: statistics
  simple: أفضل تقدير لدينا من البيانات، لا القيمة الحقيقية.
  example: 'ارمِ 100 قطعة نقد فتحصل على 53 صورة: p̂ = 0.53، وهو تقديرنا للاحتمال الحقيقي p = 0.5.'
  lesson: law-of-large-numbers
\bar:
  name: الشريط
  read: شريط
  meaning: 'متوسط: x̄ هو متوسط قيم x.'
  group: statistics
  simple: متوسط القيم.
  example: x̄ للأعداد 2 و 4 و 6 هو 4.
  lesson: mean-and-spread
\vec:
  name: سهم المتجه
  read: متجه
  meaning: كمية لها اتجاه إلى جانب مقدارها.
  group: operator
  simple: 'كمية لها اتجاه: سهم.'
  example: 'السرعة المتجهة: 50 km/h شمالًا، لا 50 km/h فقط.'
  lesson: vectors
\mathbf:
  name: المتجه الغليظ
  read: متجه
  meaning: 'الحروف الغليظة متجهات: كميات لها اتجاه مثل القوة والسرعة.'
  group: operator
  simple: 'الحروف الغليظة أسهم: لها اتجاه لا مقدار فقط.'
  example: F قوة تدفع في اتجاه ما، لا «قوة 10 N» فقط.
  lesson: vectors
\text:
  name: نص
  read: ''
  meaning: كلمات عادية داخل الصيغة.
  group: layout
  simple: كلمات عادية داخل الصيغة.
  example: P(مطر) تستخدم كلمة «مطر» داخل الرياضيات.
\rightleftharpoons:
  name: تفاعل انعكاسي
  read: في توازن مع
  meaning: يجري التفاعل في الاتجاهين معًا؛ وعند التوازن يتساوى المعدلان.
  group: relation
  simple: يجري التفاعل في الاتجاهين معًا.
  example: 'A ⇌ B: تتحول A إلى B بينما تعود B إلى A.'
  lesson: chemical-equilibrium
\gets:
  name: الإسناد
  read: يصبح
  meaning: في الخوارزميات، x ← 5 تخزن 5 في x.
  group: computer-science
  simple: خزّن القيمة على اليمين في الاسم على اليسار.
  example: x ← 5 تضع 5 في الصندوق المسمى x.
  lesson: algorithms-and-complexity
\searrow:
  name: سهم التناقص
  read: يتناقص إلى
  meaning: تنخفض الكمية نحو القيمة.
  group: relation
  simple: ينخفض نحو.
  example: تتناقص القيمة إلى النهاية.
\nearrow:
  name: سهم التزايد
  read: يتزايد إلى
  meaning: ترتفع الكمية نحو القيمة.
  group: relation
  simple: يرتفع نحو.
  example: تتزايد القيمة إلى النهاية.
\arg:
  name: الوسيطة
  read: arg
  meaning: argmax f هو المدخل الذي تكون f عنده أكبر ما يمكن، لا القيمة الكبرى نفسها.
  group: function
  simple: أي مدخل، لا أي مخرج.
  example: argmax تختار x التي تكون الدالة عندها أكبر ما يمكن، لا القيمة الكبرى نفسها.
  lesson: linear-regression
\sin:
  name: الجيب
  read: جا
  meaning: لزاوية على دائرة الوحدة، ارتفاع النقطة (إحداثي y).
  group: function
  simple: ارتفاع نقطة على عجلة تدور، كنسبة من نصف قطر العجلة.
  example: 'عند 30° تكون النقطة في منتصف الارتفاع: sin 30° = 0.5. وعند 90° في القمة: sin 90° = 1.'
  lesson: unit-circle
\cos:
  name: جيب التمام
  read: جتا
  meaning: لزاوية على دائرة الوحدة، الموضع الأفقي للنقطة (إحداثي x).
  group: function
  simple: بُعد نقطة على عجلة تدور نحو اليمين، كنسبة من نصف القطر.
  example: 'عند 0° تكون النقطة في أقصى اليمين: cos 0° = 1. وعند 90° تكون فوق تمامًا فتصير cos 90° = 0.'
  lesson: unit-circle
\tan:
  name: الظل
  read: ظا
  meaning: الجيب مقسومًا على جيب التمام؛ ميل الخط عند تلك الزاوية.
  group: function
  simple: 'ميل الخط عند تلك الزاوية: الارتفاع مقسومًا على المسافة الأفقية.'
  example: 'tan 45° = 1: عند 45° ترتفع بقدر ما تتقدم.'
  lesson: tangent-function
\atan:
  name: الظل العكسي
  read: ظا العكسي
  meaning: الزاوية التي ظلها هو العدد المعطى.
  group: function
  simple: الزاوية التي ميلها هو العدد المعطى.
  example: arctan 1 = 45°.
  lesson: tangent-function
\arctan:
  name: الظل العكسي
  read: ظا العكسي
  meaning: الزاوية التي ظلها هو العدد المعطى.
  group: function
  simple: الزاوية التي ميلها هو العدد المعطى.
  example: arctan 1 = 45°.
  lesson: tangent-function
\log:
  name: اللوغاريتم
  read: لو
  meaning: 'القوة التي ترفع إليها الأساس لتحصل على العدد: log₁₀(1000) = 3.'
  group: function
  simple: 'يسأل: كم مرة أضرب 10 لأصل إلى هذا العدد؟'
  example: log(1000) = 3 لأن 10 × 10 × 10 = 1000.
  lesson: logarithms
\ln:
  name: اللوغاريتم الطبيعي
  read: لو الطبيعي
  meaning: لوغاريتم أساسه e ≈ 2.718؛ ln(e^x) = x.
  group: function
  simple: 'يسأل: كم مرة أضرب e (2.718…) لأصل إلى هذا العدد؟'
  example: ln(7.39) ≈ 2 لأن e × e ≈ 7.39.
  lesson: logarithms
\exp:
  name: الدالة الأسية
  read: e أس
  meaning: exp(x) = eˣ، الدالة التي يساوي معدل تغيرها قيمتها.
  group: function
  simple: اضرب e (2.718…) في نفسه بذلك العدد من المرات.
  example: exp(2) = e × e ≈ 7.39. نمو يتسارع كلما كبر.
  lesson: exponential-growth
\tanh:
  name: الظل الزائدي
  read: tanh
  meaning: دالة على شكل S ترتفع من −1 إلى 1؛ تظهر في مسائل السرعة الحدية.
  group: function
  simple: منحنى على شكل S يرتفع بسلاسة من −1 إلى 1 ثم يستوي.
  example: 'سرعة مظلّي يسقط تتبع tanh: تزيد ثم تستوي عند السرعة الحدية.'
