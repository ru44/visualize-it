\alpha:
  name: alpha
  read: AL-fa
  meaning: An angle (angle of attack in aerodynamics) or a small constant.
  group: greek
  simple: How much the wing's nose points up into the wind, measured as an angle.
  example: At α = 5° a wing lifts well; past about 15° the air lets go and it stalls.
  lesson: lift
\beta:
  name: beta
  read: BAY-ta
  meaning: A second angle or rate; in the SIR model the infection rate.
  group: greek
  simple: How easily the illness jumps from one person to another each day.
  example: β = 0.3 means each sick person infects about 0.3 others per day.
  lesson: sir-epidemic
\gamma:
  name: gamma
  read: GAM-ma
  meaning: A third angle or rate; the recovery rate in the SIR model; the heat-capacity ratio in gases.
  group: greek
  simple: How quickly sick people recover each day.
  example: γ = 0.1 means a tenth of the sick recover every day, so illness lasts about 10 days.
  lesson: sir-epidemic
\delta:
  name: delta (small)
  read: DEL-ta
  meaning: A small distance or tolerance, as in the ε–δ definition of a limit.
  group: greek
  simple: A tiny allowed wiggle in the input.
  example: Stay within δ = 0.01 of the point and the output stays within the error you asked for.
  lesson: limit
\Delta:
  name: Delta (capital)
  read: DEL-ta
  meaning: 'A change in a quantity: Δx means ''the change in x'', final minus initial.'
  example: Temperature went from 18° to 25°, so ΔT = 25 − 18 = 7°.
  group: greek
  simple: 'The change: what you ended with minus what you started with.'
  lesson: slope
\epsilon:
  name: epsilon
  read: EP-si-lon
  meaning: A small positive number, an allowed error.
  group: greek
  simple: A tiny allowed error.
  example: '''Within ε = 0.001'' means the answer may be off by at most a thousandth.'
  lesson: limit
\varepsilon:
  name: epsilon
  read: EP-si-lon
  meaning: A small positive number, an allowed error, as in 'within ε of the limit'.
  group: greek
  simple: A tiny allowed error.
  example: '''Within ε = 0.001'' means the answer may be off by at most a thousandth.'
  lesson: limit
\theta:
  name: theta
  read: THAY-ta
  meaning: An angle, usually measured from the positive x-axis.
  group: greek
  simple: 'An angle: how far something has turned.'
  example: θ = 90° is a quarter turn; θ = 360° is a full circle.
  lesson: unit-circle
\lambda:
  name: lambda
  read: LAM-da
  meaning: Wavelength of a wave; the average rate in a Poisson distribution; an eigenvalue in linear algebra.
  group: greek
  simple: The distance from one wave crest to the next.
  example: Ripples with crests 2 cm apart have λ = 2 cm.
  lesson: sine-wave
\mu:
  name: mu
  read: mew
  meaning: The mean of a distribution; the coefficient of friction; the prefix micro (one millionth).
  group: greek
  simple: 'The average: add everything up and divide by how many.'
  example: Scores 4, 6, 8 have mean μ = (4 + 6 + 8) / 3 = 6.
  lesson: mean-and-spread
\nu:
  name: nu
  read: new
  meaning: Frequency (physics) or kinematic viscosity (fluids).
  group: greek
  simple: How many waves pass per second.
  example: 'ν = 440 Hz is the note A: 440 wave crests every second.'
  lesson: sine-wave
\pi:
  name: pi
  read: pie
  meaning: The ratio of a circle's circumference to its diameter, 3.14159…
  group: greek
  simple: 'How many times a circle''s width fits around its edge: a bit more than 3.'
  example: A wheel 1 m across rolls 3.14 m in one turn.
  lesson: circle
\rho:
  name: rho
  read: row
  meaning: 'Density: mass per unit volume (kg/m³). Air at sea level has ρ ≈ 1.225 kg/m³.'
  group: greek
  simple: How heavy a material is for its size (mass per litre or per cubic metre).
  example: 'Water: 1 kg per litre. Air: about 1.2 g per litre. Iron: 7.9 kg per litre.'
  lesson: ideal-gas-law
\sigma:
  name: sigma (small)
  read: SIG-ma
  meaning: Standard deviation, the typical distance of data from the mean; σ² is the variance.
  group: greek
  simple: How far the numbers typically stray from their average.
  example: Marks 48, 50, 52 have a small σ; marks 20, 50, 80 have a large one.
  lesson: mean-and-spread
\Sigma:
  name: Sigma (capital)
  read: SIG-ma
  meaning: 'Sum sign: add up the terms that follow.'
  group: greek
  simple: Add them all up.
  example: Σ of 1, 2, 3, 4 is 10.
  lesson: integral
\sum:
  name: sum
  read: the sum of
  meaning: Add up all the terms, with the index running from the lower to the upper limit.
  example: Σ from i = 1 to 4 of i is 1 + 2 + 3 + 4 = 10.
  group: operator
  simple: Add them all up, one term for each value of the counter.
  lesson: integral
\tau:
  name: tau
  read: tow
  meaning: A time constant, the time for an exponential process to change by a factor e; also torque.
  group: greek
  simple: The time it takes for something to fade by about two thirds.
  example: A capacitor with τ = 2 s is 63% charged after 2 s and 95% after 6 s.
  lesson: rc-circuit
\phi:
  name: phi
  read: fee
  meaning: 'A phase angle: where in its cycle a wave starts. Also the golden ratio.'
  group: greek
  simple: Where in its cycle a wave starts.
  example: φ = 90° means the wave starts at its peak instead of at zero.
  lesson: sine-wave
\varphi:
  name: phi
  read: fee
  meaning: 'A phase angle: where in its cycle a wave starts.'
  group: greek
  simple: Where in its cycle a wave starts.
  example: φ = 90° means the wave starts at its peak instead of at zero.
  lesson: sine-wave
\Phi:
  name: Phi (capital)
  read: fee
  meaning: Magnetic flux; or the standard normal cumulative distribution function.
  group: greek
  simple: How much of a field passes through a surface, or the bell-curve area up to a point.
  example: 'Φ(0) = 0.5: half the bell curve lies left of the middle.'
  lesson: normal-distribution
\omega:
  name: omega
  read: oh-MAY-ga
  meaning: Angular frequency, ω = 2πf (radians per second); angular velocity of rotation.
  group: greek
  simple: How fast something turns, in radians per second.
  example: One full turn per second is ω = 2π ≈ 6.28 rad/s.
  lesson: simple-harmonic-motion
\Omega:
  name: Omega (capital)
  read: oh-MAY-ga
  meaning: The unit ohm of electrical resistance; or the set of all outcomes in probability.
  group: greek
  simple: The unit of electrical resistance, the ohm.
  example: A 100 Ω resistor lets 0.1 A flow when 10 V pushes it.
  lesson: ohms-law
\eta:
  name: eta
  read: AY-ta
  meaning: 'Efficiency: useful energy out divided by energy in.'
  group: greek
  simple: 'Efficiency: how much of what you put in comes out as something useful.'
  example: η = 0.3 means 30% of the fuel's energy moves the car; the rest is heat.
  lesson: entropy-and-heat-engines
\kappa:
  name: kappa
  read: KAP-pa
  meaning: A curvature or a constant of proportionality.
  group: greek
  simple: A curvature or a constant of proportionality.
\chi:
  name: chi
  read: kai
  meaning: Used in the chi-squared statistic.
  group: greek
  simple: Used in the chi-squared statistic.
\psi:
  name: psi
  read: sigh
  meaning: A wave function in quantum mechanics or a stream function in fluids.
  group: greek
  simple: A wave function in quantum mechanics or a stream function in fluids.
\xi:
  name: xi
  read: ksee
  meaning: A dummy variable or a random variable.
  group: greek
  simple: A dummy variable or a random variable.
\zeta:
  name: zeta
  read: ZAY-ta
  meaning: A damping ratio in oscillations.
  group: greek
  simple: A damping ratio in oscillations.
\int:
  name: integral sign
  read: the integral of
  meaning: Add up infinitely many infinitely thin slices; the area under a curve between the lower and upper limits.
  example: '∫ from 0 to 4 of x² dx = 21.33: the area under the curve between 0 and 4.'
  group: calculus
  simple: 'Add up infinitely many thin slices: the area under a curve.'
  lesson: integral
\lim:
  name: limit
  read: the limit as
  meaning: The value a function approaches as its input approaches a point, without needing to reach it.
  example: sin(x)/x heads to 1 as x heads to 0, even though 0/0 itself means nothing.
  group: calculus
  simple: Where the values are heading as you get closer and closer.
  lesson: limit
\partial:
  name: partial derivative sign
  read: partial
  meaning: Rate of change with respect to one variable while all the others are held fixed.
  example: On a hill, ∂h/∂x is the steepness walking east, ignoring north.
  group: calculus
  simple: The slope in one direction only, keeping every other input fixed.
  lesson: gradient
\nabla:
  name: nabla / del
  read: del
  meaning: 'The gradient operator: the vector of all partial derivatives; it points in the direction of steepest increase.'
  example: On a bowl-shaped surface ∇f points away from the bottom everywhere.
  group: calculus
  simple: The arrow that points straight uphill, as long as the slope is steep.
  lesson: gradient
\to:
  name: arrow
  read: approaches / goes to
  meaning: In a limit, the input approaches this value; in reactions, 'turns into'.
  group: calculus
  simple: Heads toward.
  example: x → 0 means x gets closer and closer to 0.
  lesson: limit
\infty:
  name: infinity
  read: infinity
  meaning: 'Without bound: larger than any number. Not a number itself.'
  group: calculus
  simple: 'Without end: bigger than any number you could name.'
  example: 1, 2, 3, … keeps going → ∞. It is a direction, not a place.
  lesson: limits-at-infinity
'''':
  name: prime
  read: prime
  meaning: 'The derivative: f′(x) is the rate of change of f; f″ is the second derivative.'
  example: If f is a car's position, f′ is its speed.
  group: calculus
  simple: 'The rate of change: how fast the output changes when the input changes.'
  lesson: derivative
\dot:
  name: dot
  read: dot
  meaning: 'A dot over a quantity means its rate of change in time: ẍ is acceleration, ṁ is mass per second.'
  example: ṡ is speed if s is distance; ṁ is kilograms flowing per second.
  group: calculus
  simple: A dot on top means 'how fast this changes with time'.
  lesson: derivative
\ddot:
  name: double dot
  read: double dot
  meaning: 'Second derivative in time: ẍ is acceleration.'
  group: calculus
  simple: Two dots mean 'how fast the speed of change itself changes'.
  example: ẋ is velocity, ẍ is acceleration.
  lesson: kinematics-constant-acceleration
d:
  name: differential d
  read: dee
  meaning: 'In dx or dt: an infinitely small change in that variable. dy/dx is the derivative of y with respect to x.'
  group: calculus
  simple: A tiny step in that quantity.
  example: 'dx is a very small change in x; dy/dx is the slope: rise per tiny step.'
  lesson: derivative
\propto:
  name: proportional to
  read: is proportional to
  meaning: 'Grows in step with: doubling one doubles the other. y ∝ x means y = (constant) × x.'
  group: relation
  simple: 'Grows in step with: double one and the other doubles.'
  example: 'Cost ∝ number of tickets: 3 tickets cost three times one ticket.'
  lesson: slope
\approx:
  name: approximately equal
  read: is approximately
  meaning: Equal up to a small error.
  group: relation
  simple: Almost equal.
  example: π ≈ 3.14.
\ne:
  name: not equal
  read: is not equal to
  meaning: The two sides differ.
  group: relation
  simple: Not equal.
  example: 3 ≠ 4.
\neq:
  name: not equal
  read: is not equal to
  meaning: The two sides differ.
  group: relation
  simple: Not equal.
  example: 3 ≠ 4.
\le:
  name: less than or equal
  read: is at most
  meaning: Smaller than or equal to.
  group: relation
  simple: Smaller than or equal to.
  example: x ≤ 5 allows 5 and anything below.
\leq:
  name: less than or equal
  read: is at most
  meaning: Smaller than or equal to.
  group: relation
  simple: Smaller than or equal to.
  example: x ≤ 5 allows 5 and anything below.
\ge:
  name: greater than or equal
  read: is at least
  meaning: Larger than or equal to.
  group: relation
  simple: Bigger than or equal to.
  example: x ≥ 5 allows 5 and anything above.
\geq:
  name: greater than or equal
  read: is at least
  meaning: Larger than or equal to.
  group: relation
  simple: Bigger than or equal to.
  example: x ≥ 5 allows 5 and anything above.
\ll:
  name: much less than
  read: is much less than
  meaning: Smaller by a large factor.
  group: relation
  simple: Much smaller than.
  example: 1 ≪ 1000.
\gg:
  name: much greater than
  read: is much greater than
  meaning: Larger by a large factor.
  group: relation
  simple: Much bigger than.
  example: 1000 ≫ 1.
\pm:
  name: plus or minus
  read: plus or minus
  meaning: 'Two cases at once: one with +, one with −. Used for the two roots of a quadratic and for error margins.'
  group: relation
  simple: 'Two answers in one: once with plus, once with minus.'
  example: x = 3 ± 2 means x = 5 or x = 1.
  lesson: quadratic-roots
\mp:
  name: minus or plus
  read: minus or plus
  meaning: The opposite sign choice to a ± earlier in the same formula.
  group: relation
  simple: The opposite sign choice to a ± earlier in the same line.
  example: a ± b ∓ c pairs + with − and − with +.
\cdot:
  name: dot product / times
  read: times / dot
  meaning: Multiplication; between vectors, the dot product.
  group: operator
  simple: Times.
  example: 3 · 4 = 12.
\times:
  name: times / cross product
  read: times / cross
  meaning: Multiplication; between vectors, the cross product (a vector perpendicular to both).
  group: operator
  simple: Times.
  example: 3 × 4 = 12.
\sqrt:
  name: square root
  read: the square root of
  meaning: The number that multiplied by itself gives what is under the sign.
  group: operator
  simple: The number that, multiplied by itself, gives what is inside.
  example: √9 = 3 because 3 × 3 = 9.
  lesson: exponents-and-powers
\frac:
  name: fraction
  read: over
  meaning: The top divided by the bottom.
  group: operator
  simple: Top divided by bottom.
  example: '3/4 of a pizza: cut into 4, take 3.'
\Rightarrow:
  name: implies
  read: implies / therefore
  meaning: If the left side holds, the right side follows.
  group: relation
  simple: Therefore; if the left is true, the right follows.
  example: x = 2 ⇒ x² = 4.
\iff:
  name: if and only if
  read: if and only if
  meaning: Each side implies the other; the two statements are equivalent.
  group: relation
  simple: Each side is true exactly when the other is.
  example: x + 1 = 3 ⇔ x = 2.
\mid:
  name: given
  read: given
  meaning: 'In P(A | B): the probability of A given that B happened.'
  group: probability
  simple: '''Given that'': look only at the cases where the thing after the bar happened.'
  example: P(rain | clouds) is the chance of rain on days that are cloudy.
  lesson: bayes-theorem
\binom:
  name: binomial coefficient
  read: n choose k
  meaning: The number of ways to choose k items from n when order does not matter.
  example: 'From 3 friends, 3 different pairs can be picked: C(3,2) = 3.'
  group: probability
  simple: How many different groups of k you can pick from n things.
  lesson: combinations
'!':
  name: factorial
  read: factorial
  meaning: n! = n × (n−1) × … × 1, the number of ways to arrange n items.
  example: '3! = 3 × 2 × 1 = 6: the ways to line up 3 people.'
  group: probability
  simple: Multiply the number by every whole number below it.
  lesson: permutations
\in:
  name: element of
  read: is in
  meaning: Belongs to the set.
  group: sets
  simple: Is one of.
  example: 3 ∈ {1, 2, 3}.
\subseteq:
  name: subset
  read: is a subset of
  meaning: Every element of the left set is also in the right set.
  group: sets
  simple: Everything in the first set is also in the second.
  example: '{1, 2} ⊆ {1, 2, 3}.'
\cup:
  name: union
  read: or / union
  meaning: Everything in either set; for events, 'A or B'.
  group: sets
  simple: Either one or the other (or both).
  example: 'A ∪ B: in A, in B, or in both.'
  lesson: probability-basics
\cap:
  name: intersection
  read: and / intersection
  meaning: Everything in both sets; for events, 'A and B'.
  group: sets
  simple: Both at once.
  example: 'A ∩ B: in A and also in B.'
  lesson: probability-basics
\mathbb:
  name: number sets
  read: R, the reals
  meaning: ℝ is the set of all real numbers; ℕ the natural numbers; ℤ the integers.
  group: sets
  simple: A famous set of numbers, written in hollow letters.
  example: 'ℝ: all numbers on the number line. ℤ: whole numbers, including negatives.'
\dots:
  name: ellipsis
  read: and so on
  meaning: The pattern continues.
  group: operator
  simple: And so on.
  example: 1, 2, 3, … continues forever.
\cdots:
  name: ellipsis
  read: and so on
  meaning: The pattern continues.
  group: operator
  simple: And so on.
  example: 1 + 2 + ⋯ + 10 continues the pattern to 10.
\langle:
  name: average brackets
  read: the average of
  meaning: ⟨v²⟩ is the average of v² over all particles.
  group: operator
  simple: The average of what is inside.
  example: ⟨v²⟩ is the average of the squared speeds of all the particles.
  lesson: ideal-gas-law
\hat:
  name: hat
  read: hat
  meaning: 'An estimate from data: p̂ is the observed proportion that estimates the true probability p.'
  group: statistics
  simple: Our best guess from data, not the true value.
  example: 'Flip 100 coins, get 53 heads: p̂ = 0.53, our estimate of the true p = 0.5.'
  lesson: law-of-large-numbers
\bar:
  name: bar
  read: bar
  meaning: 'A mean: x̄ is the average of the x values.'
  group: statistics
  simple: The average of the values.
  example: x̄ of 2, 4, 6 is 4.
  lesson: mean-and-spread
\vec:
  name: vector arrow
  read: vector
  meaning: A quantity with a direction as well as a size.
  group: operator
  simple: 'A quantity with a direction: an arrow.'
  example: 'Velocity is a vector: 50 km/h north, not just 50 km/h.'
  lesson: vectors
\mathbf:
  name: bold vector
  read: vector
  meaning: 'Bold letters are vectors: quantities with direction, such as force or velocity.'
  group: operator
  simple: 'Bold letters are arrows: they have a direction, not just a size.'
  example: F is a force pushing somewhere, not just 'a force of 10 N'.
  lesson: vectors
\text:
  name: text
  read: ''
  meaning: Ordinary words inside a formula.
  group: layout
  simple: Ordinary words inside a formula.
  example: P(rain) uses the word 'rain' inside maths.
\rightleftharpoons:
  name: reversible reaction
  read: in equilibrium with
  meaning: The reaction runs both ways at once; at equilibrium the two rates are equal.
  group: relation
  simple: The reaction runs both ways at once.
  example: 'A ⇌ B: A turns into B while B turns back into A.'
  lesson: chemical-equilibrium
\gets:
  name: assignment
  read: becomes
  meaning: In pseudocode, x ← 5 stores 5 in x.
  group: computer-science
  simple: Store the value on the right into the name on the left.
  example: x ← 5 puts 5 into the box called x.
  lesson: algorithms-and-complexity
\searrow:
  name: decreasing arrow
  read: decreases to
  meaning: The quantity falls toward the value.
  group: relation
  simple: Falls toward.
  example: The value decreases to the limit.
\nearrow:
  name: increasing arrow
  read: increases to
  meaning: The quantity rises toward the value.
  group: relation
  simple: Rises toward.
  example: The value increases to the limit.
\arg:
  name: argument
  read: arg
  meaning: argmax f is the input where f is largest, not the largest value itself.
  group: function
  simple: Which input, not which output.
  example: argmax picks the x where the function is biggest, not the biggest value.
  lesson: linear-regression
\sin:
  name: sine
  read: sine
  meaning: For an angle on the unit circle, the height (y-coordinate) of the point.
  group: function
  simple: How high a point on a spinning wheel is, as a fraction of the wheel's radius.
  example: 'At 30° the point is halfway up: sin 30° = 0.5. At 90° it is at the top: sin 90° = 1.'
  lesson: unit-circle
\cos:
  name: cosine
  read: cosine
  meaning: For an angle on the unit circle, the horizontal position (x-coordinate) of the point.
  group: function
  simple: How far to the right a point on a spinning wheel is, as a fraction of the radius.
  example: 'At 0° the point is fully right: cos 0° = 1. At 90° it is straight up, so cos 90° = 0.'
  lesson: unit-circle
\tan:
  name: tangent
  read: tan
  meaning: sin divided by cos; the slope of the line at that angle.
  group: function
  simple: 'The slope of a line at that angle: rise divided by run.'
  example: 'tan 45° = 1: at 45° you rise as much as you go across.'
  lesson: tangent-function
\atan:
  name: arctangent
  read: arctan
  meaning: The angle whose tangent is the given number.
  group: function
  simple: The angle whose slope is the given number.
  example: arctan 1 = 45°.
  lesson: tangent-function
\arctan:
  name: arctangent
  read: arctan
  meaning: The angle whose tangent is the given number.
  group: function
  simple: The angle whose slope is the given number.
  example: arctan 1 = 45°.
  lesson: tangent-function
\log:
  name: logarithm
  read: log
  meaning: 'The power you raise the base to in order to get the number: log₁₀(1000) = 3.'
  group: function
  simple: 'Asks: how many times do I multiply 10 to reach this number?'
  example: log(1000) = 3, because 10 × 10 × 10 = 1000.
  lesson: logarithms
\ln:
  name: natural logarithm
  read: natural log
  meaning: Logarithm with base e ≈ 2.718; ln(e^x) = x.
  group: function
  simple: 'Asks: how many times do I multiply e (2.718…) to reach this number?'
  example: ln(7.39) ≈ 2, because e × e ≈ 7.39.
  lesson: logarithms
\exp:
  name: exponential
  read: e to the
  meaning: exp(x) = eˣ, the function whose rate of change equals its own value.
  group: function
  simple: Multiply e (2.718…) by itself that many times.
  example: exp(2) = e × e ≈ 7.39. Growth that speeds up as it grows.
  lesson: exponential-growth
\tanh:
  name: hyperbolic tangent
  read: tanh
  meaning: An S-shaped function that rises from −1 to 1; appears in terminal-velocity problems.
  group: function
  simple: An S-shaped curve that rises smoothly from −1 to 1 and then flattens.
  example: 'A falling skydiver''s speed follows tanh: it climbs, then levels off at terminal velocity.'
  lesson: terminal-velocity
\max:
  name: maximum
  read: max
  meaning: The largest of the listed values.
  group: function
  simple: The biggest of them.
  example: max(3, 7, 5) = 7.
\min:
  name: minimum
  read: min
  meaning: The smallest of the listed values.
  group: function
  simple: The smallest of them.
  example: min(3, 7, 5) = 3.
\erf:
  name: error function
  read: erf
  meaning: The area under the bell curve, used to compute normal probabilities.
  group: function
  simple: The area under the bell curve between the middle and a point.
  example: Used to answer 'what fraction of people are within one σ of average?' (about 68%).
  lesson: normal-distribution
\operatorname:
  name: named function
  read: ''
  meaning: A function written by name, such as Var or erf.
  group: function
  simple: A function written by its name.
  example: Var(X) is the variance of X.
\mathrm:
  name: upright text
  read: ''
  meaning: Units and names written upright, such as kg or Bin.
  group: layout
  simple: 'Upright letters: units or names, not variables.'
  example: kg, Hz, sin.
e:
  name: Euler's number
  read: e
  meaning: 2.71828…, the base of natural growth; also the charge of an electron in physics.
  group: constant
  simple: 'The number 2.718…: the natural rate of growth.'
  example: 'Money at 100% interest, compounded constantly, grows by e each year: 1 → 2.718.'
  lesson: exponential-growth
i:
  name: index / imaginary unit
  read: i
  meaning: A counting index in sums (i = 1, 2, …); in complex numbers, √−1.
  group: constant
  simple: Either a counter (1st, 2nd, 3rd…) or the imaginary unit, the square root of −1.
  example: In Σ, i counts the terms. In complex numbers, i² = −1.
  lesson: complex-numbers
j:
  name: index
  read: j
  meaning: A second counting index.
  group: constant
  simple: A second counting index.
k:
  name: constant / count
  read: k
  meaning: A constant of proportionality (spring constant, rate constant) or a count in probability.
  group: letter
  simple: A constant of proportionality (spring constant, rate constant) or a count in probability.
n:
