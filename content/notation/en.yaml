# Global notation guide. Key = the LaTeX token as it appears in formulas. Lessons may override a
# letter's meaning with their own `variables`; anything not explained in either place fails `pnpm check`.
# Fields: name, read (how to say it aloud), meaning, example (LaTeX, optional), group.
# ---- Greek letters -----------------------------------------------------------------------------
\alpha: { name: alpha, read: "AL-fa", meaning: "An angle (angle of attack in aerodynamics) or a small constant.", group: greek }
\beta: { name: beta, read: "BAY-ta", meaning: "A second angle or rate; in the SIR model the infection rate.", group: greek }
\gamma: { name: gamma, read: "GAM-ma", meaning: "A third angle or rate; the recovery rate in the SIR model; the heat-capacity ratio in gases.", group: greek }
\delta: { name: delta (small), read: "DEL-ta", meaning: "A small distance or tolerance, as in the ε–δ definition of a limit.", group: greek }
\Delta: { name: Delta (capital), read: "DEL-ta", meaning: "A change in a quantity: Δx means 'the change in x', final minus initial.", example: '\Delta x = x_2 - x_1', group: greek }
\epsilon: { name: epsilon, read: "EP-si-lon", meaning: "A small positive number, an allowed error.", group: greek }
\varepsilon: { name: epsilon, read: "EP-si-lon", meaning: "A small positive number, an allowed error, as in 'within ε of the limit'.", group: greek }
\theta: { name: theta, read: "THAY-ta", meaning: "An angle, usually measured from the positive x-axis.", group: greek }
\lambda: { name: lambda, read: "LAM-da", meaning: "Wavelength of a wave; the average rate in a Poisson distribution; an eigenvalue in linear algebra.", group: greek }
\mu: { name: mu, read: "mew", meaning: "The mean of a distribution; the coefficient of friction; the prefix micro (one millionth).", group: greek }
\nu: { name: nu, read: "new", meaning: "Frequency (physics) or kinematic viscosity (fluids).", group: greek }
\pi: { name: pi, read: "pie", meaning: "The ratio of a circle's circumference to its diameter, 3.14159…", group: greek }
\rho: { name: rho, read: "row", meaning: "Density: mass per unit volume (kg/m³). Air at sea level has ρ ≈ 1.225 kg/m³.", group: greek }
\sigma: { name: sigma (small), read: "SIG-ma", meaning: "Standard deviation, the typical distance of data from the mean; σ² is the variance.", group: greek }
\Sigma: { name: Sigma (capital), read: "SIG-ma", meaning: "Sum sign: add up the terms that follow.", group: greek }
\sum: { name: sum, read: "the sum of", meaning: "Add up all the terms, with the index running from the lower to the upper limit.", example: '\sum_{i=1}^{n} x_i = x_1 + x_2 + \dots + x_n', group: operator }
\tau: { name: tau, read: "tow", meaning: "A time constant, the time for an exponential process to change by a factor e; also torque.", group: greek }
\phi: { name: phi, read: "fee", meaning: "A phase angle: where in its cycle a wave starts. Also the golden ratio.", group: greek }
\varphi: { name: phi, read: "fee", meaning: "A phase angle: where in its cycle a wave starts.", group: greek }
\Phi: { name: Phi (capital), read: "fee", meaning: "Magnetic flux; or the standard normal cumulative distribution function.", group: greek }
\omega: { name: omega, read: "oh-MAY-ga", meaning: "Angular frequency, ω = 2πf (radians per second); angular velocity of rotation.", group: greek }
\Omega: { name: Omega (capital), read: "oh-MAY-ga", meaning: "The unit ohm of electrical resistance; or the set of all outcomes in probability.", group: greek }
\eta: { name: eta, read: "AY-ta", meaning: "Efficiency: useful energy out divided by energy in.", group: greek }
\kappa: { name: kappa, read: "KAP-pa", meaning: "A curvature or a constant of proportionality.", group: greek }
\chi: { name: chi, read: "kai", meaning: "Used in the chi-squared statistic.", group: greek }
\psi: { name: psi, read: "sigh", meaning: "A wave function in quantum mechanics or a stream function in fluids.", group: greek }
\xi: { name: xi, read: "ksee", meaning: "A dummy variable or a random variable.", group: greek }
\zeta: { name: zeta, read: "ZAY-ta", meaning: "A damping ratio in oscillations.", group: greek }
# ---- calculus ------------------------------------------------------------------------------------
\int: { name: integral sign, read: "the integral of", meaning: "Add up infinitely many infinitely thin slices; the area under a curve between the lower and upper limits.", example: '\int_a^b f(x)\,dx', group: calculus }
\lim: { name: limit, read: "the limit as", meaning: "The value a function approaches as its input approaches a point, without needing to reach it.", example: '\lim_{x \to 0} \frac{\sin x}{x} = 1', group: calculus }
\partial: { name: partial derivative sign, read: "partial", meaning: "Rate of change with respect to one variable while all the others are held fixed.", example: '\frac{\partial f}{\partial x}', group: calculus }
\nabla: { name: nabla / del, read: "del", meaning: "The gradient operator: the vector of all partial derivatives; it points in the direction of steepest increase.", example: '\nabla f = (f_x, f_y)', group: calculus }
\to: { name: arrow, read: "approaches / goes to", meaning: "In a limit, the input approaches this value; in reactions, 'turns into'.", group: calculus }
\infty: { name: infinity, read: "infinity", meaning: "Without bound: larger than any number. Not a number itself.", group: calculus }
"'": { name: prime, read: "prime", meaning: "The derivative: f′(x) is the rate of change of f; f″ is the second derivative.", example: "f'(x)", group: calculus }
\dot: { name: dot, read: "dot", meaning: "A dot over a quantity means its rate of change in time: ẍ is acceleration, ṁ is mass per second.", example: '\dot{x} = \frac{dx}{dt}', group: calculus }
\ddot: { name: double dot, read: "double dot", meaning: "Second derivative in time: ẍ is acceleration.", group: calculus }
d: { name: differential d, read: "dee", meaning: "In dx or dt: an infinitely small change in that variable. dy/dx is the derivative of y with respect to x.", group: calculus }
# ---- operators and relations ---------------------------------------------------------------------
\propto: { name: proportional to, read: "is proportional to", meaning: "Grows in step with: doubling one doubles the other. y ∝ x means y = (constant) × x.", group: relation }
\approx: { name: approximately equal, read: "is approximately", meaning: "Equal up to a small error.", group: relation }
\ne: { name: not equal, read: "is not equal to", meaning: "The two sides differ.", group: relation }
\neq: { name: not equal, read: "is not equal to", meaning: "The two sides differ.", group: relation }
\le: { name: less than or equal, read: "is at most", meaning: "Smaller than or equal to.", group: relation }
\leq: { name: less than or equal, read: "is at most", meaning: "Smaller than or equal to.", group: relation }
\ge: { name: greater than or equal, read: "is at least", meaning: "Larger than or equal to.", group: relation }
\geq: { name: greater than or equal, read: "is at least", meaning: "Larger than or equal to.", group: relation }
\ll: { name: much less than, read: "is much less than", meaning: "Smaller by a large factor.", group: relation }
\gg: { name: much greater than, read: "is much greater than", meaning: "Larger by a large factor.", group: relation }
\pm: { name: plus or minus, read: "plus or minus", meaning: "Two cases at once: one with +, one with −. Used for the two roots of a quadratic and for error margins.", group: relation }
\mp: { name: minus or plus, read: "minus or plus", meaning: "The opposite sign choice to a ± earlier in the same formula.", group: relation }
\cdot: { name: dot product / times, read: "times / dot", meaning: "Multiplication; between vectors, the dot product.", group: operator }
\times: { name: times / cross product, read: "times / cross", meaning: "Multiplication; between vectors, the cross product (a vector perpendicular to both).", group: operator }
\sqrt: { name: square root, read: "the square root of", meaning: "The number that multiplied by itself gives what is under the sign.", group: operator }
\frac: { name: fraction, read: "over", meaning: "The top divided by the bottom.", group: operator }
\Rightarrow: { name: implies, read: "implies / therefore", meaning: "If the left side holds, the right side follows.", group: relation }
\iff: { name: if and only if, read: "if and only if", meaning: "Each side implies the other; the two statements are equivalent.", group: relation }
\mid: { name: given, read: "given", meaning: "In P(A | B): the probability of A given that B happened.", group: probability }
\binom: { name: binomial coefficient, read: "n choose k", meaning: "The number of ways to choose k items from n when order does not matter.", example: '\binom{n}{k} = \frac{n!}{k!\,(n-k)!}', group: probability }
"!": { name: factorial, read: "factorial", meaning: "n! = n × (n−1) × … × 1, the number of ways to arrange n items.", example: '5! = 120', group: probability }
\in: { name: element of, read: "is in", meaning: "Belongs to the set.", group: sets }
\subseteq: { name: subset, read: "is a subset of", meaning: "Every element of the left set is also in the right set.", group: sets }
\cup: { name: union, read: "or / union", meaning: "Everything in either set; for events, 'A or B'.", group: sets }
\cap: { name: intersection, read: "and / intersection", meaning: "Everything in both sets; for events, 'A and B'.", group: sets }
\mathbb: { name: number sets, read: "R, the reals", meaning: "ℝ is the set of all real numbers; ℕ the natural numbers; ℤ the integers.", group: sets }
\dots: { name: ellipsis, read: "and so on", meaning: "The pattern continues.", group: operator }
\cdots: { name: ellipsis, read: "and so on", meaning: "The pattern continues.", group: operator }
\langle: { name: average brackets, read: "the average of", meaning: "⟨v²⟩ is the average of v² over all particles.", group: operator }
\hat: { name: hat, read: "hat", meaning: "An estimate from data: p̂ is the observed proportion that estimates the true probability p.", group: statistics }
\bar: { name: bar, read: "bar", meaning: "A mean: x̄ is the average of the x values.", group: statistics }
\vec: { name: vector arrow, read: "vector", meaning: "A quantity with a direction as well as a size.", group: operator }
\mathbf: { name: bold vector, read: "vector", meaning: "Bold letters are vectors: quantities with direction, such as force or velocity.", group: operator }
\text: { name: text, read: "", meaning: "Ordinary words inside a formula.", group: layout }
\rightleftharpoons: { name: reversible reaction, read: "in equilibrium with", meaning: "The reaction runs both ways at once; at equilibrium the two rates are equal.", group: relation }
\gets: { name: assignment, read: "becomes", meaning: "In pseudocode, x ← 5 stores 5 in x.", group: computer-science }
\searrow: { name: decreasing arrow, read: "decreases to", meaning: "The quantity falls toward the value.", group: relation }
\nearrow: { name: increasing arrow, read: "increases to", meaning: "The quantity rises toward the value.", group: relation }
\arg: { name: argument, read: "arg", meaning: "argmax f is the input where f is largest, not the largest value itself.", group: function }
# ---- functions ---------------------------------------------------------------------------------
\sin: { name: sine, read: "sine", meaning: "For an angle on the unit circle, the height (y-coordinate) of the point.", group: function }
\cos: { name: cosine, read: "cosine", meaning: "For an angle on the unit circle, the horizontal position (x-coordinate) of the point.", group: function }
\tan: { name: tangent, read: "tan", meaning: "sin divided by cos; the slope of the line at that angle.", group: function }
\atan: { name: arctangent, read: "arctan", meaning: "The angle whose tangent is the given number.", group: function }
\arctan: { name: arctangent, read: "arctan", meaning: "The angle whose tangent is the given number.", group: function }
\log: { name: logarithm, read: "log", meaning: "The power you raise the base to in order to get the number: log₁₀(1000) = 3.", group: function }
\ln: { name: natural logarithm, read: "natural log", meaning: "Logarithm with base e ≈ 2.718; ln(e^x) = x.", group: function }
\exp: { name: exponential, read: "e to the", meaning: "exp(x) = eˣ, the function whose rate of change equals its own value.", group: function }
\tanh: { name: hyperbolic tangent, read: "tanh", meaning: "An S-shaped function that rises from −1 to 1; appears in terminal-velocity problems.", group: function }
\max: { name: maximum, read: "max", meaning: "The largest of the listed values.", group: function }
\min: { name: minimum, read: "min", meaning: "The smallest of the listed values.", group: function }
\erf: { name: error function, read: "erf", meaning: "The area under the bell curve, used to compute normal probabilities.", group: function }
\operatorname: { name: named function, read: "", meaning: "A function written by name, such as Var or erf.", group: function }
\mathrm: { name: upright text, read: "", meaning: "Units and names written upright, such as kg or Bin.", group: layout }
# ---- standard letters (defaults; a lesson's own variables take precedence) -----------------------
e: { name: Euler's number, read: "e", meaning: "2.71828…, the base of natural growth; also the charge of an electron in physics.", group: constant }
i: { name: index / imaginary unit, read: "i", meaning: "A counting index in sums (i = 1, 2, …); in complex numbers, √−1.", group: constant }
j: { name: index, read: "j", meaning: "A second counting index.", group: constant }
k: { name: constant / count, read: "k", meaning: "A constant of proportionality (spring constant, rate constant) or a count in probability.", group: letter }
n: { name: count, read: "n", meaning: "How many: trials, items, moles or rectangles.", group: letter }
N: { name: total count, read: "N", meaning: "A total number: of trials, particles or people.", group: letter }
t: { name: time, read: "t", meaning: "Time, usually in seconds.", group: letter }
x: { name: x, read: "x", meaning: "The input of a function, or a horizontal position.", group: letter }
y: { name: y, read: "y", meaning: "The output of a function, or a vertical position.", group: letter }
z: { name: z, read: "z", meaning: "A third coordinate, or the output of a function of two variables.", group: letter }
f: { name: function, read: "f", meaning: "A rule that turns an input into an output; f(x) is its output at x.", group: letter }
g: { name: gravity / function, read: "g", meaning: "The acceleration of gravity, 9.81 m/s² on Earth; or a second function.", group: letter }
h: { name: small step / height, read: "h", meaning: "A small step in the input (as in the derivative's limit) or a height.", group: letter }
a: { name: a, read: "a", meaning: "A coefficient, a lower limit of integration, or acceleration.", group: letter }
b: { name: b, read: "b", meaning: "A coefficient or the upper limit of integration.", group: letter }
c: { name: c, read: "c", meaning: "A constant; the speed of light in relativity; the hypotenuse in the Pythagorean theorem.", group: letter }
m: { name: mass / slope, read: "m", meaning: "Mass in physics; the slope of a line in algebra.", group: letter }
v: { name: velocity, read: "v", meaning: "Speed with a direction, in m/s.", group: letter }
u: { name: u, read: "u", meaning: "A substitution variable or an initial velocity.", group: letter }
p: { name: probability / momentum, read: "p", meaning: "A probability between 0 and 1; in mechanics, momentum p = mv; in gases, pressure.", group: letter }
q: { name: charge, read: "q", meaning: "Electric charge in coulombs; or 1 − p in probability.", group: letter }
r: { name: radius / rate, read: "r", meaning: "A radius or distance from a centre; in growth models, a rate.", group: letter }
s: { name: s, read: "s", meaning: "Distance travelled, a selection coefficient, or seconds.", group: letter }
w: { name: w, read: "w", meaning: "A weight or width.", group: letter }
A: { name: area / amplitude, read: "A", meaning: "Area, amplitude of a wave, or an event in probability.", group: letter }
B: { name: magnetic field / event, read: "B", meaning: "Magnetic field strength in tesla; or a second event in probability.", group: letter }
C: { name: capacitance / constant, read: "C", meaning: "Capacitance in farads; an integration constant; C(n,k) counts combinations.", group: letter }
D: { name: drag / diameter, read: "D", meaning: "Drag force, diameter, or a directional derivative.", group: letter }
E: { name: energy / field / expectation, read: "E", meaning: "Energy in joules; electric field in V/m; E[X] the expected value of X.", group: letter }
F: { name: force, read: "F", meaning: "Force in newtons.", group: letter }
G: { name: gravitational constant, read: "G", meaning: "6.674 × 10⁻¹¹ N·m²/kg², the strength of gravity.", group: constant }
H: { name: H, read: "H", meaning: "Height, or the Hessian matrix of second derivatives.", group: letter }
I: { name: current / infected, read: "I", meaning: "Electric current in amperes; the infected group in an epidemic model.", group: letter }
J: { name: J, read: "J", meaning: "Current density or the joule.", group: letter }
K: { name: carrying capacity / equilibrium constant, read: "K", meaning: "The population an environment can support; or a chemical equilibrium constant.", group: letter }
L: { name: length / lift / limit / inductance, read: "L", meaning: "A length, lift force, the value of a limit, or inductance in henries.", group: letter }
M: { name: mass / Mach number, read: "M", meaning: "A large mass (a planet), molar mass, or the Mach number.", group: letter }
P: { name: pressure / probability / power, read: "P", meaning: "Pressure in pascals; P(A) the probability of A; electrical power in watts; population.", group: letter }
Q: { name: heat / charge, read: "Q", meaning: "Heat energy in joules, or total charge.", group: letter }
R: { name: resistance / gas constant / range, read: "R", meaning: "Electrical resistance in ohms; the gas constant 8.314 J/(mol·K); range; the recovered group.", group: letter }
S: { name: area / entropy / susceptible, read: "S", meaning: "A surface area (wing area), entropy, or the susceptible group in an epidemic model.", group: letter }
T: { name: temperature / period, read: "T", meaning: "Temperature in kelvin, or the period of an oscillation in seconds.", group: letter }
U: { name: internal energy, read: "U", meaning: "The internal energy of a system.", group: letter }
V: { name: voltage / volume, read: "V", meaning: "Voltage in volts, or volume in litres or m³.", group: letter }
W: { name: work / weight, read: "W", meaning: "Work done or weight, in joules or newtons.", group: letter }
X: { name: random variable, read: "X", meaning: "A random variable: a quantity whose value depends on chance.", group: statistics }
Y: { name: Y, read: "Y", meaning: "A second random variable or coordinate.", group: statistics }
Z: { name: standard score, read: "Z", meaning: "A standardised value: how many standard deviations from the mean.", group: statistics }
O: { name: big O, read: "big O of", meaning: "An upper bound on growth: O(n²) means the running time grows at most like n².", group: computer-science }
o: { name: little o, read: "little o of", meaning: "Grows strictly slower than: o(h) vanishes faster than h.", group: calculus }
