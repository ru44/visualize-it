id: hilbert-curve
subject: numbers
difficulty: high-school
equation: 'i \to (x, y)'
concepts:
- space-filling curve
- locality
- recursion
prerequisites:
- place-value
related:
- prime-numbers
visualization:
  type: hilbert-curve
  options: {}
visualization3d:
  type: hilbert
  options: {}
parameters:
  order:
    min: 1
    max: 5
    step: 1
    value: 3
  t:
    min: 0
    max: 1
    step: 0.01
    value: 0
variables:
- k
- i
- x
- y
derivation:
- '\text{order } k \Rightarrow \text{grid is } 2^k \times 2^k'
- '\text{write } i \text{ in base 4, one digit per level}'
- '\text{each digit rotates and offsets } (x,y) \text{ by that level}'
charts: []
primary: t
presets:
- order: 2
  t: 1
- order: 4
  t: 0.5
- order: 5
  t: 1
challenges:
- check: order >= 4 and t >= 0.9
- check: abs(order - 2) < 0.5 and t >= 0.99
- check: t
  target: 0.5
  tol: 0.05
