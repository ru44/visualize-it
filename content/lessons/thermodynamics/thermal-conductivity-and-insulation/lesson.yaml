id: thermal-conductivity-and-insulation
subject: thermodynamics
difficulty: high-school
equation: \frac{Q}{t} = \frac{kA\Delta T}{d}, \qquad U = \frac{k}{d}
concepts:
  - thermal-conductivity
  - u-value
  - insulation
  - conduction
prerequisites: []
related:
  - heat-transfer-conduction-convection-radiation
  - thermal-expansion
visualization:
  type: insulation
  options: {}
parameters:
  k:
    min: 0.02
    max: 2
    step: 0.02
    value: 0.04
    unit: W/(m·K)
  A:
    min: 1
    max: 30
    step: 1
    value: 15
    unit: m²
  d:
    min: 0.01
    max: 0.6
    step: 0.01
    value: 0.15
    unit: m
  dT:
    min: 5
    max: 40
    step: 1
    value: 20
    unit: °C
variables:
  - Q
  - t
  - k
  - A
  - \Delta T
  - d
  - U
derivation:
  - '\text{Fourier''s law: conductive heat flow through a slab depends on } k, A, \Delta T \text{ and inversely on thickness } d.'
  - \frac{Q}{t} = \frac{kA\Delta T}{d} \;\text{gives the heat-loss rate directly, in watts.}
  - \text{Builders roll } k/d \text{ into one number, the U-value, so } \frac{Q}{t} = UA\Delta T.
charts: []
primary: k
presets:
  - k: 0.04
    A: 15
    d: 0.15
    dT: 20
  - k: 0.8
    A: 15
    d: 0.25
    dT: 20
  - k: 0.13
    A: 2
    d: 0.04
    dT: 15
challenges:
  - check: k*A*dT/d < 50 and A > 10
  - check: k/d < 0.3
  - check: k*A*dT/d > 500 and k > 0.5
