id: first-law-thermodynamics
subject: thermodynamics
difficulty: university
equation: \Delta U = Q - W, \qquad W = \int_{V_1}^{V_2} P\,dV
concepts:
  - internal-energy
  - heat
  - work
  - pressure-volume-work
  - isothermal-process
prerequisites:
  - area-under-curve
  - integral
related:
  - entropy-and-heat-engines
  - ideal-gas-law
visualization:
  type: function-plot
  options:
    expr: n*8.314*T/x
    domain:
      - 0.5
      - 10
    range:
      - 0
      - 5200
    mode: area
parameters:
  n:
    min: 0.1
    max: 5
    step: 0.1
    value: 1
    unit: mol
  T:
    min: 200
    max: 500
    step: 10
    value: 300
    unit: K
  a:
    min: 0.5
    max: 9
    step: 0.1
    value: 1
    unit: L
  b:
    min: 1
    max: 10
    step: 0.1
    value: 5
    unit: L
variables:
  - U
  - Q
  - W
  - P, V, T
derivation:
  - P = \frac{nRT}{V}
  - W = \int_{V_1}^{V_2} \frac{nRT}{V}\,dV = nRT\big[\ln V\big]_{V_1}^{V_2}
  - W = nRT\ln\!\frac{V_2}{V_1}, \qquad \Delta U = 0 \;\Rightarrow\; Q = W
charts: []
