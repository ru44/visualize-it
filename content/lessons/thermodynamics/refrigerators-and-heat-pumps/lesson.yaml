id: refrigerators-and-heat-pumps
subject: thermodynamics
difficulty: university
equation: COP_{cool} = \frac{T_c}{T_h - T_c}, \qquad COP_{heat} = \frac{T_h}{T_h - T_c}
concepts:
  - coefficient-of-performance
  - refrigeration-cycle
  - heat-pump
  - second-law
prerequisites: []
related:
  - entropy-and-heat-engines
  - first-law-thermodynamics
visualization:
  type: heat-pump
  options: {}
parameters:
  Tc:
    min: 250
    max: 285
    step: 1
    value: 277
    unit: K
  Th:
    min: 290
    max: 320
    step: 1
    value: 295
    unit: K
variables:
  - COP_{cool}
  - COP_{heat}
  - T_c
  - T_h
derivation:
  - COP_{cool} = \frac{Q_c}{W} = \frac{Q_c}{Q_h - Q_c}
  - "\\frac{Q_c}{T_c} = \\frac{Q_h}{T_h} \\;\\Rightarrow\\; COP_{cool} = \\frac{T_c}{T_h - T_c}"
  - COP_{heat} = \frac{Q_h}{W} = \frac{T_h}{T_h - T_c} = COP_{cool} + 1
charts: []
primary: Th
presets:
  - Tc: 277
    Th: 295
  - Tc: 268
    Th: 293
  - Tc: 283
    Th: 308
challenges:
  - check: Th/(Th-Tc)
    target: 10
  - check: Tc/(Th-Tc) < 4 and Tc < 260
  - check: Th - Tc
    target: 20
