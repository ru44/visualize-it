id: rc-circuit
subject: electricity
difficulty: university
equation: V_C(t) = V_0\left(1 - e^{-t/RC}\right)
concepts:
  - capacitor
  - time-constant
  - exponential
  - differential-equation
prerequisites:
  - ohms-law
  - exponential-growth
related:
  - sine-wave
visualization:
  type: function-plot
  options:
    expr: V0*(1 - exp(-x/(R*C/1000)))
    domain:
      - 0
      - 10
    range:
      - -1
      - 13
    mode: tangent
parameters:
  V0:
    min: 1
    max: 12
    step: 0.5
    value: 9
    unit: V
  R:
    min: 0.5
    max: 10
    step: 0.1
    value: 2
    unit: kΩ
  C:
    min: 100
    max: 2000
    step: 50
    value: 1000
    unit: µF
  x:
    min: 0
    max: 10
    step: 0.01
    value: 2
    unit: s
variables:
  - V_C
  - V_0
  - \tau = RC
derivation:
  - V_0 = R\,C\frac{dV_C}{dt} + V_C
  - \frac{d}{dt}(V_0 - V_C) = -\frac{1}{RC}(V_0 - V_C)
  - V_C = V_0\left(1 - e^{-t/RC}\right)
charts:
  - domain:
      - 0
      - 10
    marker: x
    series:
      - V0/R*exp(-x/(R*C/1000))
primary: R
presets:
  - V0: 9
    R: 2
    C: 1000
  - V0: 6
    R: 0.5
    C: 2000
  - V0: 12
    R: 8
    C: 1000
challenges:
  - check: R*C/1000
    target: 5
  - check: abs(x-5)<0.1 and (1-exp(-x/(R*C/1000)))>=0.9
  - check: abs((1-exp(-x/(R*C/1000))) - 0.5) < 0.02
