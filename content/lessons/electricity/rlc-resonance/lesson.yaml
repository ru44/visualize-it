id: rlc-resonance
subject: electricity
difficulty: university
equation: I(f) = \frac{V}{\sqrt{R^2+\left(2\pi f L-\dfrac{1}{2\pi f C}\right)^2}}, \qquad f_0=\frac{1}{2\pi\sqrt{LC}}
concepts:
  - impedance
  - reactance
  - resonance
  - q-factor
prerequisites:
  - sine-wave
  - rc-circuit
related:
  - series-parallel
  - ac-power
visualization:
  type: function-plot
  options:
    expr: V / sqrt(R^2 + (2*pi*x*L/1000 - 1/(2*pi*x*C*1e-6))^2)
    domain:
      - 10
      - 400
    range:
      - 0
      - 1.1
    mode: tangent
parameters:
  V:
    min: 1
    max: 20
    step: 0.5
    value: 10
    unit: V
  R:
    min: 1
    max: 50
    step: 1
    value: 10
    unit: Ω
  L:
    min: 1
    max: 200
    step: 1
    value: 50
    unit: mH
  C:
    min: 1
    max: 200
    step: 1
    value: 20
    unit: µF
  x:
    min: 10
    max: 400
    step: 1
    value: 159
    unit: Hz
variables:
  - L
  - C
  - f_0
  - Q
derivation:
  - Z = R + j\left(2\pi f L - \frac{1}{2\pi f C}\right)
  - "|Z| = \\sqrt{R^2+\\left(2\\pi f L-\\frac{1}{2\\pi f C}\\right)^2}, \\qquad I=\\frac{V}{|Z|}"
  - 2\pi f_0 L = \frac{1}{2\pi f_0 C} \;\Rightarrow\; f_0 = \frac{1}{2\pi\sqrt{LC}}
