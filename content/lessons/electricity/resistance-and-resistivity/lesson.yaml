    A: 0.1
    mat: 1
  - L: 1
    A: 0.1
    mat: 1
challenges:
  - check: '(mat < 0.5 ? 1.68e-8 : 1.10e-6) * L / (A*1e-6)'
    target: 0.05
  - check: 'mat > 0.5 and (mat < 0.5 ? 1.68e-8 : 1.10e-6) * L / (A*1e-6) > 40 and A < 2'
  - check: 'mat < 0.5 and (mat < 0.5 ? 1.68e-8 : 1.10e-6) * L / (A*1e-6) < 0.01 and L >= 2'
