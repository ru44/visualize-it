id: resistance-and-resistivity
subject: electricity
difficulty: high-school
equation: R = \rho\frac{L}{A}
concepts:
- resistance
- resistivity
- resistors
prerequisites:
- ohms-law
related:
- kirchhoffs-laws
- electric-power-and-energy-bills
visualization:
  type: resistance-and-resistivity
  options: {}
visualization3d:
  type: resistance-and-resistivity
  options: {}
primary: L
parameters:
