id: smith-chart
subject: electricity
difficulty: university
equation: \Gamma = \frac{Z_L - Z_0}{Z_L + Z_0}
concepts:
- smith-chart
- reflection-coefficient
- impedance-matching
- transmission-line
- standing-wave-ratio
prerequisites:
- rlc-resonance
