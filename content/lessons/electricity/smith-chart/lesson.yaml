variables:
- \Gamma
- Z_L
- Z_0
- z
- r
- x
- j
derivation:
- z = \frac{Z_L}{Z_0} = r + jx
- \Gamma = \frac{z - 1}{z + 1}
- '\text{VSWR} = \frac{1 + |\Gamma|}{1 - |\Gamma|}'
- \Gamma(d) = \Gamma(0)\, e^{-j\,4\pi d/\lambda}
