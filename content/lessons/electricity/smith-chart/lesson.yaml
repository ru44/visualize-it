challenges:
- check: ((R/50)^2 - 1 + (X/50)^2)^2 + (2*X/50)^2 < 0.01 * ((R/50 + 1)^2 + (X/50)^2)^2
- check: abs((((R/50)^2 - 1 + (X/50)^2)^2 + (2*X/50)^2) / ((R/50 + 1)^2 + (X/50)^2)^2 - 0.25) < 0.01
- check: abs(R - 100) < 0.5 and abs(X - 50) < 0.5 and abs(d - 0.125) < 0.003
