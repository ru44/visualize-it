    unit: m
variables:
- L
- D
- \gamma
derivation:
- W\sin\gamma = D, \quad W\cos\gamma = L
- \dfrac{L}{D} = \dfrac{\cos\gamma}{\sin\gamma} = \dfrac{1}{\tan\gamma}
- \tan\gamma \approx \gamma \;\Rightarrow\; \text{distance} \approx h \cdot (L/D)
