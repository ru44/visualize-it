id: stall-and-angle-of-attack
subject: aerodynamics
difficulty: university
equation: C_L(\alpha) \nearrow \text{until } \alpha_{\text{crit}}, \text{ then } C_L \searrow
concepts:
  - stall
  - separation
  - angle-of-attack
  - boundary-layer
prerequisites:
  - lift
related:
  - lift
  - lift-to-drag
visualization:
  type: airfoil
  options: {}
parameters:
  alpha:
    min: -5
    max: 20
    step: 0.5
    value: 14
    unit: °
  v:
    min: 10
    max: 90
    step: 1
    value: 40
    unit: m/s
variables:
  - \alpha
  - \alpha_{\text{crit}}
  - C_L
derivation:
  - L = W \;\Rightarrow\; \tfrac12\rho v^2 S C_L = W
  - C_L \le C_{L,\max}
  - v_{\text{stall}} = \sqrt{\dfrac{2W}{\rho S\, C_{L,\max}}}
charts:
  - domain:
      - -5
      - 20
    marker: alpha
    series:
      - "x < 15 ? 0.11*(x+2) : 1.87 - 0.19*(x-15)"
