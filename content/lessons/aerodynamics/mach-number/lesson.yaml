id: mach-number
subject: aerodynamics
difficulty: advanced
equation: M = \frac{v}{a}, \qquad a = \sqrt{\gamma R T}
concepts:
  - mach-number
  - speed-of-sound
  - compressibility
  - shock-wave
prerequisites:
  - ideal-gas-law
  - function-graph
related:
  - drag-equation
  - lift
visualization:
  type: function-plot
  options:
    expr: sqrt(1.4*287*x)
    domain:
      - 200
      - 320
    range:
      - 260
      - 370
    mode: plain
visualization3d:
  type: airfoil
  options:
    mode: mach
parameters:
  x:
    min: 200
    max: 320
    step: 1
    value: 288
    unit: K
  vAircraft:
    min: 50
    max: 340
    step: 5
    value: 250
    unit: m/s
variables:
  - M
  - a
  - \gamma
  - R
  - T
derivation:
  - p = \rho R T
  - a^2 = \left(\frac{\partial p}{\partial \rho}\right)_{s} = \gamma R T
  - M = \frac{v}{a} = \frac{v}{\sqrt{\gamma R T}}
charts:
  - domain:
      - 200
      - 320
    marker: x
    series:
      - vAircraft/sqrt(1.4*287*x)
primary: vAircraft
presets:
- x: 220
  vAircraft: 250
- x: 305
  vAircraft: 90
- x: 220
  vAircraft: 340
challenges:
- check: 'vAircraft/sqrt(1.4*287*x)'
  target: 0.8
  tol: 0.05
- check: 'x <= 220 and vAircraft/sqrt(1.4*287*x) > 1'
- check: 'vAircraft >= 100 and vAircraft/sqrt(1.4*287*x) < 0.3'
