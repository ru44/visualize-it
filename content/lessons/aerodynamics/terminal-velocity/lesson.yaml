id: terminal-velocity
subject: aerodynamics
difficulty: university
equation: v(t) = v_t \tanh\!\left(\frac{g t}{v_t}\right), \qquad v_t = \sqrt{\frac{2mg}{\rho C_D A}}
concepts:
  - terminal-velocity
  - differential-equation
  - drag
prerequisites:
  - newtons-second-law
  - drag-equation
  - derivative
related:
  - drag-equation
  - exponential-growth
visualization:
  type: function-plot
  options:
    expr: sqrt(2*m*9.81/(1.225*Cd*A)) * tanh(9.81*x/sqrt(2*m*9.81/(1.225*Cd*A)))
    domain:
      - 0
      - 30
    range:
      - -4
      - 70
    mode: tangent
parameters:
  m:
    min: 40
    max: 120
    step: 1
    value: 75
    unit: kg
  Cd:
    min: 0.5
    max: 1.4
    step: 0.01
    value: 1
  A:
    min: 0.3
    max: 1.2
    step: 0.01
    value: 0.7
    unit: m²
  x:
    min: 0
    max: 30
    step: 0.1
    value: 8
    unit: s
variables:
  - v(t)
  - v_t
  - m
  - C_D, A
derivation:
  - m\dot v = mg - \tfrac12\rho C_D A v^2
  - \dot v = g\left(1 - \frac{v^2}{v_t^2}\right), \qquad v_t^2 = \frac{2mg}{\rho C_D A}
  - v(t) = v_t\tanh\!\left(\frac{gt}{v_t}\right)
charts:
  - domain:
      - 0
      - 30
    marker: x
    series:
      - 0.5*1.225*Cd*A*(sqrt(2*m*9.81/(1.225*Cd*A)) * tanh(9.81*x/sqrt(2*m*9.81/(1.225*Cd*A))))^2
      - m*9.81
