id: four-forces-of-flight
subject: aerodynamics
difficulty: high-school
equation: T - D = W\sin\gamma
concepts:
- lift
- weight
- thrust
- drag
- climb-angle
prerequisites: []
related:
- lift
- drag-equation
- gliding-and-glide-ratio
visualization:
  type: four-forces-of-flight
  options: {}
primary: throttle
parameters:
  throttle:
    min: 0
    max: 100
    step: 1
    value: 61
    unit: '%'
  v:
    min: 40
    max: 150
    step: 1
    value: 100
    unit: m/s
variables:
- T
- D
- W
- \gamma
derivation:
- D = \tfrac12\rho v^2 C_D A
- T - D = W\sin\gamma
- L = W\cos\gamma
charts: []
presets:
- throttle: 80
  v: 100
- throttle: 61
  v: 100
- throttle: 30
  v: 100
challenges:
- check: 'v*asin(min(1,max(-1,(throttle/100*60000-3.675*v^2)/78400)))'
  target: 10
  tol: 1.5
- check: 'abs(asin(min(1,max(-1,(throttle/100*60000-3.675*v^2)/78400)))*180/pi) < 0.5'
- check: 'asin(min(1,max(-1,(throttle/100*60000-3.675*v^2)/78400)))*180/pi < -10'
