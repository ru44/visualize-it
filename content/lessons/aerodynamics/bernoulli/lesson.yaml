id: bernoulli
subject: aerodynamics
difficulty: university
equation: p + \tfrac12 \rho v^2 = \text{const}, \qquad A_1 v_1 = A_2 v_2
concepts:
  - continuity
  - pressure
  - incompressible-flow
prerequisites:
  - newtons-second-law
related:
  - lift
  - drag-equation
visualization:
  type: venturi
  options: {}
visualization3d:
  type: airfoil
  options:
    mode: venturi
parameters:
  v1:
    min: 2
    max: 30
    step: 0.5
    value: 10
    unit: m/s
  ratio:
    min: 0.2
    max: 1
    step: 0.01
    value: 0.5
variables:
  - p
  - v
  - A
  - \rho
derivation:
  - \rho A_1 v_1 = \rho A_2 v_2 \;\Rightarrow\; A_1 v_1 = A_2 v_2
  - dp = -\rho v\, dv
  - p_1 + \tfrac12\rho v_1^2 = p_2 + \tfrac12\rho v_2^2
charts: []
primary: ratio
presets:
- v1: 5
  ratio: 0.3
- v1: 10
  ratio: 0.5
- v1: 25
  ratio: 0.25
challenges:
- check: 'v1/ratio'
  target: 20
  tol: 2
- check: '0.6125*v1^2*(1/ratio^2-1)'
  target: 500
  tol: 50
- check: 'v1/ratio < 15 and 0.6125*v1^2*(1/ratio^2-1) > 100'
