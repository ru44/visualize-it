id: titration-curve
subject: chemistry
difficulty: university
equation: "C_a V_a = C_b V_{eq}"
concepts:
  - titration
  - equivalence-point
  - acid-base-reaction
  - indicator
prerequisites:
  - ph-scale
  - dilution-molarity
related:
  - chemical-equilibrium
  - logarithms
visualization:
  type: function-plot
  options:
    expr: "x < Ca*Va/Cb ? -log10((Ca*Va - Cb*x)/(Va + x)) : (x > Ca*Va/Cb ? 14 + log10((Cb*x - Ca*Va)/(Va + x)) : 7)"
    domain:
      - 0
      - 60
    range:
      - 0
      - 14
    mode: plain
parameters:
  Ca:
    min: 0.01
    max: 1
    step: 0.01
    value: 0.1
    unit: mol/L
  Va:
    min: 10
    max: 100
    step: 1
    value: 25
    unit: mL
  Cb:
    min: 0.01
    max: 1
    step: 0.01
    value: 0.1
    unit: mol/L
  x:
    min: 0
    max: 60
    step: 0.1
    value: 10
    unit: mL
variables:
  - C_a
  - V_a
  - C_b
  - V_{eq}
derivation:
  - "n_a = C_a V_a"
  - "n_b = C_b x"
  - "n_a = n_b \\Rightarrow V_{eq} = \\dfrac{C_a V_a}{C_b}"
charts: []
