id: chemical-equilibrium
subject: chemistry
difficulty: university
equation: \mathrm{A} \rightleftharpoons \mathrm{B}, \qquad K = \frac{k_f}{k_r}
concepts:
  - equilibrium
  - equilibrium-constant
  - forward-rate
  - reverse-rate
  - le-chateliers-principle
prerequisites:
  - reaction-rate
related:
  - chemical-reaction
  - reaction-rate
visualization:
  type: function-plot
  options:
    expr: A0*(kr + kf*exp(-(kf+kr)*x))/(kf+kr)
    domain:
      - 0
      - 20
    range:
      - 0
      - 1.1
    mode: plain
parameters:
  A0:
    min: 0.2
    max: 2
    step: 0.1
    value: 1
    unit: mol/L
  kf:
    min: 0.01
    max: 1
    step: 0.01
    value: 0.3
    unit: 1/s
  kr:
    min: 0.01
    max: 1
    step: 0.01
    value: 0.1
    unit: 1/s
  x:
    min: 0
    max: 20
    step: 0.1
    value: 5
    unit: s
variables:
  - "[\\mathrm{A}], [\\mathrm{B}]"
  - k_f, k_r
  - K
derivation:
  - \frac{d[\mathrm{A}]}{dt} = -k_f[\mathrm{A}] + k_r([\mathrm{A}]_0 - [\mathrm{A}])
  - \frac{d[\mathrm{A}]}{dt} = -(k_f+k_r)[\mathrm{A}] + k_r[\mathrm{A}]_0
  - "[\\mathrm{A}] = \\frac{[\\mathrm{A}]_0\\big(k_r + k_f e^{-(k_f+k_r)t}\\big)}{k_f + k_r}"
charts:
  - domain:
      - 0
      - 20
    marker: x
    series:
      - A0*(kr + kf*exp(-(kf+kr)*x))/(kf+kr)
      - A0 - (A0*(kr + kf*exp(-(kf+kr)*x))/(kf+kr))
primary: x
presets:
  - A0: 1
    kf: 0.8
    kr: 0.1
  - A0: 1.5
    kf: 0.5
    kr: 0.5
  - A0: 0.5
    kf: 0.05
    kr: 0.6
challenges:
  - check: kf / kr
    target: 3
  - check: A0*(kr + kf*exp(-(kf+kr)*x))/(kf+kr)
    target: 0.3
  - check: kf < kr and A0*(kr + kf*exp(-(kf+kr)*x))/(kf+kr) > 0.8*A0
