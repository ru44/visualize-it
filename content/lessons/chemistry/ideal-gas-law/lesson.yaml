variables:
- P
- V
- n
- R
- T
derivation:
- P \propto \frac{1}{V} \quad \text{(Boyle)}, \qquad V \propto T \quad \text{(Charles)}, \qquad V \propto n \quad \text{(Avogadro)}
- P \propto \frac{nT}{V}
- PV = nRT
