id: ideal-gas-law
subject: chemistry
difficulty: high-school
equation: PV = nRT
concepts:
- pressure
- volume
- temperature
- moles
prerequisites:
- function-graph
related:
- newtons-second-law
visualization:
  type: gas-box
  options: {}
parameters:
  n:
    min: 0.5
    max: 5
    step: 0.1
    value: 1
    unit: mol
  T:
    min: 100
    max: 600
    step: 5
    value: 300
    unit: K
  V:
    min: 5
    max: 50
