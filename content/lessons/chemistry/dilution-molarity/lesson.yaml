id: dilution-molarity
subject: chemistry
difficulty: high-school
equation: C_1 V_1 = C_2 V_2
concepts:
  - molarity
  - moles
  - concentration
  - volume
  - dilution
prerequisites:
  - function-graph
related:
  - ph-scale
  - chemical-reaction
visualization:
  type: function-plot
  options:
    expr: C1*V1/x
    domain:
      - 0.5
      - 10
    range:
      - 0
      - 5
    mode: plain
parameters:
  C1:
    min: 0.1
    max: 5
    step: 0.1
    value: 2
    unit: mol/L
  V1:
    min: 0.1
    max: 5
    step: 0.1
    value: 1
    unit: L
  x:
    min: 0.5
    max: 10
    step: 0.1
    value: 2
    unit: L
variables:
  - C
  - V_1, V_2
  - n
derivation:
  - n = C_1 V_1
  - "\\text{add solvent: } n \\text{ unchanged}, \\quad V_1 \\to V_2"
  - C_2 = \frac{n}{V_2} = \frac{C_1V_1}{V_2}
charts: []
primary: x
presets:
  - C1: 2
    V1: 0.5
    x: 5
  - C1: 4
    V1: 1
    x: 4
  - C1: 3
    V1: 0.2
    x: 2
challenges:
  - check: C1*V1/x
    target: 0.4
  - check: C1*V1/x < 0.1
  - check: abs(x - 2*V1) < 0.1
