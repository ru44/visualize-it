id: ph-scale
subject: chemistry
difficulty: high-school
equation: \mathrm{pH} = -\log_{10}\!\big[\mathrm{H^+}\big]
concepts:
  - logarithm
  - acid
  - base
  - concentration
  - pOH
prerequisites:
  - exponential-growth
related:
  - dilution-molarity
  - chemical-equilibrium
visualization:
  type: function-plot
  options:
    expr: -log10(x)
    domain:
      - 0.0001
      - 0.1
    range:
      - 0
      - 5
    mode: tangent
parameters:
  x:
    min: 0.0001
    max: 0.1
    step: 0.0001
    value: 0.001
    unit: mol/L
variables:
  - "[\\mathrm{H^+}]"
  - \mathrm{pH}
  - \mathrm{pOH}
derivation:
  - "[\\mathrm{H^+}] \\text{ ranges over many orders of magnitude}"
  - \mathrm{pH} \equiv -\log_{10}[\mathrm{H^+}]
  - \Delta[\mathrm{H^+}] \times 10 \;\Longleftrightarrow\; \Delta\mathrm{pH} = 1
