id: crowd-flow
subject: complexity
difficulty: high-school
equation: g \downarrow \Rightarrow \text{the crowd backs up at the doorway}
concepts:
  - agent-based-model
  - self-organization
  - emergence
prerequisites: []
related:
  - game-of-life
visualization:
  type: crowd-flow
  options: {}
parameters:
