id: toner-tu-flocks
subject: complexity
difficulty: university
equation: \text{treat the whole flock as a moving fluid, not as separate animals}
concepts:
  - fluid-flocking
  - density-waves
  - emergence
prerequisites: []
related:
  - swarm-synchronisation
  - game-of-life
visualization:
  type: toner-tu
  options: {}
parameters:
  diffusion:
    min: 0.1
    max: 2
    step: 0.05
    value: 0.6
  pressure:
    min: 0
    max: 2
    step: 0.05
    value: 0.8
  step:
    min: 0
    max: 200
    step: 1
    value: 0
variables:
  - how strongly each cell's flow matches its neighbours
  - how hard crowding pushes flock away from dense cells
  - which generation of the flowing ring you are watching
derivation:
  - \text{each cell relaxes its own flow toward one preferred speed}
  - \text{neighbouring cells smooth their flow together and crowding pushes flow apart}
  - \text{the small starting ripple in density keeps travelling around the ring as a wave}
charts: []
primary: step
presets:
  - diffusion: 0.6
    pressure: 0.1
    step: 200
  - diffusion: 0.6
    pressure: 0.8
    step: 200
  - diffusion: 1.6
    pressure: 0.8
    step: 120
challenges:
  - check: pressure < 0.2 and step >= 150
  - check: pressure >= 0.6 and step >= 150
  - check: abs(diffusion - 1.6) < 0.1 and step >= 100
