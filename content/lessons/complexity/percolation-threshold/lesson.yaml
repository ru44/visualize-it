id: percolation-threshold
subject: complexity
difficulty: beginner
equation: p_c \approx 0.593
concepts:
  - percolation
  - phase-transition
  - critical-point
  - cluster
prerequisites: []
related:
  - directed-percolation
visualization:
  type: percolation
  options: {}
visualization3d:
  type: percolation
  options: {}
parameters:
  p:
    min: 0
    max: 1
    step: 0.002
    value: 0.3
variables:
  - p
derivation:
  - \text{each cell is open independently with probability } p \text{ and closed otherwise}
  - \text{open cells that touch (up, down, left or right) belong to the same cluster}
  - '\text{the grid spans, top to bottom, once one cluster reaches both edges; on a large square lattice this first happens near } p_c \approx 0.593'
charts: []
primary: p
presets:
  - p: 0.4
  - p: 0.593
  - p: 0.75
challenges:
  - check: p <= 0.45
  - check: p >= 0.7
  - check: abs(p - 0.593) < 0.01
