id: home-range
subject: complexity
difficulty: beginner
equation: \text{wander freely, but always feel a pull back toward the den}
concepts:
  - random-walk
  - home-range
  - emergence
prerequisites: []
related:
  - game-of-life
visualization:
  type: home-range
  options: {}
parameters:
  home:
    min: 0
    max: 1
    step: 0.05
    value: 0.25
  explore:
    min: 0.2
    max: 3
    step: 0.1
    value: 1.2
  step:
    min: 0
    max: 300
    step: 1
    value: 0
variables:
  - how strongly the animal is pulled back toward its den
  - how far the animal wanders on each step before the pull acts
  - how many steps of wandering you are watching
derivation:
  - \text{each step the animal picks a new wander direction at random}
  - \text{that wander is added to a pull that always points back toward the den}
  - \text{the patch of ground it visits stops growing once wander and pull balance}
charts: []
primary: step
presets:
  - home: 0.05
    explore: 1.2
    step: 300
  - home: 0.25
    explore: 1.2
    step: 300
  - home: 0.6
    explore: 2.5
    step: 300
challenges:
  - check: home < 0.1 and step >= 250
  - check: home >= 0.5 and explore >= 2 and step >= 250
  - check: abs(explore - 2.5) < 0.2 and home >= 0.5
