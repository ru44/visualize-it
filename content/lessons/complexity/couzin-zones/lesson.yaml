id: couzin-zones
subject: complexity
difficulty: high-school
equation: \text{repel} \Rightarrow \text{else orient and attract}
concepts:
  - flocking
  - collective-motion
  - phase-transition
  - self-organization
prerequisites:
  - flocking-boids
related:
  - flocking-boids
  - vicsek-alignment
visualization:
  type: boids
  options:
    mode: couzin
parameters:
  rep:
    min: 0.5
    max: 4
    step: 0.5
    value: 1
  orient:
    min: 0.5
    max: 15
    step: 0.5
    value: 3
  attract:
    min: 1
    max: 20
    step: 0.5
    value: 12
  t:
    min: 0
    max: 240
    step: 1
    value: 150
variables:
  - repulsion-zone radius
  - orientation-zone radius
  - attraction-zone radius
  - how many steps the rule has run
derivation:
  - \text{if any fish is inside the repulsion zone, turn straight away from it}
  - \text{otherwise average the heading of fish in the orientation zone}
  - \text{and the direction to fish in the attraction zone, then turn that way}
charts: []
primary: orient
presets:
  - rep: 1
    orient: 1
    attract: 15
    t: 200
  - rep: 1
    orient: 3
    attract: 15
    t: 200
  - rep: 1
    orient: 8
    attract: 10
    t: 200
challenges:
  - check: orient <= 1.5 and attract >= 14
  - check: orient >= 3 and orient <= 5 and attract >= 12
  - check: orient >= 10
