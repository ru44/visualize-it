id: schelling-segregation
subject: complexity
difficulty: high-school
equation: f > t \Rightarrow \text{move to a happier cell}
concepts:
  - agent-based-model
  - segregation
  - emergence
prerequisites: []
related:
  - game-of-life
visualization:
  type: schelling
  options: {}
parameters:
  tolerance:
    min: 0.1
    max: 0.9
    step: 0.05
    value: 0.3
  density:
    min: 0.3
    max: 0.95
    step: 0.05
    value: 0.7
  gen:
    min: 0
    max: 45
    step: 1
    value: 0
variables:
  - f
  - t
derivation:
  - \text{look at the 8 neighbours of each occupied cell}
  - f = \frac{\text{unlike neighbours}}{\text{occupied neighbours}}
  - f > t \Rightarrow \text{move to a random empty cell where } f \le t
charts: []
primary: tolerance
presets:
  - tolerance: 0.3
    density: 0.7
    gen: 0
  - tolerance: 0.55
    density: 0.7
    gen: 0
  - tolerance: 0.15
    density: 0.9
    gen: 0
challenges:
  - check: abs(tolerance - 0.2) < 0.03
  - check: density >= 0.85 and gen >= 20
  - check: abs(tolerance - 0.5) < 0.05 and gen >= 25
