id: public-goods-game
subject: complexity
difficulty: high-school
equation: r < n \Rightarrow \text{defecting always earns more}
concepts:
  - game-theory
  - cooperation
  - free-riding
prerequisites: []
related:
  - game-of-life
visualization:
  type: public-goods
  options: {}
parameters:
  r:
    min: 1
    max: 8
    step: 0.1
    value: 3
  sigma:
    min: -1
    max: 2
    step: 0.1
    value: 1
  gen:
    min: 0
    max: 40
    step: 1
    value: 0
variables:
  - r
  - n
derivation:
  - \text{a cooperator puts 1 token in the shared pot; a defector puts 0}
  - \text{the pot is multiplied by } r \text{ and split equally among the } n \text{ players in the group}
  - r < n \Rightarrow \text{each contributor's share is worth less than the token it gave up}
charts: []
primary: r
presets:
  - r: 1.5
    sigma: 1
    gen: 0
  - r: 5
    sigma: 1
    gen: 0
  - r: 3
    sigma: -0.5
    gen: 0
challenges:
  - check: abs(r - 1.5) < 0.15
  - check: r >= 6 and gen >= 15
  - check: abs(sigma - 0) < 0.1 and gen >= 10
