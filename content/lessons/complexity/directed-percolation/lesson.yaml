id: directed-percolation
subject: complexity
difficulty: high-school
equation: p_c \approx 0.6447
concepts:
  - directed-percolation
  - phase-transition
  - critical-point
  - universality-class
prerequisites: []
related:
  - contact-process
visualization:
  type: directed-percolation
  options: {}
parameters:
  p:
    min: 0
    max: 1
    step: 0.01
    value: 0.65
  gen:
    min: 0
    max: 120
    step: 1
    value: 0
variables:
  - p
derivation:
  - \text{start from one active site; every active site can activate itself and its right neighbour at the next step, each independently with probability } p
  - '\text{a site does not stay active on its own: it is active next step only if at least one of those attempts succeeds}'
  - \text{below the critical value } p_c \text{ activity always dies out eventually; above it, activity can survive forever with positive probability}
charts: []
primary: gen
presets:
  - p: 0.5
    gen: 60
  - p: 0.6447
    gen: 120
  - p: 0.85
    gen: 100
challenges:
  - check: p <= 0.5 and gen >= 40
  - check: p >= 0.8 and gen >= 60
  - check: abs(p - 0.6447) < 0.02 and gen >= 80
