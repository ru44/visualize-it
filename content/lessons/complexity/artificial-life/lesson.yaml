id: artificial-life
subject: complexity
difficulty: beginner
equation: E \ge 12 \Rightarrow \text{split in two}
concepts:
  - agent-based-model
  - emergence
  - carrying-capacity
prerequisites: []
related:
  - logistic-population
  - game-of-life
visualization:
  type: artificial-life
  options: {}
parameters:
  initial:
    min: 2
    max: 30
    step: 1
    value: 10
  food:
    min: 1
    max: 20
    step: 1
    value: 6
  step:
    min: 0
    max: 150
    step: 1
    value: 0
variables:
  - E
derivation:
  - \text{every step each creature moves to a random neighbouring cell and its energy } E \text{ drops by one}
  - \text{landing on a food cell adds energy and removes the food}
  - E \le 0 \Rightarrow \text{it starves; } E \ge 12 \Rightarrow \text{it splits into two, each keeping half the energy}
charts: []
primary: step
presets:
  - initial: 10
    food: 3
    step: 100
  - initial: 10
    food: 10
    step: 100
  - initial: 4
    food: 15
    step: 60
challenges:
  - check: food <= 3 and step >= 100
  - check: food >= 12 and step >= 60
  - check: initial <= 5 and step >= 30
