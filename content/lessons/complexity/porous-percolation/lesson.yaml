id: porous-percolation
subject: complexity
difficulty: beginner
equation: p > 0.59 \Rightarrow \text{water reaches the bottom}
concepts:
  - percolation
  - phase-transition
  - emergence
prerequisites: []
related:
  - game-of-life
  - percolation-threshold
visualization:
  type: porous-rock
  options: {}
parameters:
  porosity:
    min: 0.2
    max: 0.8
    step: 0.01
    value: 0.55
  seed:
    min: 1
    max: 9
    step: 1
    value: 1
  step:
    min: 0
    max: 60
    step: 1
    value: 0
variables:
  - how much of the rock is open pore space
  - which random arrangement of pores you're looking at
  - how far the water has spread from the top
derivation:
  - \text{each cell is open (pore) with probability } p, \text{ closed (rock) otherwise}
  - \text{water enters the open cells of the top row and floods through open neighbours}
  - p > 0.59 \Rightarrow \text{a connected path of open cells almost always reaches the bottom}
charts: []
primary: porosity
presets:
  - porosity: 0.35
    seed: 1
    step: 0
  - porosity: 0.59
    seed: 1
    step: 0
  - porosity: 0.75
    seed: 1
    step: 0
challenges:
  - check: abs(porosity - 0.65) < 0.03
  - check: porosity < 0.4 and step >= 15
  - check: abs(porosity - 0.59) < 0.02
