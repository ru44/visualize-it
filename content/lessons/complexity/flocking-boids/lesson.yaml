id: flocking-boids
subject: complexity
difficulty: beginner
equation: \text{steer} = \text{separation} + \text{alignment} + \text{cohesion}
concepts:
  - flocking
  - emergence
  - self-organization
  - local-rules
prerequisites: []
related:
  - vicsek-alignment
  - couzin-zones
visualization:
  type: boids
  options:
    mode: flock
parameters:
  sep:
    min: 1
    max: 10
    step: 0.5
    value: 2
  align:
    min: 2
    max: 16
    step: 0.5
    value: 6
  coh:
    min: 2
    max: 20
    step: 0.5
    value: 8
  t:
    min: 0
    max: 240
    step: 1
    value: 90
variables:
  - how close another bird must get before it is crowding
  - how far away a bird still copies its neighbours' heading
  - how far away a bird still turns toward its neighbours
  - how many steps the three rules have run
derivation:
  - \text{steer away from neighbours that are too close}
  - \text{turn to match the average heading of neighbours nearby}
  - \text{turn toward the average position of neighbours further out}
charts: []
primary: coh
presets:
  - sep: 2
    align: 6
    coh: 6
    t: 150
  - sep: 1.5
    align: 12
    coh: 16
    t: 180
  - sep: 6
    align: 2
    coh: 3
    t: 150
challenges:
  - check: coh >= 15 and align >= 10
  - check: sep >= 6 and coh <= 4
  - check: align <= 2 and coh >= 12
