id: cell-size-and-surface-area
subject: biology
difficulty: beginner
equation: \dfrac{\mathrm{SA}}{V} = \dfrac{3}{r}, \qquad d = \dfrac{d_0}{\sqrt{a}}
concepts:
  - surface-area-to-volume-ratio
  - diffusion-limit
  - cell-size
prerequisites:
  - diffusion-and-osmosis
related:
  - diffusion-and-osmosis
  - bacterial-growth
visualization:
  type: cell-size
  options: {}
visualization3d:
  type: cell-growth
  options: {}
primary: r
parameters:
  r:
    min: 1
    max: 1000
    step: 1
    value: 50
    unit: μm
  activity:
    min: 0.1
    max: 10
    step: 0.1
    value: 1
variables:
  - \mathrm{SA}
  - V
  - r
  - a
  - d
  - d_0
derivation:
  - \mathrm{SA} = 4\pi r^2, \qquad V = \tfrac{4}{3}\pi r^3
  - \dfrac{\mathrm{SA}}{V} = \dfrac{4\pi r^2}{\tfrac{4}{3}\pi r^3} = \dfrac{3}{r}
  - \left(\dfrac{r-d}{r}\right)^3 = \text{starved fraction of the volume, once } r>d
charts: []
presets:
- r: 1
  activity: 3
- r: 15
  activity: 1
- r: 800
  activity: 2
challenges:
- check: 3/r
  target: 3
- check: (max(0, r - 200/sqrt(activity))/r)^3
  target: 0.5
  tol: 0.05
- check: r>500 and activity<0.2 and r<=200/sqrt(activity)
