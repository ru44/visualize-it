id: sir-epidemic
subject: biology
difficulty: high-school
equation: \frac{dS}{dt} = -\frac{\beta S I}{N}, \qquad \frac{dI}{dt} = \frac{\beta S I}{N} - \gamma I, \qquad \frac{dR}{dt} = \gamma I
concepts:
  - epidemic
  - infection-rate
  - basic-reproduction-number
  - herd-immunity
prerequisites:
  - exponential-growth
related:
  - logistic-population
  - natural-selection
visualization:
  type: ode-system
  options:
    vars:
      - S
      - I
      - R
    equations:
      - -beta*S*I/N
      - beta*S*I/N - gamma*I
      - gamma*I
    initial:
      - N - I0
      - I0
      - "0"
    tMax: 160
    labels:
      - susceptible
      - infected
      - recovered
parameters:
  N:
    min: 500
    max: 5000
    step: 100
    value: 1000
  I0:
    min: 1
    max: 50
    step: 1
    value: 5
  beta:
    min: 0.05
    max: 1
    step: 0.01
    value: 0.3
  gamma:
    min: 0.02
    max: 0.5
    step: 0.01
    value: 0.1
  tView:
    min: 0
    max: 1
    step: 0.001
    value: 0
variables:
  - S
  - I
  - R
  - N
  - \beta
  - \gamma
  - R_0 = \beta/\gamma
derivation:
  - \frac{dI}{dt} = I\left(\frac{\beta S}{N} - \gamma\right)
  - \frac{dI}{dt} > 0 \iff \frac{S}{N} > \frac{\gamma}{\beta} = \frac{1}{R_0}
  - \text{herd immunity threshold} = 1 - \frac{1}{R_0}
charts: []
primary: beta
presets:
- N: 1000
  I0: 5
  beta: 0.13
  gamma: 0.1
- N: 1000
  I0: 5
  beta: 0.75
  gamma: 0.05
- N: 2000
  I0: 10
  beta: 0.1
  gamma: 0.3
challenges:
- check: beta/gamma
  target: 3
- check: 1 - gamma/beta
  target: 0.8
- check: beta/gamma < 1 and I0 >= 20
