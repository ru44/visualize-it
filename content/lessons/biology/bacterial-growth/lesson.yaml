id: bacterial-growth
subject: biology
difficulty: beginner
equation: N(t) = N_0\cdot 2^{t/T}
concepts:
  - exponential-growth
  - doubling-time
  - bacterial-growth
prerequisites:
  - exponential-growth
related:
  - logistic-population
visualization:
  type: function-plot
  options:
    expr: N0*2^(x/T)
    domain:
      - 0
      - 600
    range:
      - 0
      - 11000000
    mode: tangent
parameters:
  N0:
    min: 1
    max: 100
    step: 1
    value: 10
  T:
    min: 10
    max: 120
    step: 5
    value: 30
    unit: min
  x:
    min: 0
    max: 600
    step: 1
    value: 120
    unit: min
variables:
  - N
  - N_0
  - T
  - t
derivation:
  - N(T) = 2N(0), \quad N(2T)=2N(T)=4N(0)
  - N(nT) = N_0\cdot 2^n
  - N(t) = N_0\cdot 2^{t/T}
charts: []
primary: T
presets:
- N0: 10
  T: 20
  x: 120
- N0: 20
  T: 65
  x: 260
- N0: 5
  T: 110
  x: 440
challenges:
- check: 2^(x/T)
  target: 2
- check: 2^(x/T)
  target: 8
- check: N0 >= 80 and T > 100 and N0*2^(x/T) > 500
