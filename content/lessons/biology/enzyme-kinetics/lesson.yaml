id: enzyme-kinetics
subject: biology
difficulty: high-school
equation: v = \frac{V_{max}[S]}{K_m + [S]}
concepts:
  - enzyme
  - substrate
  - reaction-rate
  - michaelis-menten
prerequisites:
  - derivative
related:
  - diffusion-and-osmosis
visualization:
  type: function-plot
  options:
    expr: Vmax*x/(Km + x)
    domain:
      - 0
      - 30
    range:
      - 0
      - 11
    mode: tangent
parameters:
  Vmax:
    min: 1
    max: 10
    step: 0.5
    value: 5
  Km:
    min: 0.5
    max: 10
    step: 0.5
    value: 2
  x:
    min: 0
    max: 30
    step: 0.5
    value: 3
variables:
  - v
  - "[S]"
  - V_{max}
  - K_m
derivation:
  - E + S \underset{k_{-1}}{\overset{k_1}{\rightleftharpoons}} ES \overset{k_2}{\rightarrow} E + P
  - \frac{d[ES]}{dt} = k_1[E][S] - (k_{-1}+k_2)[ES] \approx 0
  - v = k_2[ES] = \frac{V_{max}[S]}{K_m+[S]}, \quad K_m=\frac{k_{-1}+k_2}{k_1}
charts:
  - domain:
      - 0
      - 30
    marker: x
    series:
      - Vmax*x/(Km+x)
      - Vmax*x/(2*Km+x)
