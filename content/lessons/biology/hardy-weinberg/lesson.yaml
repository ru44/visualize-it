id: hardy-weinberg
subject: biology
difficulty: high-school
equation: p^2 + 2pq + q^2 = 1, \qquad q = 1-p
concepts:
  - hardy-weinberg
  - allele-frequency
  - genotype
  - population-genetics
prerequisites:
  - probability-basics
related:
  - natural-selection
visualization:
  type: function-plot
  options:
    expr: 2*x*(1-x)
    domain:
      - 0
      - 1
    range:
      - 0
      - 1
    mode: plain
parameters:
  x:
    min: 0
    max: 1
    step: 0.01
    value: 0.3
variables:
  - p
  - q = 1-p
  - p^2
  - 2pq
  - q^2
derivation:
  - (p+q)^2 = p^2+2pq+q^2
  - P(\text{AA}) = p\cdot p = p^2, \quad P(\text{aa}) = q\cdot q = q^2
  - P(\text{Aa}) = 2pq
charts:
  - domain:
      - 0
      - 1
    marker: x
    series:
      - x^2
      - (1-x)^2
