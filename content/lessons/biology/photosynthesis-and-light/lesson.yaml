id: photosynthesis-and-light
subject: biology
difficulty: high-school
equation: 'P = P_{max}\dfrac{I}{K+I} - R, \qquad P_{max} = P_0\min\!\left(1, \dfrac{C}{C_{ref}}\right)'
concepts:
  - photosynthesis
  - light-saturation
  - limiting-factor
prerequisites:
  - enzyme-kinetics
