id: diffusion-and-osmosis
subject: biology
difficulty: beginner
equation: J = -D\,\frac{dC}{dx}
concepts:
  - diffusion
  - osmosis
  - concentration-gradient
  - membrane
prerequisites:
  - ideal-gas-law
related:
  - enzyme-kinetics
visualization:
  type: diffusion
  options: {}
visualization3d:
  type: gas-box
  options:
    mode: diffusion
parameters:
  nLeft:
    min: 0
    max: 200
    step: 5
    value: 150
  nRight:
    min: 0
    max: 200
    step: 5
    value: 20
  perm:
    min: 0
    max: 100
    step: 5
    value: 50
    unit: "%"
  temp:
    min: 150
    max: 600
    step: 10
    value: 300
    unit: K
  split:
    min: 10
    max: 90
    step: 1
    value: 50
    unit: "%"
variables:
  - J
  - D
  - C
  - dC/dx
derivation:
  - \text{rate left-to-right} \propto n_{left}\cdot(\text{permeability})
  - \text{net rate} \propto (n_{left}-n_{right})\cdot(\text{permeability})
  - \text{net rate} \to 0 \text{ as } n_{left}\to n_{right}
charts: []
primary: nLeft
presets:
- nLeft: 180
  nRight: 10
  perm: 50
  temp: 350
  split: 50
- nLeft: 100
  nRight: 90
  perm: 70
  temp: 300
  split: 50
- nLeft: 150
  nRight: 20
  perm: 10
  temp: 150
  split: 50
challenges:
- check: abs(nLeft - nRight) < 5
- check: abs(nLeft/nRight - 3) < 0.3 and perm > 80
- check: perm < 20 and temp < 160
