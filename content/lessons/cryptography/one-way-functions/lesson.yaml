id: one-way-functions
subject: cryptography
difficulty: high-school
equation: c = a^{k} \bmod n
concepts:
- one-way-function
- discrete-logarithm
- trapdoor
- cryptography
prerequisites:
- modular-arithmetic
- exponents-and-powers
related:
- diffie-hellman
- logarithms
visualization:
  type: mod-clock
  options:
    mode: pow
parameters:
  n:
    min: 2
    max: 30
    step: 1
    value: 23
  a:
    min: 0
    max: 29
    step: 1
    value: 5
  k:
    min: 1
    max: 12
    step: 1
    value: 8
variables:
- \bmod
derivation:
- c = a^{k} \bmod n
- \text{finding } k \text{ from } a, c, n \text{ (the discrete logarithm) has no known fast general method}
- \log_a c \text{ inverts an ordinary power instantly; the mod hides the pattern that log needs}
charts: []
primary: k
presets:
  - n: 23
    a: 5
    k: 3
  - n: 23
    a: 5
    k: 8
  - n: 29
    a: 2
    k: 11
challenges:
  - check: abs(a-5)<0.5 and abs(n-23)<0.5 and abs(mod(a^k,n)-10)<0.5
  - check: abs(k-12)<0.5
  - check: abs(n-30)<0.5 and abs(a-0)<0.5
