id: secret-sharing
subject: cryptography
difficulty: high-school
equation: f(x) = s + a_1 x + \dots + a_{k-1}\,x^{k-1}
concepts:
- secret-sharing
- threshold
- polynomial-interpolation
- information-theoretic-security
prerequisites: []
related:
- xor-and-one-time-pad
- digital-signatures
visualization:
  type: secret-sharing
  options: {}
parameters:
  secret:
    min: 0
    max: 8
    step: 1
    value: 5
  k:
    min: 2
    max: 4
    step: 1
    value: 3
  shown:
    min: 0
    max: 5
    step: 1
    value: 2
variables:
- s
- k
- a_1, \dots, a_{k-1}
derivation:
- \text{hide the secret as } f(0) = s \text{ and pick } k-1 \text{ random coefficients}
- \text{share } j \text{ is the point } (j,\ f(j))
- k \text{ points fix the curve exactly; } k-1 \text{ points fit every possible secret}
charts: []
primary: shown
presets:
  - secret: 5
    k: 3
    shown: 2
  - secret: 5
    k: 3
    shown: 3
  - secret: 7
    k: 4
    shown: 5
challenges:
  - check: abs(shown - (k - 1)) < 0.5 and abs(k - 3) < 0.5
  - check: shown - k >= 0
  - check: abs(k - 4) < 0.5 and abs(shown - 2) < 0.5
