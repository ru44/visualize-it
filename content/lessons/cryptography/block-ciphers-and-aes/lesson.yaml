derivation:
- '\text{each round: mix in the key, substitute every 4-bit group through a fixed S-box, then shuffle all 16 bits}'
- \text{repeat the same round several times, each one spreading the change of a single bit further}
- \text{after enough rounds, one flipped input bit has changed roughly half of the 16 output bits}
