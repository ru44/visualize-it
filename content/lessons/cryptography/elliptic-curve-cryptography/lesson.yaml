derivation:
- \lambda = \dfrac{y_Q - y_P}{x_Q - x_P} = \dfrac{1 - 1}{1 - (-1)} = 0
- x_R = \lambda^{2} - x_P - x_Q = 0 - (-1) - 1 = 0
- y_{P+Q} = \lambda(x_P - x_R) - y_P = 0 - 1 = -1
