- \text{feed the message } M \text{ into SHA-256, a fixed public procedure}
- H(M) = h \quad \text{(a 256-bit fingerprint, always the same length)}
- \text{change one letter of } M \text{ and about half of the 256 bits of } h \text{ flip}
