    value: 8
variables:
- \bmod
- \equiv
derivation:
- a \bmod n = b \bmod n
- a - b = kn \text{ for some integer } k
- a \equiv b \;(\bmod n)
charts: []
primary: n
presets:
  - n: 12
    a: 9
    b: 5
  - n: 7
    a: 3
    b: 10
  - n: 24
    a: 20
    b: 8
challenges:
