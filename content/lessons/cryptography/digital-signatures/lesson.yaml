derivation:
- \text{treat the order's hash as } h = 13
- s = h^{d} \bmod n = 13^{27} \bmod 55 = 7 \quad \text{(sign with private exponent } d = 27\text{)}
- s^{e} \bmod n = 7^{3} \bmod 55 = 13 = h \quad \text{(anyone can verify with public exponent } e = 3\text{)}
