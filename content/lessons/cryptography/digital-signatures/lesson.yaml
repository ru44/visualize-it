derivation:
- h = (m^{2} + 1) \bmod n = (49 + 1) \bmod 55 = 50
- s = h^{d} \bmod n = 50^{27} \bmod 55 = 30
- s^{e} \bmod n = 30^{3} \bmod 55 = 50 = h
