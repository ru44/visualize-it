id: uncertainty-principle
subject: quantum
difficulty: high-school
equation: \Delta x \cdot \Delta p \geq \frac{\hbar}{2}
concepts:
  - heisenberg-uncertainty
  - wave-packet
  - complementarity
prerequisites:
  - de-broglie-waves
related:
  - double-slit-experiment
  - schrodinger-equation-particle-in-a-box
visualization:
  type: wave-function
  options:
    mode: packet
parameters:
  sx:
    min: 0.02
    max: 0.3
    step: 0.005
    value: 0.08
variables:
  - \Delta x
  - \Delta p
  - \hbar
derivation:
  - \Delta x \cdot \Delta p \geq \frac{\hbar}{2}
  - \Delta p = \frac{\hbar}{2\,\Delta x}
  - \Delta x \to 0 \ \Rightarrow\ \Delta p \to \infty
