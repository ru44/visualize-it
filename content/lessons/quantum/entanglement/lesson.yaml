    shots: 100
  - a: 0
    b: 90
    shots: 200
  - a: 0
    b: 180
    shots: 100
challenges:
  - check: cos((a-b)*pi/180/2)^2
    target: 1
    tol: 0.02
  - check: cos((a-b)*pi/180/2)^2
    target: 0.5
    tol: 0.03
  - check: abs(a-b) >= 170
