    value: 100
variables:
  - \alpha
  - \beta
  - p
derivation:
  - \alpha = \beta \Rightarrow p = 1
  - \alpha - \beta = 180^\circ \Rightarrow p = 0
  - p = \cos^2\!\left(\dfrac{\alpha-\beta}{2}\right)
charts: []
primary: a
presets:
  - a: 0
