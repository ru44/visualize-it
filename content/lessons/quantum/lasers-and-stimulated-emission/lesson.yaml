id: lasers-and-stimulated-emission
subject: quantum
difficulty: high-school
equation: G = e^{g_0\,\Delta N\,p}
concepts:
  - stimulated-emission
  - population-inversion
  - coherence
prerequisites:
  - photons-and-plancks-constant
related:
  - photoelectric-effect
visualization:
  type: laser
  options: {}
parameters:
  eta:
    min: 0
    max: 1
    step: 0.05
    value: 0.5
  p:
    min: 1
    max: 10
    step: 1
    value: 5
variables:
  - G
  - g_0
  - \Delta N
  - \eta
  - p
derivation:
  - \Delta N = 2\eta - 1
  - \Delta N > 0 \Rightarrow G > 1
  - G = e^{g_0\,\Delta N\,p}
charts: []
primary: eta
presets:
  - eta: 0.5
    p: 1
  - eta: 0.9
    p: 8
  - eta: 0.2
    p: 8
challenges:
  - check: exp(0.35*(2*eta-1)*p)
    target: 5
    tol: 0.5
  - check: eta < 0.5 and p >= 5
  - check: exp(0.35*(2*eta-1)*p)
    target: 1
    tol: 0.1
