id: linear-regression
subject: computer-science
difficulty: high-school
equation: \hat y = mx + c, \qquad L(m,c) = \frac{1}{n}\sum_i (y_i - (mx_i+c))^2
concepts:
  - linear-regression
  - gradient-descent
  - loss
  - least-squares
prerequisites:
  - gradient
  - mean-and-spread
related:
  - gradient
  - mean-and-spread
visualization:
  type: gradient-fit
  options: {}
parameters:
  m:
    min: -2
    max: 3
    step: 0.01
    value: 0
  c:
    min: -3
    max: 5
    step: 0.05
    value: 0
  lr:
    min: 0.001
    max: 0.05
    step: 0.001
    value: 0.02
  steps:
    min: 0
    max: 200
    step: 1
    value: 0
variables:
  - m, c
  - L(m,c)
  - learning rate
derivation:
  - L(m,c) = \frac{1}{n}\sum_i (y_i - mx_i - c)^2
  - \frac{\partial L}{\partial m} = -\frac{2}{n}\sum_i x_i(y_i - mx_i - c), \quad \frac{\partial L}{\partial c} = -\frac{2}{n}\sum_i (y_i - mx_i - c)
  - m \gets m - \text{lr}\,\frac{\partial L}{\partial m}, \qquad c \gets c - \text{lr}\,\frac{\partial L}{\partial c}
charts: []
primary: steps
presets:
  - m: 0
    c: 0
    lr: 0.02
    steps: 100
  - m: 0
    c: 0
    lr: 0.049
    steps: 20
  - m: 1
    c: 2
    lr: 0.01
    steps: 0
challenges:
  - check: steps>=150 and abs(lr-0.02)<0.005
  - check: abs(lr-0.05)<0.002 and steps<=5
  - check: abs(lr-0.001)<0.0005 and steps>=199
