id: travelling-salesman
subject: computer-science
difficulty: high-school
equation: R = \frac{(n-1)!}{2}
concepts:
  - travelling-salesman
  - combinatorial-explosion
  - np-hard
  - heuristics
prerequisites:
  - algorithms-and-complexity
related:
  - exponential-vs-polynomial
visualization:
  type: tsp
  options: {}
parameters:
  n:
    min: 4
    max: 8
    step: 1
    value: 6
  mode:
    min: 0
    max: 1
    step: 1
    value: 0
  step:
    min: 0
    max: 1
    step: 0.001
    value: 0
variables:
  - n
  - R
derivation:
  - \text{fix one city as the start; the other } n - 1 \text{ can be ordered } (n-1)! \text{ ways}
  - \text{walking a route forward or backward visits the same cities in the same order of stops}
  - R = \frac{(n-1)!}{2} \text{ counts every distinct route exactly once}
charts: []
primary: n
presets:
  - n: 5
    mode: 0
  - n: 8
    mode: 0
  - n: 8
    mode: 1
challenges:
  - check: n >= 8 and mode < 0.5 and step >= 0.99
  - check: mode >= 0.5 and step >= 0.99
  - check: n <= 4 and mode < 0.5 and step >= 0.99
