    value: 0.5
  res:
    min: 6
    max: 28
    step: 1
    value: 16
variables:
  - a
  - b
  - c
  - t
derivation:
  - \text{walking along one grid edge, the value climbs from } a \text{ to } b
  - \text{the contour crosses that edge where the climbing value equals the level } c
  - t = \frac{c - a}{b - a} \text{ is how far from } a \text{ to } b \text{ the crossing sits}
