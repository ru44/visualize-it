id: bubble-sort
subject: computer-science
difficulty: beginner
equation: T(n) = O(n^2)
concepts:
  - sorting
  - bubble-sort
  - comparison
  - swap
prerequisites:
  - algorithms-and-complexity
related:
  - quicksort
  - merge-sort
  - algorithms-and-complexity
visualization:
  type: sort-steps
  options:
    algorithm: bubble
parameters:
  n:
    min: 4
    max: 40
    step: 1
    value: 16
  step:
    min: 0
    max: 1
    step: 0.001
    value: 0
variables:
  - n
  - comparisons
  - swaps
derivation:
  - \text{pass } i \text{ compares } n-i \text{ adjacent pairs}
  - \sum_{i=1}^{n-1} (n-i) = \sum_{j=1}^{n-1} j = \frac{n(n-1)}{2}
  - \frac{n(n-1)}{2} = O(n^2)
charts: []
primary: n
presets:
  - n: 8
    step: 1
  - n: 24
    step: 1
  - n: 40
    step: 1
challenges:
  - check: n*(n-1)/2
    target: 190
  - check: n*(n-1)/2 >= 300
  - check: abs(n-10)<0.5 and step>=0.99
