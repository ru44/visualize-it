id: how-code-is-read
subject: computer-science
difficulty: high-school
equation: \delta(q, c) = q'
concepts:
  - lexical-analysis
  - finite-state-machines
  - tokenization
  - compilers
prerequisites: []
related:
  - algorithms-and-complexity
visualization:
  type: tokeniser
  options: {}
parameters:
  line:
    min: 0
    max: 2
    step: 1
    value: 0
  step:
    min: 0
    max: 1
    step: 0.001
    value: 0
variables:
  - \delta
  - q
  - c
  - q'
derivation:
  - \text{the machine starts in one state } q \text{ and reads one character } c \text{ at a time}
  - \text{a fixed rule } \delta(q, c) = q' \text{ says which state comes next}
  - \text{each time the state changes, the characters read since the last change become one token}
charts: []
primary: line
presets:
  - line: 0
  - line: 1
  - line: 2
challenges:
  - check: line < 0.5 and step >= 0.99
  - check: line >= 0.5 and line < 1.5 and step >= 0.99
  - check: line >= 1.5 and step >= 0.99
