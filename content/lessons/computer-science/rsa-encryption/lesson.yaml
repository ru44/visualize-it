id: rsa-encryption
subject: computer-science
difficulty: university
equation: c = m^{e} \bmod n
concepts:
  - rsa
  - public-key-cryptography
  - factoring
  - modular-arithmetic
prerequisites:
  - diffie-hellman
  - exponential-vs-polynomial
related:
  - one-way-functions
  - logarithms
visualization:
  type: function-plot
  options:
    expr: x*log10(2)
    domain:
      - 0
      - 2048
    range:
      - 0
      - 640
    mode: plain
parameters:
  x:
    min: 0
    max: 2048
    step: 8
    value: 256
variables:
  - \bmod
derivation:
  - \text{choose } p=5,\ q=11,\ n=pq=55,\ \varphi(n)=(p-1)(q-1)=40
  - \text{pick } e=3; \text{ solve } ed \equiv 1 \bmod \varphi(n) \Rightarrow d=27 \text{ since } 3\times27=81=2\times40+1
  - c = m^{e} \bmod n = 7^{3} \bmod 55 = 13, \qquad c^{d} \bmod n = 13^{27} \bmod 55 = 7
charts:
  - domain:
      - 0
      - 2048
    marker: x
    series:
      - x*log10(2) - 12 - 7.5
