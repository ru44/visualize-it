id: exponential-vs-polynomial
subject: computer-science
difficulty: university
equation: 2^x \text{ vs } x^3
concepts:
  - exponential-growth
  - polynomial-growth
  - cryptography
  - logarithm
prerequisites:
  - algorithms-and-complexity
  - exponents-and-powers
  - logarithms
related:
  - algorithms-and-complexity
  - dijkstra
visualization:
  type: function-plot
  options:
    expr: 2^x
    domain:
      - 0
      - 12
    range:
      - 0
      - 4300
    mode: tangent
parameters:
  x:
    min: 0
    max: 12
    step: 0.1
    value: 6
variables:
  - x
  - 2^x
  - x^3
derivation:
  - \frac{d}{dx}\left(\frac{x^k}{b^x}\right) = \frac{x^{k-1}(k - x\ln b)}{b^x}
  - \text{applying L'Hôpital's rule } k \text{ times to } \frac{x^k}{b^x}
  - \lim_{x\to\infty} \frac{x^k}{b^x} = \frac{k!}{(\ln b)^k}\lim_{x\to\infty}\frac{1}{b^x} = 0
charts:
  - domain:
      - 0
      - 12
    marker: x
    series:
      - 2^x
      - x^3
primary: x
presets:
  - x: 2
  - x: 10
  - x: 12
challenges:
  - check: 2^x > x^3
  - check: 2^x - x^3
    target: 2368
  - check: x^3 > 2^x
