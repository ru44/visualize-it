id: ant-colony
subject: computer-science
difficulty: high-school
equation: \tau \leftarrow (1-\rho)\tau + \Delta\tau
concepts:
  - ant-colony-optimization
  - swarm-intelligence
  - metaheuristics
  - travelling-salesman
prerequisites:
  - travelling-salesman
related:
  - algorithms-and-complexity
visualization:
  type: ant-colony
  options: {}
parameters:
  n:
    min: 5
    max: 11
    step: 1
    value: 8
  rho:
    min: 0.05
    max: 0.9
    step: 0.01
    value: 0.3
  iter:
    min: 0
    max: 30
    step: 1
    value: 0
variables:
  - \tau
  - \rho
  - \Delta\tau
derivation:
  - '\text{each ant picks its next city with probability proportional to } \tau^\alpha \eta^\beta'
  - '\text{every edge''s pheromone then evaporates a little, } \tau \leftarrow (1-\rho)\tau'
  - '\text{the generation''s best tour deposits } \Delta\tau \text{ along the edges it used}'
charts: []
primary: iter
presets:
  - n: 8
    rho: 0.1
  - n: 8
    rho: 0.6
  - n: 11
    rho: 0.3
challenges:
  - check: iter >= 30
  - check: rho >= 0.6 and iter >= 15
  - check: n >= 10 and iter >= 20
