id: binomial-distribution
subject: statistics
difficulty: high-school
equation: P(X = k) = \binom{n}{k} p^k (1-p)^{n-k}
concepts:
  - binomial
  - distribution
  - expected-value
prerequisites:
  - combinations
  - probability-basics
related:
  - poisson-distribution
  - normal-distribution
visualization:
  type: discrete-dist
  options:
    kind: binomial
parameters:
  n:
    min: 1
    max: 60
    step: 1
    value: 10
  p:
    min: 0.02
    max: 0.98
    step: 0.01
    value: 0.5
  k:
    min: 0
    max: 60
    step: 1
    value: 3
variables:
  - X
  - \binom{n}{k}
  - \mu = np
  - \sigma = \sqrt{np(1-p)}
derivation:
  - P(\text{one specific sequence with } k \text{ successes}) = p^k (1-p)^{n-k}
  - \text{number of such sequences} = \binom{n}{k}
  - P(X = k) = \binom{n}{k} p^k (1-p)^{n-k}
charts: []
primary: n
presets:
  - n: 10
    p: 0.5
    k: 5
  - n: 20
    p: 0.7
    k: 15
  - n: 50
    p: 0.02
    k: 0
challenges:
  - check: 'n*p'
    target: 6
  - check: 'combinations(n,k)*p^k*(1-p)^(n-k) > 0.3'
  - check: 'sqrt(n*p*(1-p))'
    target: 3
