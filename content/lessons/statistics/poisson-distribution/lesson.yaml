id: poisson-distribution
subject: statistics
difficulty: high-school
equation: P(X = k) = \frac{\lambda^k e^{-\lambda}}{k!}
concepts:
  - poisson
  - rate
  - rare-events
prerequisites:
  - binomial-distribution
related:
  - normal-distribution
  - exponential-growth
visualization:
  type: discrete-dist
  options:
    kind: poisson
parameters:
  lambda:
    min: 0.1
    max: 30
    step: 0.1
    value: 3
  k:
    min: 0
    max: 60
    step: 1
    value: 2
variables:
  - X
  - \lambda
  - e
derivation:
  - P(X=k) = \binom{n}{k}\left(\frac{\lambda}{n}\right)^k \left(1 - \frac{\lambda}{n}\right)^{n-k}
  - \binom{n}{k}\frac{1}{n^k} \to \frac{1}{k!}, \qquad \left(1 - \frac{\lambda}{n}\right)^{n} \to e^{-\lambda}
  - P(X = k) = \frac{\lambda^k e^{-\lambda}}{k!}
charts: []
primary: lambda
presets:
  - lambda: 3
    k: 2
  - lambda: 8
    k: 5
  - lambda: 0.8
    k: 0
challenges:
  - check: 'lambda^k*exp(-lambda)/factorial(k)'
    target: 0.2
  - check: 'lambda < 1 and lambda^k*exp(-lambda)/factorial(k) > 0.5'
  - check: 'lambda > 15 and abs(k-lambda) <= 1 and lambda^k*exp(-lambda)/factorial(k) > 0.05'
