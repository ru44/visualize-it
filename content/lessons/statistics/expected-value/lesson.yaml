id: expected-value
subject: statistics
difficulty: beginner
equation: E[X] = \sum_i x_i\,P(x_i)
concepts:
  - expected-value
  - average
  - fair-game
prerequisites:
  - probability-basics
related:
  - mean-and-spread
  - binomial-distribution
visualization:
  type: function-plot
  options:
    expr: x*w - (1-x)*c
    domain:
      - 0
      - 1
    range:
      - -12
      - 12
    mode: plain
parameters:
  x:
    min: 0
    max: 1
    step: 0.01
    value: 0.4
  w:
    min: 0
    max: 20
    step: 0.5
    value: 10
  c:
    min: 0
    max: 20
    step: 0.5
    value: 5
variables:
  - X
  - x_i
  - P(x_i)
derivation:
  - "\\text{in } N \\text{ plays: about } Np \\text{ wins and } N(1-p) \\text{ losses}"
  - \text{total} \approx Np\,w - N(1-p)\,c
  - E[X] = \frac{\text{total}}{N} = p\,w - (1-p)\,c
charts:
  - domain:
      - 0
      - 1
    marker: x
    series:
      - x*w - (1-x)*c
      - 0*x
primary: x
presets:
  - x: 0.5
    w: 8
    c: 8
  - x: 0.05
    w: 20
    c: 1
  - x: 0.9
    w: 2
    c: 15
challenges:
  - check: 'x*w - (1-x)*c'
    target: 0
  - check: 'x*w - (1-x)*c > 5'
  - check: 'x < 0.5 and x*w - (1-x)*c > 0'
