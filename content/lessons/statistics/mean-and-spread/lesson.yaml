id: mean-and-spread
subject: statistics
difficulty: beginner
equation: \mu = \frac{1}{n}\sum x_i, \qquad \sigma^2 = \frac{1}{n}\sum (x_i - \mu)^2
concepts:
  - mean
  - variance
  - standard-deviation
prerequisites: []
related:
  - normal-distribution
  - law-of-large-numbers
visualization:
  type: function-plot
  options:
    expr: (x - m)^2
    domain:
      - -2
      - 12
    range:
      - -5
      - 60
    mode: area
parameters:
  m:
    min: 0
    max: 10
    step: 0.05
    value: 5
  a:
    min: 0
    max: 10
    step: 0.1
    value: 2
  b:
    min: 0
    max: 10
    step: 0.1
    value: 9
variables:
  - \mu
  - \sigma^2
  - \sigma
derivation:
  - S(c) = \sum_i (x_i - c)^2
  - S'(c) = -2\sum_i (x_i - c) = 0 \;\Rightarrow\; c = \frac{1}{n}\sum_i x_i = \mu
  - \sigma^2 = \frac{S(\mu)}{n}, \qquad \sigma = \sqrt{\sigma^2}
charts:
  - domain:
      - 0
      - 10
    marker: m
    series:
      - (2-x)^2+(4-x)^2*3+(5-x)^2*2+(7-x)^2+(9-x)^2
