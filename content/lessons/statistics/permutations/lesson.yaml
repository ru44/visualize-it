id: permutations
subject: statistics
difficulty: beginner
equation: P(n,k) = \frac{n!}{(n-k)!}
concepts:
  - counting
  - factorial
  - permutation
prerequisites: []
related:
  - combinations
  - probability-basics
visualization:
  type: counting
  options:
    ordered: true
parameters:
  n:
    min: 1
    max: 8
    step: 1
    value: 4
  k:
    min: 0
    max: 8
    step: 1
    value: 2
variables:
  - n
  - k
  - n!
derivation:
  - n \times (n-1) \times \cdots \times (n-k+1)
  - = \frac{n \times (n-1) \times \cdots \times 1}{(n-k) \times \cdots \times 1}
  - P(n,k) = \frac{n!}{(n-k)!}
charts: []
primary: k
presets:
  - n: 8
    k: 3
  - n: 5
    k: 5
  - n: 6
    k: 3
challenges:
  - check: 'permutations(n,k)'
    target: 60
  - check: 'abs(k - n) < 0.5 and permutations(n,k) > 100'
  - check: 'n - k >= 3 and permutations(n,k) < 20'
