id: probability-basics
subject: statistics
difficulty: beginner
equation: P(A) = \frac{\text{favourable outcomes}}{\text{all equally likely outcomes}}
concepts:
  - probability
  - outcome
  - event
  - law-of-large-numbers
prerequisites: []
related:
  - law-of-large-numbers
  - combinations
visualization:
  type: coin-flips
  options: {}
parameters:
  p:
    min: 0.05
    max: 0.95
    step: 0.05
    value: 0.5
  N:
    min: 20
    max: 2000
    step: 10
    value: 200
  speed:
    min: 1
    max: 200
    step: 1
    value: 20
variables:
  - p
  - N
  - \hat p
derivation:
  - \Omega = \{\text{all outcomes}\}, \quad A \subseteq \Omega
  - P(A) = \frac{|A|}{|\Omega|}
  - \hat p_N = \frac{\text{successes}}{N} \xrightarrow{N \to \infty} p
