id: bayes-theorem
subject: statistics
difficulty: high-school
equation: P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}
concepts:
  - conditional-probability
  - bayes
  - base-rate
prerequisites:
  - probability-basics
related:
  - binomial-distribution
visualization:
  type: bayes-grid
  options: {}
parameters:
  prior:
    min: 0.1
    max: 50
    step: 0.1
    value: 1
    unit: "%"
  sens:
    min: 50
    max: 100
    step: 0.5
    value: 99
    unit: "%"
  spec:
    min: 50
    max: 100
    step: 0.5
    value: 95
    unit: "%"
variables:
  - P(A)
  - P(B \mid A)
  - P(A \mid B)
derivation:
  - P(A \cap B) = P(A \mid B)\,P(B) = P(B \mid A)\,P(A)
  - P(B) = P(B \mid A)\,P(A) + P(B \mid A^c)\,P(A^c)
  - P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B \mid A)\,P(A) + P(B \mid A^c)\,P(A^c)}
charts: []
primary: prior
presets:
  - prior: 1
    sens: 99
    spec: 95
  - prior: 20
    sens: 90
    spec: 85
  - prior: 5
    sens: 98
    spec: 98
challenges:
  - check: '(sens*prior)/(sens*prior+(100-spec)*(100-prior))*100'
    target: 50
  - check: 'prior <= 2 and (sens*prior)/(sens*prior+(100-spec)*(100-prior))*100 >= 95'
  - check: 'prior >= 20 and (sens*prior)/(sens*prior+(100-spec)*(100-prior))*100 <= 40'
