id: chain-and-product-rule
subject: calculus
difficulty: university
equation: \frac{d}{dx}\big[\sin(kx)\cdot x\big] = kx\cos(kx) + \sin(kx)
concepts:
  - chain-rule
  - product-rule
  - derivative
prerequisites:
  - derivative
  - sine-function-parameters
related:
  - derivative
  - sine-function-parameters
visualization:
  type: function-plot
  options:
    expr: sin(k*x)*x
    domain:
      - -6
      - 6
    range:
      - -8
      - 8
    mode: tangent
    showDerivative: true
parameters:
  k:
    min: 0.3
    max: 3
    step: 0.05
    value: 1
  x:
    min: -6
    max: 6
    step: 0.02
    value: 2
variables:
  - k
  - x
derivation:
  - \frac{d}{dx}\big[\sin(kx)\cdot x\big] = \frac{d}{dx}\big[\sin(kx)\big]\cdot x + \sin(kx)\cdot \frac{d}{dx}[x]
  - \frac{d}{dx}\sin(kx) = \cos(kx)\cdot k
  - = kx\cos(kx) + \sin(kx)
charts: []
