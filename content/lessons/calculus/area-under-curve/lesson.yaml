id: area-under-curve
subject: calculus
difficulty: high-school
equation: \int_a^b v(t)\,dt = \text{net displacement}
concepts:
  - signed-area
  - accumulation
  - integral
prerequisites:
  - integral
related:
  - derivative
visualization:
  type: function-plot
  options:
    expr: 2*sin(x)
    domain:
      - -0.5
      - 10
    range:
      - -3
      - 3
    mode: area
parameters:
  a:
    min: 0
    max: 9.5
    step: 0.05
    value: 0
  b:
    min: 0
    max: 9.5
    step: 0.05
    value: 4.5
variables:
  - v(t)
  - a, b
derivation:
  - \int_0^{b} 2\sin t \, dt = \big[-2\cos t\big]_0^{b}
  - = 2 - 2\cos b
  - b = 2\pi \;\Rightarrow\; 2 - 2 = 0
charts: []
primary: b
presets:
  - { a: 0, b: 1.5 }
  - { a: 0, b: 3.15 }
  - { a: 0, b: 6.3 }
challenges:
  - { check: 'abs(2*cos(a) - 2*cos(b)) < 0.1 and abs(b - a) > 2' }
  - { check: '2*cos(a) - 2*cos(b)', target: 4, tol: 0.15 }
  - { check: '2*cos(a) - 2*cos(b)', target: -3, tol: 0.1 }
