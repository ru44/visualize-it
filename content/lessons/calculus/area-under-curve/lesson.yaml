id: area-under-curve
subject: calculus
difficulty: high-school
equation: \int_a^b v(t)\,dt = \text{net displacement}
concepts:
  - signed-area
  - accumulation
  - integral
prerequisites:
  - integral
related:
  - derivative
visualization:
  type: function-plot
  options:
    expr: 2*sin(x)
    domain:
      - -0.5
      - 10
    range:
      - -3
      - 3
    mode: area
parameters:
  a:
    min: 0
    max: 9.5
    step: 0.05
    value: 0
  b:
    min: 0
    max: 9.5
    step: 0.05
    value: 4.5
variables:
  - v(t)
  - a, b
derivation:
  - \int_0^{b} 2\sin t \, dt = \big[-2\cos t\big]_0^{b}
  - = 2 - 2\cos b
  - b = 2\pi \;\Rightarrow\; 2 - 2 = 0
charts: []
