id: differential-equations-intro
subject: calculus
difficulty: university
equation: '\frac{dy}{dt} = ky\left(1-\frac{y}{K}\right) - h'
concepts:
  - differential-equations
  - equilibria
  - harvested-logistic-growth
prerequisites:
  - logistic-growth
  - derivative
related:
  - taylor-series
visualization:
  type: ode-system
  options:
    vars: [y]
    equations: ['k*y*(1 - y/K) - h']
    initial: y0
    tMax: 40
parameters:
  k:
    min: 0.1
    max: 1
    step: 0.05
    value: 0.5
  K:
    min: 50
    max: 200
    step: 10
    value: 100
  h:
    min: 0
    max: 15
    step: 0.5
    value: 5
    label: harvest per unit time h
  y0:
    min: 5
    max: 150
    step: 5
    value: 30
  tView:
    min: 0
    max: 1
    step: 0.001
    value: 0
variables:
  - y
  - k
  - K
  - h
derivation:
  - \frac{dy}{dt} = ky\left(1-\frac{y}{K}\right) - h
  - ky\left(1-\frac{y}{K}\right) - h = 0
  - \frac{kK}{4}
charts: []
primary: h
presets:
  - { k: 0.5, K: 150, h: 5, y0: 30 }
  - { k: 0.3, K: 100, h: 7, y0: 50 }
  - { k: 0.4, K: 80, h: 12, y0: 60 }
challenges:
  - { check: 'h > 0 and h < k*K/4' }
  - { check: 'h > k*K/4' }
  - { check: 'h - k*K/4', target: 0, tol: 0.5 }
