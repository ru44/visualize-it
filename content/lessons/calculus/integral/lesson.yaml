id: integral
subject: calculus
difficulty: high-school
equation: \int_0^4 x^2 \, dx = \frac{64}{3}
concepts:
- area
- riemann-sum
- integral
- accumulation
prerequisites:
- function-graph
- limit
related:
- area-under-curve
- derivative
visualization:
  type: function-plot
  options:
    expr: x^2
    domain:
    - -1
    - 5
    range:
    - -2
    - 20
    mode: riemann
    rule: left
visualization3d:
  type: revolution
  options:
    expr: x^2
    domain:
    - -1
    - 5
    rule: left
parameters:
  n:
    min: 1
    max: 500
    step: 1
    value: 4
  a:
    min: 0
    max: 4
    step: 0.05
    value: 0
  b:
    min: 0
    max: 5
    step: 0.05
    value: 4
variables:
- a, b
- dx
- f(x)\,dx
derivation:
- \sum_{i=1}^{n} \left(\tfrac{4i}{n}\right)^2 \cdot \tfrac{4}{n} = \frac{64}{n^3} \sum_{i=1}^{n} i^2
- = \frac{64}{n^3} \cdot \frac{n(n+1)(2n+1)}{6}
- \xrightarrow{\,n \to \infty\,} \frac{64 \cdot 2}{6} = \frac{64}{3}
charts: []
primary: n
presets:
  - { n: 4, a: 0, b: 4 }
  - { n: 50, a: 1, b: 3 }
  - { n: 500, a: 0, b: 5 }
challenges:
  - { check: '(b^3 - a^3)/3', target: 9, tol: 0.3 }
  - { check: 'n > 100 and (b^3 - a^3)/3 > 20' }
  - { check: '(b^3 - a^3)/3 < 0' }
