id: gradient
subject: calculus
difficulty: university
equation: z = x^2 + y^2, \qquad \nabla f = \left(\frac{\partial f}{\partial x}, \frac{\partial f}{\partial y}\right) = (2x,\, 2y)
concepts:
- partial-derivative
- gradient
- tangent-plane
- multivariable
prerequisites:
- derivative
related:
- exponential-growth
visualization:
  type: surface-3d
  options:
    expr: x^2 + y^2
    extent: 2
    zRange:
    - 0
    - 8
parameters:
  x0:
    min: -2
    max: 2
    step: 0.01
    value: 1
  y0:
    min: -2
    max: 2
    step: 0.01
    value: -0.6
variables:
- \partial f/\partial x
- \partial f/\partial y
- \nabla f
derivation:
- \frac{\partial f}{\partial x} = \lim_{h\to0}\frac{f(x+h,\,y) - f(x,\,y)}{h} = 2x
- D_{\mathbf u} f = f_x u_1 + f_y u_2 = \nabla f \cdot \mathbf u
- \nabla f \cdot \mathbf u = |\nabla f| \cos\alpha
charts: []
visualization3d:
  type: surface
  options:
    expr: x^2 + y^2
    extent: 2
    zRange:
    - 0
    - 8
primary: x0
presets:
  - { x0: 0, y0: 0 }
  - { x0: 1.5, y0: 1.5 }
  - { x0: -2, y0: 0.5 }
challenges:
  - { check: 'x0^2 + y0^2 < 0.25' }
  - { check: 'sqrt((2*x0)^2 + (2*y0)^2)', target: 5, tol: 0.5 }
  - { check: 'abs(x0 - 2*y0) < 0.05' }
