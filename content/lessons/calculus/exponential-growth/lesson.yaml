id: exponential-growth
subject: calculus
difficulty: high-school
equation: \frac{dy}{dt} = ky \;\Rightarrow\; y = y_0 e^{kt}
concepts:
  - differential-equation
  - exponential
  - rate-of-change
prerequisites:
  - derivative
related:
  - rc-circuit
visualization:
  type: function-plot
  options:
    expr: y0*exp(k*x)
    domain:
      - 0
      - 10
    range:
      - -1
      - 12
    mode: tangent
parameters:
  k:
    min: -1
    max: 0.6
    step: 0.01
    value: 0.25
  y0:
    min: 0.5
    max: 8
    step: 0.1
    value: 1
  x:
    min: 0
    max: 10
    step: 0.01
    value: 4
variables:
  - y
  - k
  - y_0
derivation:
  - \frac{dy}{y} = k\,dt
  - \ln y = kt + C
  - y = e^{C} e^{kt} = y_0 e^{kt}
charts: []
primary: k
presets:
  - { k: 0.05, y0: 1, x: 10 }
  - { k: -0.3, y0: 8, x: 5 }
  - { k: 0.4, y0: 0.5, x: 8 }
challenges:
  - { check: 'y0*exp(k*x)', target: 5, tol: 0.3 }
  - { check: 'y0*exp(k*x) < 0.1' }
  - { check: 'exp(k*x)', target: 2, tol: 0.1 }
