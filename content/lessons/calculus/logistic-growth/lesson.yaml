id: logistic-growth
subject: calculus
difficulty: university
equation: \frac{dy}{dt} = ky\left(1-\frac{y}{K}\right) \;\Longrightarrow\; y = \frac{K}{1+\left(\frac{K-y_0}{y_0}\right)e^{-kt}}
concepts:
  - logistic-equation
  - carrying-capacity
  - differential-equation
prerequisites:
  - exponential-growth
  - derivative
related:
  - exponential-growth
  - derivative
visualization:
  type: function-plot
  options:
    expr: K/(1 + ((K - y0)/y0)*exp(-k*x))
    domain:
      - 0
      - 20
    range:
      - 0
      - 12
    mode: tangent
parameters:
  K:
    min: 2
    max: 10
    step: 0.5
    value: 8
  y0:
    min: 0.1
    max: 3
    step: 0.05
    value: 0.5
  k:
    min: 0.1
    max: 1.5
    step: 0.05
    value: 0.6
  x:
    min: 0
    max: 20
    step: 0.02
    value: 6
variables:
  - K
  - y_0
  - k
derivation:
  - \frac{dy}{y(1-y/K)} = k\,dt
  - \int\left(\frac1y + \frac{1/K}{1-y/K}\right)dy = kt + C
  - y = \frac{K}{1+\left(\frac{K-y_0}{y_0}\right)e^{-kt}}
charts: []
