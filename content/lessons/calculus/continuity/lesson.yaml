id: continuity
subject: calculus
difficulty: university
equation: f \text{ continuous at } c \;\Longleftrightarrow\; \lim_{x\to c^-} f(x) = \lim_{x\to c^+} f(x) = f(c)
concepts:
  - continuity
  - limit
  - piecewise-function
prerequisites:
  - limit
  - one-sided-and-infinite-limits
related:
  - one-sided-and-infinite-limits
  - limit
visualization:
  type: function-plot
  options:
    expr: "x < 1 ? x^2 : x^2 + j"
    domain:
      - -2
      - 4
    range:
      - -1
      - 7
    mode: limit
    limitAt: 1
parameters:
  d:
    min: 0.02
    max: 1.5
    step: 0.01
    value: 0.5
  j:
    min: -3
    max: 3
    step: 0.1
    value: 1.5
variables:
  - j
  - d
derivation:
  - \lim_{x\to1^-} x^2 = 1
  - \lim_{x\to1^+} (x^2+j) = 1+j
  - 1 = 1+j \;\Longleftrightarrow\; j = 0
charts: []
primary: j
presets:
  - { j: 0, d: 0.3 }
  - { j: 1.5, d: 0.3 }
  - { j: -2, d: 0.1 }
challenges:
  - { check: 'j', target: 0 }
  - { check: 'j', target: -2 }
  - { check: 'd < 0.05 and abs(j) > 1' }
