id: fundamental-theorem
subject: calculus
difficulty: university
equation: \frac{d}{dx}\int_a^x f(t)\,dt = f(x)
concepts:
  - fundamental-theorem-of-calculus
  - integral
  - derivative
  - accumulation
prerequisites:
  - integral
  - derivative
  - area-under-curve
related:
  - integral
  - area-under-curve
  - derivative
visualization:
  type: function-plot
  options:
    expr: 2*sin(x) + 0.5
    domain:
      - 0
      - 10
    range:
      - -2
      - 3
    mode: area
parameters:
  a:
    min: 0
    max: 9
    step: 0.1
    value: 0
  b:
    min: 0
    max: 10
    step: 0.1
    value: 4
variables:
  - v(x)
  - F(b)
  - a, b
derivation:
  - F(b) = \int_a^b f(x)\,dx
  - F(b+h) - F(b) = \int_b^{b+h} f(x)\,dx \approx f(b)\,h
  - F'(b) = \lim_{h\to0}\frac{F(b+h)-F(b)}{h} = f(b)
charts:
  - domain:
      - 0
      - 10
    marker: b
    series:
      - -2*cos(x) + 0.5*x + 2
primary: b
presets:
  - { a: 0, b: 3 }
  - { a: 0, b: 6 }
  - { a: 2, b: 8 }
challenges:
  - { check: '-2*cos(b) + 0.5*b + 2*cos(a) - 0.5*a', target: 5, tol: 0.4 }
  - { check: 'abs(-2*cos(b) + 0.5*b + 2*cos(a) - 0.5*a) < 0.3 and abs(b - a) > 1' }
  - { check: '-2*cos(b) + 0.5*b + 2*cos(a) - 0.5*a > 6' }
