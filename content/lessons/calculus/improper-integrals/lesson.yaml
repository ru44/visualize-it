id: improper-integrals
subject: calculus
difficulty: university
equation: \int_1^\infty \frac{dx}{x^p} \text{ converges} \iff p > 1
concepts:
  - improper-integral
  - convergence
  - integral
prerequisites:
  - integral
  - area-under-curve
  - limits-at-infinity
related:
  - limits-at-infinity
  - integral
  - fundamental-theorem
visualization:
  type: function-plot
  options:
    expr: 1/x^p
    domain:
      - 1
      - 60
    range:
      - 0
      - 3
    mode: area
parameters:
  p:
    min: 0.2
    max: 3
    step: 0.05
    value: 0.8
  a:
    min: 1
    max: 3
    step: 0.1
    value: 1
  b:
    min: 1
    max: 60
    step: 0.5
    value: 10
variables:
  - p
  - a, b
derivation:
  - \int_1^b x^{-p}\,dx = \left[\frac{x^{1-p}}{1-p}\right]_1^b = \frac{b^{1-p}-1}{1-p} \quad (p\ne1)
  - p>1 \;\Rightarrow\; 1-p<0 \;\Rightarrow\; \lim_{b\to\infty} b^{1-p} = 0
  - \lim_{b\to\infty}\int_1^b x^{-p}\,dx = \frac{0-1}{1-p} = \frac{1}{p-1}
charts: []
primary: p
presets:
  - { p: 0.5, a: 1, b: 50 }
  - { p: 2, a: 1, b: 50 }
  - { p: 1, a: 1, b: 30 }
challenges:
  - { check: 'p < 1 and (b^(1-p) - a^(1-p))/(1-p) > 5' }
  - { check: 'p > 1 and (b^(1-p) - a^(1-p))/(1-p) < 2' }
  - { check: '(b^(1-p) - a^(1-p))/(1-p)', target: 1, tol: 0.2 }
