id: one-sided-and-infinite-limits
subject: calculus
difficulty: university
equation: \lim_{x\to 0^-}\frac1x = -\infty, \qquad \lim_{x\to 0^+}\frac1x = +\infty
concepts:
  - limit
  - one-sided-limit
  - vertical-asymptote
prerequisites:
  - limit
  - function-graph
related:
  - limit
  - tangent-function
  - limits-at-infinity
visualization:
  type: function-plot
  options:
    expr: 1/x
    domain:
      - -4
      - 4
    range:
      - -10
      - 10
    mode: limit
    limitAt: 0
parameters:
  d:
    min: 0.02
    max: 3
    step: 0.01
    value: 1
variables:
  - d
  - \lim_{x\to0^-}
  - \lim_{x\to0^+}
derivation:
  - 0 < x < \delta \;\Rightarrow\; \frac1x > \frac1\delta
  - \forall M > 0,\ \exists\, \delta = 1/M \text{ s.t. } 0<x<\delta \Rightarrow \tfrac1x > M
  - -\delta < x < 0 \;\Rightarrow\; \frac1x < -\frac1\delta
charts: []
primary: d
presets:
  - { d: 1 }
  - { d: 0.1 }
  - { d: 0.02 }
challenges:
  - { check: '1/d > 40' }
  - { check: '1/d', target: 10, tol: 0.3 }
  - { check: '1/d < 1' }
