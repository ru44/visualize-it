id: derivative
subject: calculus
difficulty: high-school
equation: f(x) = x^2 \;\Rightarrow\; f'(x) = 2x
concepts:
  - function
  - slope
  - derivative
  - rate-of-change
prerequisites:
  - slope
  - limit
related:
  - integral
visualization:
  type: function-plot
  options:
    expr: x^2
    domain:
      - -4
      - 4
    range:
      - -8
      - 12
    mode: tangent
    showDerivative: true
parameters:
  x:
    min: -4
    max: 4
    step: 0.01
    value: 1
variables:
  - f(x)
  - f'(x)
derivation:
  - \frac{f(x+h) - f(x)}{h} = \frac{(x+h)^2 - x^2}{h}
  - = \frac{2xh + h^2}{h} = 2x + h
  - f'(x) = \lim_{h \to 0} (2x + h) = 2x
charts: []
