id: inflation
subject: economics
difficulty: beginner
equation: V = \dfrac{100}{\left(1+\dfrac{p}{100}\right)^{x}}
concepts:
  - inflation
  - purchasing-power
  - real-vs-nominal
prerequisites:
  - percent-and-compound-growth
  - exponential-growth
related:
  - present-value
  - compound-interest
visualization:
  type: function-plot
  options:
    expr: 100/(1 + p/100)^x
    domain:
      - 0
      - 40
    range:
      - 0
      - 100
    mode: plain
parameters:
  p:
    min: 0
    max: 20
    step: 0.25
    value: 3
    unit: "%"
  x:
    min: 0
    max: 40
    step: 0.5
    value: 20
variables:
  - V
  - p
  - x
derivation:
  - "V = \\dfrac{100}{(1+p/100)^x}"
  - "\\text{price index} = 100\\,(1+p/100)^x"
  - "\\text{if } p=2\\%, \\text{ prices double in about } 35 \\text{ years (rule of 72)}"
charts:
  - domain:
      - 0
      - 40
    marker: x
    series:
      - 100*(1 + p/100)^x
