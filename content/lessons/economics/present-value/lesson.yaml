id: present-value
subject: economics
difficulty: beginner
equation: V = \dfrac{F}{\left(1+\dfrac{r}{100}\right)^{x}}
concepts:
  - present-value
  - discounting
  - time-value-of-money
prerequisites:
  - compound-interest
related:
  - loan-amortization
  - inflation
visualization:
  type: function-plot
  options:
    expr: F/(1 + r/100)^x
    domain:
      - 0
      - 50
    range:
      - 0
      - 1000
    mode: plain
parameters:
  F:
    min: 100
    max: 10000
    step: 100
    value: 1000
  r:
    min: 0
    max: 15
    step: 0.25
    value: 5
    unit: "%"
  x:
    min: 0
    max: 50
    step: 0.5
    value: 10
variables:
  - V
  - F
  - r
  - x
derivation:
  - "V = \\dfrac{F}{(1+r/100)^x}"
  - "V\\,(1+r/100)^x = F"
  - "\\text{as } x \\text{ grows, } V \\to 0 \\text{ for fixed } F, r>0"
