id: price-controls
subject: economics
difficulty: beginner
equation: P = a - b\,Q, \quad P = c + d\,Q, \quad P = P_0
concepts:
  - price-ceiling
  - price-floor
  - shortage
  - surplus
prerequisites:
  - supply-and-demand
related:
  - elasticity
visualization:
  type: supply-demand
  options: {}
parameters:
  a:
    min: 20
    max: 100
    step: 1
    value: 80
  b:
    min: 0.2
    max: 2
    step: 0.05
    value: 0.8
  c:
    min: 0
    max: 60
    step: 1
    value: 10
  d:
    min: 0.2
    max: 2
    step: 0.05
    value: 0.6
  price:
    min: 0
    max: 100
    step: 0.5
    value: 30
variables:
  - P
  - a
  - b
  - Q
  - c
  - d
  - P_0
derivation:
  - "\\text{quantity demanded at } P_0: \\quad Q = \\dfrac{a - P_0}{b}"
  - "\\text{quantity supplied at } P_0: \\quad Q = \\dfrac{P_0 - c}{d}"
  - "\\text{gap} = \\dfrac{a-P_0}{b} - \\dfrac{P_0-c}{d}"
primary: price
presets:
  - a: 80
    b: 0.8
    c: 10
    d: 0.6
    price: 25
  - a: 80
    b: 0.8
    c: 10
    d: 0.6
    price: 55
  - a: 90
    b: 1
    c: 20
    d: 0.8
    price: 30
challenges:
  - check: (a-price)/b - (price-c)/d
    target: 20
    tol: 1
  - check: (price-c)/d - (a-price)/b > 15
  - check: abs(price-50)<0.3 and abs((a-price)/b - (price-c)/d) < 1
