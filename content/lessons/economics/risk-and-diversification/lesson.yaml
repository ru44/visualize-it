id: risk-and-diversification
subject: economics
difficulty: beginner
equation: w = v\sqrt{\dfrac{1}{n} + \left(1-\dfrac{1}{n}\right)c}
concepts:
  - diversification
  - risk
  - correlation
related:
  - compound-interest
visualization:
  type: risk-and-diversification
  options: {}
primary: n
parameters:
  v:
    min: 10
    max: 60
    step: 1
    value: 35
    unit: "%/yr"
  n:
    min: 1
    max: 30
    step: 1
    value: 10
  c:
    min: 0
    max: 0.8
    step: 0.05
    value: 0.3
variables:
  - v
  - n
  - c
  - w
derivation:
  - w = v\sqrt{\dfrac{1}{n} + \left(1-\dfrac{1}{n}\right)c}
  - "\\text{as } n \\to 1, \\quad w \\to v"
  - "\\text{as } n \\to \\infty, \\quad w \\to v\\sqrt{c}"
presets:
  - v: 45
    n: 1
    c: 0.3
  - v: 45
    n: 10
    c: 0.3
  - v: 45
    n: 30
    c: 0.3
challenges:
  - check: v*sqrt(1/n + (1-1/n)*c)
    target: 20
  - check: n > 1 and v*sqrt(1/n + (1-1/n)*c) < v/2
  - check: n >= 20 and c < 0.2 and v*sqrt(1/n + (1-1/n)*c) < 15
