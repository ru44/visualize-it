id: elasticity
subject: economics
difficulty: beginner
equation: Q = a - b\,x, \quad R = x\,Q
concepts:
  - elasticity
  - revenue
  - demand
prerequisites:
  - supply-and-demand
  - slope
related:
  - price-controls
visualization:
  type: function-plot
  options:
    expr: x*(a - b*x)
    domain:
      - 0
      - 50
    range:
      - 0
      - 1300
    mode: tangent
parameters:
  a:
    min: 50
    max: 200
    step: 1
    value: 100
  b:
    min: 0.5
    max: 4
    step: 0.1
    value: 2
  x:
    min: 0
    max: 50
    step: 0.5
    value: 20
variables:
  - Q
  - a
  - b
  - x
  - R
  - E_d
derivation:
  - "R(x) = x\\,Q = x\\,(a - b\\,x)"
  - "\\dfrac{dR}{dx} = a - 2b\\,x"
  - "E_d = -\\dfrac{dQ}{dx}\\cdot\\dfrac{x}{Q} = \\dfrac{b\\,x}{a-b\\,x}, \\quad R \\text{ peaks where } |E_d| = 1"
charts:
  - domain:
      - 0
      - 45
    marker: x
    series:
      - -b*x/(a - b*x)
primary: x
presets:
  - a: 120
    b: 0.5
    x: 30
  - a: 100
    b: 3
    x: 25
  - a: 100
    b: 2
    x: 25
challenges:
  - check: b*x/(a-b*x)
    target: 1
    tol: 0.05
  - check: b*x/(a-b*x) > 2 and a-b*x > 0
  - check: b*x/(a-b*x) < 0.2 and a-b*x > 0
