id: temperature-and-softmax
subject: ai
difficulty: beginner
equation: p_i(T) = \frac{\exp(s_i/T)}{\sum_j \exp(s_j/T)}, \quad s = (2,1,0)
concepts:
  - temperature
  - softmax
  - sampling
  - hallucination
prerequisites:
  - exponential-growth
  - probability-basics
related:
  - next-word-prediction
  - attention
visualization:
  type: function-plot
  options:
    expr: exp(2/x)/(exp(2/x)+exp(1/x)+1)
    domain:
      - 0.1
      - 3
    range:
      - 0
      - 1.05
    mode: plain
parameters:
  x:
    min: 0.1
    max: 3
    step: 0.05
    value: 1
variables:
  - s_i
  - T
  - p_i
derivation:
  - s = (2,1,0)
  - p_i(T) = \dfrac{\exp(s_i/T)}{\sum_j \exp(s_j/T)}
  - T\to 0 \Rightarrow p \to \text{one-hot}, \quad T\to\infty \Rightarrow p \to \text{uniform}
primary: x
presets:
  - x: 1
  - x: 0.15
  - x: 2.8
challenges:
  - check: x<0.15
  - check: x>2.8
  - check: abs(x-1)<0.05
charts:
  - domain:
      - 0.1
      - 3
    marker: x
    series:
      - exp(1/x)/(exp(2/x)+exp(1/x)+1)
      - 1/(exp(2/x)+exp(1/x)+1)
