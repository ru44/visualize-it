id: logistic-regression
subject: ai
difficulty: beginner
equation: \sigma(z) = \frac{1}{1+e^{-z}}, \qquad z = wx+b
concepts:
  - logistic-regression
  - sigmoid
  - classification
  - decision-boundary
prerequisites:
  - linear-regression
  - exponential-growth
related:
  - what-is-machine-learning
  - activation-functions
visualization:
  type: function-plot
  options:
    expr: 1/(1 + exp(-(w*x + b)))
    domain:
      - -6
      - 6
    range:
      - -0.1
      - 1.1
    mode: tangent
parameters:
  w:
    min: 0.2
    max: 5
    step: 0.1
    value: 1.5
  b:
    min: -5
    max: 5
    step: 0.1
    value: 0
  x:
    min: -6
    max: 6
    step: 0.05
    value: 0
variables:
  - z
  - w
  - b
  - \sigma
derivation:
  - z = wx + b
  - \sigma(z) = \frac{1}{1+e^{-z}}
  - \hat y = \mathbb{1}[\sigma(z) \ge 0.5]
charts: []
primary: w
presets:
  - w: 5
    b: 0
    x: 1
  - w: 0.3
    b: 0
    x: 1
  - w: 1.5
    b: 3
    x: -2
challenges:
  - check: abs(w*x+b) < 0.1
  - check: w >= 4.5
  - check: w*x+b > 3
