id: ai-agents
subject: ai
difficulty: beginner
equation: C_{t+1} = C_t + r_t
concepts:
- agents
- harness
- tools
- context
prerequisites:
- next-word-prediction
related:
- rlhf
- attention
visualization:
  type: agent-loop
parameters:
  t:
    min: 0
    max: 100
    step: 1
    value: 0
  steps:
    min: 1
    max: 8
    step: 1
    value: 6
  tools:
    min: 0
    max: 1
    step: 1
    value: 1
variables:
- C_{t+1}
- C_t
- r_t
derivation:
- \text{the model reads its context and proposes one action; the harness runs the tool and captures } r_t
- '\text{appending the result is the agent''s only memory: } C_{t+1} = C_t + r_t'
- \text{the loop repeats until the errand is done, or the budget or the window runs out}
charts: []
primary: t
presets:
- t: 100
  steps: 6
  tools: 1
- t: 100
  steps: 6
  tools: 0
- t: 100
  steps: 2
  tools: 1
challenges:
- check: tools == 1 and steps >= 4 and t >= 95
- check: tools == 0 and t >= 95
- check: tools == 1 and steps <= 2 and t >= 95
