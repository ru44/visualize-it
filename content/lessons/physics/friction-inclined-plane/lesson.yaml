id: friction-inclined-plane
subject: physics
difficulty: high-school
equation: a(\theta) = g(\sin\theta - \mu\cos\theta)
concepts:
  - friction
  - inclined-plane
  - newtons-second-law
prerequisites:
  - newtons-second-law
  - linear-equations
related:
  - newtons-second-law
  - circular-motion
visualization:
  type: function-plot
  options:
    expr: 9.81*(sin(x*pi/180) - mu*cos(x*pi/180))
    domain:
      - 0
      - 90
    range:
      - -6
      - 10
    mode: plain
visualization3d:
  type: block-force
  options:
    mode: incline
parameters:
  mu:
    min: 0
    max: 1.2
    step: 0.02
    value: 0.4
  x:
    min: 0
    max: 90
    step: 0.2
    value: 30
    unit: °
variables:
  - \theta
  - \mu
  - a
derivation:
  - \sum F_{\parallel} = mg\sin\theta - f
  - f = \mu N = \mu mg\cos\theta
  - ma = mg\sin\theta - \mu mg\cos\theta \;\Rightarrow\; a = g(\sin\theta - \mu\cos\theta)
charts: []
primary: x
presets:
  - mu: 0.06
    x: 20
  - mu: 0.4
    x: 30
  - mu: 0.9
    x: 70
challenges:
  - check: abs(mu-0.5)<0.01 and abs(9.81*(sin(x*pi/180)-mu*cos(x*pi/180)))<0.3
  - check: 9.81*(sin(x*pi/180)-mu*cos(x*pi/180))
    target: 3
  - check: abs(x-45)<0.2 and abs(9.81*(sin(x*pi/180)-mu*cos(x*pi/180)))<0.3
