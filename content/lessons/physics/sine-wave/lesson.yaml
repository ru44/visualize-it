id: sine-wave
subject: physics
difficulty: high-school
equation: y = A \sin\!\left(2\pi\left(\tfrac{x}{\lambda} - ft\right) + \varphi\right), \qquad v = f\lambda
concepts:
  - wave
  - amplitude
  - frequency
  - wavelength
  - phase
prerequisites:
  - unit-circle
  - function-graph
related:
  - projectile-motion
visualization:
  type: function-plot
  options:
    expr: A*sin(2*pi*(x/L - f*t) + phi)
    domain:
      - 0
      - 12
    range:
      - -3.2
      - 3.2
    mode: plain
    animate:
      param: t
      speed: 1
      loop:
        - 0
        - 20
parameters:
  A:
    min: 0.2
    max: 3
    step: 0.05
    value: 1.5
  L:
    min: 1
    max: 8
    step: 0.1
    value: 4
    unit: m
  f:
    min: 0.1
    max: 1.5
    step: 0.05
    value: 0.4
    unit: Hz
  phi:
    min: 0
    max: 6.28
    step: 0.01
    value: 0
    unit: rad
  x:
    min: 0
    max: 12
    step: 0.05
    value: 3
    unit: m
  t:
    min: 0
    max: 20
    step: 0.01
    value: 0
    unit: s
variables:
  - A
  - \lambda
  - f
  - \varphi
  - v
derivation:
  - y = A\sin(kx - \omega t)
  - kx - \omega t = \text{const} \;\Rightarrow\; \frac{dx}{dt} = \frac{\omega}{k}
  - v = \frac{2\pi f}{2\pi/\lambda} = f\lambda
charts: []
