id: kinematics-constant-acceleration
subject: physics
difficulty: high-school
equation: x(t) = x_0 + v_0 t + \tfrac12 a t^2
concepts:
  - kinematics
  - velocity
  - acceleration
  - derivative
prerequisites:
  - newtons-second-law
  - derivative
related:
  - velocity-time-area
  - projectile-motion
visualization:
  type: function-plot
  options:
    expr: x0 + v0*x + 0.5*a*x^2
    domain:
      - 0
      - 10
    range:
      - -10
      - 60
    mode: tangent
    showDerivative: true
parameters:
  x0:
    min: -5
    max: 10
    step: 0.5
    value: 0
    unit: m
  v0:
    min: -8
    max: 8
    step: 0.5
    value: 2
    unit: m/s
  a:
    min: -4
    max: 4
    step: 0.2
    value: 1
    unit: m/s²
  x:
    min: 0
    max: 10
    step: 0.02
    value: 4
    unit: s
variables:
  - x_0
  - v_0
  - a
  - t
derivation:
  - a(t) = a \;\text{(const.)}
  - v(t) = \int_0^t a\,d\tau + v_0 = v_0 + at
  - x(t) = \int_0^t v(\tau)\,d\tau + x_0 = x_0 + v_0 t + \tfrac12 a t^2
charts: []
primary: a
presets:
  - x0: 0
    v0: 8
    a: -3
  - x0: 0
    v0: 0
    a: 1
  - x0: 2
    v0: 1
    a: 2
challenges:
  - check: abs(x-5)<0.05 and abs(x0+v0*x+0.5*a*x^2-20)<1
  - check: abs(x-4)<0.05 and abs(v0+a*x)<0.2
  - check: abs(v0*x+0.5*a*x^2)<0.5 and x>0.5
