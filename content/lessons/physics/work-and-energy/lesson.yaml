id: work-and-energy
subject: physics
difficulty: high-school
equation: W = \int_0^x F(x')\,dx' = \tfrac12 k x^2
concepts:
  - work
  - spring-force
  - hookes-law
  - area-under-curve
prerequisites:
  - area-under-curve
related:
  - velocity-time-area
  - kinetic-and-potential-energy
visualization:
  type: function-plot
  options:
    expr: k*x
    domain:
      - 0
      - 10
    range:
      - 0
      - 30
    mode: area
visualization3d:
  type: block-force
  options:
    mode: work
parameters:
  k:
    min: 0.2
    max: 4
    step: 0.1
    value: 1.5
    unit: N/m
  a:
    min: 0
    max: 8
    step: 0.2
    value: 0
    unit: m
  b:
    min: 0
    max: 10
    step: 0.2
    value: 5
    unit: m
variables:
  - F = kx
  - k
  - W
derivation:
  - F(x') = kx'
  - W = \int_0^x F(x')\,dx' = \int_0^x kx'\,dx'
  - W = \left[\tfrac12 kx'^2\right]_0^x = \tfrac12 kx^2
charts: []
primary: b
presets:
  - k: 0.3
    a: 0
    b: 6
  - k: 1.5
    a: 0
    b: 5
  - k: 3.5
    a: 0
    b: 4
challenges:
  - check: 0.5*k*(b^2-a^2)
    target: 20
  - check: abs(a)<0.3 and abs(0.5*k*(b^2-a^2)-24)<2
  - check: b<5 and 0.5*k*(b^2-a^2)>25
