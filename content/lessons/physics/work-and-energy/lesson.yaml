id: work-and-energy
subject: physics
difficulty: high-school
equation: W = \int_0^x F(x')\,dx' = \tfrac12 k x^2
concepts:
  - work
  - spring-force
  - hookes-law
  - area-under-curve
prerequisites:
  - area-under-curve
related:
  - velocity-time-area
  - kinetic-and-potential-energy
visualization:
  type: function-plot
  options:
    expr: k*x
    domain:
      - 0
      - 10
    range:
      - 0
      - 30
    mode: area
parameters:
  k:
    min: 0.2
    max: 4
    step: 0.1
    value: 1.5
    unit: N/m
  a:
    min: 0
    max: 8
    step: 0.2
    value: 0
    unit: m
  b:
    min: 0
    max: 10
    step: 0.2
    value: 5
    unit: m
variables:
  - F = kx
  - k
  - W
derivation:
  - F(x') = kx'
  - W = \int_0^x F(x')\,dx' = \int_0^x kx'\,dx'
  - W = \left[\tfrac12 kx'^2\right]_0^x = \tfrac12 kx^2
charts: []
