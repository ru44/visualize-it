id: circular-motion
subject: physics
difficulty: high-school
equation: a_c = \frac{v^2}{r}
concepts:
  - centripetal-acceleration
  - circular-motion
  - derivative
prerequisites:
  - derivative
  - unit-circle
related:
  - unit-circle
  - friction-inclined-plane
visualization:
  type: function-plot
  options:
    expr: x^2/rad
    domain:
      - 0
      - 15
    range:
      - -4
      - 40
    mode: tangent
parameters:
  rad:
    min: 1
    max: 20
    step: 0.5
    value: 5
    unit: m
  x:
    min: 0
    max: 15
    step: 0.05
    value: 8
    unit: m/s
variables:
  - v
  - r
  - a_c
derivation:
  - \mathbf r(t) = r(\cos\omega t,\ \sin\omega t)
  - \dot{\mathbf r} = r\omega(-\sin\omega t,\ \cos\omega t), \quad |\dot{\mathbf r}| = r\omega = v
  - \ddot{\mathbf r} = -r\omega^2(\cos\omega t,\ \sin\omega t) = -\omega^2\mathbf r \;\Rightarrow\; |\ddot{\mathbf r}| = \frac{v^2}{r}
charts:
  - domain:
      - 1
      - 20
    marker: rad
    series:
      - 100/x
