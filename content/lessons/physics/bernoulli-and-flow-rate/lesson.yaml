id: bernoulli-and-flow-rate
subject: physics
difficulty: university
equation: A_1 v_1 = A_2 v_2, \qquad \Delta p = \tfrac12\rho\left(v_2^2 - v_1^2\right)
concepts:
  - continuity
  - bernoulli-equation
  - flow-rate
prerequisites:
  - pressure-in-fluids
related:
  - bernoulli
  - buoyancy-archimedes
visualization:
  type: function-plot
  options:
    expr: v1*A1/x
    domain:
      - 0.5
      - 10
    range:
      - 0
      - 25
    mode: plain
visualization3d:
  type: airfoil
  options:
    mode: venturi
    map:
      A2: x
parameters:
  v1:
    min: 0.5
    max: 5
    step: 0.1
    value: 2
  A1:
    min: 2
    max: 10
    step: 0.5
    value: 6
  x:
    min: 0.5
    max: 10
    step: 0.1
    value: 3
variables:
  - A_1, A_2
  - v_1, v_2
  - \Delta p
derivation:
  - \rho A_1 v_1 = \rho A_2 v_2 \;\Rightarrow\; A_1 v_1 = A_2 v_2
  - p_1 + \tfrac12\rho v_1^2 = p_2 + \tfrac12\rho v_2^2
  - \Delta p = p_1 - p_2 = \tfrac12\rho\left(v_2^2 - v_1^2\right)
charts:
  - domain:
      - 0.5
      - 10
    marker: x
    series:
      - 0.5*1000*((v1*A1/x)^2 - v1^2)/1000
primary: x
presets:
  - v1: 1.5
    A1: 6
    x: 6
  - v1: 1.5
    A1: 6
    x: 1.5
  - v1: 1
    A1: 9
    x: 1
challenges:
  - check: A1/x
    target: 2
  - check: v1*A1/x
    target: 8
  - check: (v1*A1/x)^2 - v1^2
    target: 20
