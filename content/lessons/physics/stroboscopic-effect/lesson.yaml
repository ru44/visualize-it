id: stroboscopic-effect
subject: physics
difficulty: high-school
equation: f_a = f_w - n f_s, \qquad n = \mathrm{round}\!\left(\dfrac{f_w}{f_s}\right)
concepts:
- sampling
- aliasing
- rotation
prerequisites: []
related:
- circular-motion
visualization:
  type: stroboscope
  options: {}
parameters:
  rpm:
    min: 10
    max: 300
    step: 5
    value: 80
    unit: rpm
  fps:
    min: 5
    max: 60
    step: 1
    value: 24
    unit: fps
  t:
    min: 0
    max: 6
    step: 0.01
    value: 0
    unit: s
variables:
- f_w
- f_s
derivation:
- \text{the wheel truly turns at } f_w = \dfrac{\text{rpm}}{60}\text{ turns per second}
- \text{the camera only records a new picture every } \dfrac{1}{f_s}\text{ seconds}
- f_a = f_w - n f_s\text{, choosing the integer } n \text{ that makes } |f_a| \text{ smallest}
charts: []
primary: fps
presets:
- rpm: 80
  fps: 24
  t: 0
- rpm: 300
  fps: 60
  t: 0
- rpm: 120
  fps: 50
  t: 0
challenges:
- check: mod(rpm, fps*60)
  target: 0
  tol: 0.01
- check: mod(rpm, fps*60) > fps*30
- check: fps >= 50 and rpm <= 20
