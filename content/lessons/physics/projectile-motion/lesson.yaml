id: projectile-motion
subject: physics
difficulty: high-school
equation: y = x\tan\theta - \frac{g\,x^2}{2v^2\cos^2\theta}
concepts:
- kinematics
- vectors
- parabola
- gravity
prerequisites:
- function-graph
- newtons-second-law
- unit-circle
related:
- sine-wave
visualization:
  type: function-plot
  options:
    expr: x*tan(th*pi/180) - 9.81*x^2/(2*v^2*cos(th*pi/180)^2)
    domain:
    - 0
    - 100
    range:
    - -8
    - 52
    mode: tangent
    animate:
      param: x
      speed: 22
      loop:
      - 0
      - 100
parameters:
  v:
    min: 5
    max: 31
    step: 0.5
    value: 25
    unit: m/s
  th:
    min: 5
    max: 85
    step: 1
    value: 45
    unit: °
  x:
    min: 0
    max: 100
    step: 0.1
    value: 0
    unit: m
variables:
- v
- \theta
- g
- x, y
derivation:
- x = v\cos\theta\; t, \qquad y = v\sin\theta\; t - \tfrac12 g t^2
- t = \frac{x}{v\cos\theta}
- y = x\tan\theta - \frac{g x^2}{2v^2\cos^2\theta}
charts: []
visualization3d:
  type: projectile
  options: {}
primary: th
presets:
  - v: 8
    th: 50
  - v: 25
    th: 35
  - v: 30
    th: 15
challenges:
  - check: v^2*sin(2*th*pi/180)/9.81
    target: 40
  - check: abs(v-20)<0.3 and abs(th-45)<1
  - check: abs(v-20)<0.3 and th<40 and abs(v^2*sin(2*th*pi/180)/9.81-40)<1
