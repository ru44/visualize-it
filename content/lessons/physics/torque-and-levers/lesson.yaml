id: torque-and-levers
subject: physics
difficulty: high-school
equation: F_1 d_1 = F_2 d_2
concepts:
  - torque
  - lever
  - equilibrium
prerequisites:
  - newtons-second-law
related:
  - newtons-second-law
  - circular-motion
visualization:
  type: function-plot
  options:
    expr: F1*d1/x
    domain:
      - 0.3
      - 10
    range:
      - 0
      - 40
    mode: plain
visualization3d:
  type: torque
  options: {}
parameters:
  F1:
    min: 5
    max: 50
    step: 1
    value: 20
    unit: N
  d1:
    min: 0.5
    max: 5
    step: 0.1
    value: 2
    unit: m
  x:
    min: 0.3
    max: 10
    step: 0.05
    value: 4
    unit: m
variables:
  - F_1, d_1
  - d_2
  - F_2
derivation:
  - \tau_1 = F_1 d_1, \qquad \tau_2 = F_2 d_2
  - "\\tau_1 = \\tau_2 \\quad \\text{(equilibrium: no net rotation)}"
  - F_2 = \frac{F_1 d_1}{d_2}
charts: []
primary: x
presets:
  - F1: 40
    d1: 0.5
    x: 5
  - F1: 30
    d1: 1.5
    x: 3
  - F1: 45
    d1: 0.5
    x: 1.5
challenges:
  - check: F1*d1/x
    target: 10
  - check: abs(F1-40)<0.5 and abs(F1*d1/x-8)<0.3
  - check: F1*d1/x<2
