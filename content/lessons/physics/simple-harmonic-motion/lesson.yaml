id: simple-harmonic-motion
subject: physics
difficulty: university
equation: \ddot x + \omega^2 x = 0, \qquad x(t) = A\cos(\omega t), \quad \omega = \sqrt{k/m}
concepts:
- simple-harmonic-motion
- differential-equation
- period
prerequisites:
- derivative
- work-and-energy
related:
- damped-oscillation-resonance
- sine-function-parameters
visualization:
  type: function-plot
  options:
    expr: A*cos(sqrt(k/m)*x)
    domain:
    - 0
    - 12
    range:
    - -5
    - 5
    mode: tangent
    showDerivative: true
    animate:
      param: x
      speed: 1
      loop:
      - 0
      - 12
parameters:
  A:
    min: 0.5
    max: 4
    step: 0.1
    value: 3
    unit: m
  k:
    min: 0.2
    max: 4
    step: 0.1
    value: 1
    unit: N/m
  m:
    min: 0.2
    max: 4
    step: 0.1
    value: 1
    unit: kg
  x:
    min: 0
    max: 12
    step: 0.02
    value: 0
    unit: s
variables:
- A
- k
- m
- \omega = \sqrt{k/m}
derivation:
- F = -kx = m\ddot x \;\Rightarrow\; \ddot x + \frac{k}{m}x = 0
- x(t) = A\cos(\omega t + \varphi), \qquad \omega^2 = k/m
- T = \frac{2\pi}{\omega} = 2\pi\sqrt{\frac{m}{k}}
charts: []
visualization3d:
  type: spring
  options: {}
