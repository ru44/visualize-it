id: kinetic-and-potential-energy
subject: physics
difficulty: high-school
equation: KE = \tfrac12 m v^2
concepts:
  - kinetic-energy
  - potential-energy
  - derivative
prerequisites:
  - derivative
  - work-and-energy
related:
  - work-and-energy
  - momentum-and-impulse
visualization:
  type: function-plot
  options:
    expr: 0.5*m*x^2
    domain:
      - 0
      - 12
    range:
      - -4
      - 80
    mode: tangent
parameters:
  m:
    min: 0.5
    max: 5
    step: 0.1
    value: 1
    unit: kg
  x:
    min: 0
    max: 12
    step: 0.05
    value: 6
    unit: m/s
variables:
  - m
  - v
  - KE
derivation:
  - F = m\frac{dv}{dt}
  - W = \int F\,dx = \int m\frac{dv}{dt}\,dx = \int mv\,dv
  - KE = \int_0^v mv'\,dv' = \tfrac12 mv^2
charts:
  - domain:
      - 0
      - 12
    series:
      - m*9.81*x
