derivation:
  - p \Rightarrow q \text{ is false only when } p=1 \text{ and } q=0
  - \text{contrapositive } \neg q \Rightarrow \neg p \text{ has the same truth table as } p \Rightarrow q
  - \text{converse } q \Rightarrow p \text{ is a different statement, not guaranteed by } p \Rightarrow q
