id: parallel-computing
subject: data
difficulty: beginner
equation: S(x) = \dfrac{1}{(1-p) + p/x}
concepts:
- Amdahl's law
- parallel computing
- speedup
- distributed systems
prerequisites:
- algorithms-and-complexity
related:
- mapreduce
visualization:
  type: function-plot
  options:
    expr: 1/((1 - p) + p/x)
    domain: [1, 1000]
    range: [0, 60]
    mode: plain
primary: p
parameters:
  p:
    min: 0
    max: 1
    step: 0.01
    value: 0.95
  x:
    min: 1
    max: 1000
    step: 1
    value: 16
variables:
- S
- p
- x
- T
derivation:
- T(x) = (1-p) + \dfrac{p}{x}
- S(x) = \dfrac{T(1)}{T(x)}
- x \to \infty \Rightarrow S \to \dfrac{1}{1-p}
presets:
- p: 0.5
  x: 4
- p: 0.95
  x: 16
- p: 0.99
  x: 200
challenges:
- check: p
  target: 0.9
- check: x
  target: 100
- check: 1/((1-p)+p/x) > 15
