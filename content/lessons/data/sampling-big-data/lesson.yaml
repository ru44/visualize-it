id: sampling-big-data
subject: data
difficulty: beginner
equation: \text{SE} = \sqrt{\dfrac{p(1-p)}{N}}
concepts:
- sampling
- margin of error
- law of large numbers
- estimation
prerequisites:
- law-of-large-numbers
related:
- mapreduce
visualization:
  type: coin-flips
  options: {}
primary: N
parameters:
  p:
    min: 0.05
    max: 0.95
    step: 0.05
    value: 0.3
  N:
    min: 20
    max: 2000
    step: 10
    value: 1000
  speed:
    min: 1
    max: 200
    step: 1
    value: 60
variables:
- p
- N
derivation:
- \text{Var} = \dfrac{p(1-p)}{N}
- \text{SE} = \sqrt{\text{Var}}
- N \to \infty \Rightarrow \text{SE} \to 0
presets:
- p: 0.5
  N: 50
  speed: 80
- p: 0.3
  N: 1000
  speed: 60
- p: 0.8
  N: 2000
  speed: 150
challenges:
- check: N
  target: 500
- check: p
  target: 0.5
- check: N >= 1500
