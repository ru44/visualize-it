visualization:
  type: query-table
  options:
    mode: columns
primary: cols
parameters:
  cols:
    min: 1
    max: 3
    step: 1
    value: 1
variables:
- B
- c
- k
derivation:
- \text{row store, read every column} \Rightarrow B = k \cdot 10^9
- \text{column store, read only the columns you SELECT} \Rightarrow B = c \cdot 10^9
- c < k \Rightarrow \text{fewer bytes scanned, smaller bill}
