id: gravitational-waves
subject: relativity
difficulty: high-school
equation: f(t) = f_0\left(1-\dfrac{t}{t_c}\right)^{-3/8}
concepts:
  - gravitational waves
  - LIGO
  - chirp signal
  - binary inspiral
  - general relativity
prerequisites:
  - black-holes
related:
  - sine-wave
  - special-relativity-time-dilation
visualization:
  type: function-plot
  options:
    expr: sin(2*pi*f0*x/(1.05 - x)^0.375)*(1.05 - x)^(-0.25)
    domain:
      - 0
      - 1
    range:
      - -4
      - 4
    mode: plain
primary: f0
parameters:
  f0:
    min: 2
    max: 10
    step: 0.5
    value: 4
  x:
    min: 0
    max: 1
    step: 0.01
    value: 0.5
variables: []
derivation:
  - f \propto (t_c-t)^{-3/8}
  - h \propto (t_c-t)^{-1/4}
  - f, h \to \infty \text{ as } t \to t_c
charts: []
presets:
  - f0: 4
    x: 0.5
  - f0: 2
    x: 0.9
  - f0: 8
    x: 0.1
challenges:
  - check: x
    target: 0.95
    tol: 0.02
  - check: f0
    target: 10
    tol: 0.25
  - check: (1.05-x)^(-0.25) > 1.5
