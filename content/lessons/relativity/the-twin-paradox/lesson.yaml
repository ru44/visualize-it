derivation:
  - T = \dfrac{2D}{v} \quad \text{(the years Earth's clock counts for the round trip)}
  - \tau = \dfrac{T}{\gamma} = \dfrac{2D}{v}\sqrt{1-v^2/c^2} \quad \text{(the years the traveler's own clock counts)}
  - T - \tau > 0 \quad \text{for any } v > 0 \text{, growing as } v \to c
