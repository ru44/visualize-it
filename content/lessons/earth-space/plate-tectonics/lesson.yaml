id: plate-tectonics
subject: earth-space
difficulty: high-school
equation: D = 10\,v\,t
concepts:
  - plate-boundaries
  - continental-drift
  - seismic-hazard
prerequisites: []
related:
  - earthquake-magnitude
visualization:
  type: plate-tectonics
  options: {}
parameters:
  v:
    min: -10
    max: 15
    step: 0.5
    value: 5
    unit: "cm/yr"
  t:
    min: 0
    max: 200
    step: 1
    value: 50
    unit: "Myr"
variables:
  - D
  - v
  - t
derivation:
  - v\,t\times 10^{6} = vt\times 10^{6}\text{ cm}
  - \frac{10^{6}\text{ cm}}{10^{5}} = 10\text{ km}
  - D = 10\,v\,t
charts: []
primary: v
presets:
- v: 5
  t: 50
- v: -2
  t: 180
- v: 3.5
  t: 20
challenges:
- check: 10*v*t
  target: 1000
- check: v < 0 and abs(10*v*t) > 2000
- check: v > 0 and 10*v*t > 3000
