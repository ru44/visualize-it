id: earthquake-magnitude
subject: earth-space
difficulty: high-school
equation: \log_{10}E = 1.5x + 4.8
concepts:
  - logarithmic-scales
  - seismic-energy
  - gutenberg-richter-relation
prerequisites:
  - logarithms
related:
  - radioactive-dating
visualization:
  type: function-plot
  options:
    expr: 1.5*x + 4.8
    domain: [0, 9]
    range: [0, 20]
    mode: plain
parameters:
  x:
    min: 0
    max: 9
    step: 0.1
    value: 6
variables:
  - x
  - E
  - R
derivation:
  - \log_{10}E = 1.5x + 4.8
  - 10^{1.5} \approx 31.6
  - R = 10^{1.5(x-5)}
charts:
  - title: Energy ratio
    xLabel: magnitude
    yLabel: ratio to M5 energy
    domain: [5, 9]
    series:
      - 10^(1.5*(x-5))
primary: x
presets:
- x: 3
- x: 9
- x: 6.5
challenges:
- check: 10^(1.5*(x-5))
  target: 1000
- check: 10^(1.5*(x-5)) > 100000
- check: 10^(1.5*(x-5))
  target: 32
