id: planet-distances
subject: earth-space
difficulty: beginner
added: '2026-11-14'
equation: r = \sin\varepsilon_{\max}
concepts:
  - elongation
  - right-triangle
  - astronomical-unit
  - heliocentrism
prerequisites:
  - sun-distance
  - sun-size
related:
  - transit-of-venus
  - kepler-orbits
  - earth-size
