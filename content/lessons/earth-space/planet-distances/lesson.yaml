  - \varepsilon_{\max}
derivation:
  - '\sin\varepsilon_{\max} = \frac{r}{1\,\text{AU}}'
  - r = \sin\varepsilon_{\max}
charts: []
primary: a
presets:
  - r: 0.72
    a: 44
  - r: 0.39
    a: 67
  - r: 0.72
    a: 180
challenges:
  - check: abs(r - 0.72) < 0.015 and abs(atan2(r*sin(a*pi/180), 1 - r*cos(a*pi/180))*180/pi) > 45.5
  - check: abs(r - 0.5) < 0.011 and abs(atan2(r*sin(a*pi/180), 1 - r*cos(a*pi/180))*180/pi) > 29.5
  - check: abs(r - 0.39) < 0.015 and abs(atan2(r*sin(a*pi/180), 1 - r*cos(a*pi/180))*180/pi) > 22.3
