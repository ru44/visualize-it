id: radioactive-dating
subject: earth-space
difficulty: high-school
equation: N = N_0\left(\frac{1}{2}\right)^{x/T_{1/2}}
concepts:
  - half-life
  - exponential-decay
  - carbon-dating
prerequisites:
  - exponential-growth
  - logarithms
related: []
visualization:
  type: function-plot
  options:
    expr: N0*(1/2)^(x/T)
    domain: [0, 40000]
    range: [0, 1000]
    mode: tangent
parameters:
  N0:
    min: 10
    max: 1000
    step: 10
    value: 100
    unit: "atoms"
  T:
    min: 1000
    max: 10000
    step: 10
    value: 5730
    unit: "yr"
  x:
    min: 0
    max: 40000
    step: 100
    value: 5730
    unit: "yr"
variables:
  - N_0
  - T_{1/2}
  - x
  - k
  - N
derivation:
  - N = N_0\left(\frac{1}{2}\right)^{k}
  - k = \frac{x}{T_{1/2}}
  - N = N_0\left(\frac{1}{2}\right)^{x/T_{1/2}}
charts:
  - title: Fraction remaining
    xLabel: years
    yLabel: fraction of N₀
    domain: [0, 40000]
    series:
      - (1/2)^(x/T)
primary: T
presets:
- N0: 500
  T: 5730
  x: 1000
- N0: 200
  T: 5730
  x: 5700
- N0: 100
  T: 1000
  x: 8000
challenges:
- check: (1/2)^(x/T)
  target: 0.5
  tol: 0.02
- check: (1/2)^(x/T) < 0.05
- check: N0*(1/2)^(x/T)
  target: 25
  tol: 2
