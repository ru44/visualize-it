id: escape-velocity
subject: earth-space
difficulty: high-school
equation: v_{esc} = \sqrt{\frac{2GM}{r}}
concepts:
  - escape-velocity
  - gravitational-potential-energy
  - atmospheric-retention
prerequisites:
  - universal-gravitation
  - kepler-orbits
related:
  - kepler-orbits
visualization:
  type: function-plot
  options:
    expr: sqrt(2*3.986e14/(x*1e6))/1000
    domain: [6.4, 60]
    range: [0, 12]
    mode: plain
parameters:
  x:
    min: 6.4
    max: 60
    step: 0.1
    value: 6.4
    unit: "thousand km"
variables:
  - G
  - M
  - m
  - r
  - v_{esc}
  - v
derivation:
  - \frac{1}{2}mv_{esc}^2 = \frac{GMm}{r}
  - v_{esc}^2 = \frac{2GM}{r}
  - v_{esc} = \sqrt{\frac{2GM}{r}} = \sqrt{2}\,v
charts:
  - title: Escape vs. orbital speed
    xLabel: radius (thousand km)
    yLabel: speed (km/s)
    domain: [6.4, 60]
    series:
      - sqrt(3.986e14/(x*1e6))/1000
primary: x
presets:
- x: 6.4
- x: 20
- x: 42.2
challenges:
- check: sqrt(2*3.986e14/(x*1e6))/1000
  target: 5
- check: x < 10 and sqrt(2*3.986e14/(x*1e6))/1000 > 10
- check: sqrt(2*3.986e14/(x*1e6))/1000 < 6
