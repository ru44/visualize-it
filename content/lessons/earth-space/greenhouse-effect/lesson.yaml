id: greenhouse-effect
subject: earth-space
difficulty: high-school
equation: T = \left[\frac{(1-\alpha)S_{0}}{4\sigma(1-\epsilon/2)}\right]^{1/4}
concepts:
  - energy-balance
  - albedo
  - stefan-boltzmann-law
prerequisites: []
related:
  - seasons
visualization:
  type: function-plot
  options:
    expr: ((1 - alb)*1361/(4*5.67e-8*(1 - x/2)))^(1/4) - 273.15
    domain: [0, 0.95]
    range: [-40, 40]
    mode: plain
parameters:
  alb:
    min: 0.1
    max: 0.6
    step: 0.01
    value: 0.3
    label: "albedo — sunlight reflected"
  x:
    min: 0
    max: 0.95
    step: 0.01
    value: 0.78
variables:
  - \alpha
  - S_{0}
  - \sigma
  - \epsilon
  - T
derivation:
  - (1-\alpha)\frac{S_{0}}{4}
  - (1-\alpha)\frac{S_{0}}{4} = \sigma T^4\left(1-\frac{\epsilon}{2}\right)
  - T = \left[\frac{(1-\alpha)S_{0}}{4\sigma(1-\epsilon/2)}\right]^{1/4}
charts: []
