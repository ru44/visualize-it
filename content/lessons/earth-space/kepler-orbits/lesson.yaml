id: kepler-orbits
subject: earth-space
difficulty: high-school
equation: v = \sqrt{\frac{GM}{r}}
concepts:
  - keplers-laws
  - circular-orbits
  - orbital-period
prerequisites:
  - universal-gravitation
related:
  - escape-velocity
visualization:
  type: function-plot
  options:
    expr: sqrt(3.986e14/(x*1e6))/1000
    domain: [6.6, 50]
    range: [0, 8]
    mode: tangent
visualization3d:
  type: orbit
parameters:
  x:
    min: 6.6
    max: 50
    step: 0.1
    value: 6.8
    unit: "thousand km"
variables:
  - G
  - M
  - m
  - r
  - v
  - T
derivation:
  - \frac{GMm}{r^2} = \frac{mv^2}{r}
  - v = \sqrt{\frac{GM}{r}}
  - T = \frac{2\pi r}{v} = 2\pi\sqrt{\frac{r^3}{GM}}
charts:
  - title: Orbital period
    xLabel: radius (thousand km)
    yLabel: period (hours)
    domain: [6.6, 50]
    series:
      - 2*pi*sqrt((x*1e6)^3/3.986e14)/3600
