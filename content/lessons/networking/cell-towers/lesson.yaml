id: cell-towers
subject: networking
difficulty: high-school
equation: P = P_1 - 10\,n\,\log_{10} d
concepts:
- cellular-network
- handover
- path-loss
- signal-strength
prerequisites:
- wifi
related:
- dialer-codes
- latency-and-bandwidth
visualization:
  type: cell-towers
visualization3d:
  type: cell-towers
parameters:
  d:
    min: 0.2
    max: 5.8
    step: 0.1
    value: 1.5
    unit: km
  n:
    min: 2
    max: 4
    step: 0.1
    value: 3
  H:
    min: 0
    max: 10
    step: 1
    value: 3
    unit: dB
variables:
- P
- P_1
- n
- d
- H
derivation:
- P_A = P_1 - 10\,n\,\log_{10} d_A \qquad P_B = P_1 - 10\,n\,\log_{10} d_B
- P_B - P_A = 10\,n\,\log_{10} \dfrac{d_A}{d_B}
- '\text{switch to B when } P_B - P_A > H'
charts: []
primary: d
presets:
- d: 1.5
  n: 3
  H: 3
- d: 3.5
  n: 2.4
  H: 3
- d: 3.8
  n: 3.8
  H: 10
challenges:
- check: 10*n*log10(d/(6-d)) > H
- check: abs(d - 3.5) < 0.05 and 10*n*log10(d/(6-d)) <= H
- check: 'n >= 3.5 and (10*n*log10(d/(6-d)) > H ? -75 - 10*n*log10(6-d) : -75 - 10*n*log10(d)) < -95'
