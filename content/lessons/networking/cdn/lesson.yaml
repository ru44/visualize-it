id: cdn
subject: networking
difficulty: high-school
equation: \bar{t} = \frac{H\,t_e + (100 - H)\,t_o}{100}
concepts:
- cdn
- caching
- edge
- speed-of-light
prerequisites:
- latency-and-bandwidth
related:
- dns
- cloud-vpc
visualization:
  type: cdn-map
parameters:
  do:
    min: 100
    max: 12000
    step: 100
    value: 9000
    unit: km
  de:
    min: 10
    max: 500
    step: 10
    value: 50
    unit: km
  H:
    min: 0
    max: 100
