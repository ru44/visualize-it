id: bridges-and-trusses
subject: engineering
difficulty: high-school
equation: F_{brace} = \frac{W}{\sin\theta}, \qquad F_{arm} = \frac{W}{\tan\theta}, \qquad \theta=\arctan\frac{h}{L}
concepts:
  - truss
  - triangulation
  - tension-and-compression
  - load-path
  - statically-determinate
prerequisites: []
related:
  - beam-bending
  - stress-strain-and-materials
visualization:
  type: bridges-and-trusses
  options: {}
visualization3d:
  type: bridges-and-trusses
  options: {}
parameters:
  W:
    min: 20
    max: 2000
    step: 10
    value: 300
    unit: N
  L:
    min: 0.2
    max: 2
    step: 0.05
    value: 0.6
    unit: m
  h:
    min: 0.05
    max: 1.5
    step: 0.05
    value: 0.4
    unit: m
variables:
  - W
  - L
  - h
  - \theta
  - F_{brace}
  - F_{arm}
derivation:
  - \theta = \arctan\frac{h}{L}
  - F_{brace}\sin\theta = W \implies F_{brace} = \frac{W}{\sin\theta}
  - F_{arm} = F_{brace}\cos\theta = \frac{W}{\tan\theta}
charts: []
primary: h
presets:
  - W: 150
    L: 0.3
    h: 0.2
  - W: 800
    L: 1.2
    h: 0.6
  - W: 300
    L: 0.6
    h: 1.2
challenges:
  - check: W*L/h > 1000
  - check: W*sqrt(L^2+h^2)/h < 500 and h > 1
  - check: W*sqrt(L^2+h^2)/h
    target: 1000
    tol: 30
