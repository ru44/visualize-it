id: fourier-series
subject: engineering
difficulty: university
equation: f(x) = \frac{4}{\pi}\sum_{k=1,3,5,\dots}^{N}\frac{\sin(kx)}{k}
concepts:
  - harmonics
  - periodic-signal
  - fourier-series
  - gibbs-phenomenon
prerequisites:
  - sine-wave
related:
  - low-pass-filter
  - sampling-and-aliasing
  - interference-and-beats
visualization:
  type: function-plot
  options:
    expr: "4/pi*(sin(x) + (N >= 3 ? sin(3*x)/3 : 0) + (N >= 5 ? sin(5*x)/5 : 0) + (N >= 7 ? sin(7*x)/7 : 0) + (N >= 9 ? sin(9*x)/9 : 0) + (N >= 11 ? sin(11*x)/11 : 0))"
    domain: [-7, 7]
    range: [-1.6, 1.6]
    mode: plain
parameters:
  N:
    min: 1
    max: 11
    step: 2
    value: 3
  x:
    min: -7
    max: 7
    step: 0.01
    value: 1
variables:
  - f
  - N
  - k
  - a_k
derivation:
  - a_k = \frac{4}{\pi k} \text{ for odd } k
  - f(x) = \sum_{k=1}^{\infty} a_k \sin(kx)
  - S_N(x) = \sum_{k=1,3,\dots}^{N} a_k \sin(kx)
charts: []
primary: N
presets:
  - N: 1
    x: 0
  - N: 7
    x: 1.57
  - N: 11
    x: 3
challenges:
  - check: abs(N-1)<0.5 and abs(4/pi*sin(x) - 1.27) < 0.05
  - check: "N>=11 and x>0 and x<1 and (4/pi*(sin(x) + (N >= 3 ? sin(3*x)/3 : 0) + (N >= 5 ? sin(5*x)/5 : 0) + (N >= 7 ? sin(7*x)/7 : 0) + (N >= 9 ? sin(9*x)/9 : 0) + (N >= 11 ? sin(11*x)/11 : 0))) > 1.1"
  - check: "abs(x-1.5708)<0.05 and (4/pi*(sin(x) + (N >= 3 ? sin(3*x)/3 : 0) + (N >= 5 ? sin(5*x)/5 : 0) + (N >= 7 ? sin(7*x)/7 : 0) + (N >= 9 ? sin(9*x)/9 : 0) + (N >= 11 ? sin(11*x)/11 : 0))) > 0.92 and (4/pi*(sin(x) + (N >= 3 ? sin(3*x)/3 : 0) + (N >= 5 ? sin(5*x)/5 : 0) + (N >= 7 ? sin(7*x)/7 : 0) + (N >= 9 ? sin(9*x)/9 : 0) + (N >= 11 ? sin(11*x)/11 : 0))) < 1.08"
