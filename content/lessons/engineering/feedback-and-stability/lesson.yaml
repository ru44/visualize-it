id: feedback-and-stability
subject: engineering
difficulty: high-school
equation: T_n = T_{n-1} + g\,(r - T_{n-1-d})
concepts:
  - feedback
  - gain
  - lag
  - oscillation
  - stability
prerequisites: []
related:
  - pid-control
visualization:
  type: feedback-and-stability
  options: {}
parameters:
  g:
    min: 0
    max: 2.4
    step: 0.02
    value: 0.5
  d:
    min: 0
    max: 4
    step: 1
    value: 1
  r:
    min: 15
    max: 30
    step: 1
    value: 22
    unit: °C
  T0:
    min: 5
    max: 25
    step: 1
    value: 15
    unit: °C
variables:
  - T
  - n
  - g
  - r
  - d
  - e
derivation:
  - e = r - T_{n-1-d}
  - T_n = T_{n-1} + g\,e
  - \text{roughly stable when } g < \frac{2}{d+1}
charts: []
primary: g
presets:
  - g: 0.15
    d: 1
    r: 22
    T0: 15
  - g: 0.7
    d: 1
    r: 22
    T0: 15
  - g: 0.7
    d: 3
    r: 22
    T0: 15
challenges:
  - check: g < 2/(d+1)
  - check: g > 2/(d+1) and g < 2
  - check: d >= 3 and g < 2/(d+1)
