id: damped-oscillation-resonance
subject: waves
difficulty: university
equation: x(t) = Ae^{-\gamma t}\cos(\omega t)
concepts:
  - damping
  - resonance
  - oscillator
prerequisites:
  - simple-harmonic-motion
related:
  - simple-harmonic-motion
  - exponential-growth
visualization:
  type: function-plot
  options:
    expr: A*exp(-g*x)*cos(w*x)
    domain:
      - 0
      - 12
    range:
      - -4
      - 4
    mode: tangent
visualization3d:
  type: spring
  options: { mode: driven }
parameters:
  A:
    min: 0.5
    max: 4
    step: 0.1
    value: 3
  g:
    min: 0.02
    max: 1
    step: 0.02
    value: 0.2
    unit: 1/s
  w:
    min: 0.5
    max: 6
    step: 0.1
    value: 3
    unit: rad/s
  x:
    min: 0
    max: 12
    step: 0.02
    value: 3
    unit: s
  F:
    min: 0.5
    max: 5
    step: 0.1
    value: 2
  w0:
    min: 0.5
    max: 6
    step: 0.1
    value: 3
    unit: rad/s
variables:
  - \gamma
  - \omega
  - \omega_0, F
derivation:
  - \ddot x + 2\gamma\dot x + \omega_0^2 x = 0
  - x(t) = e^{-\gamma t}\big(C_1\cos\omega t + C_2\sin\omega t\big), \quad \omega = \sqrt{\omega_0^2-\gamma^2}
  - x(t) = Ae^{-\gamma t}\cos(\omega t + \varphi)
charts:
  - domain:
      - 0
      - 6
    marker: w0
    series:
      - F/sqrt((w0^2 - x^2)^2 + (2*g*x)^2)
primary: g
presets:
  - A: 1.5
    g: 0.06
    w: 5
  - A: 3
    g: 0.3
    w: 1.5
  - A: 2.5
    g: 0.9
    w: 3
challenges:
  - check: g >= 0.9
  - check: w
    target: 4.5
  - check: abs(x - w0) < 0.3
