id: refraction-snells-law
subject: waves
difficulty: high-school
equation: n_1 \sin\theta_1 = n_2 \sin\theta_2
concepts:
  - refraction
  - snells-law
  - refractive-index
prerequisites:
  - sine-wave
related:
  - total-internal-reflection
  - thin-lenses
visualization:
  type: ray-optics
  options:
    mode: refraction
parameters:
  theta1:
    min: 0
    max: 89
    step: 0.5
    value: 40
    unit: '°'
  n1:
    min: 1
    max: 2.5
    step: 0.01
    value: 1
  n2:
    min: 1
    max: 2.5
    step: 0.01
    value: 1.5
variables:
  - n_1, n_2
  - \theta_1, \theta_2
  - v_1, v_2
derivation:
  - \frac{\sin\theta_1}{\sin\theta_2} = \frac{v_1}{v_2}
  - n = \frac{c}{v} \;\Rightarrow\; v_1 = \frac{c}{n_1},\ v_2 = \frac{c}{n_2}
  - n_1\sin\theta_1 = n_2\sin\theta_2
charts: []
