id: diffraction
subject: waves
difficulty: high-school
equation: \theta = \arcsin\!\left(\dfrac{\lambda}{a}\right)
concepts:
  - diffraction
  - huygens-principle
  - gap-width
prerequisites:
  - wave-basics
related:
  - interference-and-beats
  - speed-of-sound
visualization:
  type: diffraction
  options: {}
visualization3d:
  type: diffraction-field
  options: {}
parameters:
  a:
    min: 0.2
    max: 4
    step: 0.05
    value: 1
    unit: m
  lambda:
    min: 0.1
    max: 3
    step: 0.05
    value: 0.7
    unit: m
variables:
  - \lambda
  - a
  - \theta
derivation:
  - \theta = \arcsin\!\left(\dfrac{\lambda}{a}\right)
  - a \gg \lambda \Rightarrow \theta \to 0
  - a \approx \lambda \Rightarrow \theta \to \text{90°}
charts: []
primary: a
presets:
  - a: 1
    lambda: 0.7
  - a: 4
    lambda: 0.1
  - a: 0.3
    lambda: 0.3
challenges:
  - check: lambda/a
    target: 1
  - check: lambda/a
    target: 0.05
    tol: 0.02
  - check: asin(min(1,lambda/a))*180/pi
    target: 30
