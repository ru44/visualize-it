id: wave-basics
subject: waves
difficulty: beginner
equation: v = f\lambda
concepts:
  - wavelength
  - frequency
  - amplitude
  - wave-speed
prerequisites: []
related:
  - transverse-and-longitudinal
  - sine-wave
visualization:
  type: wave-basics
  options: {}
visualization3d:
  type: rope
  options: {}
parameters:
  f:
    min: 0.2
    max: 2
    step: 0.05
    value: 0.5
    unit: Hz
  lambda:
    min: 0.5
    max: 4
    step: 0.05
    value: 2
    unit: m
  A:
    min: 0.1
    max: 1
