  - \lambda
  - v
  - T
derivation:
  - v = \dfrac{\lambda}{T}
  - T = \dfrac{1}{f}
  - v = f\lambda
charts: []
primary: f
presets:
  - f: 0.5
    lambda: 3
    A: 0.6
  - f: 1.2
    lambda: 1.2
    A: 0.3
  - f: 2
    lambda: 0.6
    A: 0.2
challenges:
  - check: f*lambda
    target: 1
  - check: f*lambda
    target: 3.6
  - check: A < 0.2 and f*lambda > 2
