id: thin-lenses
subject: waves
difficulty: university
equation: \frac{1}{f} = \frac{1}{d_0} + \frac{1}{d_i}
concepts:
  - thin-lens
  - focal-length
  - image-formation
prerequisites:
  - refraction-snells-law
related:
  - refraction-snells-law
  - total-internal-reflection
visualization:
  type: ray-optics
  options:
    mode: lens
parameters:
  f:
    min: 2
    max: 15
    step: 0.1
    value: 6
  doo:
    min: 0.5
    max: 30
    step: 0.1
    value: 15
  ho:
    min: 0.5
    max: 6
    step: 0.1
    value: 3
variables:
  - f
  - d_0, d_i
  - h_0, h_i
  - m
derivation:
  - \frac{h_i}{h_0} = -\frac{d_i}{d_0}
  - \frac{1}{d_0} + \frac{1}{d_i} = \frac{1}{f}
  - m = \frac{h_i}{h_0} = -\frac{d_i}{d_0}
charts: []
primary: doo
presets:
  - f: 6
    doo: 25
    ho: 2
  - f: 6
    doo: 3
    ho: 1
  - f: 10
    doo: 12
    ho: 1.5
challenges:
  - check: 1/(1/f - 1/doo)
    target: 10
  - check: doo < f
  - check: -(1/(1/f - 1/doo))/doo
    target: -2
