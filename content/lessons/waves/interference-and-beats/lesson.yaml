id: interference-and-beats
subject: waves
difficulty: university
equation: \sin(2\pi f_1 x) + \sin(2\pi f_2 x) = 2\cos\!\left(2\pi\tfrac{f_1-f_2}{2}x\right)\sin\!\left(2\pi\tfrac{f_1+f_2}{2}x\right)
concepts:
  - interference
  - beats
  - superposition
prerequisites:
  - sine-wave
related:
  - sine-wave
  - standing-waves
visualization:
  type: function-plot
  options:
    expr: sin(2*pi*f1*x) + sin(2*pi*f2*x)
    domain:
      - 0
      - 4
    range:
      - -2.2
      - 2.2
    mode: plain
parameters:
  f1:
    min: 5
    max: 12
    step: 0.1
    value: 8
    unit: Hz
  f2:
    min: 5
    max: 12
    step: 0.1
    value: 9
    unit: Hz
  x:
    min: 0
    max: 4
    step: 0.002
    value: 0.5
    unit: s
variables:
  - f_1, f_2
  - "|f_1 - f_2|"
derivation:
  - \sin A + \sin B = 2\sin\!\left(\frac{A+B}{2}\right)\cos\!\left(\frac{A-B}{2}\right)
  - A = 2\pi f_1 x, \quad B = 2\pi f_2 x
  - = 2\cos\!\left(2\pi\frac{f_1-f_2}{2}x\right)\sin\!\left(2\pi\frac{f_1+f_2}{2}x\right)
charts: []
primary: f2
presets:
  - f1: 8
    f2: 8.2
  - f1: 6
    f2: 6.8
  - f1: 5
    f2: 11
challenges:
  - check: abs(f1 - f2)
    target: 1
  - check: abs(f1 - f2) < 0.05
  - check: abs(f1 - f2) >= 5
