id: transverse-and-longitudinal
subject: waves
difficulty: beginner
equation: s(x,t) = A\sin\!\left(\dfrac{2\pi x}{\lambda} - 2\pi f t\right)
concepts:
  - transverse-wave
  - longitudinal-wave
  - compression
  - rarefaction
prerequisites:
  - wave-basics
related:
  - wave-basics
  - speed-of-sound
visualization:
  type: transverse-and-longitudinal
  options: {}
visualization3d:
  type: coil
  options: {}
parameters:
  f:
    min: 0.2
    max: 1.5
    step: 0.05
    value: 0.8
    unit: Hz
  lambda:
    min: 1
    max: 4
    step: 0.05
    value: 2
    unit: m
  A:
    min: 0.1
    max: 0.8
    step: 0.05
    value: 0.5
    unit: m
variables:
  - \lambda
  - f
  - A
  - k
  - \omega
derivation:
  - k = \dfrac{2\pi}{\lambda}
  - \omega = 2\pi f
  - s(x,t) = A\sin(kx-\omega t)
charts: []
primary: f
presets:
  - lambda: 3.5
    f: 0.4
    A: 0.6
  - lambda: 1
    f: 1.2
    A: 0.3
  - lambda: 2
    f: 0.8
    A: 0.5
challenges:
  - check: lambda
    target: 1
  - check: lambda > 3 and f < 0.5
  - check: f
    target: 1.5
