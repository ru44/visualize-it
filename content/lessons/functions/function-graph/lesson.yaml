id: function-graph
subject: functions
difficulty: beginner
equation: f(x) = ax^2 + bx + c
concepts:
- function
- input
- output
- graph
prerequisites: []
related:
- slope
- derivative
visualization:
  type: function-plot
  options:
    expr: a*x^2 + b*x + c
    domain:
    - -6
    - 6
    range:
    - -8
    - 12
    mode: plain
parameters:
  x:
    min: -6
    max: 6
    step: 0.05
    value: 1.5
  a:
    min: -2
    max: 2
    step: 0.05
    value: 1
  b:
    min: -4
    max: 4
    step: 0.1
    value: 0
  c:
    min: -6
    max: 6
    step: 0.1
    value: 0
variables:
- x
- f(x)
- a
- b
- c
derivation:
- f(x) = ax^2 + bx + c
- f(x) = a\left(x + \tfrac{b}{2a}\right)^2 + c - \tfrac{b^2}{4a}
- x_{\text{vertex}} = -\tfrac{b}{2a}
charts: []
primary: x
presets:
  - x: 3
    a: 1
    b: 0
    c: 0
  - x: 2
    a: -1
    b: 4
    c: 0
  - x: 4
    a: -0.5
    b: 4
    c: 0
challenges:
  - check: abs(a*x^2 + b*x + c - 16) < 0.3 and abs(a) > 0.3
  - check: a < -0.05 and abs(-b/(2*a) - 2) < 0.1
  - check: abs(c) < 0.1 and abs(16*a + 4*b) < 0.3 and abs(a) > 0.05
