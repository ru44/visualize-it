variables:
- \Delta x
- \Delta y
- m
derivation:
- y_1 = mx_1 + b, \quad y_2 = mx_2 + b
- y_2 - y_1 = m(x_2 - x_1)
- \frac{y_2 - y_1}{x_2 - x_1} = m
