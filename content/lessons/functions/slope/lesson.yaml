id: slope
subject: functions
difficulty: beginner
equation: m = \frac{\Delta y}{\Delta x} = \frac{y_2 - y_1}{x_2 - x_1}
concepts:
- slope
- rate-of-change
- line
prerequisites:
- function-graph
related:
- derivative
visualization:
  type: function-plot
  options:
    expr: m*x + b
    domain:
    - -6
    - 6
    range:
    - -8
    - 8
    mode: secant
parameters:
  m:
    min: -3
    max: 3
    step: 0.05
    value: 0.75
  b:
    min: -5
    max: 5
    step: 0.1
    value: -1
  x:
    min: -6
    max: 6
    step: 0.05
    value: -2
  h:
    min: 0.25
    max: 6
    step: 0.05
    value: 4
variables:
- \Delta x
- \Delta y
- m
derivation:
- y_1 = mx_1 + b, \quad y_2 = mx_2 + b
- y_2 - y_1 = m(x_2 - x_1)
- \frac{y_2 - y_1}{x_2 - x_1} = m
charts: []
primary: x
presets:
  - m: 1.5
    b: 0
    x: -2
    h: 4
  - m: 0.05
    b: 0
    x: 0
    h: 6
  - m: 2.5
    b: 1
    x: 1
    h: 3
challenges:
  - check: m*h
    target: 5
  - check: abs(x - 3) < 0.05 and abs(m*x + b - 7) < 0.2
  - check: m < -0.05 and m*h < -10
