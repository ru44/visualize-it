id: piecewise-and-absolute-value
subject: functions
difficulty: beginner
equation: f(x) = \begin{cases} px + c & x < a \\ pa + c + q(x-a) & x \ge a \end{cases}
concepts:
- piecewise
- absolute-value
- step-function
prerequisites:
- function-graph
- slope
related:
- domain-and-range
visualization:
  type: function-plot
  options:
    expr: 'x < a ? p*x + c : p*a + c + q*(x - a)'
    domain:
    - -6
    - 10
    range:
    - -4
    - 12
    mode: plain
parameters:
  x:
    min: -6
    max: 10
    step: 0.05
    value: 5
  a:
    min: -4
    max: 6
    step: 0.5
    value: 2
  p:
    min: -3
    max: 3
    step: 0.05
    value: 1
  q:
    min: -3
    max: 3
    step: 0.05
    value: 2
  c:
    min: -4
    max: 4
    step: 0.1
    value: 0
variables:
- x
- a
- p
- q
- c
derivation:
- f(x) = px + c \quad (x < a)
- f(a) = pa + c
- f(x) = f(a) + q(x-a) \quad (x \ge a)
charts: []
primary: x
presets:
- x: 6
  a: 4
  p: 1.5
  q: 2.5
  c: 2
- x: 8
  a: 5
  p: 0.1
  q: 0.25
  c: 0
- x: -3
  a: 0
  p: -1
  q: 1
  c: 0
challenges:
- check: 'x < a ? p*x + c : p*a + c + q*(x - a)'
  target: 13
- check: abs(p + 1) < 0.05 and abs(q - 1) < 0.05 and abs(a) < 0.05 and abs(c) < 0.05
- check: q > 0 and abs(q - 2*p) < 0.05
