id: quadratic-functions
subject: functions
difficulty: high-school
equation: f(x) = a(x-h)^2 + k
concepts:
  - quadratic-function
  - vertex-form
  - parabola
  - turning-point
prerequisites:
  - function-graph
related:
  - quadratic-roots
  - polynomial-shape
visualization:
  type: function-plot
  options:
    expr: a*(x-h)^2 + k
    domain:
      - -4
      - 8
    range:
      - -3
      - 6
    mode: plain
parameters:
  x:
    min: -4
    max: 8
    step: 0.05
    value: 2
  a:
    min: -2
    max: 2
    step: 0.05
    value: -0.75
  h:
    min: -6
    max: 8
    step: 0.5
    value: 2
  k:
    min: -6
    max: 8
    step: 0.5
    value: 3
variables:
  - a
  - h
  - k
  - x
derivation:
  - (x-h)^2 \ge 0
  - a(x-h)^2 \ge 0 \quad (a>0)
  - f(x) = a(x-h)^2 + k \ge k, \text{ with equality at } x=h
charts: []
primary: h
presets:
  - a: -0.75
    h: 2
    k: 3
    x: 2
  - a: 0.3
    h: 0
    k: 0
    x: 0
  - a: -0.4
    h: -3
    k: 4
    x: -3
challenges:
  - check: a > 0.1 and abs(k - 6) < 0.2
  - check: abs(h + 3) < 0.15 and abs(k - 4) < 0.15
  - check: a < -0.1 and abs(a*(5-h)^2 + k) < 0.3
