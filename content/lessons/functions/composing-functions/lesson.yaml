id: composing-functions
subject: functions
difficulty: beginner
equation: (f \circ g)(x) = rx(1+t), \quad g(x) = rx,\ f(u) = u(1+t)
concepts:
- composition
- function-machine
- chaining
prerequisites:
- function-graph
related:
- inverse-functions
visualization:
  type: function-plot
  options:
    expr: r*x*(1+t)
    domain:
    - 0
    - 200
    range:
    - 0
    - 1000
    mode: plain
parameters:
  x:
    min: 0
    max: 200
    step: 1
    value: 100
  r:
    min: 0.5
    max: 5
    step: 0.05
    value: 3.75
  t:
    min: 0
    max: 0.3
    step: 0.01
    value: 0.15
variables:
- x
- r
- t
derivation:
- g(x) = rx
- f(u) = u(1+t)
- f(g(x)) = rx(1+t)
charts: []
primary: x
presets:
- x: 100
  r: 3.75
  t: 0.15
- x: 50
  r: 0.85
  t: 0.08
- x: 150
  r: 1.35
  t: 0
challenges:
- check: r*x*(1+t)
  target: 300
- check: r*x*t
