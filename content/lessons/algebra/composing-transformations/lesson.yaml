id: composing-transformations
subject: algebra
difficulty: university
equation: R(\theta)\,S(k) \neq S(k)\,R(\theta)
concepts:
- matrix multiplication
- composition
- linear transformations
prerequisites:
- matrices-as-transformations
related:
- determinant
visualization:
  type: compose-transform
  options: {}
parameters:
  angle:
    min: 0
    max: 180
    step: 1
    value: 40
    unit: °
  k:
    min: 1
    max: 3
    step: 0.05
    value: 2
variables:
- R
- S
- \theta
- k
derivation:
- R(\theta) = \begin{pmatrix}\cos\theta & -\sin\theta\\ \sin\theta & \cos\theta\end{pmatrix}, \qquad S(k) = \begin{pmatrix}k & 0\\ 0 & 1\end{pmatrix}
- S(k)R(\theta)\,\mathbf{v} \text{ rotates } \mathbf{v} \text{ by } \theta \text{ first, then stretches the result by } k
- R(\theta)S(k)\,\mathbf{v} \text{ stretches } \mathbf{v} \text{ by } k \text{ first, then rotates the result by } \theta, \text{ landing somewhere else whenever } \theta \neq 0 \text{ and } k \neq 1
charts: []
primary: angle
presets:
- angle: 90
  k: 2
- angle: 45
  k: 1.5
- angle: 0
  k: 2.5
challenges:
- check: 'angle < 1'
- check: 'angle > 60 and angle < 120 and k > 1.8'
- check: k
  target: 3
