id: percent-and-compound-growth
subject: algebra
difficulty: high-school
equation: A(x) = P\left(1 + \frac{\text{rate}}{100}\right)^{x}
concepts:
  - percent
  - compound-growth
  - exponential
prerequisites:
  - exponents-and-powers
related:
  - exponential-growth
  - logarithms
visualization:
  type: function-plot
  options:
    expr: P*(1 + rate/100)^x
    domain:
      - 0
      - 20
    range:
      - -2
      - 30
    mode: tangent
parameters:
  P:
    min: 1
    max: 10
    step: 0.5
    value: 4
  rate:
    min: -20
    max: 25
    step: 0.5
    value: 8
  x:
    min: 0
    max: 20
    step: 0.05
    value: 8
variables:
  - P
  - rate
  - x
derivation:
  - A(1) = P + P\cdot\frac{\text{rate}}{100} = P\left(1+\frac{\text{rate}}{100}\right)
  - A(2) = A(1)\left(1+\frac{\text{rate}}{100}\right) = P\left(1+\frac{\text{rate}}{100}\right)^2
  - A(x) = P\left(1+\frac{\text{rate}}{100}\right)^{x}
charts: []
