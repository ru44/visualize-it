id: vectors
subject: algebra
difficulty: high-school
equation: '|\mathbf{v}| = \sqrt{v_x^2 + v_y^2}'
concepts:
  - vectors
  - magnitude
  - direction
  - vector-addition
  - scalar-multiplication
prerequisites:
  - pythagorean-theorem
related:
  - matrices-as-transformations
  - complex-numbers
visualization:
  type: matrix-transform
  options: {}
visualization3d:
  type: vector
  options: { mode: add }
parameters:
  a:
    min: -3
    max: 3
    step: 0.05
    value: 1
  b:
    min: -3
    max: 3
    step: 0.05
    value: 0
  c:
    min: -3
    max: 3
    step: 0.05
    value: 0
  d:
    min: -3
    max: 3
    step: 0.05
    value: 1
  vx:
    min: -5
    max: 5
    step: 0.05
    value: 2
  vy:
    min: -4
    max: 4
    step: 0.05
    value: 1
variables:
  - v_x
  - v_y
derivation:
  - \mathbf{v} = (v_x, v_y)
  - v_x^2 + v_y^2
  - '|\mathbf{v}| = \sqrt{v_x^2 + v_y^2}'
charts: []
primary: vx
presets:
  - vx: 5
    vy: 0
  - vx: 0
    vy: 4
  - vx: 3
    vy: 4
challenges:
  - check: abs(sqrt(vx^2 + vy^2) - 5) < 0.1 and abs(vx) > 0.1 and abs(vy) > 0.1
  - check: abs(vx) + abs(vy - 4)
    target: 0
    tol: 0.1
  - check: abs(vx - vy) < 0.05 and sqrt(vx^2 + vy^2) > 4
