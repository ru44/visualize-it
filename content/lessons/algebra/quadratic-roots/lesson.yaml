id: quadratic-roots
subject: algebra
difficulty: high-school
equation: ax^2 + bx + c = 0 \;\Longrightarrow\; x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
concepts:
  - quadratic-function
  - discriminant
  - parabola
  - root
prerequisites:
  - function-graph
  - linear-equations
related:
  - linear-equations
  - absolute-value-inequalities
visualization:
  type: function-plot
  options:
    expr: a*x^2 + b*x + c
    domain:
      - -10
      - 10
    range:
      - -12
      - 20
    mode: tangent
parameters:
  a:
    min: -3
    max: 3
    step: 0.1
    value: 1
  b:
    min: -8
    max: 8
    step: 0.1
    value: -1
  c:
    min: -10
    max: 10
    step: 0.5
    value: -6
  x:
    min: -10
    max: 10
    step: 0.05
    value: 0
variables:
  - a, b, c
  - \Delta = b^2 - 4ac
  - x
derivation:
  - ax^2 + bx + c = 0 \;\Rightarrow\; x^2 + \frac{b}{a}x = -\frac{c}{a}
  - \left(x + \frac{b}{2a}\right)^2 = \frac{b^2 - 4ac}{4a^2}
  - x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
charts: []
