id: exponents-and-powers
subject: algebra
difficulty: high-school
equation: f(x) = x^n
concepts:
  - exponent
  - power-function
  - root
prerequisites:
  - function-graph
related:
  - logarithms
  - exponential-growth
visualization:
  type: function-plot
  options:
    expr: x^n
    domain:
      - 0.1
      - 4
    range:
      - -2
      - 20
    mode: plain
parameters:
  n:
    min: -1
    max: 3
    step: 0.1
    value: 2
  x:
    min: 0.1
    max: 4
    step: 0.02
    value: 2
variables:
  - n
  - x
derivation:
  - x^{a} \cdot x^{b} = x^{a+b}
  - x^{p/q} = \left(x^{1/q}\right)^{p}, \qquad \left(x^{1/q}\right)^q = x
  - x^{n} := e^{n \ln x}\ (x>0)
charts: []
primary: n
presets:
  - n: 2
    x: 2
  - n: 3
    x: 2
  - n: -1
    x: 2
challenges:
  - check: abs(x - 2) + abs(x^n - 8)
    target: 0
    tol: 0.3
  - check: abs(n + 1) < 0.05 and abs(x^n - 0.25) < 0.02
  - check: abs(n) < 0.05
