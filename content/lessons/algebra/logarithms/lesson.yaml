id: logarithms
subject: algebra
difficulty: high-school
equation: y = \log_b x \;\Longleftrightarrow\; b^y = x
concepts:
  - logarithm
  - inverse-function
  - exponential
prerequisites:
  - exponents-and-powers
related:
  - exponential-growth
  - exponents-and-powers
visualization:
  type: function-plot
  options:
    expr: log(x, b)
    domain:
      - 0.1
      - 10
    range:
      - -4
      - 4
    mode: plain
parameters:
  b:
    min: 1.1
    max: 5
    step: 0.1
    value: 2
  x:
    min: 0.1
    max: 10
    step: 0.02
    value: 4
variables:
  - b
  - x
derivation:
  - b^y = x
  - b^{y_1+y_2} = b^{y_1}b^{y_2} = x_1 x_2
  - \log_b(x_1 x_2) = y_1 + y_2 = \log_b x_1 + \log_b x_2
charts:
  - domain:
      - -4
      - 4
    marker: x
    series:
      - b^x
