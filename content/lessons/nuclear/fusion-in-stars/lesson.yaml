    value: 0
variables:
  - Q
  - \Delta m
  - E_b
  - A
derivation:
  - \dfrac{E_b}{A} \text{ is the binding energy per nucleon, largest for } A \approx 56
  - \text{fusing light nuclei toward } A=56 \text{ raises } \dfrac{E_b}{A} \text{ and releases energy } Q
  - Q = \Delta m\,c^2 \text{, the energy released equals the mass lost times } c^2
charts: []
