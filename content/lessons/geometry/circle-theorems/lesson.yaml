id: circle-theorems
subject: geometry
difficulty: high-school
equation: \angle AOB = 2\,\angle ACB
concepts:
- inscribed angle
- central angle
- semicircle
- tangent
prerequisites:
- circle
related:
- pythagorean-theorem
- polygons-and-tessellation
visualization:
  type: circle-theorems
  options: {}
parameters:
  arc:
    min: 20
    max: 180
    step: 1
    value: 100
    unit: "°"
  pos:
    min: 0.05
    max: 0.95
    step: 0.01
    value: 0.5
variables:
- O
- A
- B
- C
derivation:
  - '\text{at pos = 0.5, draw OC; OA = OB = OC, so OAC and OBC are isosceles}'
  - '\angle ACB=\gamma,\quad \angle ACO=\angle OCB=\gamma/2,\quad \angle AOC=\angle COB=180^\circ-\gamma'
  - '\angle AOB=360^\circ-2(180^\circ-\gamma)=2\gamma\quad\text{(symmetric case)}'
charts: []
primary: arc
presets:
- arc: 100
  pos: 0.5
- arc: 180
  pos: 0.5
- arc: 60
  pos: 0.8
challenges:
- check: arc
  target: 180
- check: arc
  target: 80
- check: 'arc > 130 and pos > 0.85'
