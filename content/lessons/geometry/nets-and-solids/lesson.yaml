derivation:
- \text{a cube's net is six equal squares, hinged edge to edge, each of area } L^2
- \text{folding each flap up by } 90^\circ \text{ along its hinge does not stretch or overlap any square, so no area is gained or lost}
- \text{once every flap is folded, the six squares close into a cube whose total surface area is still } A = 6L^2
