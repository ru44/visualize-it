derivation:
- \text{slide a point a fraction } t \text{ along each of the three segments } P_0P_1,\ P_1P_2,\ P_2P_3
- \text{slide a point the same fraction } t \text{ along the two segments joining those three new points}
- \text{slide a point the same fraction } t \text{ along the last segment; that point is } B(t)
