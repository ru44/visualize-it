id: angles-and-parallel-lines
subject: geometry
difficulty: beginner
equation: \alpha = \beta
concepts:
  - parallel lines
  - transversal
  - corresponding angles
  - alternate angles
  - co-interior angles
prerequisites: []
related:
  - triangle-angles-and-sides
visualization:
  type: parallel-lines
  options: {}
parameters:
  theta:
    min: 15
    max: 165
    step: 1
    value: 55
    unit: °
  pair:
    min: 0
    max: 2
    step: 1
    value: 0
variables:
  - \alpha
  - \beta
derivation:
  - '\text{parallel lines have equal corresponding angles under a translation along the transversal}'
  - '\text{vertically opposite angles are equal, so alternate interior angles are equal too}'
  - '\alpha + \beta = 180^\circ \text{ for same-side interior angles}'
charts: []
primary: pair
presets:
  - theta: 65
    pair: 0
  - theta: 50
    pair: 1
  - theta: 100
    pair: 2
challenges:
  - check: 'pair == 0 and abs(theta - 40) < 2'
  - check: 'pair == 1 and abs(theta - 100) < 3'
  - check: 'pair == 2 and abs(theta - 130) < 3'
