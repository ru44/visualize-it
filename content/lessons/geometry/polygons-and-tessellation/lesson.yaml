id: polygons-and-tessellation
subject: geometry
difficulty: high-school
equation: S = (n-2)\cdot 180^\circ,\quad a = \dfrac{S}{n}
concepts:
- interior angle
- regular polygon
- tessellation
- exterior angle
prerequisites: []
related:
