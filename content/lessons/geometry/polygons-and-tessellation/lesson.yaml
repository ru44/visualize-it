    min: 3
    max: 12
    step: 1
    value: 6
variables:
- n
- S
- a
derivation:
- \text{draw every diagonal from one vertex, splitting the } n\text{-gon into } (n-2) \text{ triangles}
- \text{each triangle's angles add to } 180^\circ \text{, and together the triangles cover every interior angle of the polygon exactly once}
- S = (n-2)\cdot 180^\circ \text{, and sharing that equally among the } n \text{ equal angles of a regular polygon gives } a = \dfrac{S}{n}
charts: []
