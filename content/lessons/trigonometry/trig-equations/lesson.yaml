id: trig-equations
subject: trigonometry
difficulty: high-school
equation: \sin(x+h) = \sin x
concepts:
  - periodicity
  - symmetry
  - equation-solving
  - sine
prerequisites:
  - unit-circle
  - sine-function-parameters
related:
  - tangent-function
  - trig-identities
visualization:
  type: function-plot
  options:
    expr: sin(x)
    domain:
      - 0
      - 12.57
    range:
      - -1.3
      - 1.3
    mode: secant
parameters:
  x:
    min: 0
    max: 6.2
    step: 0.02
    value: 0.5
  h:
    min: -6.2
    max: 6.2
    step: 0.02
    value: 2.14
variables:
  - x
  - h
  - k
derivation:
  - \sin(x+h) - \sin x = 0
  - x + h = \pi - x + 2\pi k \quad\Rightarrow\quad h = \pi - 2x + 2\pi k
  - x + h = x + 2\pi k \quad\Rightarrow\quad h = 2\pi k
charts: []
primary: x
presets:
  - x: 0.5
    h: 2.14
  - x: 1
    h: 1.14
  - x: 4
    h: 1.42
challenges:
  - check: 'abs(sin(x+h) - sin(x)) < 0.02 and abs(h) > 0.5'
  - check: 'abs(sin(x+h) - sin(x)) < 0.02 and abs(h - 2*pi) < 0.3'
  - check: 'sin(x) < -0.3 and abs(sin(x+h) - sin(x)) < 0.02 and abs(h) > 0.3'
