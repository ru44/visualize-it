id: angles-of-elevation-and-depression
subject: trigonometry
difficulty: high-school
equation: \tan\theta = \dfrac{a}{b}
concepts:
- angle of elevation
- angle of depression
- alternate angles
- right triangle
prerequisites:
- solving-right-triangles
related:
- sine-rule
- cosine-rule
visualization:
  type: right-triangle
  options: {}
parameters:
  a:
    min: 1
    max: 200
    step: 1
    value: 30
    unit: m
  b:
    min: 1
    max: 1000
    step: 1
    value: 40
    unit: m
variables:
- a
- b
- \theta
derivation:
- \text{the observer's horizontal sightline and the ground are parallel lines}
- \text{the line of sight is a transversal, so the angle of elevation equals the angle of depression measured from the other end}
- \tan\theta = \dfrac{a}{b}
charts: []
primary: a
presets:
- a: 30
  b: 40
- a: 52
  b: 1000
- a: 100
  b: 150
challenges:
- check: 'atan2(a,b)*180/pi'
  target: 3
  tol: 0.3
- check: 'atan2(a,b)*180/pi > 45'
- check: 'a > 80 and atan2(a,b)*180/pi < 20'
