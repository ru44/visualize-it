id: sine-function-parameters
subject: trigonometry
difficulty: high-school
equation: f(x) = A\sin(\omega x + \varphi) + D
concepts:
  - sine
  - amplitude
  - angular-frequency
  - phase-shift
prerequisites:
  - unit-circle
  - function-graph
related:
  - sine-wave
  - tangent-function
visualization:
  type: function-plot
  options:
    expr: A*sin(w*x + phi) + D
    domain:
      - 0
      - 12
    range:
      - -6
      - 6
    mode: tangent
parameters:
  A:
    min: 0.2
    max: 4
    step: 0.1
    value: 2
  w:
    min: 0.2
    max: 3
    step: 0.05
    value: 1
    unit: rad/unit
  phi:
    min: 0
    max: 6.28
    step: 0.05
    value: 0
    unit: rad
  D:
    min: -3
    max: 3
    step: 0.1
    value: 0
  x:
    min: 0
    max: 12
    step: 0.02
    value: 3
variables:
  - A
  - \omega
  - \varphi
  - D
derivation:
  - f(x) = A\sin(\omega x + \varphi) + D
  - f'(x) = A\omega\cos(\omega x + \varphi)
  - \max f = D + A, \quad \min f = D - A, \quad T = \frac{2\pi}{\omega}
charts: []
