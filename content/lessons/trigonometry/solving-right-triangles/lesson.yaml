derivation:
- c = \sqrt{a^2+b^2}
- \sin\theta = \dfrac{a}{c}, \quad \cos\theta = \dfrac{b}{c}
- \tan\theta = \dfrac{\sin\theta}{\cos\theta} = \dfrac{a}{b}
