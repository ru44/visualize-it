id: inverse-trig-functions
subject: trigonometry
difficulty: high-school
equation: \theta = \arcsin\!\left(\dfrac{a}{c}\right) = \arccos\!\left(\dfrac{b}{c}\right) = \arctan\!\left(\dfrac{a}{b}\right)
concepts:
  - arcsine
  - arccosine
  - arctangent
  - restricted-range
  - inverse-function
prerequisites:
  - unit-circle
  - pythagorean-theorem
related:
  - tangent-function
visualization:
  type: right-triangle
  options: {}
parameters:
  a:
    min: 1
    max: 8
    step: 0.1
    value: 3
  b:
    min: 1
    max: 8
    step: 0.1
    value: 4
variables:
  - a
  - b
  - c
  - \theta
derivation:
  - \sin\theta = \dfrac{a}{c}
  - \theta = \arcsin\!\left(\dfrac{a}{c}\right) \quad\text{(the inverse undoes the sine)}
  - \theta = \arccos\!\left(\dfrac{b}{c}\right) = \arctan\!\left(\dfrac{a}{b}\right) \quad\text{(the same angle, from any two sides)}
charts: []
primary: a
presets:
  - a: 3
    b: 4
  - a: 1
    b: 1
  - a: 1.5
    b: 6
challenges:
  - check: 'atan2(a,b)*180/pi'
    target: 20
  - check: 'atan2(a,b)*180/pi'
    target: 45
  - check: 'a > b and atan2(a,b)*180/pi > 70'
