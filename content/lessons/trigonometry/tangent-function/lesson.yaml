id: tangent-function
subject: trigonometry
difficulty: high-school
equation: f(x) = \tan x = \frac{\sin x}{\cos x}
concepts:
  - tangent
  - asymptote
  - periodicity
prerequisites:
  - unit-circle
  - sine-function-parameters
related:
  - sine-function-parameters
  - one-sided-and-infinite-limits
visualization:
  type: function-plot
  options:
    expr: tan(x)
    domain:
      - -6
      - 6
    range:
      - -6
      - 6
    mode: plain
parameters:
  x:
    min: -6
    max: 6
    step: 0.01
    value: 0.5
variables:
  - x
  - \tan x
derivation:
  - \tan x = \frac{\sin x}{\cos x}
  - \cos x = 0 \;\Rightarrow\; x = \tfrac{\pi}{2} + n\pi
  - \tan(x+\pi) = \frac{\sin(x+\pi)}{\cos(x+\pi)} = \frac{-\sin x}{-\cos x} = \tan x
charts: []
