id: coulombs-law
subject: electromagnetism
difficulty: high-school
equation: F = k\frac{q_1 q_2}{r^2}, \qquad \mathbf{E} = \frac{\mathbf{F}}{q}
concepts:
  - coulombs-law
  - electric-field
  - superposition
  - inverse-square-law
prerequisites:
  - newtons-second-law
related:
  - electric-potential
  - lorentz-force
  - series-parallel
visualization:
  type: electric-field
  options: {}
visualization3d:
  type: coulomb
  options: {}
parameters:
  q1:
    min: -5
    max: 5
    step: 0.1
    value: 2
    unit: µC
  q2:
    min: -5
    max: 5
    step: 0.1
    value: -2
    unit: µC
  d:
    min: 1
    max: 6
    step: 0.1
    value: 3
    unit: m
  px:
    min: -4
    max: 4
    step: 0.05
    value: 0.5
    unit: m
  py:
    min: -2.4
    max: 2.4
    step: 0.05
    value: 1.2
    unit: m
variables:
  - k
  - q_1, q_2
  - r
  - \mathbf{E}
derivation:
  - F = k\frac{q_1q_2}{r^2}
  - \mathbf{E} \equiv \frac{\mathbf{F}}{q_{\text{test}}} = k\frac{q}{r^2}\hat{\mathbf{r}}
  - \mathbf{E}_{\text{total}} = \mathbf{E}_1 + \mathbf{E}_2
charts: []
primary: d
presets:
- q1: 3
  q2: -3
  d: 1.5
- q1: 5
  q2: 5
  d: 4
- q1: -4
  q2: 2
  d: 6
challenges:
- check: 'abs(8.99e-3*q1*q2/d^2)'
  target: 0.05
  tol: 0.01
- check: 'q1*q2 > 0 and 8.99e-3*q1*q2/d^2 >= 0.02 and d >= 3'
- check: '8.99e-3*abs(q1*q2)/d^2 > 0.2'
