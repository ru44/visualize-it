id: amperes-law-and-solenoid
subject: electromagnetism
difficulty: university
equation: \oint \mathbf{B}\cdot d\boldsymbol{\ell} = \mu_0 I_{enc}, \qquad B_{solenoid} = \mu_0 n I
concepts:
  - amperes-law
  - magnetic-field
  - solenoid
prerequisites:
  - lorentz-force
related:
  - faradays-law
  - lorentz-force
visualization:
  type: function-plot
  options:
    expr: 'x < R ? 2e-7*I*x/R^2 : 2e-7*I/x'
    domain:
      - 0.0005
      - 0.05
    range:
      - 0
      - 0.0005
    mode: plain
visualization3d:
  type: solenoid
  options: {}
parameters:
  I:
    min: 1
    max: 50
    step: 1
    value: 10
    unit: A
  R:
    min: 0.002
    max: 0.02
    step: 0.001
    value: 0.005
    unit: m
  x:
    min: 0.0005
    max: 0.05
    step: 0.0005
    value: 0.01
  n:
    min: 500
    max: 5000
    step: 100
    value: 2000
variables:
  - \mu_0
  - B
  - I, I_{enc}
  - R
  - \oint
derivation:
  - \oint \mathbf{B}\cdot d\boldsymbol{\ell} = \mu_0 I_{enc}
  - I_{enc} = I\frac{x^2}{R^2} \;\Rightarrow\; B(x)\cdot2\pi x = \mu_0 I\frac{x^2}{R^2} \;\Rightarrow\; B(x) = \frac{\mu_0 I x}{2\pi R^2}
  - I_{enc} = I \;\Rightarrow\; B(x)\cdot2\pi x = \mu_0 I \;\Rightarrow\; B(x) = \frac{\mu_0 I}{2\pi x}
charts:
  - domain:
      - 0
      - 50
    marker: I
    series:
      - 4*pi*1e-7*n*x*1000
primary: I
presets:
- I: 10
  R: 0.003
  x: 0.02
- I: 32
  R: 0.006
  x: 0.05
- n: 4000
  I: 20
challenges:
- check: '4*pi*1e-7*n*I*1000'
  target: 50
  tol: 5
- check: '2e-7*I/x*1000'
  target: 5
  tol: 1
- check: 'R >= 0.015 and 2e-7*I/x*1000 >= 3'
