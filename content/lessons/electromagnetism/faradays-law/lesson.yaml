id: faradays-law
subject: electromagnetism
difficulty: university
equation: \varepsilon = -N\frac{d\Phi}{dt}
concepts:
  - electromagnetic-induction
  - magnetic-flux
  - emf
  - lenzs-law
prerequisites:
  - sine-wave
  - derivative
related:
  - lorentz-force
  - sine-wave
visualization:
  type: function-plot
  options:
    expr: B*A*cos(2*pi*f*x)
    domain:
      - 0
      - 4
    range:
      - -4.5
      - 4.5
    mode: tangent
parameters:
  B:
    min: 0.2
    max: 2
    step: 0.1
    value: 1
    unit: T
  A:
    min: 0.2
    max: 2
    step: 0.1
    value: 1
    unit: m²
  f:
    min: 0.1
    max: 2
    step: 0.05
    value: 0.5
    unit: Hz
  N:
    min: 1
    max: 200
    step: 1
    value: 50
  x:
    min: 0
    max: 4
    step: 0.02
    value: 1
    unit: s
variables:
  - \Phi
  - \varepsilon
  - N
  - f
derivation:
  - \Phi(t) = B A \cos(2\pi f t)
  - \varepsilon = -N\frac{d\Phi}{dt}
  - \varepsilon(t) = N B A \, 2\pi f \sin(2\pi f t)
charts: []
primary: f
presets:
- 'N': 50
  B: 0.2
  A: 0.2
  f: 0.5
- 'N': 200
  B: 2
  A: 2
  f: 2
- 'N': 100
  B: 1
  A: 0.3
  f: 1
challenges:
- check: 'N*B*A*2*pi*f'
  target: 6
  tol: 1
- check: 'N*B*A*2*pi*f > 500'
- check: 'A <= 0.5 and B <= 1 and N*B*A*2*pi*f > 20'
