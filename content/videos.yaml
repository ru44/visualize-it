  - { title: Khan Academy, url: 'https://www.youtube.com/@khanacademy', by: Khan Academy, lang: en }
  - { title: The Organic Chemistry Tutor, url: 'https://www.youtube.com/@TheOrganicChemistryTutor', by: The Organic Chemistry Tutor, lang: en }
