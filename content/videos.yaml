# Extra video support, shown at the bottom of each subject page and linked from lessons.
# Every url was checked to exist. Prefer channels and playlists over single videos (they age better).
# Fields: title, url, by (channel), lang (en | ar | …), note (optional, one sentence).
# To add a video for ONE lesson, put a `videos:` list with the same fields in that lesson's lesson.yaml.
algebra:
  - { title: Khan Academy, url: 'https://www.youtube.com/@khanacademy', by: Khan Academy, lang: en, note: Step-by-step algebra from the very beginning. }
  - { title: The Organic Chemistry Tutor, url: 'https://www.youtube.com/@TheOrganicChemistryTutor', by: The Organic Chemistry Tutor, lang: en, note: Worked examples for every school topic. }
